  const BLOCK = (() => { const c = []; for (let x = 0; x < 3; x++) for (let y = 0; y < 2; y++) c.push([x, y, 0]); return fig(blocks(c, { u: 34, aria: "A flat block of six small cubes, 3 cubes long, 2 cubes wide and 1 cube high." })); })();

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "u101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Mr Ito, the librarian: “We should put the new picture books on the lowest shelves. Then the youngest children will borrow more of them.”</div><p>Which statement, if true, best supports Mr Ito’s claim?</p>`,
      options: ["The new picture books have bright covers.", "Older children in the school prefer to borrow chapter books.", "The youngest children can’t reach the high shelves.", "The lowest shelves are the easiest ones to dust."], answer: 2,
      explain: `<p>The claim links low shelves to more borrowing by the youngest children. If they <b>can’t reach the high shelves</b>, moving the books down is exactly what lets them borrow more.</p><p class="why-not">Bright covers would attract children wherever the books were. What older children like, and which shelves are easy to dust, say nothing about the youngest children borrowing more.</p>` },
    { id: "u102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Mia started playing music to her tomato plant in spring. By summer it had grown much taller.<br>Mia: “That proves music makes plants grow.”</div><p>Which one of these shows the mistake Mia has made?</p>`,
      options: ["The plant may have grown because the weather got warmer.", "Other people in her family may not like the music Mia plays.", "Some kinds of plants may not grow tomatoes.", "Mia may have more than one tomato plant."], answer: 0,
      explain: `<p>Plants grow from spring to summer anyway. Mia has <b>ignored another possible cause</b>: warmer weather and longer days, not the music, may have made it grow.</p><p class="why-not">Whether people like her music, which plants grow tomatoes and how many plants she has don’t show what is wrong with her conclusion.</p>` },
    { id: "u103", tier: 1, cat: "Whose reasoning",
      stem: `<div class="box">Rule: to be in the swimming final, you <b>must</b> swim your heat in under 40 seconds. Only the eight fastest swimmers go through.</div><p>Ana: “Kai swam his heat in 38 seconds, so he is definitely in the final.”</p><p>Ben: “Lucy is in the final, so she must have swum her heat in under 40 seconds.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ana", "Ben"), answer: 1,
      explain: `<p>Under 40 seconds is <b>needed</b> for the final, so anyone in the final, like Lucy, must have done it: <b>Ben</b> is right.</p><p class="why-not">But being under 40 seconds doesn’t <i>guarantee</i> a place: if eight other swimmers were faster than Kai, he misses out. So Ana is wrong.</p>` },
    { id: "u104", tier: 1, cat: "Tables & timetables",
      stem: `<p>At a sports day, each race gives <b>3 points</b> for 1st, <b>2 points</b> for 2nd and <b>1 point</b> for 3rd.</p>${tbl(["Race", "1st", "2nd", "3rd"], [["Sprint", "Red", "Blue", "Gold"], ["Relay", "Blue", "Red", "Gold"], ["Hurdles", "Gold", "Blue", "Red"]])}<p>Which house scored the most points?</p>`,
      options: ["Red", "Blue", "Gold", "It is a tie"], answer: 1,
      explain: `<p>Add up each house: Red 3 + 2 + 1 = 6. <b>Blue</b> 2 + 3 + 2 = 7. Gold 1 + 1 + 3 = 5.</p><p class="why-not">Every house won exactly one race, so counting wins makes it look like a tie. The 2nd places matter too, and Blue came 2nd twice.</p>` },
    { id: "u105", tier: 1, cat: "Spatial",
      stem: `<p>A wooden cube is painted <b>red on the top and the bottom</b> and blue on the other four faces. It is then cut into 8 equal small cubes.</p>${cube(2, { u: 44, fill: ["#74c0fc", "#ff6b6b", "#4dabf7"], aria: "A cube cut into 8 small cubes, 2 along each edge. The top is red and the sides are blue." })}<p>How many of the small cubes have some red paint on them?</p>`,
      options: ["2", "4", "6", "8"], answer: 3,
      explain: `<p>Every small cube is in either the top layer or the bottom layer. The top four all have a red top, and the bottom four all have a red bottom. So <b>all 8</b> have some red.</p><p class="why-not">4 counts only the top layer you can see in the picture. The bottom face is red too.</p>` },
    { id: "u106", tier: 1, cat: "Rules & codes",
      stem: `<p>In a made-up language:</p><div class="box">“mipo tak” means “red apple”<br>“mipo sul” means “red bus”<br>“lin sul” means “blue bus”</div><p>What does “<b>lin tak</b>” mean?</p>`,
      options: ["red apple", "blue bus", "blue apple", "red bus"], answer: 2,
      explain: `<p>“mipo” appears in both phrases with “red”, so mipo = red. Then tak = apple and sul = bus, and “lin sul” = blue bus gives lin = blue. So “lin tak” is <b>blue apple</b>.</p><p class="why-not">The other options use a word in the wrong meaning, or copy one of the given phrases.</p>` },
    { id: "u107", tier: 1, cat: "Must or cannot be true",
      stem: `<div class="box">Every cupcake on the tray has icing.<br>Some of the cupcakes with icing also have sprinkles.<br>Ella takes one cupcake from the tray.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["Ella’s cupcake has sprinkles.", "Some cupcakes have sprinkles but no icing.", "Ella’s cupcake has no sprinkles.", "Ella’s cupcake has icing."], answer: 3,
      explain: `<p>Every cupcake on the tray has icing, so <b>Ella’s must have icing</b>.</p><p class="why-not">Only <i>some</i> have sprinkles, so hers may or may not. Every cupcake has icing, so none can have sprinkles without it.</p>` },
    { id: "u108", tier: 1, cat: "Number problems",
      stem: `<p>Ava is standing in a line. She is <b>9th</b> counting from the front and <b>6th</b> counting from the back.</p><p>How many people are in the line?</p>`,
      options: ["3", "13", "14", "15"], answer: 2,
      explain: `<p>There are 8 people in front of Ava and 5 behind her. With Ava: 8 + 1 + 5 = <b>14</b>.</p><p class="why-not">9 + 6 = 15 counts Ava twice. 13 leaves her out, and 3 is just the difference.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "u201", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">Oscar asked the four other members of his chess club whether the school should hold a chess tournament. All four said yes.<br>Oscar: “Everyone at school wants a chess tournament.”</div><p>Which one of these shows the mistake Oscar has made?</p>`,
      options: ["A tournament may take a long time to organise.", "Oscar may not be the best player in the club.", "Some people at the school may like draughts more than chess.", "The people Oscar asked may all already love chess."], answer: 3,
      explain: `<p>Oscar only asked the chess club, people who <b>already love chess</b>. Their answer tells him nothing about the rest of the school.</p><p class="why-not">How long it takes to organise, how good Oscar is, and draughts don’t explain what is wrong with judging a whole school from four club members.</p>` },
    { id: "u202", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Coach Ruiz: “Players should drink water at every quarter break. Then they will play better in the last quarter.”</div><p>Which statement, if true, best supports the coach’s claim?</p>`,
      options: ["Players who are short of water tire and make mistakes.", "Water costs much less than sports drinks.", "Most netball games are played in four quarters.", "Good players are often seen drinking water at the breaks."], answer: 0,
      explain: `<p>The claim needs a link from drinking water to playing better late in the game. If players short of water <b>tire and make mistakes</b>, drinking at each break prevents that.</p><p class="why-not">Cost and the number of quarters are true but beside the point. “Good players are seen drinking water” is a link the wrong way round: they might drink because they play hard, not play well because they drink.</p>` },
    { id: "u203", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">School rule: if it is raining at lunchtime, everyone stays in the library. The rule is always followed.</div><p>Pia: “The children are not in the library at lunchtime, so it can’t be raining.”</p><p>Raj: “It is raining at lunchtime, so the children are in the library.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 2,
      explain: `<p>The rule says rain at lunchtime always means the library, so Raj is right. And if the children are <i>not</i> in the library, it can’t be raining, or the rule would have sent them there: Pia is right too. <b>Both</b> are correct.</p><p class="why-not">The mistake to avoid is turning the rule round: “they are in the library, so it must be raining” would be wrong, because children can be in the library for other reasons. Neither Pia nor Raj does that.</p>` },
    { id: "u204", tier: 2, cat: "Tables & timetables",
      stem: `<p>The swim club’s usual timetable:</p>${tbl(["Day", "Start", "Finish"], [["Monday", "4:00 pm", "5:00 pm"], ["Wednesday", "4:00 pm", "5:00 pm"], ["Friday", "4:00 pm", "5:00 pm"], ["Saturday", "9:00 am", "10:30 am"]])}<p>This week, Wednesday is cancelled, and Saturday starts <b>half an hour late</b> but finishes at the usual time.</p><p>How much training is there this week?</p>`,
      options: ["2½ hours", "3 hours", "3½ hours", "4½ hours"], answer: 1,
      explain: `<p>Monday 1 hour + Friday 1 hour + Saturday 9:30 to 10:30, 1 hour = <b>3 hours</b>.</p><p class="why-not">4½ hours is a normal week. 3½ hours forgets that Saturday is shorter, and 2½ hours takes off too much.</p>` },
    { id: "u205", tier: 2, cat: "Spatial",
      stem: `<p>On a dice, opposite faces always add up to <b>7</b>.</p><p>Three dice are stacked in a tower on a table. The top of the tower shows <b>5</b>.</p><p>What is the total of the five faces you can’t see because they are pressed against another dice or the table?</p>`,
      options: ["21", "19", "16", "14"], answer: 2,
      explain: `<p>The hidden faces are the bottom of the top dice, and the top and bottom of the other two dice.</p><p>The top dice shows 5, so its bottom is 7 − 5 = 2. The middle and bottom dice each hide a top and a bottom that are opposite faces: 7 each. Total: 2 + 7 + 7 = <b>16</b>.</p><p class="why-not">21 counts 7 for all three dice, but the top dice’s top (5) is on show. 19 subtracts the 2 instead of the 5.</p>` },
    { id: "u206", tier: 2, cat: "Rules & codes",
      stem: `<p>Four friends each have a different pet: a cat, a dog, a fish and a bird.</p><div class="box">Ali doesn’t have the cat or the dog.<br>Bea has the fish.<br>Cal doesn’t have the dog.</div><p>Who has the dog?</p>`,
      options: ["Ali", "Bea", "Cal", "Dee"], answer: 3,
      explain: `<p>Bea has the fish. Ali can’t have the cat or the dog, so Ali has the bird. Cal can’t have the dog, so Cal has the cat. That leaves the dog for <b>Dee</b>.</p><p class="why-not">Dee isn’t mentioned in any clue, which makes her easy to overlook, but the pets left over after the clues tell you hers.</p>` },
    { id: "u207", tier: 2, cat: "Number problems",
      stem: `<p>Six classes each send <b>3 children</b> to a quiz. The children are put into teams of <b>4</b>.</p><p>How many more children are needed so that every child is in a full team?</p>`,
      options: ["6", "4", "3", "2"], answer: 3,
      explain: `<p>6 × 3 = 18 children. Teams of 4: four full teams use 16, leaving 2 in a team that needs 4. So <b>2</b> more children are needed (20 = 5 teams of 4).</p><p class="why-not">4 is the team size, not the number missing. 6 is the number of classes, and 3 is how many each class sent.</p>` },
    { id: "u208", tier: 2, cat: "Spatial",
      stem: `<p>Six small cubes are glued together to make this block.</p>${BLOCK}<p>How many small square faces are on the outside of the block, including the bottom?</p>`,
      options: ["18", "22", "24", "36"], answer: 1,
      explain: `<p>Count the outside in pairs. Top and bottom: 6 + 6 = 12. Front and back: 3 + 3 = 6. The two ends: 2 + 2 = 4. Total <b>22</b>.</p><p class="why-not">36 is every face of all six cubes, including the ones glued together inside. 24 and 18 come from counting one pair of sides wrongly or missing the bottom.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "u301", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">Last month, the kiosk at the beach sold 300 ice blocks and the kiosk at the park sold 200.<br>Max: “People like the beach kiosk’s ice blocks better.”</div><p>Which one of these shows the mistake Max has made?</p>`,
      options: ["The park kiosk may also sell sandwiches and drinks.", "Far more people may pass the beach kiosk each day.", "Some people may not eat ice blocks at all.", "Both kiosks may charge the same for an ice block."], answer: 1,
      explain: `<p>Max compares totals that aren’t fair to compare. If <b>far more people pass the beach kiosk</b>, it would sell more even if people liked both equally.</p><p class="why-not">What else the park kiosk sells, people who never eat ice blocks, and equal prices don’t show why the totals can’t be compared.</p>` },
    { id: "u302", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Ms Park: “Our class should have quiet reading straight after lunch instead of at the end of the day. Then more children will finish their books.”</div><p>Which statement, if true, best supports Ms Park’s claim?</p>`,
      options: ["End-of-day reading often gets cut short by packing up.", "Children who finish books usually enjoy reading.", "The library is busiest straight after lunch.", "Some children in the class read much faster than the others."], answer: 0,
      explain: `<p>If reading time at the end of the day <b>often gets cut short</b>, moving it gives the children more real reading time, so more books get finished.</p><p class="why-not">Enjoying reading and reading speed are true but don’t show that the new time helps. A busy library after lunch has nothing to do with reading in class.</p>` },
    { id: "u303", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">Only children who have returned their permission note can go on the excursion.</div><p>Pia: “Tom has returned his note, so he will definitely go on the excursion.”</p><p>Raj: “Sara didn’t go on the excursion, so she can’t have returned her note.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 3,
      explain: `<p>A note is <b>needed</b> to go, but it doesn’t <i>guarantee</i> going. Tom could be sick on the day, so Pia is wrong. Sara could have returned her note and then been sick too, so Raj is wrong. <b>Neither</b> is correct.</p><p class="why-not">The rule only tells you about children who <i>do</i> go: they must have returned a note. It says nothing certain about the ones who stay behind.</p>` },
    { id: "u304", tier: 3, cat: "Spatial",
      stem: `<p>A cube has six different colours. <b>Red is opposite blue</b>, <b>green is opposite yellow</b>, and <b>white is opposite black</b>.</p><p>The cube sits on a table with red on top and green facing you.</p><p>Which colour <b>could</b> be on the right-hand side?</p>`,
      options: ["blue", "yellow", "black", "red"], answer: 2,
      explain: `<p>Red is on top, so blue is underneath. Green faces you, so yellow is at the back. The left and right sides must be the last pair: white and black. So the right side could be <b>black</b>.</p><p class="why-not">Blue is on the bottom and yellow at the back, and red is on top, so none of them can be on the right.</p>` },
    { id: "u305", tier: 3, cat: "Tables & timetables",
      stem: `<p>The 1st of the month is a <b>Tuesday</b>.</p><p>On what date is the <b>third Friday</b> of the month?</p>`,
      options: ["11th", "17th", "18th", "21st"], answer: 2,
      explain: `<p>If the 1st is a Tuesday, the first Friday is the 4th. Add a week each time: the 11th, then the <b>18th</b>.</p><p class="why-not">The 11th is the second Friday. The 17th and 21st come from counting the Fridays from the wrong starting day.</p>` },
    { id: "u306", tier: 3, cat: "Must or cannot be true",
      stem: `<p>One of Ann, Bob and Cat ate the last biscuit.</p><div class="box">Ann: “Bob ate it.”<br>Bob: “Ann is lying.”<br>Cat: “I didn’t eat it.”</div><p><b>Exactly one</b> of them is telling the truth. Who ate the biscuit?</p>`,
      options: ["Ann", "Bob", "It can’t be worked out", "Cat"], answer: 3,
      explain: `<p>Ann and Bob can’t both be telling the truth, and they can’t both be lying: one of them must be the one honest person. So Cat is lying, and “I didn’t eat it” is false: <b>Cat</b> ate it.</p><p>Check: Ann lies (Bob didn’t eat it), Bob tells the truth, Cat lies. Exactly one truth.</p><p class="why-not">If Bob had eaten it, Ann and Cat would both be telling the truth. If Ann had, Bob and Cat would both be telling the truth.</p>` },
    { id: "u307", tier: 3, cat: "Rules & codes",
      stem: `<p>The numbers <b>12, 20, 28 and 36</b> belong to a club. The numbers <b>16, 22, 24 and 30</b> do not.</p><p>Which of these numbers belongs to the club?</p>`,
      options: ["32", "40", "48", "60"], answer: 3,
      explain: `<p>Every member is in the 4 times table, but 16 and 24 are in it too and are not members. The members are 4 × 3, 4 × 5, 4 × 7 and 4 × 9: 4 times an <b>odd</b> number. 60 = 4 × 15, so <b>60</b> belongs.</p><p class="why-not">32 = 4 × 8, 40 = 4 × 10 and 48 = 4 × 12 are 4 times an even number, like 16 and 24, which are not in the club.</p>` },
    { id: "u308", tier: 3, cat: "Spatial",
      stem: `<p>A large cube is made of 64 small cubes, 4 along each edge. Only its <b>top</b> and its <b>bottom</b> are painted.</p>${cube(4, { u: 26, fill: ["#ffe9cf", "#ff6b6b", "#f4c7a1"], aria: "A large cube made of small cubes, 4 along each edge. The top and the bottom are painted red." })}<p>How many small cubes have <b>no paint at all</b>?</p>`,
      options: ["48", "32", "16", "8"], answer: 1,
      explain: `<p>The paint only touches the top layer (16 cubes) and the bottom layer (16 cubes). The two middle layers have none: 64 − 16 − 16 = <b>32</b>.</p><p class="why-not">8 is the answer for a cube painted on all six faces, which this one isn’t. 48 takes off only one layer.</p>` },

    /* ===================== the boss ===================== */
    { id: "u401", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">A box holds 5 green, 3 yellow and 2 white tennis balls. Nobody can see into the box.</div><p>Pia: “If I take out 4 balls, I am certain to get at least two of the same colour.”</p><p>Raj: “If I take out 6 balls, I am certain to get at least one green.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 2,
      explain: `<p>Think of the unluckiest case each time. There are only 3 colours, so 3 balls could all be different, but a 4th must match one: Pia is right. There are 3 + 2 = 5 balls that aren’t green, so 5 balls could all miss, but a 6th must be green: Raj is right. <b>Both</b> are correct.</p><p class="why-not">It is easy to think 6 isn’t enough because there are 5 green balls, but what matters is how many balls are <i>not</i> green.</p>` },
    { id: "u402", tier: 4, cat: "Spot the mistake",
      stem: `<div class="box">Some of the tomatoes in the garden have been eaten overnight. Mum found possum footprints in the soil.<br>Zac: “So it wasn’t the birds.”</div><p>Which one of these shows the mistake Zac has made?</p>`,
      options: ["The birds and the possum may both have eaten some.", "Possums may come out mainly at night, when birds are asleep.", "Some of the tomatoes may not have been ripe.", "Mum may grow other vegetables as well."], answer: 0,
      explain: `<p>Zac thinks that if the possum did it, the birds didn’t. But one cause doesn’t rule out another: <b>both may have eaten some</b>.</p><p class="why-not">Possums coming out at night supports Mum’s idea rather than showing Zac’s mistake. Ripeness and other vegetables are beside the point.</p>` },
    { id: "u403", tier: 4, cat: "Number problems",
      stem: `<p>Tickets to a show cost <b>$4</b> for a child and <b>$7</b> for an adult. A group buys <b>9 tickets</b> and pays <b>$51</b>.</p><p>How many adults are in the group?</p>`,
      options: ["3", "4", "5", "6"], answer: 2,
      explain: `<p>If all 9 were children, it would cost 9 × $4 = $36. The group paid $15 more. Each adult instead of a child adds $3, so there are $15 ÷ $3 = <b>5</b> adults.</p><p>Check: 5 × $7 + 4 × $4 = $35 + $16 = $51.</p><p class="why-not">4 is the number of children. 3 and 6 come from dividing by the wrong price difference.</p>` },
    { id: "u404", tier: 4, cat: "Spatial",
      stem: `<p>A dice sits on a table with <b>1 on top</b>. It is tipped over forwards, away from you, so that it rolls onto the next face. This is done <b>four times</b> in a row, in the same direction.</p><p>Which number is on top now?</p>`,
      options: ["1", "2", "5", "6"], answer: 0,
      explain: `<p>Each tip is a quarter turn. Four quarter turns in the same direction make a full turn, so the dice ends up just as it started: <b>1</b> on top.</p><p class="why-not">6 is on top after only two tips (halfway round). It’s tempting to think the dice keeps changing, but after four tips it is back where it began.</p>` },
    { id: "u405", tier: 4, cat: "Tables & timetables",
      stem: `<p>A bus leaves the station every <b>12 minutes</b> and a train every <b>20 minutes</b>. Both leave together at <b>7:00 am</b>.</p><p>When do they next leave together?</p>`,
      options: ["7:40 am", "8:00 am", "8:20 am", "9:00 am"], answer: 1,
      explain: `<p>Bus: 7:12, 7:24, 7:36, 7:48, 8:00. Train: 7:20, 7:40, 8:00. The first time on both lists is <b>8:00 am</b> (60 minutes is the first number in both the 12 and 20 times tables).</p><p class="why-not">7:40 is a train time but not a bus time. 8:20 is the train’s next time after 8:00. 9:00 is a time they are both at the station again, but not the next one.</p>` },
    { id: "u406", tier: 4, cat: "Supports the claim",
      stem: `<div class="box">The principal: “If we put in more bike racks, more students will ride to school.”</div><p>Which statement, if true, best supports the principal’s claim?</p>`,
      options: ["Riding a bike to school is good exercise.", "Students who ride to school usually arrive a little earlier than the others.", "Bike racks cost less than a new car park.", "Many say they don’t ride because there is nowhere to leave their bikes."], answer: 3,
      explain: `<p>The claim only works if the lack of racks is what stops students riding. If many say they <b>don’t ride because there’s nowhere to leave their bikes</b>, more racks remove that reason.</p><p class="why-not">Exercise and arriving early are reasons riding is good, not reasons racks would change anything. Cost is about the school’s money, not students’ choices.</p>` },
    { id: "u407", tier: 4, cat: "Order & arrangement",
      stem: `<p>Five children stand in a line at the canteen.</p><div class="box">Pat is somewhere ahead of Quinn.<br>Rose is directly behind Pat.<br>Sam is last.<br>Tia is not first.</div><p>Who is <b>first</b> in the line?</p>`,
      options: ["Pat", "Quinn", "Rose", "Tia"], answer: 0,
      explain: `<p>Sam is last and Tia isn’t first. Rose stands directly behind Pat, so Rose can’t be first. Quinn is behind Pat, so Quinn can’t be first. That leaves <b>Pat</b>.</p><p class="why-not">The clues don’t say where Quinn and Tia stand exactly, but they don’t need to: only one person can be first.</p>` },
    { id: "u408", tier: 4, cat: "Spatial",
      stem: `<p>A large cube is made of 27 small cubes. The whole outside is painted, and then it is taken apart.</p>${cube(3, { u: 34, aria: "A large cube made of 27 small cubes, 3 along each edge, painted all over." })}<p>Altogether, how many faces of the small cubes are <b>not</b> painted?</p>`,
      options: ["54", "81", "108", "162"], answer: 2,
      explain: `<p>27 small cubes have 27 × 6 = 162 faces. The painted ones are the outside of the large cube: 6 sides of 9 squares = 54. So 162 − 54 = <b>108</b> faces are not painted.</p><p class="why-not">162 is all the faces and 54 is the painted ones: both stop one step short. 81 assumes exactly half are painted.</p>` },
  );
})();

/* ---------------------------------------------------------------
   STORM ISLAND: third set of thinking questions (Nov 2026). Four options (A–D).
   New kinds of question: a secret passed on at meetings, tiles turned and flipped,
   counting triangles, a moving-dot picture pattern, the view from the front,
   a round table, a Venn diagram, a timetable with limits.
   tier 1–3 = storm circle 1–3; tier 4 = the boss.
   --------------------------------------------------------------- */
(() => {
  const { tbl, fig, T, blocks, plan, towers } = LIB;
  const WHO = (a, b) => [`${a} only`, `${b} only`, `Both ${a} and ${b}`, `Neither ${a} nor ${b}`];

  /* a 3 × 3 tile of letters */
  const TILE = (() => {
    const L = ["A", "B", "C", "D", "E", "F", "G", "H", "I"], u = 46;
    let g = `<rect x="8" y="8" width="${3 * u}" height="${3 * u}" fill="#fff3bf" stroke="${INK}" stroke-width="3"/>`;
    for (let k = 1; k < 3; k++) g += `<line x1="${8 + k * u}" x2="${8 + k * u}" y1="8" y2="${8 + 3 * u}" stroke="${INK}" stroke-width="1.5"/><line y1="${8 + k * u}" y2="${8 + k * u}" x1="8" x2="${8 + 3 * u}" stroke="${INK}" stroke-width="1.5"/>`;
    L.forEach((l, i) => { g += T(8 + (i % 3) * u + u / 2, 8 + Math.floor(i / 3) * u + u / 2 + 8, l, 'text-anchor="middle" font-size="22" font-weight="700"'); });
    return fig(`<svg viewBox="0 0 ${3 * u + 16} ${3 * u + 16}" width="160" role="img" aria-label="A square tile with three rows of letters. Top row: A, B, C. Middle row: D, E, F. Bottom row: G, H, I.">${g}</svg>`);
  })();

  /* a big triangle with two lines from the top corner down to the base */
  const TRI = fig(`<svg viewBox="0 0 300 220" width="280" role="img" aria-label="A large triangle. From its top corner, two straight lines go down to the bottom side, splitting the triangle into three thin triangles side by side."><polygon points="150,14 20,204 280,204" fill="#d0ebff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><line x1="150" y1="14" x2="110" y2="204" stroke="${INK}" stroke-width="3"/><line x1="150" y1="14" x2="196" y2="204" stroke="${INK}" stroke-width="3"/></svg>`);

  /* a square with a dot in one corner and a line through the middle */
  const DOT = [[16, 16], [64, 16], [64, 64], [16, 64]];
  const sq = (c, a, w = 80) => { const r = 26, rad = a * Math.PI / 180, dx = Math.sin(rad) * r, dy = -Math.cos(rad) * r;
    return `<svg viewBox="0 0 80 80" width="${w}" role="img" aria-label="A square with a dot in the ${["top left", "top right", "bottom right", "bottom left"][c]} corner and a line through the middle that is ${{ 0: "upright", 45: "sloping up to the right", 90: "flat", 135: "sloping down to the right" }[a % 180]}."><rect x="4" y="4" width="72" height="72" fill="#fff" stroke="${INK}" stroke-width="3"/><line x1="${40 - dx}" y1="${40 - dy}" x2="${40 + dx}" y2="${40 + dy}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><circle cx="${DOT[c][0]}" cy="${DOT[c][1]}" r="8" fill="#e5484d" stroke="${INK}" stroke-width="2"/></svg>`; };
  const SEQ = `<div class="figure" style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">${[0, 1, 2, 3].map(i => sq(i, 45 * i, 70)).join("")}<b style="font-size:28px">?</b></div>`;

  /* front views drawn as columns of squares */
  const front = (h, label) => { const u = 22, W = h.length * u + 8, H = 3 * u + 8; let g = `<line x1="2" x2="${W - 2}" y1="${H - 4}" y2="${H - 4}" stroke="${INK}" stroke-width="2"/>`;
    h.forEach((c, x) => { for (let k = 0; k < c; k++) g += `<rect x="${4 + x * u}" y="${H - 4 - (k + 1) * u}" width="${u}" height="${u}" fill="#c9d6f2" stroke="${INK}" stroke-width="1.5"/>`; });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W * 1.6}" role="img" aria-label="${label}: columns of squares ${h.join(", ")} high, from left to right.">${g}</svg>`; };
  const ROWS = [[1, 3, 1], [2, 1, 0], [3, 1, 2]];

  /* a Venn diagram */
  const VENN = fig(`<svg viewBox="0 0 330 200" width="320" role="img" aria-label="A rectangle labelled Class 4R. Inside it are two overlapping circles, Plays sport and Plays music. 7 is in the sport circle only, 4 is in the overlap, 6 is in the music circle only, and 3 is inside the rectangle but outside both circles."><rect x="4" y="4" width="322" height="192" rx="8" fill="#fff" stroke="${INK}" stroke-width="2.5"/>${T(14, 26, "Class 4R", 'font-weight="700"')}<circle cx="125" cy="112" r="68" fill="#4dabf7" fill-opacity=".35" stroke="${INK}" stroke-width="2.5"/><circle cx="205" cy="112" r="68" fill="#ffa94d" fill-opacity=".35" stroke="${INK}" stroke-width="2.5"/>${T(85, 40, "Plays sport", 'font-size="14" font-weight="700" text-anchor="middle"')}${T(248, 40, "Plays music", 'font-size="14" font-weight="700" text-anchor="middle"')}${T(95, 120, "7", 'font-size="24" font-weight="700" text-anchor="middle"')}${T(165, 120, "4", 'font-size="24" font-weight="700" text-anchor="middle"')}${T(235, 120, "6", 'font-size="24" font-weight="700" text-anchor="middle"')}${T(302, 180, "3", 'font-size="24" font-weight="700" text-anchor="middle"')}</svg>`);

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "v101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Mrs Lane: “The school should open the library for half an hour before the bell. Then more children will read every day.”</div><p>Which statement, if true, best supports Mrs Lane’s claim?</p>`,
      options: ["The library has just bought a lot of new books.", "Children who read every day get better at spelling.", "Many children arrive early and have nothing to do until the bell.", "The librarian is happy to come in half an hour early every school day."], answer: 2,
      explain: `<p>The claim says opening early will lead to <i>more reading</i>. That only works if there are children who would use the time. If <b>many arrive early with nothing to do</b>, an open library gives them somewhere to read.</p><p class="why-not">New books would be there whatever time the library opens. Better spelling is what reading leads to, not a reason more children will read. The librarian being willing makes the plan possible, but doesn’t show children will come.</p>` },
    { id: "v102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Leo asked the three other children at his lunch table about the new canteen menu. All three said they love it.<br>Leo: “So everyone at our school loves the new menu.”</div><p>Which one of these shows the mistake Leo has made?</p>`,
      options: ["Leo may not have tried the new menu himself yet.", "Children at other tables may not feel the same way.", "The canteen may change the menu again next term.", "The three children may have bought lunch from home."], answer: 1,
      explain: `<p>Leo has judged the <b>whole school</b> from <b>three children</b> at his own table. His friends may like the same things as him; children at other tables may not.</p><p class="why-not">Whether Leo has tried it, or the menu changes later, doesn’t touch his reasoning. And the three children said they love it, so where their lunch came from today doesn’t matter.</p>` },
    { id: "v103", tier: 1, cat: "Tables & timetables",
      stem: `<p>At the start of the day, only <b>Ana</b> knows a secret. Whenever someone who knows it meets someone who doesn’t, they pass it on. The meetings happen in this order:</p>${tbl(["Meeting", "Who meets"], [["First", "Ana and Ben"], ["Second", "Cal and Dee"], ["Third", "Ben and Cal"], ["Fourth", "Eli and Ana"], ["Fifth", "Dee and Fay"]])}<p>Who does <b>not</b> know the secret at the end of the day?</p>`,
      options: ["Fay only", "Dee and Fay", "Cal, Dee and Fay", "Nobody: they all know it"], answer: 1,
      explain: `<p>Go through the meetings in order, keeping a list of who knows:</p><p>First: Ana tells Ben (Ana, Ben). Second: Cal and Dee meet, but <b>neither knows yet</b>. Third: Ben tells Cal. Fourth: Ana tells Eli. Fifth: Dee and Fay meet, but Dee still doesn’t know.</p><p>So <b>Dee and Fay</b> never hear it.</p><p class="why-not">“Fay only” forgets that Dee met Cal <i>before</i> Cal knew. “Cal, Dee and Fay” misses that Ben told Cal at the third meeting. “Nobody” ignores the order completely.</p>` },
    { id: "v104", tier: 1, cat: "Spatial",
      stem: `<p>This tile is turned a <b>quarter turn clockwise</b> (the way a clock’s hands move).</p>${TILE}<p>Which letter is now in the <b>top left</b> corner?</p>`,
      options: ["A", "C", "G", "I"], answer: 2,
      explain: `<p>In a quarter turn clockwise, the left side swings up to become the top. So the left column, G-D-A from bottom to top, becomes the new top row from left to right: <b>G</b>, D, A.</p><p>Check with a corner: A was top left and moves round to top right; G was bottom left and moves up to top left.</p><p class="why-not">C would come to the top left after a quarter turn the other way (anticlockwise). I would be there after a half turn. A is where it started.</p>` },
    { id: "v105", tier: 1, cat: "Spatial",
      stem: `<p>How many triangles of any size can you find in this picture?</p>${TRI}`,
      options: ["3", "4", "5", "6"], answer: 3,
      explain: `<p>Count by size. There are <b>3</b> small triangles, <b>2</b> made of two small ones side by side, and <b>1</b> big one made of all three: 3 + 2 + 1 = <b>6</b>.</p><p>Another way: every triangle uses the bottom side and two of the four lines from the top corner. There are 6 ways to choose two of four lines.</p><p class="why-not">3 counts only the small ones, and 4 adds just the big one. 5 misses one of the middle-sized pairs.</p>` },
    { id: "v106", tier: 1, cat: "Order & arrangement",
      stem: `<p>Five runners finished a race, one after another.</p><div class="box">Gus finished before Hal but after Ivy.<br>Jo finished straight after Hal.<br>Kim finished last.</div><p>Who came <b>second</b>?</p>`,
      options: ["Ivy", "Gus", "Hal", "Jo"], answer: 1,
      explain: `<p>Ivy is before Gus, and Gus is before Hal: Ivy, Gus, Hal. Jo comes straight after Hal, and Kim is last: Ivy, <b>Gus</b>, Hal, Jo, Kim.</p><p class="why-not">Ivy came first. Hal and Jo came third and fourth. Reading the names in the order the clues mention them (Gus first) gives the wrong order.</p>` },
    { id: "v107", tier: 1, cat: "Must or cannot be true",
      stem: `<p>A bag holds 10 marbles. <b>4</b> of them are red and the rest are blue. Jay takes out <b>5</b> marbles without looking.</p><p>Which one of these <b>cannot</b> be true?</p>`,
      options: ["All five of Jay’s marbles are red.", "None of Jay’s marbles are red.", "Four of Jay’s marbles are red.", "Jay has more red marbles than blue."], answer: 0,
      explain: `<p>There are only 4 red marbles in the bag, so Jay <b>can’t</b> have 5 red ones.</p><p class="why-not">There are 6 blue marbles, so all 5 could be blue (no red). He could take all 4 red ones and one blue. 3 red and 2 blue gives more red than blue. All of those can happen.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "v201", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">Most of the shells on Sandy Bay beach are white. Lia picks up one shell from the beach without looking.</div><p>Ana: “Lia’s shell is probably white.”</p><p>Ben: “Lia’s shell must be white.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ana", "Ben"), answer: 0,
      explain: `<p>“Most” means more than half, so a shell picked at random is <b>probably</b> white: <b>Ana</b> is right.</p><p class="why-not">“Most” is not “all”. Some shells on the beach are other colours, and Lia could have picked one of them, so Ben can’t say it <i>must</i> be white.</p>` },
    { id: "v202", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">To get a merit award in the maths challenge, you need a score of at least 80.<br>Rani scored 92.<br>Rani: “So I am definitely getting a merit award.”</div><p>Which one of these shows the mistake Rani has made?</p>`,
      options: ["Other children in the challenge may have scored even more than 92.", "A score of 80 may not be all you need for a merit award.", "Rani may have found some of the questions easy.", "The maths challenge may be harder next year."], answer: 1,
      explain: `<p>The rule says 80 is <b>needed</b>. It doesn’t say 80 is <i>enough</i>. There may be other conditions too, such as handing in the work on time. Rani has treated something needed as a <b>guarantee</b>.</p><p class="why-not">Other scores don’t matter unless awards are limited, which the rule doesn’t say. How easy the questions were and next year’s challenge don’t affect her reasoning.</p>` },
    { id: "v203", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Ranger Bo: “Bread is bad for ducks. We should put up signs at the pond asking people not to feed them bread. Then far fewer ducks will be fed bread.”</div><p>Which statement, if true, best supports Ranger Bo’s claim?</p>`,
      options: ["Some visitors to the pond feed the ducks seeds instead of bread.", "Ducks also eat water plants, seeds and insects.", "Most people who feed ducks bread don’t know it harms them.", "Many families visit the pond on the weekend."], answer: 2,
      explain: `<p>The claim is that <b>signs</b> will stop people feeding bread. That will only work if people would change once they knew. If <b>most of them don’t know it harms ducks</b>, a sign telling them should make a big difference.</p><p class="why-not">Visitors who already feed seeds won’t change. What else ducks eat, and how busy the pond is, don’t show that the signs will change what people do.</p>` },
    { id: "v204", tier: 2, cat: "Tables & timetables",
      stem: `<p>Zara wants to do all three after-school activities, each on a <b>different</b> day.</p>${tbl(["", "Monday", "Tuesday", "Wednesday", "Thursday"], [["Swimming", "4:00–5:00", "–", "4:30–5:30", "–"], ["Art", "–", "3:30–4:30", "4:00–5:00", "3:30–4:30"], ["Chess", "3:30–4:30", "4:00–5:00", "–", "–"]])}<p>She also has a piano lesson every <b>Monday from 4:00 to 4:45</b>.</p><p>On which day will Zara do art?</p>`,
      options: ["Monday", "Tuesday", "Wednesday", "Thursday"], answer: 3,
      explain: `<p>Start with Monday: swimming and chess both clash with piano, so Zara does nothing on Monday.</p><p>Then <b>swimming</b> must be on Wednesday, its only other day. <b>Chess</b> must be on Tuesday, its only other day. That leaves <b>art</b> on <b>Thursday</b>.</p><p class="why-not">Art does run on Tuesday and Wednesday, but those days are needed for chess and swimming. Start with the activity that has the fewest choices. Art never runs on Monday.</p>` },
    { id: "v205", tier: 2, cat: "Rules & codes", visual: true,
      stem: `<p>These pictures follow a pattern.</p>${SEQ}<p>Which picture comes next?</p>`,
      options: [sq(1, 0), sq(0, 45), sq(0, 0), sq(3, 135)], answer: 2,
      explain: `<p>Two things change. The red dot moves <b>one corner clockwise</b> each time: top left, top right, bottom right, bottom left. Next it goes back to the <b>top left</b>.</p><p>The line turns an eighth of a turn clockwise each time: upright, sloping, flat, sloping the other way. One more eighth turn makes it <b>upright</b> again.</p><p class="why-not">The picture with the dot top right moves it one corner too far. The one with the line sloping up to the right has the dot right but the line wrong. The last one just copies the fourth picture.</p>` },
    { id: "v206", tier: 2, cat: "Tables & timetables",
      stem: `<p>Entry prices at a swimming pool:</p>${tbl(["Ticket", "Price"], [["Adult", "$8"], ["Child", "$5"], ["Family pass: 2 adults and up to 3 children", "$22"]])}<p>What is the <b>cheapest</b> way for 2 adults and <b>4 children</b> to get in?</p>`,
      options: ["$22", "$27", "$36", "$44"], answer: 1,
      explain: `<p>A family pass covers 2 adults and 3 children for $22. The 4th child needs a child ticket: $22 + $5 = <b>$27</b>.</p><p>Check the other ways: all single tickets cost 2 × $8 + 4 × $5 = $36, and two family passes cost $44. $27 is cheapest.</p><p class="why-not">$22 forgets the fourth child. $36 ignores the family pass, and $44 buys two passes when one child ticket is enough.</p>` },
    { id: "v207", tier: 2, cat: "Number problems",
      stem: `<p>Five friends each send a birthday card to <b>every one</b> of the other four.</p><p>How many cards are sent altogether?</p>`,
      options: ["10", "16", "20", "25"], answer: 2,
      explain: `<p>Each of the 5 friends sends 4 cards: 5 × 4 = <b>20</b>.</p><p class="why-not">10 would be right for handshakes, where one handshake is shared by two people. But Ana sending a card to Ben and Ben sending one to Ana are <i>two</i> cards. 25 counts each friend sending a card to themselves too, and 16 is 4 × 4.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "v301", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">To borrow books from the town library you must have a library card. Cards are only given to people who live in the town.</div><p>Ana: “Zoe lives in the town, so she can borrow books from the library.”</p><p>Ben: “Yan borrowed a book from the library, so he must live in the town.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ana", "Ben"), answer: 1,
      explain: `<p>Follow the rules back from Yan: he borrowed a book, so he has a card; he has a card, so he lives in the town. <b>Ben</b> is right.</p><p class="why-not">Living in the town is <b>needed</b> for a card, but it doesn’t give you one. Zoe may never have got a card, so Ana can’t say she can borrow books.</p>` },
    { id: "v302", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">For the school fete, class 4A raised $120 and class 4B raised $90.<br>Theo: “That shows the children in 4A tried harder than the children in 4B.”</div><p>Which one of these shows the mistake Theo has made?</p>`,
      options: ["4A may have many more children than 4B.", "The weather may have been sunny on the day of the fete.", "4B may raise more money at next year’s fete.", "Both classes may have wanted to buy sports gear."], answer: 0,
      explain: `<p>Theo compares the two totals as if the classes were the same size. If 4A has <b>many more children</b>, it could raise more even if each child tried less hard. It isn’t a fair comparison.</p><p class="why-not">The weather was the same for both classes, and next year or what they want to buy doesn’t change this year’s comparison.</p>` },
    { id: "v303", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Mr Bell: “Children should get a two-minute break to stand and stretch every half hour. Then they will make fewer careless mistakes in their work.”</div><p>Which statement, if true, best supports Mr Bell’s claim?</p>`,
      options: ["Most children enjoy getting up and moving around.", "Children who make fewer mistakes usually get better marks.", "Stretching every day helps children to grow up strong and healthy.", "Children who sit still for a long time find it harder to focus."], answer: 3,
      explain: `<p>Mr Bell links breaks to <b>fewer careless mistakes</b>. Careless mistakes come from losing focus. If sitting still for a long time makes it <b>harder to focus</b>, regular breaks should help.</p><p class="why-not">Enjoying it isn’t about mistakes. Better marks are what fewer mistakes lead to, not why breaks cause fewer mistakes. Health is a different benefit.</p>` },
    { id: "v304", tier: 3, cat: "Order & arrangement",
      stem: `<p>Six friends sit around a round table, evenly spaced: Ana, Ben, Cal, Dee, Eve and Fin.</p><div class="box">Ana sits directly opposite Ben.<br>Dee sits next to Ben and next to Cal.<br>Fin sits next to Ana but not next to Cal.</div><p>Who sits directly opposite Cal?</p>`,
      options: ["Ben", "Dee", "Eve", "Fin"], answer: 2,
      explain: `<p>Put Ana at the top and Ben at the bottom. Dee is next to Ben, on one side; Cal is next to Dee, so Cal is next to Ana on that same side.</p><p>Fin is next to Ana but not next to Cal, so Fin is on Ana’s other side. Eve takes the last seat, next to Ben. Going round: Ana, Cal, Dee, Ben, <b>Eve</b>, Fin. Cal and Eve are directly opposite.</p><p class="why-not">Dee is next to Cal, not opposite. Ben is opposite Ana. Fin is opposite Dee. (If you put Dee on Ben’s other side, everything flips, but Eve is still opposite Cal.)</p>` },
    { id: "v305", tier: 3, cat: "Spatial", visual: true,
      stem: `<p>Towers of cubes stand on a board. The plan shows how many cubes are in each tower.</p>${plan(ROWS)}${fig(blocks(towers(ROWS), { u: 28, aria: "The towers of cubes on the board, drawn from the front and a little to the side." }))}<p>Which picture shows what you see when you look at the towers from the <b>front</b>?</p>`,
      options: [front([3, 1, 2], "Option A"), front([3, 3, 2], "Option B"), front([2, 3, 3], "Option C"), front([1, 3, 1], "Option D")], answer: 1,
      explain: `<p>From the front, each column shows its <b>tallest</b> tower, because shorter towers hide behind it. Left column: towers 1, 2 and 3, tallest 3. Middle: 3, 1 and 1, tallest 3. Right: 1, 0 and 2, tallest 2. So the view is <b>3, 3, 2</b>.</p><p class="why-not">The first picture (3, 1, 2) shows only the front row, forgetting the tall tower behind. The third (2, 3, 3) is the view from the back, which is a mirror image. The last (1, 3, 1) shows only the back row.</p>` },
    { id: "v307", tier: 3, cat: "Number problems",
      stem: `<p>A snail is at the bottom of a well that is <b>10 metres</b> deep. Every day it climbs <b>3 m</b> up, and every night it slides <b>2 m</b> back down.</p><p>On which day does the snail reach the top?</p>`,
      options: ["Day 5", "Day 7", "Day 8", "Day 10"], answer: 2,
      explain: `<p>Each whole day and night, the snail gains 1 m. After 7 days and nights it is 7 m up. On <b>day 8</b> it climbs 3 m, from 7 m to 10 m, and reaches the top before it can slide back.</p><p class="why-not">Day 10 counts 1 m every day and forgets that the last climb doesn’t slip back. Day 5 divides 10 by 2. Day 7 stops one day early: after day 7’s climb the snail is only at 9 m.</p>` },
    { id: "v308", tier: 3, cat: "Rules & codes",
      stem: `<p>In a secret code, a word is written <b>backwards</b>, and then every vowel is changed to the <b>next vowel</b>:</p><div class="box">a → e &nbsp; e → i &nbsp; i → o &nbsp; o → u &nbsp; u → a</div><p>For example, STORM is written MRUTS.</p><p>How is <b>CLOUD</b> written in the code?</p>`,
      options: ["DAULC", "DUOLC", "CLUAD", "DAOLC"], answer: 0,
      explain: `<p>Backwards, CLOUD is D-U-O-L-C. Now change the vowels: U becomes A and O becomes U. That gives <b>DAULC</b>.</p><p class="why-not">DUOLC is only written backwards, and CLUAD only has its vowels changed. DAOLC changes the U but forgets the O.</p>` },
    { id: "v309", tier: 3, cat: "Tables & timetables",
      stem: `<p>The diagram shows the children in class 4R.</p>${VENN}<div class="box">1. 11 children play sport.<br>2. More children play music than play sport.<br>3. There are 20 children in the class.</div><p>Which statements are true?</p>`,

/* ---------- for grown-ups ---------- */
function parentsHtml() {
  const cats = {};

    const c = cats[key] || (cats[key] = { r: 0, w: 0 });

  const rows = Object.keys(cats).sort().map(k => `<tr><td>${esc(k)}</td><td class="n">${cats[k].r}</td><td class="n">${cats[k].w}</td></tr>`).join("");
  return `<details class="parents" id="parents"><summary>For grown-ups: Fortnite time and progress</summary>

    <p>Victory Royales: ${S.stats.wins}. Times eliminated: ${S.stats.kos}. Every question gets one go and no hints; after each answer the explanation is shown. Chests ask a thinking or maths question, never the same kind as the opponent.</p>

function wireParents() {

  </div>`;
  const showPassage = mode === "q" && q.kind === "reading";

  if (fx && !fighting) {
    const add = (txt, cls) => { const f = document.createElement("div"); f.className = "float " + cls; f.textContent = txt; $(".arena").appendChild(f); };
    if (fx.hit && fx.load) add("+" + fx.load + " shots", "onme load");
    if (fx.hit && fx.bar) { add("−1 bar", "onfoe"); $("#enemy").classList.add("hit"); }
    if (fx.hit === false && fx.dmg) { add("MISS! −" + fx.dmg, "onme"); $("#hero").classList.add("hit"); }
    if (fx.hit === false && !fx.dmg && fx.bush) add("Hidden!", "onme safe");
    if (fx.loot) add("+ " + fx.loot + "!", "onme loot");
  }
  $("#back").onclick = () => { if (!canLeave) return; o.roundOut = null; o.chestDue = false; home(); };
  const go = () => { if (!(mode === "idle" && !o.dead && M.hp > 0)) return; nextQ(o); battle(); const c = $("#qcard"); if (c && window.innerWidth < 821) c.scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#shoot").onclick = go; const en = $("#enemy"); if (en) en.onclick = go;
  $("#usemed").onclick = () => { if (S.items.med && M.hp < MAXHP && M.hp > 0 && !o.round) { S.items.med--; M.hp = Math.min(MAXHP, M.hp + 50); beep(SND.buy); battle(); } };
  $("#useshield").onclick = () => { if (S.items.shield && M.shield < MAXSH && M.hp > 0 && !o.round) { S.items.shield--; M.shield = Math.min(MAXSH, M.shield + 50); beep(SND.buy); battle(); } };
  $("#usebush").onclick = () => { if (S.items.bush && !M.bush && mode === "idle") { S.items.bush--; M.bush = true; beep(SND.buy); battle(); } };
  if (mode === "q") app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(Number(b.dataset.i)));
  if (mode === "chestq") app.querySelectorAll(".opt").forEach(b => b.onclick = () => chestAnswer(Number(b.dataset.i)));
  const on = (sel, fn) => { const e = $(sel); if (e) e.onclick = fn; };
  on("#chestopen", () => { M.chest.phase = "q"; M.chest.ref = pickQ(M.chest.kind, Math.min(M.stage, 4), M); M.chest.chosen = null; beep(SND.chest); battle(); });
  on("#chestleave", () => { M.chest = null; proceed(); });
  on("#next", next);
  if (fighting) {
    const cv = $("#pix"); if (cv) cv.scrollIntoView({ block: "nearest" });
    ARENA.start(o, o.round, out => { o.round = null; o.roundOut = out; if (!o.dead) others(rnd(2)); save(); battle(); const c = $("#roundover"); if (c && window.innerWidth < 821) c.scrollIntoView({ block: "center" }); });
  }
}
function answer(i) {
  const M = S.match, o = M.opps[M.cur], pend = o.pending;
  if (!pend || pend.chosen !== null) return;
  const q = resolve(pend.ref), ok = i === q.answer, rd = o.kind === "reading" && !o.boss;
  record(pend.ref, ok);
  pend.chosen = i;
  let fx;
  if (ok) {
    M.hits++; M.streak++;
    if (rd) { o.hp = Math.max(0, o.hp - 1); o.passRight = (o.passRight || 0) + 1; fx = { hit: true, bar: true }; }   // reading: one bar for each right answer
    else fx = { hit: true, load: 5 };
    beep(SND.hit);
    others(rnd(3));
    M.sinceChest++;
    pend.chest = Math.random() < Math.min(1, 0.12 * M.sinceChest);   // more likely the longer it has been since the last chest
    if (pend.chest) M.sinceChest = 0;
  } else {
    M.misses++; M.streak = 0;
    if (M.bush) { M.bush = false; fx = { hit: false, dmg: 0, bush: true, miss: true }; }
    else { hurt(M, STAGE[o.stage].dmg); fx = { hit: false, dmg: STAGE[o.stage].dmg, miss: true }; }
    others(rnd(2));
    beep(M.hp <= 0 ? SND.ko : SND.miss);
  }
  /* what the answer loads: a fight round after every thinking or maths question; one showdown after a whole reading passage */
  pend.round = rd ? (o.queue.length ? null : o.hp <= 0 ? { kind: "finish", ammo: 0, walls: 3 } : { kind: "skirm", ammo: Math.max(2, 2 * (o.passRight || 0)), walls: 3 })
    : { kind: "fight", ammo: ok ? 5 : 2, walls: ok ? 3 : 1 };
  pend.out = { dmg: fx.dmg, bush: fx.bush };
  battle(fx);
  const fb = $(".fb"); if (fb && window.innerWidth < 821) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function rollLoot() { let r = rnd(100); for (const l of LOOT) { if (r < l.w) return l; r -= l.w; } return LOOT[0]; }
function chestAnswer(i) {
  const M = S.match, ch = M.chest;
  if (!ch || ch.chosen !== null) return;
  const q = resolve(ch.ref), ok = i === q.answer;
  record(ch.ref, ok);
  ch.chosen = i;
  if (ok) {
    const l = rollLoot(), h0 = M.hp, s0 = M.shield, c0 = S.coins;
    ch.loot = l.id;
    if (["med", "shield", "boogie", "bush"].includes(l.id)) {
      if (S.items[l.id] < CARRY) { S.items[l.id]++; ch.got = `<b>You now have ${S.items[l.id]} ${S.items[l.id] === 1 ? HOLD[l.id][0] : HOLD[l.id][1]}.</b> ${HOLD[l.id][2]}`; ch.glow = l.id; }
      else { S.coins += 20; S.stats.lootCoins += 20; ch.got = `You already carry ${CARRY}, the most you can hold, so you sell it: <b>coins ${c0} → ${S.coins}</b>.`; }
    } else if (l.id === "gold") { S.coins += 60; S.stats.lootCoins += 60; ch.got = `<b>Coins ${c0} → ${S.coins}.</b> Spend them in the shop on the island.`; }
    else {
      if (l.id === "slurp") { M.hp = Math.min(MAXHP, M.hp + 25); M.shield = Math.min(MAXSH, M.shield + 25); } else { M.hp = MAXHP; M.shield = MAXSH; }
      ch.got = `You drink it straight away: <b>health ${h0} → ${M.hp}</b> and <b>shield ${s0} → ${M.shield}</b>.${h0 === MAXHP && s0 === MAXSH ? " (You were already full.)" : ""}`;
    }
    beep(SND.chest);
  } else beep(SND.miss);
  others(rnd(2));
  battle(ok ? { loot: LOOT.find(x => x.id === ch.loot).name } : undefined);
  const r = $("#loot") || $(".fb"); if (r) r.scrollIntoView({ block: "center" });
}
function next() {
  const M = S.match, o = M.opps[M.cur];
  if (o.pending && o.pending.chosen !== null) {
    const p = o.pending; o.pending = null;
    if (M.hp <= 0) return knockedOut();
    if (p.chest) o.chestDue = true;
    if (p.round) { o.round = p.round; if (o.kind === "reading") o.passRight = 0; return battle(); }
  } else if (o.roundOut) {
    o.roundOut = null;
    if (o.chestDue) { o.chestDue = false; if (!(o.dead && o.boss)) M.chest = { phase: "offer", kind: chestKind(o) }; }
  } else if (M.chest && M.chest.phase === "q" && M.chest.chosen !== null) M.chest = null;
  proceed();
}
function proceed() {
  const M = S.match, o = M.opps[M.cur];
  window.scrollTo(0, 0);
  if (M.chest || o.round || o.roundOut) return battle();
  if (!o.dead) { if (!o.pending) nextQ(o); return battle(); }   // straight on to the next question
  if (o.boss) return victory();
  home();
}
function victory() {
  const M = S.match;
  S.coins += WIN_COINS; S.crowns++; S.stats.wins++; S.n++;
  S.last = { win: true, hits: M.hits, misses: M.misses, earned: M.earned, elims: M.opps.filter(o => o.dead).length };
  S.match = null; beep(SND.win);
  home(); window.scrollTo(0, 0);
}
function knockedOut() {
  const M = S.match;
  S.stats.kos++; S.last = { ko: true, place: alive(M), earned: M.earned }; S.match = null;
  home(); window.scrollTo(0, 0);
}

/* In practice mode only: show any one question in a battle, and the match maker (used by tools/check_game3.js). */
if (PRACTICE) {
  window.__preview = ref => {
    if (!S.match) S.match = newMatch();
    const M = S.match;
    if (M.phase === "bus") land(landNear([50, 50], 40));
    const q = resolve(ref), o = M.opps.find(x => !x.boss && x.kind === q.kind);
    M.opps.forEach(x => { x.dead = false; x.hp = x.max; x.pending = null; x.round = null; x.roundOut = null; }); M.chest = null; M.hp = MAXHP; M.cur = M.opps.indexOf(o);
    if (q.kind === "reading") { o.pid = q.pid; o.queue = []; }
    o.pending = { ref, chosen: null };
    battle();
  };
  window.__debug = { newMatch, landAt, STAGE, BOTS_AFTER, START, GAP, state: () => S };
}

/* ---------- start ---------- */
if (S.match && S.match.phase === "play" && S.match.cur !== null && S.match.opps[S.match.cur] && busy()) battle(); else home();
})();
</script>
