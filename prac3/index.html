  /* ============ circle 2: cloze ============ */
  READING.push({
    id: "stamps", tier: 2, format: "cloze", title: "The Stamp Album",
    note: "Some words are missing from this piece. Choose the word that fits each gap best.",
    html: `<p>When my grandfather died he left me his stamp album, a fat green book that smelled of dust and peppermints. I am ${G(1)} to say that I was not at all grateful. I was eleven, and I had been hoping for his telescope.</p>
<p>For months the album sat ${G(2)} on my shelf. Then, one wet Sunday, with nothing better to do, I opened it. Every page was ruled in pencil, and every stamp sat squarely in its place above a line of tiny, careful handwriting: the country, the year, and often a note about how he had ${G(3)} it. “Swapped with a sailor, 1958.” “From Aunt Vera’s letter, the one with the bad news.”</p>
<p>I had assumed that a collection was simply a heap of things. This was a life, sorted and labelled. I turned the pages more and more slowly, ${G(4)} to reach the end.</p>
<p>On the last page there were six empty squares, and a line in his handwriting that I have never forgotten: “For whoever comes next.” I went out the following Saturday and bought my first stamp. It was a common one, worth almost nothing, but I ruled the line beneath it as ${G(5)} as I could.</p>`,
    questions: [
      gapQ("r6a", 1, ["ashamed", "embarrassing", "guilty", "shy"], 0, `<p>“I am <b>ashamed</b> to say” is the set phrase for admitting something you are not proud of.</p><p class="why-not">“Embarrassing” describes a thing, not a person’s feeling: the writer would be <i>embarrassed</i>. “Guilty” and “shy” are not followed by “to say”.</p>`),
      gapQ("r6b", 2, ["unaware", "unharmed", "untouched", "unknown"], 2, `<p>Nobody opened the album for months: it sat <b>untouched</b>.</p><p class="why-not">“Unaware” describes a person who does not know something, not a book. “Unharmed” would mean something had threatened it. “Unknown” is wrong because the writer knew exactly where it was.</p>`),
      gapQ("r6c", 3, ["required", "acquired", "inquired", "achieved"], 1, `<p>To <b>acquire</b> something is to come to own it. The notes say how each stamp was got: swapped, or taken from a letter.</p><p class="why-not">The look-alikes mean different things: “required” is needed and “inquired” is asked. You achieve a goal, not an object.</p>`),
      gapQ("r6d", 4, ["impatient", "resistant", "incapable", "reluctant"], 3, `<p>The writer turns the pages “more and more slowly”. You slow down when you do not want something to finish: <b>reluctant</b> to reach the end.</p><p class="why-not">“Impatient to reach the end” is good English, but an impatient reader speeds up. “Resistant” is followed by “to” and a thing (resistant to change), and “incapable” by “of”.</p>`),
      gapQ("r6e", 5, ["quickly", "carefully", "cheaply", "boldly"], 1, `<p>Look back at how the grandfather worked: every page “ruled in pencil”, with “tiny, careful handwriting”. The writer has taken up his place (“whoever comes next”) and copies his way of doing things: as <b>carefully</b> as possible.</p><p class="why-not">The stamp was cheap, but a line can’t be ruled “cheaply”. “Quickly” and “boldly” are the opposite of the patient, exact work the album has taught the writer to admire.</p>`),
    ],
  });

  /* ============ circle 3: story ============ */
  READING.push({
    id: "volcano", tier: 3, format: "story", title: "The Science Fair",
    note: "Read the story, then answer the questions.",
    html: `<p>Hamid had built the volcano over three weekends, and it was magnificent. It stood knee-high on its plywood base, with papier-mâché ridges, a crater ringed in orange paint, and a tiny village of matchbox houses that he privately looked forward to destroying.</p>
<p>At the next table, Clementine Park had a row of bean plants in jam jars and a poster with a great deal of writing on it. Hamid had glanced at it once, in the way you might glance at a bus timetable for a town you never intend to visit.</p>
<p>The judges reached him at half past two. There were three of them, with clipboards.</p>
<p>“Whenever you’re ready,” said the tallest.</p>
<p>Hamid tipped in the vinegar. For one glorious second the crater hissed. Then a single orange bubble rose to the rim, considered the view, and sank. Nothing else happened. The matchbox village stood unharmed in the sunshine.</p>
<p>“Ah,” said the tallest judge, and wrote something short.</p>
<p>Hamid kept his eyes on the plywood. He was aware of his ears, which seemed to have grown.</p>
<p>“Is it the bicarb?” said a voice. Clementine was leaning over from her table, frowning at the crater the way a mechanic frowns at an engine. “If it gets damp it goes flat. Mine’s new. I used it for the soil test.” She was already holding out a paper cup.</p>
<p>The judges had moved on to her beans and were waiting, pens raised. Clementine did not appear to have noticed.</p>
<p>Hamid looked at the cup, and at the long poster she had clearly written herself, every line of it, and at the judges standing in front of an empty chair.</p>
<p>“They’re waiting for you,” he said.</p>
<p>“They can wait a minute,” said Clementine. “Go on. Two spoonfuls.”</p>
<p>The eruption, when it came, was everything he had hoped for. Orange foam swallowed the village whole. But the judges had their backs to it, and Hamid found that he did not much mind. He was reading, from the top, a poster about beans.</p>`,
    questions: [
      { id: "r7a", cat: "Comparisons & imagery", stem: `<p>Hamid glanced at Clementine’s poster “<b>in the way you might glance at a bus timetable for a town you never intend to visit</b>”. What does this tell us?</p>`,
        options: ["He found the poster too hard to understand.", "He thought her project had nothing to do with him.", "He was planning to read it properly later that day.", "He was worried that it was better than his."], answer: 1,
        explain: `<p>A timetable for a town you will never visit is of no use to you, so you barely look. Hamid gives the poster the same quick, uninterested glance: he thinks her project <b>has nothing to do with him</b>.</p><p class="why-not">He doesn’t read enough of it to find it hard, and “never intend to visit” rules out coming back later. He thinks his volcano is “magnificent”, so he isn’t worried.</p>` },
      { id: "r7b", cat: "Tone & attitude", stem: `<p>“Then a single orange bubble rose to the rim, <b>considered the view</b>, and sank.” Why does the writer describe the bubble like this?</p>`,
        options: ["to show that the eruption was just beginning", "to suggest that Hamid was not watching closely", "to show the vinegar was the wrong colour", "to make the failure seem slow and rather comic"], answer: 3,
        explain: `<p>The bubble is described like a person strolling up for a look and wandering off. After three weekends of work, one unhurried bubble is all Hamid gets. The joke makes the moment <b>slow and comic</b>, and shows just how little happened.</p><p class="why-not">The next sentence is “Nothing else happened”, so nothing is beginning. Hamid is watching every second. The colour of the bubble is not what goes wrong.</p>` },
      { id: "r7c", cat: "Feelings & inference", stem: `<p>“He was aware of his ears, <b>which seemed to have grown</b>.” What is Hamid feeling?</p>`,
        options: ["hot with embarrassment", "angry with Clementine", "proud of having tried", "eager to hear the judges"], answer: 0,
        explain: `<p>When you are embarrassed your ears burn and feel huge, as if everyone must be staring at them. Hamid won’t look up (“kept his eyes on the plywood”): he is <b>hot with embarrassment</b>.</p><p class="why-not">Clementine has not spoken yet, so he can’t be angry with her. He is hiding from the judges, not straining to hear them, and there is no pride in this moment.</p>` },
      { id: "r7d", cat: "Purpose of a detail", stem: `<p>The writer tells us that the judges “<b>were waiting, pens raised</b>” at Clementine’s table and that she “<b>did not appear to have noticed</b>”. Why are these details included?</p>`,
        options: ["to show that the judges were impatient people", "to show that Clementine was nervous about being judged", "to show that helping Hamid might cost her something", "to show that she did not care about her own project"], answer: 2,
        explain: `<p>Her own judging has begun and she is not there, because she is busy with his crater. The detail shows that her help is not free: <b>it could cost her</b> marks. That is what makes it generous.</p><p class="why-not">She did the soil test and wrote the whole poster herself, so she plainly cares about her project. Nothing shows nerves, and the judges are simply waiting, not complaining.</p>` },
      { id: "r7e", cat: "Character & structure", stem: `<p>At the end, the judges miss the eruption, yet Hamid “<b>did not much mind. He was reading, from the top, a poster about beans.</b>” What has changed in Hamid?</p>`,
        options: ["He has decided that volcanoes are childish.", "He has stopped caring about science altogether.", "He now thinks Clementine’s work deserves his attention.", "He wants to copy her idea for next year’s science fair."], answer: 2,
        explain: `<p>At the start he gave her poster one bored glance. Now he reads it “from the top”: all of it, properly. Her kindness has made him see her, and her work, as <b>worth his attention</b>, and that matters more to him than being watched by the judges.</p><p class="why-not">The eruption “was everything he had hoped for”, so he still loves his volcano. Reading a science poster is the opposite of giving up on science, and nothing suggests copying.</p>` },
    ],

  /* ============ circle 3: four extracts ============ */
  READING.push({
    id: "snow", tier: 3, format: "four extracts", title: "Snow",
    note: "Read the four extracts about snow. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>I grew up in Darwin, where winter means a dry breeze and a cardigan you never quite need. So when my aunt in Canada pulled back the curtains on my first morning there, I did not at first understand what I was looking at. The street had been rubbed out. Cars had become soft white loaves, and the fence wore a tall hat on every post. What struck me most was the quiet. I had expected snow to be cold. Nobody had warned me that it would also turn the volume of the whole world down.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>Every snowflake begins as a speck of dust high in a cloud. Water vapour freezes onto it, forming a tiny six-sided crystal, and as the crystal tumbles through the cloud its six arms grow. Because all six pass through the same patches of colder, warmer, wetter and drier air, they grow in the same way, which is why a snowflake looks so perfectly balanced. No two flakes take quite the same path, however. This is the reason usually given for the old saying that no two snowflakes are alike. In 1885 an American farmer named Wilson Bentley became the first person to photograph a single snow crystal, and he went on to capture more than five thousand of them.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>The sled had belonged to Per’s father, and to his grandfather before that, and it showed. One runner was held on with wire. “It’s faster than it looks,” Per said, which was what his father always said. Ingrid, who owned a new plastic one in a shade called Arctic Lime, was kind enough not to reply. They dragged both sleds to the top of Miller’s Hill. Halfway down, the plastic sled hit a buried root and stopped dead. The old one did not so much as shudder. It carried Per on, past the gate, past the frozen trough, and very nearly into the next farm.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>Our ski resorts now make much of their own snow, pumping water uphill and spraying it from cannons whenever the weather lets them down. I understand why. A resort without snow is a car park with a view, and whole towns depend on the visitors. But each machine swallows water and electricity in quantities that ought to trouble us, particularly in a dry country. If winters are growing shorter, the honest response is to ask what else these mountains might offer, in every season, rather than to keep painting the slopes white and hoping nobody looks too closely.</p></div>`,
    questions: [

<div class="extract"><b class="tag">Extract C</b><p>Every child in the class had planted a bean in a paper cup. By the second week, the windowsill was a forest of green shoots. Only Nora’s cup showed bare, brown soil. She watered it every morning anyway, and when Jack asked if she had forgotten to put a bean in, she said, “It’s thinking.” On the last day of term, when everyone else was carrying their plants home, a pale green loop pushed up through the soil, as if it had just remembered something.</p></div>

    note: "Read the story, then answer the questions.",
    html: `<p>Theo had caught the 412 home from school by himself every day for two weeks, and he had begun to feel that he was rather good at it. So he did not look up from his book when the bus pulled away, and he did not notice, for several stops, that the shops outside were the wrong shops.</p>

<p>He pressed the bell. He got off. The bus sighed and drove away, and Theo stood on a footpath he had never seen, holding a book about a boy who sailed around the world alone.</p>
<p>His phone had nine per cent battery. He looked at it, then put it back in his pocket, because Mum was at work and the word “lost” felt too heavy to type.</p>
<p>There was a bus shelter across the road, and in it sat an old man with a tartan shopping trolley. Theo crossed, read the timetable twice without understanding it, and sat down at the far end of the bench.</p>
<p>“The 412 goes the other way from this side,” said the old man, not looking at him. “People always think it’s this side.”</p>
<p>“I know,” said Theo, who had not known.</p>

    note: "Read the four extracts about sending messages. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>For three years I wrote to a girl in Finland whom I never met. Her letters came on thin blue paper, and each one took nearly a month to arrive, so that by the time I read about her new kitten, the kitten was probably a cat. I didn’t mind. I kept every letter in a shoebox and reread them while I waited for the next. I think I knew her better, in the end, than some of the people I saw every day.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>Long before telephones, people trusted messages to pigeons. A homing pigeon taken far from its loft will fly straight back to it, and a note tied to its leg travels too. Scientists still argue about exactly how the birds find their way; the sun and the Earth’s magnetism probably both play a part. In 1918, during the First World War, a pigeon named Cher Ami carried a message from a group of trapped soldiers to their own side. The bird was badly wounded on the way, but the message got through, and around two hundred soldiers were rescued.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>Sami wrote the note on the back of a shopping list: his name, his town and the words “Please write back.” He pushed it into an empty juice bottle and threw it as far as he could from the end of the jetty. Then he forgot about it, the way you forget about most things when you are eight. Six years later, a letter arrived from a fisherman on the other side of the bay, with a photo of a muddy bottle and the words: “Sorry it took so long.”</p></div>
<div class="extract"><b class="tag">Extract D</b><p>A text message takes three seconds to send and about as long to forget. A handwritten thank-you card is a different thing altogether. Someone had to choose it, find a pen, think about what to say and walk to a letterbox. That effort is part of the message. It says “you were worth my time” before the reader has even opened the envelope. We should send fewer texts and more cards, especially to the people who matter most.</p></div>`,

  /* a five-square tile (a 2 × 2 block with one extra square), turned or flipped. Cells are [row, col]. */
  const norm = c => { const r0 = Math.min(...c.map(x => x[0])), c0 = Math.min(...c.map(x => x[1])); return c.map(([r, k]) => [r - r0, k - c0]); };
  const turn = c => norm(c.map(([r, k]) => [k, -r]));            // a quarter turn clockwise
  const flip = c => norm(c.map(([r, k]) => [r, -k]));            // turned over (mirror image)
  const P = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]];
  const tile = cells => {
    const u = 24, W = 3 * u + 6, has = (r, k) => cells.some(c => c[0] === r && c[1] === k);
    const desc = "A tile of five squares on a 3 by 3 grid. " + [0, 1, 2].map(r => `Row ${r + 1}: ${[0, 1, 2].map(k => has(r, k) ? "square" : "empty").join(", ")}`).join(". ") + ".";
    return `<svg viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" role="img" aria-label="${desc}">${cells.map(([r, k]) => `<rect x="${3 + k * u}" y="${3 + r * u}" width="${u}" height="${u}" fill="#b9e3c6" stroke="${INK}" stroke-width="2"/>`).join("")}</svg>`;
  };
  const PTILE = fig(tile(P));

  const view = h => {
    const u = 22, H = 3 * u + 6;
    return `<svg viewBox="0 0 ${3 * u + 6} ${H}" width="${3 * u + 6}" height="${H}" role="img" aria-label="Three columns of squares side by side. From left to right they are ${h.join(", ")} squares tall.">${h.map((n, c) => Array.from({ length: n }, (_, k) => `<rect x="${3 + c * u}" y="${H - 3 - (k + 1) * u}" width="${u}" height="${u}" fill="#c9d6f2" stroke="${INK}" stroke-width="2"/>`).join("")).join("")}</svg>`;

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "t101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Ranger Kim: “Visitors should keep to the marked track through the sand dunes. That way the dune plants will have a chance to grow back.”</div><p>Which statement, if true, best supports Ranger Kim’s claim?</p>`,
      options: ["The marked track has the best view of the sea.", "Dune plants help to hold the sand in place during storms.", "Dune plants are easily crushed when people walk on them.", "Most visitors already carry a map that shows the track."], answer: 2,
      explain: `<p>The claim joins two things: staying on the track, and the plants growing back. The best support explains the link. If plants are <b>crushed by feet</b>, then keeping feet on the track is what lets them grow.</p><p class="why-not">The view and the maps are about the track, not the plants. The fact about storms tells us why the plants matter, but not why staying on the track helps them.</p>` },
    { id: "t102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Sam’s mum has a red tag on her keys. In the park, Sam finds a bunch of keys with a red tag.<br>Sam: “These must be Mum’s keys.”</div><p>Which one of these shows the mistake Sam has made?</p>`,
      options: ["Other people’s keys may have a red tag too.", "Sam’s mum may have more than one bunch of keys.", "The keys may have been in the park for a long time.", "Red may not be Sam’s mum’s favourite colour."], answer: 0,
      explain: `<p>Sam has matched just <b>one thing</b>: the red tag. That would only prove the keys are Mum’s if nobody else had a red tag, and Sam doesn’t know that.</p><p class="why-not">How many bunches Mum owns, how long the keys have been there and which colour she likes best don’t show what is wrong with jumping from “red tag” to “Mum’s keys”.</p>` },
    { id: "t103", tier: 1, cat: "Order & arrangement",
      stem: `<p>Three jars stand in a row on a shelf: jam, honey and pickles.</p><p>The jam is somewhere to the left of the honey.<br>The pickles are not next to the jam.</p><p>Which jar is in the middle?</p>`,

      explain: `<p>The pickles are not next to the jam, so those two must be at the two ends, with the <b>honey</b> between them. The jam is left of the honey, so the row is jam, honey, pickles.</p><p class="why-not">If the jam or the pickles were in the middle, the pickles would be right next to the jam. There is only one row that fits, so it is possible to tell.</p>` },
    { id: "t104", tier: 1, cat: "Rules & codes",

      options: ["1", "2", "3", "4"], answer: 1,

    { id: "t105", tier: 1, cat: "Number problems",

    { id: "t107", tier: 1, cat: "Must or cannot be true",

    /* ===================== circle 2 ===================== */
    { id: "t201", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">To enter the art prize, a painting must be handed in by Friday. Zane handed his painting in on Wednesday.<br>Zane: “I got mine in early, so I am sure to win a prize.”</div><p>Which one of these shows the mistake Zane has made?</p>`,

      explain: `<p>Being on time is <b>needed</b> to enter, but it does not <b>guarantee</b> a prize. Every painting handed in by Friday is in the same position.</p><p class="why-not">How fast Zane painted, when the judging happens and when other children hand theirs in don’t explain why “on time” is not the same as “winner”.</p>` },
    { id: "t202", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Mr Diaz, the caretaker: “We should put a second bin beside the oval. Then less rubbish will be left on the grass.”</div><p>Which statement, if true, best supports Mr Diaz’s claim?</p>`,
      options: ["Three different classes use the oval for games every lunchtime.", "Rubbish left on the grass attracts ibises.", "The school already has a bin near the canteen.", "Children say the only bin is too far away from the oval."], answer: 3,
      explain: `<p>The claim needs a reason why a bin <i>beside the oval</i> would cut the rubbish. If children drop rubbish because the bin is <b>too far away</b>, a nearer bin fixes exactly that.</p><p class="why-not">How many classes use the oval and what the rubbish attracts show that rubbish is a problem, not that a second bin would solve it. A bin near the canteen is the far-away bin already there.</p>` },
    { id: "t203", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">Most of the apples in a box are green. The rest are red.</div><p>Priya: “If I take an apple from the box without looking, it will probably be green.”</p><p>Quentin: “The apple on the teacher’s desk is green, so it probably came from this box.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Priya", "Quentin"), answer: 0,
      explain: `<p>“Most apples in the box are green” tells us about apples <i>from the box</i>. So an apple taken from it is probably green: <b>Priya</b> is right.</p><p class="why-not">Quentin turns it round. We are told nothing about where green apples usually come from. There could be thousands of green apples that were never in this box.</p>` },
    { id: "t205", tier: 2, cat: "Order & arrangement",
      stem: `<p>Four boats finished a race, one after another.</p><p>The red boat finished before the blue boat but after the green boat.<br>The yellow boat finished after the red boat.<br>The blue boat was not last.</p><p>Which boat came <b>third</b>?</p>`,
      options: ["the red boat", "the yellow boat", "the blue boat", "the green boat"], answer: 2,
      explain: `<p>Green is before red, and red is before both blue and yellow, so the race starts green, red. Blue was not last, so blue is third and yellow is fourth: green, red, <b>blue</b>, yellow.</p><p class="why-not">Yellow is tempting because it is the last boat mentioned, but the final clue pushes yellow to the back. Red and green are fixed in second and first place.</p>` },
    { id: "t206", tier: 2, cat: "Rules & codes",
      stem: `<p>In a word game, each letter is worth points:</p>${tbl(["A", "E", "T", "M", "S"], [["1", "2", "3", "4", "5"]]).replace("<th>1</th>", "<td>1</td>")}<p>A word’s score is the total of its letters. So <b>TEAM</b> scores 3 + 2 + 1 + 4 = 10.</p><p>Which of these words scores the most?</p>`,
      options: ["MATES", "TASTE", "STEAM", "MESS"], answer: 3,
      explain: `<p>Add each word: MATES = 4 + 1 + 3 + 2 + 5 = 15. TASTE = 3 + 1 + 5 + 3 + 2 = 14. STEAM = 15. <b>MESS</b> = 4 + 2 + 5 + 5 = 16.</p><p class="why-not">The longer words look as if they should win, but MESS has two letters worth 5. MATES and STEAM use the same five letters, so they tie on 15.</p>` },
    { id: "t207", tier: 2, cat: "Tables & timetables",
      stem: `<p>The table shows how many stickers two children have.</p>${tbl(["", "Animal", "Space", "Sport"], [["Ivy", 6, 5, 4], ["Jon", 7, 2, 8]])}<p>Ivy gives Jon <b>3 space</b> stickers. Jon gives Ivy <b>2 sport</b> stickers.</p><p>After the swap, how many <b>more</b> stickers does Jon have than Ivy?</p>`,
      options: ["2", "3", "4", "8"], answer: 2,
      explain: `<p>Before: Ivy 6 + 5 + 4 = 15 and Jon 7 + 2 + 8 = 17.</p><p>After: Ivy 15 − 3 + 2 = 14 and Jon 17 + 3 − 2 = 18. Jon has <b>4</b> more.</p><p class="why-not">2 is the gap before the swap. 3 changes only one child’s total: every sticker that moves makes one pile smaller <i>and</i> the other bigger. 8 stops after Ivy’s gift and forgets the stickers Jon gives back.</p>` },
    { id: "t208", tier: 2, cat: "Number problems",
      stem: `<p>A dentist sees patients from <b>9:00 am</b> until <b>5:00 pm</b>, with a lunch break from 12:30 pm to 1:30 pm.</p><p>Every check-up takes exactly 30 minutes, and there are no gaps between them.</p><p>How many check-ups can the dentist do in one day?</p>`,
      options: ["7", "14", "15", "16"], answer: 1,
      explain: `<p>Morning: 9:00 to 12:30 is 3½ hours = 7 check-ups. Afternoon: 1:30 to 5:00 is 3½ hours = 7 check-ups. Altogether <b>14</b>.</p><p class="why-not">16 forgets the lunch break (8 hours of check-ups). 15 takes off only half an hour for lunch. 7 is just the morning.</p>` },
    { id: "t209", tier: 2, cat: "Must or cannot be true",
      stem: `<p>Asha is taller than Ben, and Ben is taller than Col.</p><p>The three friends stand on a staircase, each on a different step. Now the tops of their heads are exactly level.</p><p>Which one of these <b>cannot</b> be true?</p>`,
      options: ["Ben is on a higher step than Col.", "Asha is on the lowest step.", "Col is on the highest step.", "Ben is on a step between the other two."], answer: 0,
      explain: `<p>For the heads to be level, the shortest person needs the most help from the stairs. So Col is highest, Ben is in between and Asha is lowest.</p><p>That makes “<b>Ben is on a higher step than Col</b>” impossible: Ben is taller, so on a higher step his head would be above Col’s.</p><p class="why-not">The other three statements describe exactly how they must be standing.</p>` },
    { id: "t210", tier: 2, cat: "Spatial", visual: true,
      stem: `<p>Here is a tile made of five squares.</p>${PTILE}<p>Three of the tiles below are this tile <b>turned round</b>. One has been <b>flipped over</b>, so it is a mirror image.</p><p>Which tile has been flipped over?</p>`,
      options: [tile(flip(turn(P))), tile(turn(P)), tile(turn(turn(P))), tile(turn(turn(turn(P))))], answer: 0,
      explain: `<p>Turn the first tile in your head, a quarter turn at a time. Going clockwise round the block of four, the extra square always sits just <i>after</i> the same corner. Three of the tiles keep that pattern.</p><p>In the <b>first tile (A)</b> the extra square is on the other side of the block. No amount of turning does that: the tile must have been flipped over.</p><p class="why-not">The other three are the tile after a quarter turn, a half turn and a three-quarter turn.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "t301", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">A rule in a board game: “If you roll a six, you get another turn.” The rule is always followed.</div><p>Ed: “Fay got another turn, so she must have rolled a six.”</p><p>Gus: “Hana did not get another turn, so she cannot have rolled a six.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ed", "Gus"), answer: 1,
      explain: `<p>The rule says what happens <i>after a six</i>. If Hana had rolled a six she would have had another turn. She didn’t, so she didn’t roll one: <b>Gus</b> is right.</p><p class="why-not">Ed runs the rule backwards. The rule does not say a six is the <i>only</i> way to get another turn. Fay might have landed on a bonus square.</p>` },
    { id: "t302", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">A survey found that most children at Hillside School like the new playground.<br>Mia: “My cousin goes to Hillside, so she likes the new playground.”</div><p>Which one of these shows the mistake Mia has made?</p>`,
      options: ["The survey may have been done before the playground was finished.", "Mia may not have seen the new playground herself.", "Children at other schools may like their playgrounds more.", "Mia’s cousin may be one of the children who do not like it."], answer: 3,
      explain: `<p>“Most” is not “all”. Some Hillside children do not like the playground, and Mia’s <b>cousin could be one of them</b>. Mia can only say her cousin <i>probably</i> likes it.</p><p class="why-not">The timing of the survey, whether Mia has seen the playground and what other schools think don’t explain what is wrong with going from “most children” to “this child”.</p>` },
    { id: "t303", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Dr Osei: “High schools should start lessons an hour later in the morning. Then students would learn more in their first lesson of the day.”</div><p>Which statement, if true, best supports Dr Osei’s claim?</p>`,
      options: ["Students who are still sleepy take in less of what they are taught.", "Many high school students say they would like a later start.", "Teenagers tend to go to bed later than younger children do.", "Students who learn more in the mornings usually go on to get better marks."], answer: 0,
      explain: `<p>The claim needs a link from “starting later” to “learning more”. If <b>sleepy students take in less</b>, then a later start (more sleep) means more is learned.</p><p class="why-not">What students would like is not about learning. Going to bed later explains why they are tired, but stops before learning. Better marks is about what happens <i>after</i> learning more, not what causes it.</p>` },
    { id: "t304", tier: 3, cat: "Spatial", visual: true,
      stem: `<p>Towers of cubes stand on a 3 by 3 board. This plan shows the board from <b>above</b>. Each number tells you how many cubes are in that tower.</p>${PLAN}<p>What does Mia see?</p>`,
      options: [view([2, 3, 2]), view([3, 2, 2]), view([2, 2, 3]), view([2, 1, 1])], answer: 2,
      explain: `<p>From the side, Mia sees one column for each <i>row</i> of the plan, and each column is as tall as the tallest tower in that row. Front row: 2. Middle row: 2. Back row: 3.</p><p>Standing on the right-hand side, the front of the board is on Mia’s left, so she sees <b>2, 2, 3</b> from left to right (C).</p><p class="why-not">2, 3, 2 is the view from the front. 3, 2, 2 is the view from the opposite side. 2, 1, 1 is only the nearest line of towers: taller towers behind them still show over the top.</p>` },
    { id: "t305", tier: 3, cat: "Rules & codes",
      stem: `<p>A coach must choose <b>three</b> of these five swimmers for a relay: Ada, Bo, Cy, Di and Eli.</p><div class="box">Ada and Bo will not swim in the same team.<br>If Cy is chosen, Di must be chosen too.<br>Eli must be chosen.</div><p>Which team can the coach choose?</p>`,
      options: ["Bo, Di and Eli", "Ada, Bo and Eli", "Ada, Cy and Eli", "Bo, Cy and Di"], answer: 0,
      explain: `<p>Test each team against all three rules. <b>Bo, Di and Eli</b>: Ada and Bo are not together, Cy is not chosen so the second rule does not matter, and Eli is in. It works.</p><p class="why-not">Ada, Bo and Eli puts Ada and Bo together. Ada, Cy and Eli has Cy without Di. Bo, Cy and Di leaves out Eli.</p>` },
    { id: "t306", tier: 3, cat: "Tables & timetables",
      stem: `<p>Four garden lamps are on timers.</p>${tbl(["Lamp", "Switches on", "Switches off"], [["A", "5:00 pm", "8:30 pm"], ["B", "6:15 pm", "9:00 pm"], ["C", "7:00 pm", "7:45 pm"], ["D", "8:00 pm", "10:00 pm"]])}<p>For how long altogether are <b>three</b> lamps on at the same time?</p>`,
      options: ["30 minutes", "45 minutes", "1 hour 15 minutes", "2 hours 15 minutes"], answer: 2,
      explain: `<p>A and B are both on from 6:15 to 8:30. During that time C joins them from 7:00 to 7:45 (45 minutes), and D joins them from 8:00 until A goes off at 8:30 (30 minutes).</p><p>45 + 30 = <b>1 hour 15 minutes</b>. (C and D are never on together, so there are never four.)</p><p class="why-not">45 minutes and 30 minutes are each only one of the two stretches. 2 hours 15 minutes is how long A and B are on together, which is only two lamps.</p>` },
    { id: "t307", tier: 3, cat: "Must or cannot be true",
      stem: `<div class="box">In a hockey league, a team wins a game only if it scores more goals than the other team. If the two teams score the same, the game is a draw.<br>Last Saturday the Otters scored no goals.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["The Otters lost on Saturday.", "The other team scored at least one goal.", "The Otters have not won a game this season.", "The Otters did not win on Saturday."], answer: 3,
      explain: `<p>To win you must score more than the other team, and nobody can score fewer than zero. So with no goals <b>the Otters did not win</b>.</p><p class="why-not">They need not have lost: if the other team also scored nothing, it was a 0–0 draw. That is also why the other team need not have scored. One Saturday tells us nothing about the rest of the season.</p>` },
    { id: "t308", tier: 3, cat: "Number problems",
      stem: `<p>There are <b>24</b> children in a class. <b>15</b> play soccer and <b>12</b> play netball. <b>2</b> children play neither sport.</p><p>How many children play <b>both</b> soccer and netball?</p>`,
      options: ["3", "5", "7", "10"], answer: 1,
      explain: `<p>24 − 2 = 22 children play at least one sport. But 15 + 12 = 27, which is 5 too many. The extra 5 are the children who were counted twice, once for each sport: <b>5</b> play both.</p><p>Check: 10 soccer only + 5 both + 7 netball only + 2 neither = 24.</p><p class="why-not">3 is just 15 − 12. 7 is the number who play netball only, and 10 is the number who play soccer only.</p>` },

    /* ===================== the boss ===================== */
    { id: "t401", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">A bag holds 6 lemon, 4 mint and 3 berry lollies. They are all wrapped the same, so nobody can tell them apart.</div><p>Pia: “If I take out 4 lollies, I am certain to get at least two of the same flavour.”</p><p>Raj: “If I take out 8 lollies, I am certain to get at least one berry.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 0,
      explain: `<p>To be <i>certain</i>, think of the unluckiest case. There are only 3 flavours, so the first 3 lollies could all be different, but the 4th must match one of them. <b>Pia</b> is right.</p><p class="why-not">Raj is wrong: there are 6 + 4 = 10 lollies that are not berry, so his 8 could all be lemon and mint. He would need 11 to be certain.</p>` },
    { id: "t402", tier: 4, cat: "Spot the mistake",
      stem: `<div class="box">After recess, the door of the class hamster’s cage was found open. Only Ivy and Jack were in the room during recess.<br>Ivy: “I didn’t open it, so Jack must have.”</div><p>Which one of these shows the mistake Ivy has made?</p>`,
      options: ["Jack may like the hamster more than Ivy does.", "Ivy may have been in the room for much longer than Jack was.", "The hamster may not have left its cage.", "The door may not have been latched properly before recess."], answer: 3,
      explain: `<p>Ivy thinks there are only two possibilities: she opened it, or Jack did. There is a third: <b>nobody opened it at recess</b>. A door that was not latched could have swung open by itself.</p><p class="why-not">Who likes the hamster, who was in the room longer and whether the hamster got out don’t point to anything wrong with her “me or Jack” thinking.</p>` },
    { id: "t403", tier: 4, cat: "Number problems",
      stem: `<p>A class of <b>20</b> children voted for a mascot: an owl, a fox or a frog. Every child voted for exactly <b>two</b> of the three animals.</p><p>The owl got 14 votes and the fox got 15 votes.</p><p>How many votes did the frog get?</p>`,
      options: ["9", "11", "20", "29"], answer: 1,
      explain: `<p>20 children with 2 votes each makes 40 votes altogether. The owl and the fox took 14 + 15 = 29 of them, so the frog got 40 − 29 = <b>11</b>.</p><p class="why-not">29 is the owl’s and fox’s votes, not the frog’s. 20 is the number of children, and each of them had two votes, not one. 9 comes from taking 29 away from the wrong total.</p>` },
    { id: "t404", tier: 4, cat: "Spatial",
      stem: `<p>On a dice, the numbers on opposite faces always add up to <b>7</b>.</p><p>A dice sits on a table with <b>1 on top</b>, <b>2 facing you</b> and <b>3 on the right-hand side</b>.</p><p>You tip the dice over once to the <b>right</b>, so the top face becomes the right-hand face. Then you tip it once <b>towards you</b>, so the top face becomes the face that looks at you.</p><p>Which number is on top now?</p>`,
      options: ["2", "4", "5", "6"], answer: 2,
      explain: `<p>Start: top 1, bottom 6, front 2, back 5, right 3, left 4.</p><p>Tip to the right: the left face comes up, so the top is 4 (front and back stay as 2 and 5).</p><p>Tip towards you: the back face comes up, so the top is <b>5</b>.</p><p class="why-not">4 stops after the first tip. 6 is opposite the 1 you started with, but the bottom never comes straight to the top in one tip. 2 is the face that started at the front; after the second tip it is underneath.</p>` },
    { id: "t405", tier: 4, cat: "Order & arrangement",
      stem: `<p>Five shelves are numbered 1 (bottom) to 5 (top). Each holds one thing: a globe, a clock, a vase, a lamp and a trophy.</p><div class="box">The trophy is on shelf 3.<br>The lamp is on the shelf directly above the globe.<br>The clock is higher than the vase.<br>The vase is not on the bottom shelf.</div><p>What is on shelf <b>4</b>?</p>`,
      options: ["the clock", "the lamp", "the globe", "the vase"], answer: 3,
      explain: `<p>With the trophy on 3, the globe and lamp (one directly above the other) must be on 1 and 2, or on 4 and 5.</p><p>If they were on 4 and 5, the vase and clock would be on 1 and 2. The vase can’t be on 1, so it would be on 2 with the clock below it. But the clock must be higher. That fails.</p><p>So the globe is on 1 and the lamp on 2. The vase and clock take 4 and 5 with the clock higher: the <b>vase</b> is on 4.</p><p class="why-not">The clock is on 5, the lamp on 2 and the globe on 1.</p>` },
    { id: "t406", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">The canteen sells soup <b>only</b> on days when the temperature at 9 am is below 15 degrees. On every such day, it does sell soup.</div><p>Wes: “The canteen is selling soup today, so it was below 15 degrees at 9 am.”</p><p>Xan: “It was 20 degrees at 9 am today, so there will be no soup at the canteen.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Wes", "Xan"), answer: 2,
      explain: `<p>“Only on days below 15 degrees” means soup is never sold on a warmer day. So if soup is on sale it must have been below 15 (Wes), and on a 20-degree morning there can be no soup (Xan). <b>Both</b> are right.</p><p class="why-not">Many rules only work in one direction, which is why “only one of them” is tempting. Here the word “only” makes Wes’s and Xan’s statements two ways of saying the same thing.</p>` },
    { id: "t407", tier: 4, cat: "Supports the claim",
      stem: `<div class="box">Councillor Abara: “We should plant shady trees along the footpaths of Main Street. Then more people will walk to the shops in summer instead of driving.”</div><p>Which statement, if true, best supports the councillor’s claim?</p>`,
      options: ["Streets lined with trees look more attractive to visitors.", "Many people say Main Street is too hot to walk along in summer.", "Parking spaces near the shops are very hard to find during summer.", "People who walk to the shops tend to visit more of them."], answer: 1,
      explain: `<p>The claim is that <i>shade</i> will get people walking. That only works if <b>heat is what stops them now</b>. If people say the street is too hot to walk along, shady trees remove the reason they drive.</p><p class="why-not">Looking attractive is a different benefit of trees. Scarce parking is a reason to walk that has nothing to do with trees. More shop visits is a result of walking, not a reason that trees would cause it.</p>` },
  );
})();

  const BLOCK = (() => { const c = []; for (let x = 0; x < 3; x++) for (let y = 0; y < 2; y++) c.push([x, y, 0]); return fig(blocks(c, { u: 34, aria: "A flat block of six small cubes, 3 cubes long, 2 cubes wide and 1 cube high." })); })();

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "u101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Mr Ito, the librarian: “We should put the new picture books on the lowest shelves. Then the youngest children will borrow more of them.”</div><p>Which statement, if true, best supports Mr Ito’s claim?</p>`,
      options: ["The new picture books have bright covers.", "Older children in the school prefer to borrow chapter books.", "The youngest children can’t reach the high shelves.", "The lowest shelves are the easiest ones to dust."], answer: 2,
      explain: `<p>The claim links low shelves to more borrowing by the youngest children. If they <b>can’t reach the high shelves</b>, moving the books down is exactly what lets them borrow more.</p><p class="why-not">Bright covers would attract children wherever the books were. What older children like, and which shelves are easy to dust, say nothing about the youngest children borrowing more.</p>` },
    { id: "u102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Mia started playing music to her tomato plant in spring. By summer it had grown much taller.<br>Mia: “That proves music makes plants grow.”</div><p>Which one of these shows the mistake Mia has made?</p>`,
      options: ["The plant may have grown because the weather got warmer.", "Other people in her family may not like the music Mia plays.", "Some kinds of plants may not grow tomatoes.", "Mia may have more than one tomato plant."], answer: 0,
      explain: `<p>Plants grow from spring to summer anyway. Mia has <b>ignored another possible cause</b>: warmer weather and longer days, not the music, may have made it grow.</p><p class="why-not">Whether people like her music, which plants grow tomatoes and how many plants she has don’t show what is wrong with her conclusion.</p>` },
    { id: "u103", tier: 1, cat: "Whose reasoning",
      stem: `<div class="box">Rule: to be in the swimming final, you <b>must</b> swim your heat in under 40 seconds. Only the eight fastest swimmers go through.</div><p>Ana: “Kai swam his heat in 38 seconds, so he is definitely in the final.”</p><p>Ben: “Lucy is in the final, so she must have swum her heat in under 40 seconds.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ana", "Ben"), answer: 1,
      explain: `<p>Under 40 seconds is <b>needed</b> for the final, so anyone in the final, like Lucy, must have done it: <b>Ben</b> is right.</p><p class="why-not">But being under 40 seconds doesn’t <i>guarantee</i> a place: if eight other swimmers were faster than Kai, he misses out. So Ana is wrong.</p>` },
    { id: "u104", tier: 1, cat: "Tables & timetables",
      stem: `<p>At a sports day, each race gives <b>3 points</b> for 1st, <b>2 points</b> for 2nd and <b>1 point</b> for 3rd.</p>${tbl(["Race", "1st", "2nd", "3rd"], [["Sprint", "Red", "Blue", "Gold"], ["Relay", "Blue", "Red", "Gold"], ["Hurdles", "Gold", "Blue", "Red"]])}<p>Which house scored the most points?</p>`,
      options: ["Red", "Blue", "Gold", "It is a tie"], answer: 1,
      explain: `<p>Add up each house: Red 3 + 2 + 1 = 6. <b>Blue</b> 2 + 3 + 2 = 7. Gold 1 + 1 + 3 = 5.</p><p class="why-not">Every house won exactly one race, so counting wins makes it look like a tie. The 2nd places matter too, and Blue came 2nd twice.</p>` },
    { id: "u105", tier: 1, cat: "Spatial",
      stem: `<p>A wooden cube is painted <b>red on the top and the bottom</b> and blue on the other four faces. It is then cut into 8 equal small cubes.</p>${cube(2, { u: 44, fill: ["#74c0fc", "#ff6b6b", "#4dabf7"], aria: "A cube cut into 8 small cubes, 2 along each edge. The top is red and the sides are blue." })}<p>How many of the small cubes have some red paint on them?</p>`,
      options: ["2", "4", "6", "8"], answer: 3,
      explain: `<p>Every small cube is in either the top layer or the bottom layer. The top four all have a red top, and the bottom four all have a red bottom. So <b>all 8</b> have some red.</p><p class="why-not">4 counts only the top layer you can see in the picture. The bottom face is red too.</p>` },
    { id: "u106", tier: 1, cat: "Rules & codes",
      stem: `<p>In a made-up language:</p><div class="box">“mipo tak” means “red apple”<br>“mipo sul” means “red bus”<br>“lin sul” means “blue bus”</div><p>What does “<b>lin tak</b>” mean?</p>`,
      options: ["red apple", "blue bus", "blue apple", "red bus"], answer: 2,
      explain: `<p>“mipo” appears in both phrases with “red”, so mipo = red. Then tak = apple and sul = bus, and “lin sul” = blue bus gives lin = blue. So “lin tak” is <b>blue apple</b>.</p><p class="why-not">The other options use a word in the wrong meaning, or copy one of the given phrases.</p>` },
    { id: "u107", tier: 1, cat: "Must or cannot be true",
      stem: `<div class="box">Every cupcake on the tray has icing.<br>Some of the cupcakes with icing also have sprinkles.<br>Ella takes one cupcake from the tray.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["Ella’s cupcake has sprinkles.", "Some cupcakes have sprinkles but no icing.", "Ella’s cupcake has no sprinkles.", "Ella’s cupcake has icing."], answer: 3,
      explain: `<p>Every cupcake on the tray has icing, so <b>Ella’s must have icing</b>.</p><p class="why-not">Only <i>some</i> have sprinkles, so hers may or may not. Every cupcake has icing, so none can have sprinkles without it.</p>` },
    { id: "u108", tier: 1, cat: "Number problems",
      stem: `<p>Ava is standing in a line. She is <b>9th</b> counting from the front and <b>6th</b> counting from the back.</p><p>How many people are in the line?</p>`,
      options: ["3", "13", "14", "15"], answer: 2,
      explain: `<p>There are 8 people in front of Ava and 5 behind her. With Ava: 8 + 1 + 5 = <b>14</b>.</p><p class="why-not">9 + 6 = 15 counts Ava twice. 13 leaves her out, and 3 is just the difference.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "u201", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">Oscar asked the four other members of his chess club whether the school should hold a chess tournament. All four said yes.<br>Oscar: “Everyone at school wants a chess tournament.”</div><p>Which one of these shows the mistake Oscar has made?</p>`,
      options: ["A tournament may take a long time to organise.", "Oscar may not be the best player in the club.", "Some people at the school may like draughts more than chess.", "The people Oscar asked may all already love chess."], answer: 3,
      explain: `<p>Oscar only asked the chess club, people who <b>already love chess</b>. Their answer tells him nothing about the rest of the school.</p><p class="why-not">How long it takes to organise, how good Oscar is, and draughts don’t explain what is wrong with judging a whole school from four club members.</p>` },
    { id: "u202", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Coach Ruiz: “Players should drink water at every quarter break. Then they will play better in the last quarter.”</div><p>Which statement, if true, best supports the coach’s claim?</p>`,
      options: ["Players who are short of water tire and make mistakes.", "Water costs much less than sports drinks.", "Most netball games are played in four quarters.", "Good players are often seen drinking water at the breaks."], answer: 0,
      explain: `<p>The claim needs a link from drinking water to playing better late in the game. If players short of water <b>tire and make mistakes</b>, drinking at each break prevents that.</p><p class="why-not">Cost and the number of quarters are true but beside the point. “Good players are seen drinking water” is a link the wrong way round: they might drink because they play hard, not play well because they drink.</p>` },
    { id: "u203", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">School rule: if it is raining at lunchtime, everyone stays in the library. The rule is always followed.</div><p>Pia: “The children are not in the library at lunchtime, so it can’t be raining.”</p><p>Raj: “It is raining at lunchtime, so the children are in the library.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 2,
      explain: `<p>The rule says rain at lunchtime always means the library, so Raj is right. And if the children are <i>not</i> in the library, it can’t be raining, or the rule would have sent them there: Pia is right too. <b>Both</b> are correct.</p><p class="why-not">The mistake to avoid is turning the rule round: “they are in the library, so it must be raining” would be wrong, because children can be in the library for other reasons. Neither Pia nor Raj does that.</p>` },
    { id: "u204", tier: 2, cat: "Tables & timetables",
      stem: `<p>The swim club’s usual timetable:</p>${tbl(["Day", "Start", "Finish"], [["Monday", "4:00 pm", "5:00 pm"], ["Wednesday", "4:00 pm", "5:00 pm"], ["Friday", "4:00 pm", "5:00 pm"], ["Saturday", "9:00 am", "10:30 am"]])}<p>This week, Wednesday is cancelled, and Saturday starts <b>half an hour late</b> but finishes at the usual time.</p><p>How much training is there this week?</p>`,
      options: ["2½ hours", "3 hours", "3½ hours", "4½ hours"], answer: 1,
      explain: `<p>Monday 1 hour + Friday 1 hour + Saturday 9:30 to 10:30, 1 hour = <b>3 hours</b>.</p><p class="why-not">4½ hours is a normal week. 3½ hours forgets that Saturday is shorter, and 2½ hours takes off too much.</p>` },
    { id: "u205", tier: 2, cat: "Spatial",
      stem: `<p>On a dice, opposite faces always add up to <b>7</b>.</p><p>Three dice are stacked in a tower on a table. The top of the tower shows <b>5</b>.</p><p>What is the total of the five faces you can’t see because they are pressed against another dice or the table?</p>`,
      options: ["21", "19", "16", "14"], answer: 2,
      explain: `<p>The hidden faces are the bottom of the top dice, and the top and bottom of the other two dice.</p><p>The top dice shows 5, so its bottom is 7 − 5 = 2. The middle and bottom dice each hide a top and a bottom that are opposite faces: 7 each. Total: 2 + 7 + 7 = <b>16</b>.</p><p class="why-not">21 counts 7 for all three dice, but the top dice’s top (5) is on show. 19 subtracts the 2 instead of the 5.</p>` },
    { id: "u206", tier: 2, cat: "Rules & codes",
      stem: `<p>Four friends each have a different pet: a cat, a dog, a fish and a bird.</p><div class="box">Ali doesn’t have the cat or the dog.<br>Bea has the fish.<br>Cal doesn’t have the dog.</div><p>Who has the dog?</p>`,
      options: ["Ali", "Bea", "Cal", "Dee"], answer: 3,
      explain: `<p>Bea has the fish. Ali can’t have the cat or the dog, so Ali has the bird. Cal can’t have the dog, so Cal has the cat. That leaves the dog for <b>Dee</b>.</p><p class="why-not">Dee isn’t mentioned in any clue, which makes her easy to overlook, but the pets left over after the clues tell you hers.</p>` },
    { id: "u207", tier: 2, cat: "Number problems",
      stem: `<p>Six classes each send <b>3 children</b> to a quiz. The children are put into teams of <b>4</b>.</p><p>How many more children are needed so that every child is in a full team?</p>`,
      options: ["6", "4", "3", "2"], answer: 3,
      explain: `<p>6 × 3 = 18 children. Teams of 4: four full teams use 16, leaving 2 in a team that needs 4. So <b>2</b> more children are needed (20 = 5 teams of 4).</p><p class="why-not">4 is the team size, not the number missing. 6 is the number of classes, and 3 is how many each class sent.</p>` },
    { id: "u208", tier: 2, cat: "Spatial",
      stem: `<p>Six small cubes are glued together to make this block.</p>${BLOCK}<p>How many small square faces are on the outside of the block, including the bottom?</p>`,
      options: ["18", "22", "24", "36"], answer: 1,
      explain: `<p>Count the outside in pairs. Top and bottom: 6 + 6 = 12. Front and back: 3 + 3 = 6. The two ends: 2 + 2 = 4. Total <b>22</b>.</p><p class="why-not">36 is every face of all six cubes, including the ones glued together inside. 24 and 18 come from counting one pair of sides wrongly or missing the bottom.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "u301", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">Last month, the kiosk at the beach sold 300 ice blocks and the kiosk at the park sold 200.<br>Max: “People like the beach kiosk’s ice blocks better.”</div><p>Which one of these shows the mistake Max has made?</p>`,
      options: ["The park kiosk may also sell sandwiches and drinks.", "Far more people may pass the beach kiosk each day.", "Some people may not eat ice blocks at all.", "Both kiosks may charge the same for an ice block."], answer: 1,
      explain: `<p>Max compares totals that aren’t fair to compare. If <b>far more people pass the beach kiosk</b>, it would sell more even if people liked both equally.</p><p class="why-not">What else the park kiosk sells, people who never eat ice blocks, and equal prices don’t show why the totals can’t be compared.</p>` },
    { id: "u302", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Ms Park: “Our class should have quiet reading straight after lunch instead of at the end of the day. Then more children will finish their books.”</div><p>Which statement, if true, best supports Ms Park’s claim?</p>`,
      options: ["End-of-day reading often gets cut short by packing up.", "Children who finish books usually enjoy reading.", "The library is busiest straight after lunch.", "Some children in the class read much faster than the others."], answer: 0,
      explain: `<p>If reading time at the end of the day <b>often gets cut short</b>, moving it gives the children more real reading time, so more books get finished.</p><p class="why-not">Enjoying reading and reading speed are true but don’t show that the new time helps. A busy library after lunch has nothing to do with reading in class.</p>` },
    { id: "u303", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">Only children who have returned their permission note can go on the excursion.</div><p>Pia: “Tom has returned his note, so he will definitely go on the excursion.”</p><p>Raj: “Sara didn’t go on the excursion, so she can’t have returned her note.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 3,
      explain: `<p>A note is <b>needed</b> to go, but it doesn’t <i>guarantee</i> going. Tom could be sick on the day, so Pia is wrong. Sara could have returned her note and then been sick too, so Raj is wrong. <b>Neither</b> is correct.</p><p class="why-not">The rule only tells you about children who <i>do</i> go: they must have returned a note. It says nothing certain about the ones who stay behind.</p>` },
    { id: "u304", tier: 3, cat: "Spatial",
      stem: `<p>A cube has six different colours. <b>Red is opposite blue</b>, <b>green is opposite yellow</b>, and <b>white is opposite black</b>.</p><p>The cube sits on a table with red on top and green facing you.</p><p>Which colour <b>could</b> be on the right-hand side?</p>`,
      options: ["blue", "yellow", "black", "red"], answer: 2,
      explain: `<p>Red is on top, so blue is underneath. Green faces you, so yellow is at the back. The left and right sides must be the last pair: white and black. So the right side could be <b>black</b>.</p><p class="why-not">Blue is on the bottom and yellow at the back, and red is on top, so none of them can be on the right.</p>` },
    { id: "u305", tier: 3, cat: "Tables & timetables",
      stem: `<p>The 1st of the month is a <b>Tuesday</b>.</p><p>On what date is the <b>third Friday</b> of the month?</p>`,
      options: ["11th", "17th", "18th", "21st"], answer: 2,
      explain: `<p>If the 1st is a Tuesday, the first Friday is the 4th. Add a week each time: the 11th, then the <b>18th</b>.</p><p class="why-not">The 11th is the second Friday. The 17th and 21st come from counting the Fridays from the wrong starting day.</p>` },
    { id: "u306", tier: 3, cat: "Must or cannot be true",
      stem: `<p>One of Ann, Bob and Cat ate the last biscuit.</p><div class="box">Ann: “Bob ate it.”<br>Bob: “Ann is lying.”<br>Cat: “I didn’t eat it.”</div><p><b>Exactly one</b> of them is telling the truth. Who ate the biscuit?</p>`,
      options: ["Ann", "Bob", "It can’t be worked out", "Cat"], answer: 3,
      explain: `<p>Ann and Bob can’t both be telling the truth, and they can’t both be lying: one of them must be the one honest person. So Cat is lying, and “I didn’t eat it” is false: <b>Cat</b> ate it.</p><p>Check: Ann lies (Bob didn’t eat it), Bob tells the truth, Cat lies. Exactly one truth.</p><p class="why-not">If Bob had eaten it, Ann and Cat would both be telling the truth. If Ann had, Bob and Cat would both be telling the truth.</p>` },
    { id: "u307", tier: 3, cat: "Rules & codes",
      stem: `<p>The numbers <b>12, 20, 28 and 36</b> belong to a club. The numbers <b>16, 22, 24 and 30</b> do not.</p><p>Which of these numbers belongs to the club?</p>`,
      options: ["32", "40", "48", "60"], answer: 3,
      explain: `<p>Every member is in the 4 times table, but 16 and 24 are in it too and are not members. The members are 4 × 3, 4 × 5, 4 × 7 and 4 × 9: 4 times an <b>odd</b> number. 60 = 4 × 15, so <b>60</b> belongs.</p><p class="why-not">32 = 4 × 8, 40 = 4 × 10 and 48 = 4 × 12 are 4 times an even number, like 16 and 24, which are not in the club.</p>` },
    { id: "u308", tier: 3, cat: "Spatial",
      stem: `<p>A large cube is made of 64 small cubes, 4 along each edge. Only its <b>top</b> and its <b>bottom</b> are painted.</p>${cube(4, { u: 26, fill: ["#ffe9cf", "#ff6b6b", "#f4c7a1"], aria: "A large cube made of small cubes, 4 along each edge. The top and the bottom are painted red." })}<p>How many small cubes have <b>no paint at all</b>?</p>`,
      options: ["48", "32", "16", "8"], answer: 1,
      explain: `<p>The paint only touches the top layer (16 cubes) and the bottom layer (16 cubes). The two middle layers have none: 64 − 16 − 16 = <b>32</b>.</p><p class="why-not">8 is the answer for a cube painted on all six faces, which this one isn’t. 48 takes off only one layer.</p>` },

    /* ===================== the boss ===================== */
    { id: "u401", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">A box holds 5 green, 3 yellow and 2 white tennis balls. Nobody can see into the box.</div><p>Pia: “If I take out 4 balls, I am certain to get at least two of the same colour.”</p><p>Raj: “If I take out 6 balls, I am certain to get at least one green.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 2,
      explain: `<p>Think of the unluckiest case each time. There are only 3 colours, so 3 balls could all be different, but a 4th must match one: Pia is right. There are 3 + 2 = 5 balls that aren’t green, so 5 balls could all miss, but a 6th must be green: Raj is right. <b>Both</b> are correct.</p><p class="why-not">It is easy to think 6 isn’t enough because there are 5 green balls, but what matters is how many balls are <i>not</i> green.</p>` },
    { id: "u402", tier: 4, cat: "Spot the mistake",
      stem: `<div class="box">Some of the tomatoes in the garden have been eaten overnight. Mum found possum footprints in the soil.<br>Zac: “So it wasn’t the birds.”</div><p>Which one of these shows the mistake Zac has made?</p>`,
      options: ["The birds and the possum may both have eaten some.", "Possums may come out mainly at night, when birds are asleep.", "Some of the tomatoes may not have been ripe.", "Mum may grow other vegetables as well."], answer: 0,
      explain: `<p>Zac thinks that if the possum did it, the birds didn’t. But one cause doesn’t rule out another: <b>both may have eaten some</b>.</p><p class="why-not">Possums coming out at night supports Mum’s idea rather than showing Zac’s mistake. Ripeness and other vegetables are beside the point.</p>` },
    { id: "u403", tier: 4, cat: "Number problems",
      stem: `<p>Tickets to a show cost <b>$4</b> for a child and <b>$7</b> for an adult. A group buys <b>9 tickets</b> and pays <b>$51</b>.</p><p>How many adults are in the group?</p>`,
      options: ["3", "4", "5", "6"], answer: 2,
      explain: `<p>If all 9 were children, it would cost 9 × $4 = $36. The group paid $15 more. Each adult instead of a child adds $3, so there are $15 ÷ $3 = <b>5</b> adults.</p><p>Check: 5 × $7 + 4 × $4 = $35 + $16 = $51.</p><p class="why-not">4 is the number of children. 3 and 6 come from dividing by the wrong price difference.</p>` },
    { id: "u404", tier: 4, cat: "Spatial",
      stem: `<p>A dice sits on a table with <b>1 on top</b>. It is tipped over forwards, away from you, so that it rolls onto the next face. This is done <b>four times</b> in a row, in the same direction.</p><p>Which number is on top now?</p>`,
      options: ["1", "2", "5", "6"], answer: 0,
      explain: `<p>Each tip is a quarter turn. Four quarter turns in the same direction make a full turn, so the dice ends up just as it started: <b>1</b> on top.</p><p class="why-not">6 is on top after only two tips (halfway round). It’s tempting to think the dice keeps changing, but after four tips it is back where it began.</p>` },
    { id: "u405", tier: 4, cat: "Tables & timetables",
      stem: `<p>A bus leaves the station every <b>12 minutes</b> and a train every <b>20 minutes</b>. Both leave together at <b>7:00 am</b>.</p><p>When do they next leave together?</p>`,
      options: ["7:40 am", "8:00 am", "8:20 am", "9:00 am"], answer: 1,
      explain: `<p>Bus: 7:12, 7:24, 7:36, 7:48, 8:00. Train: 7:20, 7:40, 8:00. The first time on both lists is <b>8:00 am</b> (60 minutes is the first number in both the 12 and 20 times tables).</p><p class="why-not">7:40 is a train time but not a bus time. 8:20 is the train’s next time after 8:00. 9:00 is a time they are both at the station again, but not the next one.</p>` },
    { id: "u406", tier: 4, cat: "Supports the claim",
      stem: `<div class="box">The principal: “If we put in more bike racks, more students will ride to school.”</div><p>Which statement, if true, best supports the principal’s claim?</p>`,
      options: ["Riding a bike to school is good exercise.", "Students who ride to school usually arrive a little earlier than the others.", "Bike racks cost less than a new car park.", "Many say they don’t ride because there is nowhere to leave their bikes."], answer: 3,
      explain: `<p>The claim only works if the lack of racks is what stops students riding. If many say they <b>don’t ride because there’s nowhere to leave their bikes</b>, more racks remove that reason.</p><p class="why-not">Exercise and arriving early are reasons riding is good, not reasons racks would change anything. Cost is about the school’s money, not students’ choices.</p>` },
    { id: "u407", tier: 4, cat: "Order & arrangement",
      stem: `<p>Five children stand in a line at the canteen.</p><div class="box">Pat is somewhere ahead of Quinn.<br>Rose is directly behind Pat.<br>Sam is last.<br>Tia is not first.</div><p>Who is <b>first</b> in the line?</p>`,
      options: ["Pat", "Quinn", "Rose", "Tia"], answer: 0,
      explain: `<p>Sam is last and Tia isn’t first. Rose stands directly behind Pat, so Rose can’t be first. Quinn is behind Pat, so Quinn can’t be first. That leaves <b>Pat</b>.</p><p class="why-not">The clues don’t say where Quinn and Tia stand exactly, but they don’t need to: only one person can be first.</p>` },
    { id: "u408", tier: 4, cat: "Spatial",
      stem: `<p>A large cube is made of 27 small cubes. The whole outside is painted, and then it is taken apart.</p>${cube(3, { u: 34, aria: "A large cube made of 27 small cubes, 3 along each edge, painted all over." })}<p>Altogether, how many faces of the small cubes are <b>not</b> painted?</p>`,
      options: ["54", "81", "108", "162"], answer: 2,
      explain: `<p>27 small cubes have 27 × 6 = 162 faces. The painted ones are the outside of the large cube: 6 sides of 9 squares = 54. So 162 − 54 = <b>108</b> faces are not painted.</p><p class="why-not">162 is all the faces and 54 is the painted ones: both stop one step short. 81 assumes exactly half are painted.</p>` },
  );
})();

  if (c === "boogie" && !S.items.boogie) return;
  th.chosen = c;
  const mv = MOVES[th.move], fx = { anim: c, move: th.move };
  if (c === "boogie") {
    S.items.boogie--; th.good = true; fx.anim = "dance";
    th.res = `You throw a Boogie Bomb. ${esc(o.name)} can’t stop dancing, so the move never happens!`;
  } else if (c === mv.counter) {
    th.good = true;
    if (th.move === "heal") {
      o.hp = Math.max(0, o.hp - RUSH_DMG); fx.hit = true; fx.dmg = RUSH_DMG;
      th.res = mv.good.replace("{n}", esc(o.name)).replace("{d}", RUSH_DMG);
      if (o.hp <= 0) foeDown(o);
    } else th.res = mv.good;
    beep(SND.hit);
  } else {
    th.good = false;
    if (th.move === "heal") { o.hp = Math.min(o.max, o.hp + FOE_HEAL); fx.heal = FOE_HEAL; th.res = `${mv.bad[c].replace("{n}", esc(o.name))} +${FOE_HEAL} health for ${esc(o.name)}.`; }
    else { const d = STAGE[o.stage].slip; hurt(M, d); fx.hit = false; fx.dmg = d; th.res = `${mv.bad[c]} −${d} health.`; }
    beep(M.hp <= 0 ? SND.ko : SND.miss);
  }
  others(rnd(2));
  battle(fx);
}
function rollLoot() { let r = rnd(100); for (const l of LOOT) { if (r < l.w) return l; r -= l.w; } return LOOT[0]; }
function chestAnswer(i) {
  const M = S.match, ch = M.chest;
  if (!ch || ch.chosen !== null) return;
  const q = resolve(ch.ref), ok = i === q.answer;
  record(ch.ref, ok);
  ch.chosen = i;
  if (ok) {
    const l = rollLoot(); ch.loot = l.id; ch.note = "";
    if (["med", "shield", "boogie", "bush"].includes(l.id)) {
      if (S.items[l.id] < CARRY) S.items[l.id]++;
      else { S.coins += 20; S.stats.lootCoins += 20; ch.note = " You can’t carry any more, so you sell it for 20 coins."; }
    } else if (l.id === "slurp") { M.hp = Math.min(MAXHP, M.hp + 25); M.shield = Math.min(MAXSH, M.shield + 25); }
    else if (l.id === "chug") { M.hp = MAXHP; M.shield = MAXSH; }
    else if (l.id === "gold") { S.coins += 60; S.stats.lootCoins += 60; }
    beep(SND.chest);
  } else beep(SND.miss);
  others(rnd(2));
  battle();
}
function next() {
  const M = S.match, o = M.opps[M.cur];
  if (o.pending && o.pending.chosen !== null) {
    const p = o.pending; o.pending = null;
    if (M.hp <= 0) return knockedOut();
    if (p.chest) M.chest = { phase: "offer", kind: chestKind(o) };
    if (p.threat) o.threat = p.threat;
  } else if (M.chest && M.chest.phase === "q" && M.chest.chosen !== null) M.chest = null;
  else if (o.threat && o.threat.chosen) { o.threat = null; if (M.hp <= 0) return knockedOut(); }
  proceed();
}
function proceed() {
  const M = S.match, o = M.opps[M.cur];
  window.scrollTo(0, 0);
  if (M.chest || o.threat || !o.dead) return battle();
  if (o.boss) return victory();
  home();
}
function victory() {
  const M = S.match;
  S.coins += WIN_COINS; S.crowns++; S.stats.wins++; S.n++;
  S.last = { win: true, hits: M.hits, misses: M.misses, earned: M.earned, elims: M.opps.filter(o => o.dead).length };
  S.match = null; beep(SND.win);
  home(); window.scrollTo(0, 0);
}
function knockedOut() {
  const M = S.match;
  S.stats.kos++; S.last = { ko: true, place: alive(M), earned: M.earned }; S.match = null;
  home(); window.scrollTo(0, 0);
}

/* In practice mode only: show any one question in a battle, and the match maker (used by tools/check_game3.js). */
if (PRACTICE) {
  window.__preview = ref => {
    if (!S.match) S.match = newMatch();
    const M = S.match;
    if (M.phase === "bus") land(landNear([50, 50], 40));
    const q = resolve(ref), o = M.opps.find(x => !x.boss && x.kind === q.kind);
    M.opps.forEach(x => { x.dead = false; x.hp = x.max; x.pending = null; x.threat = null; }); M.chest = null; M.hp = MAXHP; M.cur = M.opps.indexOf(o);
    if (q.kind === "reading") { o.pid = q.pid; o.queue = []; }
    o.pending = { ref, chosen: null };
    battle();
  };
  window.__debug = { newMatch, landAt, STAGE, BOTS_AFTER, START, GAP, state: () => S };
}

/* ---------- start ---------- */
if (S.match && S.match.phase === "play" && S.match.cur !== null && S.match.opps[S.match.cur] && busy()) battle(); else home();
})();
</script>
