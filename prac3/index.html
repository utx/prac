  /* ============ circle 2: four extracts ============ */
  READING.push({
    id: "gardens", tier: 2, format: "four extracts", title: "Gardens",
    note: "Read the four extracts about gardens. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>My grandfather talked to his tomatoes. Every evening he walked along the row with the hose, telling each plant about his day, and every evening I hid behind the shed in case the neighbours heard. He said the plants liked the company. I said plants couldn’t hear. He just smiled and kept watering. He has been gone four years now, and my own tomatoes are doing well this summer. I have not told anyone why I go out to water them so late, when the street is quiet.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>A healthy garden depends on workers that no one ever sees. Earthworms tunnel through the soil, letting in air and water, and they drag fallen leaves underground, where the leaves rot and feed the plants. A worm has no lungs; it breathes through its damp skin, which may be why worms come up when heavy rain fills their tunnels. The naturalist Charles Darwin was so impressed by worms that he studied them for many years, and his very last book, published in 1881, was about them.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>Every child in the class had planted a bean in a paper cup. By the second week, the windowsill was a forest of green shoots. Only Nora’s cup showed bare, brown soil. She watered it every morning anyway, and when Jack asked if she had forgotten to put a bean in, she said, “It’s thinking.” On the last day of term, when everyone else was carrying their plants home, a pale green loop pushed up through the soil, as if it had just remembered something.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>Every primary school should give up a strip of its playground to a vegetable garden. Children who grow carrots tend to eat them; children who only see carrots on a plate often push them aside. A garden also teaches what no worksheet can: that some things cannot be hurried, and that looking after something is a job you do every day, not only when you feel like it. The cost is small. A few raised beds, some seeds and a tap are all it takes.</p></div>`,
    questions: [
      exQ("r13a", "Feelings & inference", "shows someone now doing something they were once embarrassed by", 0, `<p>In <b>Extract A</b> the writer used to hide behind the shed when Grandfather talked to his plants. Now they water their own tomatoes “so late, when the street is quiet”, and won’t say why: they have started talking to them too.</p><p class="why-not">Nora in C does something odd, but she is never embarrassed by it. B and D explain and argue.</p>`),
      exQ("r13b", "Main idea", "suggests that unseen helpers matter more than they look", 1, `<p><b>Extract B</b> begins: “A healthy garden depends on workers that no one ever sees”, and shows how earthworms feed and loosen the soil.</p><p class="why-not">Extract D lists what a garden teaches, but it isn’t about hidden helpers.</p>`),
      exQ("r13c", "Feelings & inference", "shows patience being rewarded at the very last moment", 2, `<p>In <b>Extract C</b>, Nora waters her bare cup every day, and on the last day of term her bean finally comes up.</p><p class="why-not">Extract D <i>says</i> that some things can’t be hurried, but it doesn’t show it happening. In A the tomatoes are simply doing well.</p>`),
      exQ("r13d", "Tone & attitude", "tries to persuade the reader that something should change", 3, `<p><b>Extract D</b> argues that “every primary school should” make a vegetable garden, and answers the worry about cost.</p><p class="why-not">The other extracts describe or explain; none of them asks the reader to change anything.</p>`),
      exQ("r13e", "Purpose of a detail", "suggests why a creature appears after heavy rain", 1, `<p><b>Extract B</b>: a worm breathes through its skin, “which may be why worms come up when heavy rain fills their tunnels”.</p><p class="why-not">Nobody in A or C mentions rain or creatures, and D is about vegetables.</p>`),
    ],
  });

  /* ============ circle 2: cloze ============ */
  READING.push({
    id: "snailfilm", tier: 2, format: "cloze", title: "Forty-One Seconds",
    note: "Some words are missing from this piece about making a short animated film. Choose the word that fits each gap best.",
    html: `<p>Our film lasts exactly forty-one seconds. It took us three weekends to make.</p>
<p>The idea seemed simple enough. My friend Arjun and I would model a plasticine snail, photograph it, move it a ${G(1)} distance, photograph it again, and repeat. When the photos were played quickly one after another, the snail would appear to crawl across the table.</p>
<p>What we had failed to take into ${G(2)} was how many photographs that would need. Every second of film uses twelve pictures, so forty-one seconds meant almost five hundred of them, and for each one the snail had to be nudged, the lamp checked and the camera kept perfectly still.</p>
<p>Disaster struck on the second Saturday. Arjun’s little sister, who found our project ${G(3)}, decided that the snail needed a hat. She pressed a blob of yellow plasticine onto its shell and squashed it flat. Forty pictures’ worth of careful work was ruined, and Arjun was so cross that he could barely bring himself ${G(4)} speak to her.</p>
<p>In the end, though, we ${G(5)} the hat into the story. Halfway across the table the snail now stops, a gust of wind blows its hat off, and it spends the rest of the film chasing it.</p>
<p>At the school film night, the audience laughed loudest at that part. Arjun’s sister, sitting in the front row, looked ${G(6)} pleased with herself.</p>`,
    questions: [
      gapQ("r14a", 1, ["minute", "trivial", "scanty", "feeble"], 0, `<p>“Minute” (said my-NEWT) means <b>very small</b>: the snail is moved a tiny distance each time.</p><p class="why-not">“Trivial” means unimportant, not small in size. “Scanty” means not enough, and “feeble” means weak: neither describes a distance.</p>`),
      gapQ("r14b", 2, ["mind", "account", "notice", "regard"], 1, `<p>To “<b>take into account</b>” is a fixed phrase meaning to think about something when you plan.</p><p class="why-not">You can “bear in mind”, “take notice of” or “have regard for” something, but only “account” follows “take into”.</p>`),
      gapQ("r14c", 3, ["irritable", "irrelevant", "irresistible", "irreversible"], 2, `<p>She couldn’t keep her hands off it: she found the project <b>irresistible</b>.</p><p class="why-not">These words look alike. “Irritable” describes a grumpy person, not a project. “Irrelevant” would mean it didn’t matter to her, yet she joined in. “Irreversible” means it can’t be undone.</p>`),
      gapQ("r14d", 4, ["to", "for", "at", "so"], 0, `<p>The phrase is “<b>bring yourself to</b> do something”: Arjun could barely bring himself to speak.</p><p class="why-not">“Bring himself for”, “at” or “so speak” are not English.</p>`),
      gapQ("r14e", 5, ["tied", "folded", "wove", "painted"], 2, `<p>To <b>weave</b> something into a story is to make it part of the plot. They turned the accident into the best scene.</p><p class="why-not">You can tie, fold or paint a real hat, but none of those words means making it part of a story.</p>`),
      gapQ("r14f", 6, ["barely", "thoroughly", "sorely", "hardly"], 1, `<p>Read the whole passage: her hat caused the disaster, but it became the scene the audience loved most. No wonder she looked <b>thoroughly</b> (completely) pleased with herself.</p><p class="why-not">“Barely” and “hardly” would mean she was not pleased, which misses the point of the ending. “Sorely” goes with words like “tempted” or “missed”, not “pleased”.</p>`),
    ],
  });

  /* ============ circle 3: story ============ */
  READING.push({
    id: "wrongbus", tier: 3, format: "story", title: "The Wrong Bus",
    note: "Read the story, then answer the questions.",
    html: `<p>Theo had caught the 412 home from school by himself every day for two weeks, and he had begun to feel that he was rather good at it. So he did not look up from his book when the bus pulled away, and he did not notice, for several stops, that the shops outside were the wrong shops.</p>
<p>When he did notice, the feeling arrived all at once, the way cold water does.</p>
<p>He pressed the bell. He got off. The bus sighed and drove away, and Theo stood on a footpath he had never seen, holding a book about a boy who sailed around the world alone.</p>
<p>His phone had nine per cent battery. He looked at it, then put it back in his pocket, because Mum was at work and the word “lost” felt too heavy to type.</p>
<p>There was a bus shelter across the road, and in it sat an old man with a tartan shopping trolley. Theo crossed, read the timetable twice without understanding it, and sat down at the far end of the bench.</p>
<p>“The 412 goes the other way from this side,” said the old man, not looking at him. “People always think it’s this side.”</p>
<p>“I know,” said Theo, who had not known.</p>
<p>The old man nodded slowly, as if that were a very reasonable answer. “Course you do. Next one’s in eleven minutes. From over there.” He pointed across the road with his chin.</p>
<p>Theo thanked him and crossed back. He waited eleven minutes. He did not open his book.</p>
<p>When the right bus came, he chose a seat by the window and watched every shop go past, naming them under his breath, as if they might change their minds and become different shops.</p>
<p>At home, Mum asked how his day had been.</p>
<p>“Fine,” said Theo. Then, after a moment: “I learnt something about buses.”</p>`,
    questions: [
      { id: "r15a", cat: "Comparisons & imagery", stem: `<p>When Theo notices, “the feeling arrived all at once, <b>the way cold water does</b>”. What does this comparison suggest?</p>`,
        options: ["He was cold because a window was open.", "He slowly began to feel a little worried.", "He felt a sudden shock as he realised.", "He was excited about exploring somewhere new."], answer: 2,
        explain: `<p>Cold water doesn’t creep up on you: it hits you all at once and takes your breath away. Theo’s realisation is a <b>sudden shock</b>.</p><p class="why-not">The cold is only a comparison. “All at once” is the opposite of slowly, and nothing about getting lost excites him.</p>` },
      { id: "r15b", cat: "Feelings & inference", stem: `<p>Why does Theo put his phone away without messaging his mum?</p>`,
        options: ["His battery was much too low to send Mum a message.", "Admitting he was lost felt like too big a thing.", "Mum had told him never to text her at work.", "He had already worked out the way home."], answer: 1,
        explain: `<p>“The word ‘lost’ felt too heavy to type.” Saying he is lost would make it real, and would mean <b>admitting</b> his mistake.</p><p class="why-not">Nine per cent battery is enough for a short message, so that isn’t the reason. Nothing says Mum forbids texts, and he doesn’t yet know the way: he can’t even read the timetable.</p>` },
      { id: "r15c", cat: "Character & structure", stem: `<p>“<b>‘I know,’ said Theo, who had not known.</b>” What does this show about Theo?</p>`,
        options: ["He doesn’t want to look as if he needs help.", "He has caught a bus from this very stop many times before.", "He is being rude to the old man on purpose.", "He hasn’t understood what the old man said."], answer: 0,
        explain: `<p>Theo pretends he already knew because he is embarrassed: he <b>doesn’t want to look lost</b> or in need of help.</p><p class="why-not">He has never seen this footpath before. He thanks the old man later, so he isn’t being rude, and he understands well enough to cross the road.</p>` },
      { id: "r15d", cat: "Feelings & inference", stem: `<p>The old man nods “<b>as if that were a very reasonable answer</b>” and says “Course you do.” What is he doing?</p>`,
        options: ["He truly believes that Theo knew the way.", "He is quietly making fun of Theo for getting lost.", "He is going along with Theo to spare his pride.", "He wants Theo to leave him in peace."], answer: 2,
        explain: `<p>The old man can see that Theo didn’t know, but he <b>plays along kindly</b> so Theo doesn’t feel silly, and still tells him exactly where to go.</p><p class="why-not">“As if” shows he doesn’t really believe it. He isn’t mocking (he helps), and he is the one who starts the conversation.</p>` },
      { id: "r15e", cat: "Purpose of a detail", stem: `<p>On the right bus, Theo names every shop “<b>as if they might change their minds and become different shops</b>”. Why?</p>`,
        options: ["He is learning all of the shop names for a school project.", "He is checking carefully, no longer so sure of himself.", "He is bored because he has finished his book.", "He wants to prove to the old man he knew the way."], answer: 1,
        explain: `<p>At the start Theo was so sure of himself that he read his book and missed the wrong shops. Now he <b>checks every one</b>, and the joke about shops changing their minds shows how little he trusts himself after the scare.</p><p class="why-not">He hasn’t finished his book: he “did not open” it. The old man has gone, and nothing mentions a project.</p>` },
      { id: "r15f", cat: "Character & structure", stem: `<p>The story ends: “<b>‘Fine,’ said Theo. Then, after a moment: ‘I learnt something about buses.’</b>” What does this ending suggest?</p>`,
        options: ["He wants to keep the whole day a secret.", "He enjoyed a science lesson about transport.", "He wants Mum to drive him to school from now on.", "He is ready to admit a little of what happened."], answer: 3,
        explain: `<p>“Fine” hides the scare, but “after a moment” he adds a small hint. He is <b>ready to share a little</b>, in his own way, now that it is over.</p><p class="why-not">He doesn’t keep it all secret, because he drops the hint. “Something about buses” refers to his own mistake, not a lesson, and nothing suggests he wants to stop catching the bus.</p>` },
    ],
  });

  /* ============ circle 3: four extracts ============ */
  READING.push({
    id: "messages", tier: 3, format: "four extracts", title: "Messages",
    note: "Read the four extracts about sending messages. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>For three years I wrote to a girl in Finland whom I never met. Her letters came on thin blue paper, and each one took nearly a month to arrive, so that by the time I read about her new kitten, the kitten was probably a cat. I didn’t mind. I kept every letter in a shoebox and reread them while I waited for the next. I think I knew her better, in the end, than some of the people I saw every day.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>Long before telephones, people trusted messages to pigeons. A homing pigeon taken far from its loft will fly straight back to it, and a note tied to its leg travels too. Scientists still argue about exactly how the birds find their way; the sun and the Earth’s magnetism probably both play a part. In 1918, during the First World War, a pigeon named Cher Ami carried a message from a group of trapped soldiers to their own side. The bird was badly wounded on the way, but the message got through, and around two hundred soldiers were rescued.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>Sami wrote the note on the back of a shopping list: his name, his town and the words “Please write back.” He pushed it into an empty juice bottle and threw it as far as he could from the end of the jetty. Then he forgot about it, the way you forget about most things when you are eight. Six years later, a letter arrived from a fisherman on the other side of the bay, with a photo of a muddy bottle and the words: “Sorry it took so long.”</p></div>
<div class="extract"><b class="tag">Extract D</b><p>A text message takes three seconds to send and about as long to forget. A handwritten thank-you card is a different thing altogether. Someone had to choose it, find a pen, think about what to say and walk to a letterbox. That effort is part of the message. It says “you were worth my time” before the reader has even opened the envelope. We should send fewer texts and more cards, especially to the people who matter most.</p></div>`,
    questions: [
      exQ("r16a", "Main idea", "suggests that waiting for a message made it more precious", 0, `<p>In <b>Extract A</b> each letter took a month, and the writer reread old ones “while I waited for the next”: the slowness made the letters treasured.</p><p class="why-not">In C the reply takes six years, but Sami had forgotten about it, so he wasn’t waiting. D is about effort, not waiting.</p>`),
      exQ("r16b", "Purpose of a detail", "describes a message that got through in spite of an injury", 1, `<p>In <b>Extract B</b>, the pigeon “was badly wounded on the way, but the message got through”.</p><p class="why-not">Nobody is hurt in the other extracts. The bottle in C is only muddy.</p>`),
      exQ("r16c", "Main idea", "mentions something that experts still cannot fully explain", 1, `<p><b>Extract B</b>: “Scientists still argue about exactly how the birds find their way.”</p><p class="why-not">The other extracts contain surprises, but nothing that experts are puzzling over.</p>`),
      exQ("r16d", "Tone & attitude", "argues that the trouble taken over a message is part of what it says", 3, `<p><b>Extract D</b>: “That effort is part of the message. It says ‘you were worth my time’.”</p><p class="why-not">Extract A shows letters being treasured, but it doesn’t argue anything about effort, and it doesn’t try to persuade the reader.</p>`),
      exQ("r16e", "Feelings & inference", "describes a reply that the sender had stopped expecting", 2, `<p>In <b>Extract C</b>, Sami forgot about his bottle, and the reply came six years later from a stranger.</p><p class="why-not">The writer of A expects every letter: they are waiting for the next one.</p>`),
    ],
  });

/* ---------------------------------------------------------------
   STORM ISLAND: third set of reading passages (Nov 2026).
   Two are real public-domain classics, copied exactly from Project Gutenberg
   (via its GITenberg mirror on GitHub): L. M. Montgomery, "Anne of Green Gables"
   (1908, ebook #45) and A. B. "Banjo" Paterson, "Mulga Bill's Bicycle" (1896,
   in "Rio Grande's Last Race and Other Verses", ebook #304). The rest are original.
   --------------------------------------------------------------- */
(() => {
  const G = n => `<span data-g="${n}" class="gap">(${n}) ______</span>`;
  const gapQ = (id, n, options, answer, explain) => ({ id, gap: n, cat: "Vocabulary & idioms", stem: `<p>Which word fits <b>gap ${n}</b>?</p>`, options, answer, explain });
  const EX = ["Extract A", "Extract B", "Extract C", "Extract D"];
  const exQ = (id, cat, what, answer, explain) => ({ id, cat, stem: `<p>Which extract ${what}?</p>`, options: EX, answer, explain });

  /* ============ circle 1: cloze ============ */
  READING.push({
    id: "crystals", tier: 1, format: "cloze", title: "Seven Days",
    note: "Some words are missing from this piece about growing a crystal garden. Choose the word that fits each gap best.",
    html: `<p>The packet promised a sparkling crystal garden in just seven days. I followed the instructions to the ${G(1)}, dissolving the powder in hot water until not a single grain was left and pouring it gently over the little grey rocks in the tray.</p>
<p>Nothing happened on the first day, which I had been warned ${G(2)}. On the second morning, though, tiny ${G(3)} points had appeared on the tips of the rocks, like frost on a window.</p>
<p>By the fourth day the crystals were growing so ${G(4)} that I could see the difference between breakfast and dinner. I took a photograph every evening, and my little brother, who had ${G(5)} no interest at first, began to check on them before school.</p>
<p>On the seventh day the garden was finished, exactly as the packet had promised. Strangely, I felt almost ${G(6)}. Half the fun, it turned out, had been the waiting.</p>`,
    questions: [
      gapQ("r17a", 1, ["letter", "word", "point", "line"], 0, `<p>To follow instructions “<b>to the letter</b>” means exactly, every detail.</p><p class="why-not">“To the point” means short and relevant, which is about speaking, not following. “To the word” and “to the line” aren’t English phrases.</p>`),
      gapQ("r17b", 2, ["against", "for", "about", "with"], 2, `<p>You are <b>warned about</b> something that is going to happen: the packet warned that nothing would happen on day one.</p><p class="why-not">“Warned against” means told <i>not to do</i> something, which doesn’t fit. “Warned for” and “warned with” aren’t used this way.</p>`),
      gapQ("r17c", 3, ["glimpsing", "glancing", "glistening", "gleaning"], 2, `<p>Crystals catch the light: “tiny <b>glistening</b> points”, shiny like frost.</p><p class="why-not">The look-alikes are about people, not things that shine: you glimpse or glance at something with your eyes, and gleaning means gathering bits of information.</p>`),
      gapQ("r17d", 4, ["hastily", "rapidly", "eagerly", "hurriedly"], 1, `<p>The crystals grew <b>rapidly</b>: very fast. “Rapidly” describes the speed of something happening.</p><p class="why-not">“Hastily” and “hurriedly” mean doing something in a rush, as a person might, and “eagerly” means keenly. Crystals can’t be in a hurry or keen.</p>`),
      gapQ("r17e", 5, ["made", "put", "done", "shown"], 3, `<p>The set phrase is “<b>shown no interest</b>”: at first the brother didn’t seem interested at all.</p><p class="why-not">You can’t “make”, “do” or “put” interest in English.</p>`),
      gapQ("r17f", 6, ["relieved", "astonished", "triumphant", "disappointed"], 3, `<p>Read to the end: “Half the fun … had been the waiting.” Now the waiting is over, so the writer feels almost <b>disappointed</b>. “Strangely” tells us it is an unexpected feeling for someone whose garden worked.</p><p class="why-not">“Relieved” and “triumphant” would be the expected feelings, but “strangely” and the last sentence point the other way. Nothing surprising happened, so “astonished” doesn’t fit.</p>`),
    ],
  });

  /* ============ circle 1: missing sentences ============ */
  const CAT = [
    "Dogs, by contrast, are much less nimble.",
    "His photographs, taken one after another very quickly, showed what no eye could follow.",
    "A fall from a great height can still break legs or teeth.",
    "The front half of the body turns to match it.",
    "Cats are curious animals, and they do not always look before they leap.",
    "Kittens start to show it when they are about three or four weeks old.",
  ];
  const catQ = (id, n, answer, explain) => ({ id, gap: n, cat: "Sentence links", stem: `<p>Which sentence fits <b>gap ${n}</b>? (Each sentence is used once only, and one is not used at all.)</p>`, options: CAT, answer, explain });
  READING.push({
    id: "catfall", tier: 1, format: "missing sentences", title: "Four Paws Down", bank: true,
    note: "Five sentences have been taken out of this article. Choose the sentence that fits each gap. There is one extra sentence that is not needed.",
    html: `<p>Drop a cat from a low wall and it will almost always land neatly on all four paws. People wondered for centuries how cats manage it, and in 1894 a French scientist, Étienne-Jules Marey, finally found out with a camera. ${G(1)}</p>
<p>The pictures showed that a falling cat twists itself round in stages. First it turns its head to see which way is down. ${G(2)} Then the back half follows, swinging round until all four legs point at the ground. The whole movement takes a fraction of a second.</p>
<p>The trick is called the righting reflex. ${G(3)} By about seven weeks old, most of them have mastered it.</p>
<p>Landing on their feet does not mean that cats cannot be hurt. ${G(4)} Vets treat many cats every year that have slipped from balconies or windows, often while chasing a moth or a bird.</p>
<p>${G(5)} So if you have a curious cat, a screen on an upstairs window is a far better safety plan than trusting to luck.</p>`,
    questions: [
      catQ("r18a", 1, 1, `<p>Marey “found out with a camera”. The next sentence should say what the camera showed: <b>“His photographs … showed what no eye could follow.”</b> The paragraph after it begins “The pictures showed…”, which follows on.</p><p class="why-not">The sentence about dogs is on topic, but nothing before it is being compared.</p>`),

  READING.push({
    id: "mulga", tier: 2, format: "poem", title: "Mulga Bill’s Bicycle",
    note: "By A. B. “Banjo” Paterson, first published in 1896, when bicycles were new and exciting in Australia. “Blows” means boasts.",
    html: `<p class="poem">’Twas Mulga Bill, from Eaglehawk, that caught the cycling craze;
He turned away the good old horse that served him many days;
He dressed himself in cycling clothes, resplendent to be seen;
He hurried off to town and bought a shining new machine;
And as he wheeled it through the door, with air of lordly pride,
The grinning shop assistant said, ‘Excuse me, can you ride?’

‘See, here, young man,’ said Mulga Bill, ‘from Walgett to the sea,
From Conroy’s Gap to Castlereagh, there’s none can ride like me.
I’m good all round at everything, as everybody knows,
Although I’m not the one to talk — I HATE a man that blows.
But riding is my special gift, my chiefest, sole delight;
Just ask a wild duck can it swim, a wild cat can it fight.
There’s nothing clothed in hair or hide, or built of flesh or steel,
There’s nothing walks or jumps, or runs, on axle, hoof, or wheel,
But what I’ll sit, while hide will hold and girths and straps are tight:
I’ll ride this here two-wheeled concern right straight away at sight.’

’Twas Mulga Bill, from Eaglehawk, that sought his own abode,
That perched above the Dead Man’s Creek, beside the mountain road.
He turned the cycle down the hill and mounted for the fray,
But ere he’d gone a dozen yards it bolted clean away.
It left the track, and through the trees, just like a silver streak,
It whistled down the awful slope, towards the Dead Man’s Creek.

It shaved a stump by half an inch, it dodged a big white-box:
The very wallaroos in fright went scrambling up the rocks,
The wombats hiding in their caves dug deeper underground,
As Mulga Bill, as white as chalk, sat tight to every bound.
It struck a stone and gave a spring that cleared a fallen tree,
It raced beside a precipice as close as close could be;
And then as Mulga Bill let out one last despairing shriek
It made a leap of twenty feet into the Dead Man’s Creek.

’Twas Mulga Bill, from Eaglehawk, that slowly swam ashore:
He said, ‘I’ve had some narrer shaves and lively rides before;
I’ve rode a wild bull round a yard to win a five pound bet,
But this was the most awful ride that I’ve encountered yet.
I’ll give that two-wheeled outlaw best; it’s shaken all my nerve
To feel it whistle through the air and plunge and buck and swerve.
It’s safe at rest in Dead Man’s Creek, we’ll leave it lying still;
A horse’s back is good enough henceforth for Mulga Bill.’</p>`,
    questions: [
      { id: "r19a", cat: "Tone & attitude", stem: `<p>Mulga Bill says “<b>I’m not the one to talk — I HATE a man that blows</b>” (boasts). What makes this funny?</p>`,
        options: ["He says it in the middle of boasting about himself.", "He is frightened of the wind on the mountain road.", "He is cross with the shop assistant for grinning at him.", "He has never actually ridden a bicycle before."], answer: 0,
        explain: `<p>Every line around this one is a boast: “there’s none can ride like me”, “I’m good all round at everything”. Saying he hates boasters <b>while boasting</b> is the joke.</p><p class="why-not">“Blows” means boasts here, not wind. He doesn’t answer the grinning assistant crossly; he shows off. Whether he has ridden a bike before isn’t what makes this line funny.</p>` },

        explain: `<p>Of course a duck can swim and a wild cat can fight. Mulga Bill means his riding is just as obvious, so the assistant’s question is <b>silly</b>.</p><p class="why-not">The animals are a comparison, not real animals or a warning. He isn’t explaining anything about how he learned.</p>` },
      { id: "r19c", cat: "Comparisons & imagery", stem: `<p>In the fourth verse, the wallaroos scramble up the rocks and the wombats dig deeper underground. What do these lines add to the poem?</p>`,

        explain: `<p>Even the bush animals are terrified and hide: an <b>exaggeration</b> that makes the runaway ride seem wilder and funnier.</p><p class="why-not">The animals are frightened, not dangerous. The bike bolted because of the steep hill, not the animals, and Mulga Bill certainly doesn’t stop: he is “sat tight to every bound”.</p>` },
      { id: "r19d", cat: "Vocabulary & idioms", stem: `<p>At the end Mulga Bill says, “<b>I’ll give that two-wheeled outlaw best</b>.” What does he mean?</p>`,

  READING.push({
    id: "shadows", tier: 2, format: "four extracts", title: "Shadows",
    note: "Read the four extracts about shadows. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>The power went out on the second night of our camping trip, and with it went the lantern, the fan and my sister’s good mood. Dad found a torch, propped it on the esky and pointed it at the wall of the tent. Then his hands became a rabbit, a crocodile and a very bad eagle. By the time the power came back, nobody wanted the lights on.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>A solar eclipse is a shadow on a giant scale. When the Moon passes exactly between the Sun and the Earth, its shadow races across the ground. Inside the darkest part, day turns to dusk for a few minutes, the air cools, and birds often fall silent as if night had come. A total eclipse is due to cross Australia in July 2028, passing right over Sydney.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>Toby was certain that his shadow was copying him on purpose. When he waved, it waved. When he stamped, it stamped. One hot day he decided to run so fast it couldn’t keep up. He ran until the sun was high overhead, then stopped, panting, and looked down. The shadow had shrunk to a dark puddle under his feet. “Ha!” said Toby. “Too slow.”</p></div>
<div class="extract"><b class="tag">Extract D</b><p>Younger brothers and sisters spend years living in someone else’s shadow. Teachers say, “Your sister was brilliant at maths,” and coaches remember an older brother’s goals. It is meant kindly, but it makes a child feel like a copy. Every child deserves to be met as a beginner, not as the sequel to somebody else.</p></div>`,
    questions: [
      exQ("r20a", "Comparisons & imagery", "uses the word “shadow” for something that is not really a shadow", 3, `<p>In <b>Extract D</b>, “living in someone else’s shadow” is figurative: it means always being compared with an older brother or sister.</p><p class="why-not">The shadows in A, B and C are real ones, made by blocking light.</p>`),
      exQ("r20b", "Purpose of a detail", "describes animals behaving as if something had changed", 1, `<p>In <b>Extract B</b>, during an eclipse “birds often fall silent as if night had come”.</p><p class="why-not">The rabbit, crocodile and eagle in A are hand shadows, not real animals.</p>`),
      exQ("r20c", "Feelings & inference", "shows a character who misunderstands what is happening", 2, `<p>In <b>Extract C</b>, Toby thinks his shadow copies him “on purpose” and that he has outrun it. Really it is short because the sun is high overhead at midday.</p><p class="why-not">Dad in A and the writer of B understand exactly what shadows are.</p>`),
      exQ("r20d", "Feelings & inference", "describes turning a disappointment into something enjoyable", 0, `<p>In <b>Extract A</b>, the power cut spoils everyone’s mood, until Dad’s hand shadows make it so much fun that “nobody wanted the lights on”.</p><p class="why-not">Toby in C enjoys his “win”, but nothing disappointing happened first.</p>`),
      exQ("r20e", "Tone & attitude", "shows a character who believes he has won", 2, `<p>In <b>Extract C</b>, Toby looks down at his tiny shadow and says “Too slow”: he thinks he beat it in a race.</p><p class="why-not">Dad in A wins everyone over, but he doesn’t believe he has won a contest.</p>`),

  READING.push({
    id: "anne", tier: 3, format: "story", title: "Anne of Green Gables",
    note: "From Anne of Green Gables by L. M. Montgomery (1908). Anne Shirley, an orphan with red hair, has just started at the village school in Avonlea. Pupils wrote on small slates.",
    html: `<p>But it was not until the afternoon that things really began to happen.</p>
<p>Mr. Phillips was back in the corner explaining a problem in algebra to Prissy Andrews and the rest of the scholars were doing pretty much as they pleased eating green apples, whispering, drawing pictures on their slates, and driving crickets harnessed to strings, up and down aisle. Gilbert Blythe was trying to make Anne Shirley look at him and failing utterly, because Anne was at that moment totally oblivious not only to the very existence of Gilbert Blythe, but of every other scholar in Avonlea school itself. With her chin propped on her hands and her eyes fixed on the blue glimpse of the Lake of Shining Waters that the west window afforded, she was far away in a gorgeous dreamland hearing and seeing nothing save her own wonderful visions.</p>
<p>Gilbert Blythe wasn’t used to putting himself out to make a girl look at him and meeting with failure. She <i>should</i> look at him, that red-haired Shirley girl with the little pointed chin and the big eyes that weren’t like the eyes of any other girl in Avonlea school.</p>
<p>Gilbert reached across the aisle, picked up the end of Anne’s long red braid, held it out at arm’s length and said in a piercing whisper:</p>
<p>“Carrots! Carrots!”</p>
<p>Then Anne looked at him with a vengeance!</p>
<p>She did more than look. She sprang to her feet, her bright fancies fallen into cureless ruin. She flashed one indignant glance at Gilbert from eyes whose angry sparkle was swiftly quenched in equally angry tears.</p>
<p>“You mean, hateful boy!” she exclaimed passionately. “How dare you!”</p>
<p>And then—thwack! Anne had brought her slate down on Gilbert’s head and cracked it—slate not head—clear across.</p>
<p>Avonlea school always enjoyed a scene. This was an especially enjoyable one. Everybody said “Oh” in horrified delight. Diana gasped. Ruby Gillis, who was inclined to be hysterical, began to cry. Tommy Sloane let his team of crickets escape him altogether while he stared open-mouthed at the tableau.</p>`,
    questions: [
      { id: "r21a", cat: "Vocabulary & idioms", stem: `<p>Anne was “<b>totally oblivious</b>” to Gilbert and the other scholars. What does “oblivious” mean here?</p>`,
        options: ["annoyed by", "not aware of", "frightened of", "jealous of"], answer: 1,
        explain: `<p>Anne is daydreaming, “hearing and seeing nothing save her own wonderful visions”. She is <b>not aware of</b> anyone around her.</p><p class="why-not">She becomes annoyed only later, when Gilbert calls her “Carrots”. Nothing suggests she is frightened or jealous.</p>` },
      { id: "r21b", cat: "Purpose of a detail", stem: `<p>Why does the writer describe the other scholars eating green apples, whispering and racing crickets up the aisle?</p>`,
        options: ["To show that Avonlea was a cheerful and friendly school", "To show how little the teacher was watching the class", "To show that Anne was the only pupil doing her work", "To explain why Anne was staring out of the window"], answer: 1,
        explain: `<p>Mr Phillips is busy in the corner with one pupil, and everyone else is doing “pretty much as they pleased”. The detail shows <b>nobody is watching the class</b>, which is how Gilbert’s trick can happen.</p><p class="why-not">Anne isn’t working: she is daydreaming. The window detail comes from her own dreaminess, not from the others’ games.</p>` },
      { id: "r21c", cat: "Feelings & inference", stem: `<p>“She <b><i>should</i></b> look at him”. What does the word “should”, in italics, tell us about Gilbert?</p>`,

        explain: `<p>Gilbert “wasn’t used to … meeting with failure”. The stressed “should” shows he thinks <b>she ought to be noticing him</b>, and he is put out that she isn’t.</p><p class="why-not">He doesn’t care about the lesson: he is the one being a nuisance. Nothing suggests worry, and the trick on Ruby isn’t in this passage.</p>` },
      { id: "r21d", cat: "Vocabulary & idioms", stem: `<p>When Anne springs up, “her bright fancies [have] <b>fallen into cureless ruin</b>”. What does this mean?</p>`,

        explain: `<p>Her “bright fancies” are the “wonderful visions” she was lost in. “Cureless ruin” means wrecked beyond repair: Gilbert has <b>completely shattered her daydream</b>.</p><p class="why-not">It is her dream that is ruined, not her memory of the lake or her friendships. The green apples were eaten by the other scholars.</p>` },
      { id: "r21e", cat: "Tone & attitude", stem: `<p>Why does the writer add the words “<b>slate not head</b>”?</p>`,
        options: ["To reassure the reader, in a funny way, about what broke", "To show that Gilbert was badly hurt by the blow to his head", "To explain that slates in those days broke easily", "To show that Anne had missed Gilbert completely"], answer: 0,
        explain: `<p>“Cracked it … clear across” could sound as if Gilbert’s head was cracked. The quick aside puts it right with a joke: it was the <b>slate</b> that broke.</p><p class="why-not">The slate came down on his head, so she didn’t miss. The aside tells us he wasn’t badly hurt, and it isn’t about slates in general.</p>` },
      { id: "r21f", cat: "Feelings & inference", stem: `<p>“Everybody said ‘Oh’ in <b>horrified delight</b>.” What does this suggest about the other children?</p>`,

    note: "Read the story, then answer the questions.",
    html: `<p>Kiri had practised the handover forty times at lunchtime, until even Mr Lowe said she could stop. Left hand back, palm open, eyes forward. Don’t look. Never look.</p>
<p>On the day, the stands were full of parents in sunhats, and the grass smelt of sunscreen and cut clover. Kiri was third. She stood in the changeover box and shook out her hands, one, two, three, the way the big kids did on television.</p>
<p>Ollie came round the bend with his face screwed up, the baton held out in front of him like a torch. Kiri started to run. Left hand back. Palm open. Eyes forward.</p>
<p>She felt the baton touch her fingers, and then she didn’t feel it.</p>
<p>She looked. Of course she looked. It was rolling in a slow, silly circle on the track behind her, and by the time she had snatched it up, two blue shirts and a green one had gone past.</p>
<p>She ran the rest of her leg so hard that her ears rang. Tash, the last runner, took the baton cleanly and set off after the others, but there was too much track to make up. They came fourth out of four.</p>
<p>Afterwards Kiri sat under the gum tree with her shoes off and examined her laces with great interest.</p>
<p>Someone sat down beside her. It was Tash, holding out half an orange.</p>
<p>“Last year,” said Tash, “I dropped it in the final. In front of the whole district.” She bit into her own half. “My dad still has the video. He plays it every Christmas.”</p>
<p>Kiri looked at her. “Really?”</p>
<p>“Every Christmas,” said Tash gravely. “He says it’s his favourite bit.”</p>
<p>Kiri took the orange. After a while, she found that she was laughing.</p>`,
    questions: [
      { id: "r22a", cat: "Character & structure", stem: `<p>“<b>Left hand back, palm open, eyes forward. Don’t look. Never look.</b>” Why is this written as short commands?</p>`,
        options: ["It shows Mr Lowe shouting at Kiri during the race.", "It shows the instructions Kiri has drilled into herself.", "It shows that Kiri found Mr Lowe’s rules for the handover confusing.", "It shows that the race was just about to start."], answer: 1,
        explain: `<p>Kiri has practised forty times, and the same words come back during the race. They are the <b>rules she keeps repeating to herself</b>.</p><p class="why-not">Mr Lowe isn’t at the handover; the words are in Kiri’s head. They are short because they are well learned, not confusing, and they appear before the race as well as during it.</p>` },
      { id: "r22b", cat: "Purpose of a detail", stem: `<p>“<b>She felt the baton touch her fingers, and then she didn’t feel it.</b>” What does this sentence do?</p>`,
        options: ["It shows that Kiri’s hands were numb from shaking them.", "It shows that Ollie never really passed the baton across to her.", "It shows that Kiri had stopped concentrating.", "It lets us live the mistake the way Kiri did, all at once."], answer: 3,
        explain: `<p>The sentence doesn’t say “she dropped it”. Like Kiri, we only notice that something is wrong when the baton <b>isn’t there any more</b>. We experience the moment as she does.</p><p class="why-not">The baton did touch her fingers, so Ollie did pass it. Shaking her hands was a warm-up, and she was concentrating hard on the drill.</p>` },
      { id: "r22c", cat: "Feelings & inference", stem: `<p>“<b>She looked. Of course she looked.</b>” What do the words “of course” suggest?</p>`,
        options: ["Looking back for the baton is the right thing to do in a relay race.", "She wanted to see where the other runners were.", "After all that practice, she still did the one forbidden thing.", "Mr Lowe had told her to check behind her."], answer: 2,
        explain: `<p>Her one rule was “Don’t look. Never look.” “Of course” sounds like Kiri <b>blaming herself</b>: in the moment that mattered, she did exactly what she had trained not to do.</p><p class="why-not">The training says the opposite: never look. She looks for the baton, not the other runners, and Mr Lowe never told her to check behind her.</p>` },
      { id: "r22d", cat: "Feelings & inference", stem: `<p>After the race, Kiri “<b>examined her laces with great interest</b>”. Why?</p>`,

        explain: `<p>Nobody finds laces that interesting. Staring at them is a way of <b>not looking at anyone</b>, because she feels she let her team down.</p><p class="why-not">Her shoes are off, so the laces are not the problem, and nothing mentions new shoes. She isn’t bored; she is upset.</p>` },
      { id: "r22e", cat: "Character & structure", stem: `<p>Why does Tash tell Kiri about the baton she dropped last year?</p>`,
        options: ["To show Kiri that a mistake like hers can be survived and laughed about", "To boast that she was fast enough to be picked for the district final last year", "To warn Kiri that her own mistake will be filmed too", "To blame herself for the team coming fourth"], answer: 0,
        explain: `<p>Tash shares a worse mistake, in a bigger race, that her family now laughs about. She is showing Kiri that this <b>can be survived, and even become funny</b>. It works: Kiri ends up laughing.</p><p class="why-not">Tash talks about dropping the baton, not about being good. Nothing says Kiri was filmed, and Tash ran cleanly, so she has nothing to blame herself for.</p>` },
      { id: "r22f", cat: "Tone & attitude", stem: `<p>“<b>‘Every Christmas,’ said Tash gravely. ‘He says it’s his favourite bit.’</b>” Why does Tash say this “gravely”?</p>`,
        options: ["She is still upset about losing the final.", "She is still angry with her dad for keeping the video of it.", "She is telling Kiri off for dropping the baton.", "She keeps a straight face to make the story funnier."], answer: 3,

/* ---------------------------------------------------------------
   STORM ISLAND: thinking questions (hand-written). Four options (A–D).
   tier 1–3 = storm circle 1–3; tier 4 = the boss (hardest third of the sample papers).
   --------------------------------------------------------------- */
(() => {
  const { tbl, fig } = LIB;
  const WHO = (a, b) => [`${a} only`, `${b} only`, `Both ${a} and ${b}`, `Neither ${a} nor ${b}`];

  /* a five-square tile (a 2 × 2 block with one extra square), turned or flipped. Cells are [row, col]. */
  const norm = c => { const r0 = Math.min(...c.map(x => x[0])), c0 = Math.min(...c.map(x => x[1])); return c.map(([r, k]) => [r - r0, k - c0]); };
  const turn = c => norm(c.map(([r, k]) => [k, -r]));            // a quarter turn clockwise
  const flip = c => norm(c.map(([r, k]) => [r, -k]));            // turned over (mirror image)
  const P = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]];
  const tile = cells => {
    const u = 24, W = 3 * u + 6, has = (r, k) => cells.some(c => c[0] === r && c[1] === k);
    const desc = "A tile of five squares on a 3 by 3 grid. " + [0, 1, 2].map(r => `Row ${r + 1}: ${[0, 1, 2].map(k => has(r, k) ? "square" : "empty").join(", ")}`).join(". ") + ".";
    return `<svg viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" role="img" aria-label="${desc}">${cells.map(([r, k]) => `<rect x="${3 + k * u}" y="${3 + r * u}" width="${u}" height="${u}" fill="#b9e3c6" stroke="${INK}" stroke-width="2"/>`).join("")}</svg>`;
  };
  const PTILE = fig(tile(P));

  /* towers of cubes seen from above, and a view of them from one side */
  const PLAN = `<div class="figure"><div style="display:inline-flex;align-items:center;gap:10px"><div><table class="grid" style="font-weight:700;margin:0"><tr><td>1</td><td>3</td><td>1</td></tr><tr><td>2</td><td>1</td><td>1</td></tr><tr><td>1</td><td>1</td><td>2</td></tr></table><div style="font-size:14px;font-weight:700;letter-spacing:2px;margin-top:4px">▲ FRONT ▲</div></div><div style="font-size:14px;font-weight:700;text-align:left">◀ Mia stands here,<br>on the right-hand side,<br>looking at the towers</div></div></div>`;
  const view = h => {
    const u = 22, H = 3 * u + 6;
    return `<svg viewBox="0 0 ${3 * u + 6} ${H}" width="${3 * u + 6}" height="${H}" role="img" aria-label="Three columns of squares side by side. From left to right they are ${h.join(", ")} squares tall.">${h.map((n, c) => Array.from({ length: n }, (_, k) => `<rect x="${3 + c * u}" y="${H - 3 - (k + 1) * u}" width="${u}" height="${u}" fill="#c9d6f2" stroke="${INK}" stroke-width="2"/>`).join("")).join("")}</svg>`;
  };

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "t101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Ranger Kim: “Visitors should keep to the marked track through the sand dunes. That way the dune plants will have a chance to grow back.”</div><p>Which statement, if true, best supports Ranger Kim’s claim?</p>`,
      options: ["The marked track has the best view of the sea.", "Dune plants help to hold the sand in place during storms.", "Dune plants are easily crushed when people walk on them.", "Most visitors already carry a map that shows the track."], answer: 2,
      explain: `<p>The claim joins two things: staying on the track, and the plants growing back. The best support explains the link. If plants are <b>crushed by feet</b>, then keeping feet on the track is what lets them grow.</p><p class="why-not">The view and the maps are about the track, not the plants. The fact about storms tells us why the plants matter, but not why staying on the track helps them.</p>` },
    { id: "t102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Sam’s mum has a red tag on her keys. In the park, Sam finds a bunch of keys with a red tag.<br>Sam: “These must be Mum’s keys.”</div><p>Which one of these shows the mistake Sam has made?</p>`,
      options: ["Other people’s keys may have a red tag too.", "Sam’s mum may have more than one bunch of keys.", "The keys may have been in the park for a long time.", "Red may not be Sam’s mum’s favourite colour."], answer: 0,
      explain: `<p>Sam has matched just <b>one thing</b>: the red tag. That would only prove the keys are Mum’s if nobody else had a red tag, and Sam doesn’t know that.</p><p class="why-not">How many bunches Mum owns, how long the keys have been there and which colour she likes best don’t show what is wrong with jumping from “red tag” to “Mum’s keys”.</p>` },
    { id: "t103", tier: 1, cat: "Order & arrangement",
      stem: `<p>Three jars stand in a row on a shelf: jam, honey and pickles.</p><p>The jam is somewhere to the left of the honey.<br>The pickles are not next to the jam.</p><p>Which jar is in the middle?</p>`,
      options: ["the jam", "the honey", "the pickles", "It is impossible to tell."], answer: 1,
      explain: `<p>The pickles are not next to the jam, so those two must be at the two ends, with the <b>honey</b> between them. The jam is left of the honey, so the row is jam, honey, pickles.</p><p class="why-not">If the jam or the pickles were in the middle, the pickles would be right next to the jam. There is only one row that fits, so it is possible to tell.</p>` },
    { id: "t104", tier: 1, cat: "Rules & codes",
      stem: `<p>Mika only eats sandwiches that have <b>cheese</b> in them but <b>no tomato</b>.</p>${tbl(["Sandwich", "Fillings"], [["1", "cheese, ham"], ["2", "cheese, tomato"], ["3", "egg, lettuce"], ["4", "cheese, lettuce, tomato"], ["5", "cheese, cucumber"]])}<p>How many of these sandwiches will Mika eat?</p>`,
      options: ["1", "2", "3", "4"], answer: 1,
      explain: `<p>Both parts of the rule must be true. Sandwiches 1 and 5 have cheese and no tomato, so Mika eats <b>2</b>.</p><p class="why-not">Four sandwiches have cheese, but two of those also have tomato. Three sandwiches have no tomato, but one of those (egg and lettuce) has no cheese.</p>` },
    { id: "t105", tier: 1, cat: "Number problems",
      stem: `<p>Leo feeds his lizard every <b>second</b> day. He feeds it on a Monday, then on the Wednesday, and so on.</p><p>On which day of the week does Leo feed the lizard for the <b>fifth</b> time?</p>`,
      options: ["Friday", "Saturday", "Sunday", "Tuesday"], answer: 3,
      explain: `<p>List the feeds: 1st Monday, 2nd Wednesday, 3rd Friday, 4th Sunday, 5th <b>Tuesday</b>.</p><p class="why-not">Sunday is the fourth feed: the Monday counts as the first feed, not as number zero. Friday is the third. Saturday is never a feeding day in that week.</p>` },
    { id: "t106", tier: 1, cat: "Tables & timetables",
      stem: `<p>The table shows four children’s marks out of 20 in two spelling tests.</p>${tbl(["", "Test 1", "Test 2"], [["Ana", 12, 17], ["Bo", 15, 19], ["Cy", 9, 16], ["Di", 18, 20]])}<p>Who <b>improved</b> the most from Test 1 to Test 2?</p>`,
      options: ["Ana", "Bo", "Cy", "Di"], answer: 2,
      explain: `<p>Improvement is the gain, Test 2 take away Test 1. Ana +5, Bo +4, <b>Cy +7</b>, Di +2.</p><p class="why-not">Di has the highest marks in both tests but gained the least. The question asks who went up the most, not who scored the most.</p>` },
    { id: "t107", tier: 1, cat: "Must or cannot be true",
      stem: `<div class="box">Every child in the Dolphins swimming group can swim 25 metres.<br>Nadia is in the Dolphins.<br>Omar can swim 25 metres.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["Nadia can swim 25 metres.", "Omar is in the Dolphins.", "Nadia is a faster swimmer than Omar.", "Only Dolphins can swim 25 metres."], answer: 0,
      explain: `<p>Every Dolphin can swim 25 metres and Nadia is a Dolphin, so <b>Nadia can swim 25 metres</b>.</p><p class="why-not">Omar can swim 25 metres, but the rule never says that <i>only</i> Dolphins can, so he might be in another group. Nothing is said about speed.</p>` },
    { id: "t108", tier: 1, cat: "Spatial",
      stem: `<p>Jo stands facing <b>north</b>. She makes a quarter turn to her right. Then she makes a half turn.</p><p>Which way is Jo facing now?</p>`,
      options: ["north", "east", "south", "west"], answer: 3,
      explain: `<p>A quarter turn to the right from north takes Jo to east. A half turn then points her the opposite way: <b>west</b>.</p><p class="why-not">East is where she faces after only the first turn. South would need just one more quarter turn, not a half turn.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "t201", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">To enter the art prize, a painting must be handed in by Friday. Zane handed his painting in on Wednesday.<br>Zane: “I got mine in early, so I am sure to win a prize.”</div><p>Which one of these shows the mistake Zane has made?</p>`,
      options: ["Zane may have painted more quickly than the other children.", "Being on time may only let Zane’s painting into the contest.", "The judges may not look at any of the paintings until the following week.", "Some children may hand in their paintings on Thursday."], answer: 1,
      explain: `<p>Being on time is <b>needed</b> to enter, but it does not <b>guarantee</b> a prize. Every painting handed in by Friday is in the same position.</p><p class="why-not">How fast Zane painted, when the judging happens and when other children hand theirs in don’t explain why “on time” is not the same as “winner”.</p>` },
    { id: "t202", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Mr Diaz, the caretaker: “We should put a second bin beside the oval. Then less rubbish will be left on the grass.”</div><p>Which statement, if true, best supports Mr Diaz’s claim?</p>`,
      options: ["Three different classes use the oval for games every lunchtime.", "Rubbish left on the grass attracts ibises.", "The school already has a bin near the canteen.", "Children say the only bin is too far away from the oval."], answer: 3,
      explain: `<p>The claim needs a reason why a bin <i>beside the oval</i> would cut the rubbish. If children drop rubbish because the bin is <b>too far away</b>, a nearer bin fixes exactly that.</p><p class="why-not">How many classes use the oval and what the rubbish attracts show that rubbish is a problem, not that a second bin would solve it. A bin near the canteen is the far-away bin already there.</p>` },
    { id: "t203", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">Most of the apples in a box are green. The rest are red.</div><p>Priya: “If I take an apple from the box without looking, it will probably be green.”</p><p>Quentin: “The apple on the teacher’s desk is green, so it probably came from this box.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Priya", "Quentin"), answer: 0,
      explain: `<p>“Most apples in the box are green” tells us about apples <i>from the box</i>. So an apple taken from it is probably green: <b>Priya</b> is right.</p><p class="why-not">Quentin turns it round. We are told nothing about where green apples usually come from. There could be thousands of green apples that were never in this box.</p>` },
    { id: "t205", tier: 2, cat: "Order & arrangement",
      stem: `<p>Four boats finished a race, one after another.</p><p>The red boat finished before the blue boat but after the green boat.<br>The yellow boat finished after the red boat.<br>The blue boat was not last.</p><p>Which boat came <b>third</b>?</p>`,
      options: ["the red boat", "the yellow boat", "the blue boat", "the green boat"], answer: 2,
      explain: `<p>Green is before red, and red is before both blue and yellow, so the race starts green, red. Blue was not last, so blue is third and yellow is fourth: green, red, <b>blue</b>, yellow.</p><p class="why-not">Yellow is tempting because it is the last boat mentioned, but the final clue pushes yellow to the back. Red and green are fixed in second and first place.</p>` },
    { id: "t206", tier: 2, cat: "Rules & codes",
      stem: `<p>In a word game, each letter is worth points:</p>${tbl(["A", "E", "T", "M", "S"], [["1", "2", "3", "4", "5"]]).replace("<th>1</th>", "<td>1</td>")}<p>A word’s score is the total of its letters. So <b>TEAM</b> scores 3 + 2 + 1 + 4 = 10.</p><p>Which of these words scores the most?</p>`,
      options: ["MATES", "TASTE", "STEAM", "MESS"], answer: 3,
      explain: `<p>Add each word: MATES = 4 + 1 + 3 + 2 + 5 = 15. TASTE = 3 + 1 + 5 + 3 + 2 = 14. STEAM = 15. <b>MESS</b> = 4 + 2 + 5 + 5 = 16.</p><p class="why-not">The longer words look as if they should win, but MESS has two letters worth 5. MATES and STEAM use the same five letters, so they tie on 15.</p>` },
    { id: "t207", tier: 2, cat: "Tables & timetables",
      stem: `<p>The table shows how many stickers two children have.</p>${tbl(["", "Animal", "Space", "Sport"], [["Ivy", 6, 5, 4], ["Jon", 7, 2, 8]])}<p>Ivy gives Jon <b>3 space</b> stickers. Jon gives Ivy <b>2 sport</b> stickers.</p><p>After the swap, how many <b>more</b> stickers does Jon have than Ivy?</p>`,
      options: ["2", "3", "4", "8"], answer: 2,
      explain: `<p>Before: Ivy 6 + 5 + 4 = 15 and Jon 7 + 2 + 8 = 17.</p><p>After: Ivy 15 − 3 + 2 = 14 and Jon 17 + 3 − 2 = 18. Jon has <b>4</b> more.</p><p class="why-not">2 is the gap before the swap. 3 changes only one child’s total: every sticker that moves makes one pile smaller <i>and</i> the other bigger. 8 stops after Ivy’s gift and forgets the stickers Jon gives back.</p>` },
    { id: "t208", tier: 2, cat: "Number problems",
      stem: `<p>A dentist sees patients from <b>9:00 am</b> until <b>5:00 pm</b>, with a lunch break from 12:30 pm to 1:30 pm.</p><p>Every check-up takes exactly 30 minutes, and there are no gaps between them.</p><p>How many check-ups can the dentist do in one day?</p>`,
      options: ["7", "14", "15", "16"], answer: 1,
      explain: `<p>Morning: 9:00 to 12:30 is 3½ hours = 7 check-ups. Afternoon: 1:30 to 5:00 is 3½ hours = 7 check-ups. Altogether <b>14</b>.</p><p class="why-not">16 forgets the lunch break (8 hours of check-ups). 15 takes off only half an hour for lunch. 7 is just the morning.</p>` },
    { id: "t209", tier: 2, cat: "Must or cannot be true",
      stem: `<p>Asha is taller than Ben, and Ben is taller than Col.</p><p>The three friends stand on a staircase, each on a different step. Now the tops of their heads are exactly level.</p><p>Which one of these <b>cannot</b> be true?</p>`,
      options: ["Ben is on a higher step than Col.", "Asha is on the lowest step.", "Col is on the highest step.", "Ben is on a step between the other two."], answer: 0,
      explain: `<p>For the heads to be level, the shortest person needs the most help from the stairs. So Col is highest, Ben is in between and Asha is lowest.</p><p>That makes “<b>Ben is on a higher step than Col</b>” impossible: Ben is taller, so on a higher step his head would be above Col’s.</p><p class="why-not">The other three statements describe exactly how they must be standing.</p>` },
    { id: "t210", tier: 2, cat: "Spatial", visual: true,
      stem: `<p>Here is a tile made of five squares.</p>${PTILE}<p>Three of the tiles below are this tile <b>turned round</b>. One has been <b>flipped over</b>, so it is a mirror image.</p><p>Which tile has been flipped over?</p>`,
      options: [tile(flip(turn(P))), tile(turn(P)), tile(turn(turn(P))), tile(turn(turn(turn(P))))], answer: 0,
      explain: `<p>Turn the first tile in your head, a quarter turn at a time. Going clockwise round the block of four, the extra square always sits just <i>after</i> the same corner. Three of the tiles keep that pattern.</p><p>In the <b>first tile (A)</b> the extra square is on the other side of the block. No amount of turning does that: the tile must have been flipped over.</p><p class="why-not">The other three are the tile after a quarter turn, a half turn and a three-quarter turn.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "t301", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">A rule in a board game: “If you roll a six, you get another turn.” The rule is always followed.</div><p>Ed: “Fay got another turn, so she must have rolled a six.”</p><p>Gus: “Hana did not get another turn, so she cannot have rolled a six.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ed", "Gus"), answer: 1,
      explain: `<p>The rule says what happens <i>after a six</i>. If Hana had rolled a six she would have had another turn. She didn’t, so she didn’t roll one: <b>Gus</b> is right.</p><p class="why-not">Ed runs the rule backwards. The rule does not say a six is the <i>only</i> way to get another turn. Fay might have landed on a bonus square.</p>` },
    { id: "t302", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">A survey found that most children at Hillside School like the new playground.<br>Mia: “My cousin goes to Hillside, so she likes the new playground.”</div><p>Which one of these shows the mistake Mia has made?</p>`,
      options: ["The survey may have been done before the playground was finished.", "Mia may not have seen the new playground herself.", "Children at other schools may like their playgrounds more.", "Mia’s cousin may be one of the children who do not like it."], answer: 3,
      explain: `<p>“Most” is not “all”. Some Hillside children do not like the playground, and Mia’s <b>cousin could be one of them</b>. Mia can only say her cousin <i>probably</i> likes it.</p><p class="why-not">The timing of the survey, whether Mia has seen the playground and what other schools think don’t explain what is wrong with going from “most children” to “this child”.</p>` },
    { id: "t303", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Dr Osei: “High schools should start lessons an hour later in the morning. Then students would learn more in their first lesson of the day.”</div><p>Which statement, if true, best supports Dr Osei’s claim?</p>`,
      options: ["Students who are still sleepy take in less of what they are taught.", "Many high school students say they would like a later start.", "Teenagers tend to go to bed later than younger children do.", "Students who learn more in the mornings usually go on to get better marks."], answer: 0,
      explain: `<p>The claim needs a link from “starting later” to “learning more”. If <b>sleepy students take in less</b>, then a later start (more sleep) means more is learned.</p><p class="why-not">What students would like is not about learning. Going to bed later explains why they are tired, but stops before learning. Better marks is about what happens <i>after</i> learning more, not what causes it.</p>` },
    { id: "t304", tier: 3, cat: "Spatial", visual: true,
      stem: `<p>Towers of cubes stand on a 3 by 3 board. This plan shows the board from <b>above</b>. Each number tells you how many cubes are in that tower.</p>${PLAN}<p>What does Mia see?</p>`,
      options: [view([2, 3, 2]), view([3, 2, 2]), view([2, 2, 3]), view([2, 1, 1])], answer: 2,
      explain: `<p>From the side, Mia sees one column for each <i>row</i> of the plan, and each column is as tall as the tallest tower in that row. Front row: 2. Middle row: 2. Back row: 3.</p><p>Standing on the right-hand side, the front of the board is on Mia’s left, so she sees <b>2, 2, 3</b> from left to right (C).</p><p class="why-not">2, 3, 2 is the view from the front. 3, 2, 2 is the view from the opposite side. 2, 1, 1 is only the nearest line of towers: taller towers behind them still show over the top.</p>` },
    { id: "t305", tier: 3, cat: "Rules & codes",
      stem: `<p>A coach must choose <b>three</b> of these five swimmers for a relay: Ada, Bo, Cy, Di and Eli.</p><div class="box">Ada and Bo will not swim in the same team.<br>If Cy is chosen, Di must be chosen too.<br>Eli must be chosen.</div><p>Which team can the coach choose?</p>`,
      options: ["Bo, Di and Eli", "Ada, Bo and Eli", "Ada, Cy and Eli", "Bo, Cy and Di"], answer: 0,
      explain: `<p>Test each team against all three rules. <b>Bo, Di and Eli</b>: Ada and Bo are not together, Cy is not chosen so the second rule does not matter, and Eli is in. It works.</p><p class="why-not">Ada, Bo and Eli puts Ada and Bo together. Ada, Cy and Eli has Cy without Di. Bo, Cy and Di leaves out Eli.</p>` },
    { id: "t306", tier: 3, cat: "Tables & timetables",
      stem: `<p>Four garden lamps are on timers.</p>${tbl(["Lamp", "Switches on", "Switches off"], [["A", "5:00 pm", "8:30 pm"], ["B", "6:15 pm", "9:00 pm"], ["C", "7:00 pm", "7:45 pm"], ["D", "8:00 pm", "10:00 pm"]])}<p>For how long altogether are <b>three</b> lamps on at the same time?</p>`,
      options: ["30 minutes", "45 minutes", "1 hour 15 minutes", "2 hours 15 minutes"], answer: 2,
      explain: `<p>A and B are both on from 6:15 to 8:30. During that time C joins them from 7:00 to 7:45 (45 minutes), and D joins them from 8:00 until A goes off at 8:30 (30 minutes).</p><p>45 + 30 = <b>1 hour 15 minutes</b>. (C and D are never on together, so there are never four.)</p><p class="why-not">45 minutes and 30 minutes are each only one of the two stretches. 2 hours 15 minutes is how long A and B are on together, which is only two lamps.</p>` },
    { id: "t307", tier: 3, cat: "Must or cannot be true",
      stem: `<div class="box">In a hockey league, a team wins a game only if it scores more goals than the other team. If the two teams score the same, the game is a draw.<br>Last Saturday the Otters scored no goals.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["The Otters lost on Saturday.", "The other team scored at least one goal.", "The Otters have not won a game this season.", "The Otters did not win on Saturday."], answer: 3,
      explain: `<p>To win you must score more than the other team, and nobody can score fewer than zero. So with no goals <b>the Otters did not win</b>.</p><p class="why-not">They need not have lost: if the other team also scored nothing, it was a 0–0 draw. That is also why the other team need not have scored. One Saturday tells us nothing about the rest of the season.</p>` },
    { id: "t308", tier: 3, cat: "Number problems",
      stem: `<p>There are <b>24</b> children in a class. <b>15</b> play soccer and <b>12</b> play netball. <b>2</b> children play neither sport.</p><p>How many children play <b>both</b> soccer and netball?</p>`,
      options: ["3", "5", "7", "10"], answer: 1,
      explain: `<p>24 − 2 = 22 children play at least one sport. But 15 + 12 = 27, which is 5 too many. The extra 5 are the children who were counted twice, once for each sport: <b>5</b> play both.</p><p>Check: 10 soccer only + 5 both + 7 netball only + 2 neither = 24.</p><p class="why-not">3 is just 15 − 12. 7 is the number who play netball only, and 10 is the number who play soccer only.</p>` },

    /* ===================== the boss ===================== */
    { id: "t401", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">A bag holds 6 lemon, 4 mint and 3 berry lollies. They are all wrapped the same, so nobody can tell them apart.</div><p>Pia: “If I take out 4 lollies, I am certain to get at least two of the same flavour.”</p><p>Raj: “If I take out 8 lollies, I am certain to get at least one berry.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 0,
      explain: `<p>To be <i>certain</i>, think of the unluckiest case. There are only 3 flavours, so the first 3 lollies could all be different, but the 4th must match one of them. <b>Pia</b> is right.</p><p class="why-not">Raj is wrong: there are 6 + 4 = 10 lollies that are not berry, so his 8 could all be lemon and mint. He would need 11 to be certain.</p>` },
    { id: "t402", tier: 4, cat: "Spot the mistake",
      stem: `<div class="box">After recess, the door of the class hamster’s cage was found open. Only Ivy and Jack were in the room during recess.<br>Ivy: “I didn’t open it, so Jack must have.”</div><p>Which one of these shows the mistake Ivy has made?</p>`,
      options: ["Jack may like the hamster more than Ivy does.", "Ivy may have been in the room for much longer than Jack was.", "The hamster may not have left its cage.", "The door may not have been latched properly before recess."], answer: 3,
      explain: `<p>Ivy thinks there are only two possibilities: she opened it, or Jack did. There is a third: <b>nobody opened it at recess</b>. A door that was not latched could have swung open by itself.</p><p class="why-not">Who likes the hamster, who was in the room longer and whether the hamster got out don’t point to anything wrong with her “me or Jack” thinking.</p>` },
    { id: "t403", tier: 4, cat: "Number problems",
      stem: `<p>A class of <b>20</b> children voted for a mascot: an owl, a fox or a frog. Every child voted for exactly <b>two</b> of the three animals.</p><p>The owl got 14 votes and the fox got 15 votes.</p><p>How many votes did the frog get?</p>`,
      options: ["9", "11", "20", "29"], answer: 1,
      explain: `<p>20 children with 2 votes each makes 40 votes altogether. The owl and the fox took 14 + 15 = 29 of them, so the frog got 40 − 29 = <b>11</b>.</p><p class="why-not">29 is the owl’s and fox’s votes, not the frog’s. 20 is the number of children, and each of them had two votes, not one. 9 comes from taking 29 away from the wrong total.</p>` },
    { id: "t404", tier: 4, cat: "Spatial",
      stem: `<p>On a dice, the numbers on opposite faces always add up to <b>7</b>.</p><p>A dice sits on a table with <b>1 on top</b>, <b>2 facing you</b> and <b>3 on the right-hand side</b>.</p><p>You tip the dice over once to the <b>right</b>, so the top face becomes the right-hand face. Then you tip it once <b>towards you</b>, so the top face becomes the face that looks at you.</p><p>Which number is on top now?</p>`,
      options: ["2", "4", "5", "6"], answer: 2,
      explain: `<p>Start: top 1, bottom 6, front 2, back 5, right 3, left 4.</p><p>Tip to the right: the left face comes up, so the top is 4 (front and back stay as 2 and 5).</p><p>Tip towards you: the back face comes up, so the top is <b>5</b>.</p><p class="why-not">4 stops after the first tip. 6 is opposite the 1 you started with, but the bottom never comes straight to the top in one tip. 2 is the face that started at the front; after the second tip it is underneath.</p>` },
    { id: "t405", tier: 4, cat: "Order & arrangement",
      stem: `<p>Five shelves are numbered 1 (bottom) to 5 (top). Each holds one thing: a globe, a clock, a vase, a lamp and a trophy.</p><div class="box">The trophy is on shelf 3.<br>The lamp is on the shelf directly above the globe.<br>The clock is higher than the vase.<br>The vase is not on the bottom shelf.</div><p>What is on shelf <b>4</b>?</p>`,
      options: ["the clock", "the lamp", "the globe", "the vase"], answer: 3,
      explain: `<p>With the trophy on 3, the globe and lamp (one directly above the other) must be on 1 and 2, or on 4 and 5.</p><p>If they were on 4 and 5, the vase and clock would be on 1 and 2. The vase can’t be on 1, so it would be on 2 with the clock below it. But the clock must be higher. That fails.</p><p>So the globe is on 1 and the lamp on 2. The vase and clock take 4 and 5 with the clock higher: the <b>vase</b> is on 4.</p><p class="why-not">The clock is on 5, the lamp on 2 and the globe on 1.</p>` },
    { id: "t406", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">The canteen sells soup <b>only</b> on days when the temperature at 9 am is below 15 degrees. On every such day, it does sell soup.</div><p>Wes: “The canteen is selling soup today, so it was below 15 degrees at 9 am.”</p><p>Xan: “It was 20 degrees at 9 am today, so there will be no soup at the canteen.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Wes", "Xan"), answer: 2,
      explain: `<p>“Only on days below 15 degrees” means soup is never sold on a warmer day. So if soup is on sale it must have been below 15 (Wes), and on a 20-degree morning there can be no soup (Xan). <b>Both</b> are right.</p><p class="why-not">Many rules only work in one direction, which is why “only one of them” is tempting. Here the word “only” makes Wes’s and Xan’s statements two ways of saying the same thing.</p>` },
    { id: "t407", tier: 4, cat: "Supports the claim",
      stem: `<div class="box">Councillor Abara: “We should plant shady trees along the footpaths of Main Street. Then more people will walk to the shops in summer instead of driving.”</div><p>Which statement, if true, best supports the councillor’s claim?</p>`,
      options: ["Streets lined with trees look more attractive to visitors.", "Many people say Main Street is too hot to walk along in summer.", "Parking spaces near the shops are very hard to find during summer.", "People who walk to the shops tend to visit more of them."], answer: 1,
      explain: `<p>The claim is that <i>shade</i> will get people walking. That only works if <b>heat is what stops them now</b>. If people say the street is too hot to walk along, shady trees remove the reason they drive.</p><p class="why-not">Looking attractive is a different benefit of trees. Scarce parking is a reason to walk that has nothing to do with trees. More shop visits is a result of walking, not a reason that trees would cause it.</p>` },
  );
})();

(() => {
