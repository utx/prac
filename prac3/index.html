<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Island</title>
<style>
  :root {
    --ink: #1b2a41; --ink-soft: #55627a; --line: #d8dde6; --paper: #ffffff; --field: #f3f5f8;
    --navy: #0d1330; --sky1: #16205c; --sky2: #5b2a9d; --gold: #ffe81a; --gold-deep: #ff9d1a; --storm: #8a3ff0;
    --good: #1e8a55; --good-bg: #e2f5ea; --bad: #c0392b; --bad-bg: #fde8e5; --kind: #0b6fa4;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky2); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; }
  body { background: linear-gradient(160deg, var(--sky1), var(--sky2)) fixed; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 14px 70px; }
  .caps { font-family: "Arial Black", Impact, sans-serif; font-style: italic; text-transform: uppercase; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #fff; margin-bottom: 12px; }
  .top h1 { font: italic 900 30px "Arial Black", Impact, sans-serif; text-transform: uppercase; margin: 0; letter-spacing: .5px; text-shadow: 0 3px 0 var(--navy); }
  .top h1 span { color: var(--gold); }
  .top .spacer { flex: 1; }
  .pill { background: rgba(13,19,48,.6); border: 2px solid rgba(255,255,255,.28); color: #fff; border-radius: 999px;
    padding: 4px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill img { width: 24px; height: 24px; object-fit: contain; }
  button.pill:hover { background: rgba(255,255,255,.22); }
  .btn { background: var(--gold); color: #2a2100; border: 3px solid var(--navy); border-bottom-width: 6px; border-radius: 10px; padding: 8px 20px;
    font: italic 900 18px "Arial Black", Impact, sans-serif; text-transform: uppercase; text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(2px); border-bottom-width: 4px; }
  .btn.blue { background: #3fa7ff; color: #fff; } .btn.ghost { background: #fff; color: var(--ink); } .btn.small { font-size: 14px; padding: 4px 12px; border-width: 2px; border-bottom-width: 4px; }
  .btn:disabled { filter: grayscale(1); opacity: .6; cursor: default; }
  .note { background: #fff8e6; border: 2px dashed var(--gold-deep); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .note .txt { flex: 1 1 240px; }
  .banner { background: var(--storm); color: #fff; border: 3px solid var(--navy); border-radius: 12px; padding: 8px 16px; margin-bottom: 12px; font-weight: 700; animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } }

  /* ---- Fortnite time ---- */
  .timecard { background: var(--navy); color: #fff; border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .pie { --p: 0; width: 112px; height: 112px; border-radius: 50%; flex: none; position: relative;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), #2b3566 0); border: 5px solid #fff; box-shadow: 0 0 0 4px var(--navy), 0 0 22px rgba(255,232,26,.5); }
  .pie::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(13,19,48,.55) 0 1.2deg, transparent 1.2deg 60deg); }
  .timecard .txt { flex: 1 1 200px; }
  .timecard .lab { color: var(--gold); font-size: 16px; font-weight: 700; }
  .timecard .bigt { font: 900 34px/1.1 "Arial Black", Impact, sans-serif; }
  .timecard .of { opacity: .88; font-size: 15px; }
  .chest { width: 128px; height: 120px; object-fit: contain; flex: none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)); }
  @media (max-width: 520px) { .pie { width: 84px; height: 84px; } .chest { width: 84px; height: 80px; } .timecard .bigt { font-size: 26px; } .top h1 { font-size: 24px; } }

  /* ---- the island ---- */
  .island { position: relative; width: 100%; max-width: 640px; margin: 0 auto 14px; aspect-ratio: 1; border-radius: 18px; overflow: hidden; border: 4px solid var(--navy); background: #1d6fd0; }
  .island svg, .island .mapimg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
  .island #stormhole { transition: r 1.4s ease-in-out; }
  .mk { position: absolute; transform: translate(-50%, -50%); width: 68px; padding: 0; border: 0; background: none; text-align: center; color: #fff; line-height: 1.1; }
  .mk .pic { width: 60px; height: 60px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--navy); background: var(--kind); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 0 rgba(13,19,48,.6); }
  .mk .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 50%; }
  .mk .pic .em { font-size: 32px; }
  .mk .tag { position: absolute; right: -8px; bottom: -6px; font-size: 18px; background: #fff; border: 2px solid var(--navy); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .mk .nm { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 800; background: rgba(13,19,48,.82); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .mk .mhp { height: 6px; width: 46px; margin: 3px auto 0; background: rgba(13,19,48,.7); border-radius: 4px; overflow: hidden; }
  .mk .mhp i { display: block; height: 100%; background: #ff5a4d; }
  .mk.open .pic { border-color: var(--gold); animation: glow 1.6s infinite; }
  .mk.open:hover .pic { transform: scale(1.08); }
  .mk.later { opacity: .8; } .mk.later .pic { filter: grayscale(.7) brightness(.8); }
  .mk.dead .pic { filter: grayscale(1) brightness(.55); } .mk.dead .nm { text-decoration: line-through; opacity: .8; }
  .mk.boss .pic { width: 74px; height: 74px; background: #7a1f3d; } .mk.boss { width: 84px; }
  .mk.spot .pic { background: #fff; border-radius: 14px; }
  .mk.spot.usedup { opacity: .55; }
  .mk:disabled { pointer-events: none; } .mk.open { z-index: 2; }
  @keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(255,232,26,.35), 0 4px 0 rgba(13,19,48,.6); } }
  .dropin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(13,19,48,.45); text-align: center; color: #fff; padding: 20px; }
  .dropin .btn { font-size: 26px; padding: 12px 34px; }
  .dropin p { margin: 0; font-weight: 700; text-shadow: 0 2px 0 var(--navy); max-width: 420px; }
  @media (max-width: 520px) { .mk { width: 56px; } .mk .pic { width: 46px; height: 46px; } .mk.boss .pic { width: 56px; height: 56px; } .mk .nm { font-size: 10px; padding: 0 4px; } .mk .tag { width: 22px; height: 22px; font-size: 13px; } .mk .pic .em { font-size: 24px; } }
  .legend { color: #fff; font-size: 14.5px; text-align: center; margin: -4px 0 14px; opacity: .92; }
  .me-strip { background: rgba(13,19,48,.7); border: 2px solid rgba(255,255,255,.25); color: #fff; border-radius: 14px; padding: 8px 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .me-strip .grow { flex: 1 1 180px; }

  /* ---- bars ---- */
  .bar { position: relative; height: 18px; background: rgba(13,19,48,.75); border: 2px solid var(--navy); border-radius: 6px; overflow: hidden; margin-top: 3px; min-width: 110px; }
  .bar i { display: block; height: 100%; transition: width .5s; }
  .bar.hp i { background: linear-gradient(180deg, #7dff6b, #23b53a); } .bar.sh i { background: linear-gradient(180deg, #7fd4ff, #2f8fff); } .bar.ehp i { background: linear-gradient(180deg, #ff8a65, #e5484d); }
  .bar span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 #000; }
  .bar.sh { height: 12px; } .bar.sh span { line-height: 8px; font-size: 10px; }

  /* ---- battle ---- */
  .playbar { display: flex; align-items: center; gap: 8px; color: #fff; margin-bottom: 10px; flex-wrap: wrap; }
  .arena { position: relative; height: 290px; border-radius: 16px; overflow: hidden; border: 4px solid var(--navy); background: var(--navy) center bottom / cover no-repeat; margin-bottom: 10px; }
  .hud { position: absolute; top: 8px; width: 42%; max-width: 250px; color: #fff; background: rgba(13,19,48,.78); border-radius: 10px; padding: 6px 10px 8px; font-size: 14px; }
  .hud.me { left: 8px; } .hud.foe { right: 8px; }
  .hud b { font: italic 900 16px "Arial Black", Impact, sans-serif; text-transform: uppercase; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud small { display: block; opacity: .9; font-size: 12.5px; }
  .fighter { position: absolute; bottom: 6px; width: 170px; height: 170px; padding: 0; border: 0; background: none; }
  .fighter img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); display: block; }
  .fighter.me { left: 6%; } .fighter.foe { right: 6%; }
  .fighter.foe:not(:disabled):hover img { filter: drop-shadow(0 0 12px #fff) drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
  .fighter.foe:disabled { cursor: default; }
  .fighter.foe .cross { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 4px solid var(--gold); border-radius: 50%; opacity: 0; pointer-events: none; }
  .fighter.foe .cross::before, .fighter.foe .cross::after { content: ""; position: absolute; background: var(--gold); }
  .fighter.foe .cross::before { left: 50%; top: -12px; bottom: -12px; width: 4px; margin-left: -2px; } .fighter.foe .cross::after { top: 50%; left: -12px; right: -12px; height: 4px; margin-top: -2px; }
  .fighter.foe.aim .cross { opacity: .95; animation: aim 1.2s infinite; }
  @keyframes aim { 50% { transform: scale(1.15); } }
  .fighter.hit { animation: hit .55s; } .fighter.ko img { transform: rotate(80deg) translateY(30px); opacity: .5; transition: transform .6s, opacity .6s; }
  @keyframes hit { 20% { transform: translateX(-10px) rotate(-10deg); filter: brightness(2.2); } 60% { transform: translateX(8px) rotate(6deg); } }
  .float { position: absolute; top: 42%; font: italic 900 34px "Arial Black", Impact, sans-serif; color: var(--gold); text-shadow: 0 3px 0 var(--navy), 0 0 8px #000; pointer-events: none; animation: rise 1.5s forwards; white-space: nowrap; }
  .float.onfoe { right: 12%; } .float.onme { left: 10%; color: #ff6b5e; }
  @keyframes rise { 0% { transform: translateY(20px) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { transform: translateY(-60px); opacity: 0; } }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .act { flex: 1 1 130px; display: flex; align-items: center; gap: 8px; text-align: left; background: linear-gradient(180deg, color-mix(in srgb, var(--rar, #5d6578) 60%, #fff), color-mix(in srgb, var(--rar, #5d6578) 92%, #000));
    color: #fff; border: 3px solid var(--navy); border-bottom-width: 6px; border-radius: 10px; padding: 6px 10px; line-height: 1.2; min-width: 0; }
  .act b { font: italic 900 14.5px "Arial Black", Impact, sans-serif; text-transform: uppercase; display: block; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .act small { font-size: 12.5px; display: block; }
  .gunpic { width: 76px; height: 38px; object-fit: cover; border-radius: 6px; border: 2px solid var(--navy); flex: none; display: block; }
  .ico { width: 30px; height: 30px; object-fit: contain; flex: none; vertical-align: middle; }
  .pill .ico { width: 24px; height: 24px; }
  .kit { text-align: center; font-size: 14px; font-weight: 700; } .kit small { display: block; }
  .banner { display: flex; align-items: center; gap: 10px; } .banner .ico { width: 44px; height: 44px; }
  .dropin .bus { width: 110px; height: 110px; object-fit: contain; animation: bob 3s ease-in-out infinite; }
  .mk.spot .pic img { object-fit: contain; border-radius: 0; padding: 5px; }
  .act.gun { flex: 2 1 220px; } .act.gun .go { margin-left: auto; background: var(--gold); color: #2a2100; border-radius: 8px; padding: 4px 12px; font: italic 900 17px "Arial Black", Impact, sans-serif; }
  .act:disabled { filter: grayscale(.8); opacity: .65; cursor: default; }
  @media (max-width: 520px) { .act.gun { flex-basis: 100%; } .arena { height: 236px; } .fighter { width: 124px; height: 124px; } .fighter.me { left: 2%; } .fighter.foe { right: 2%; } .float { font-size: 26px; } }

  /* ---- question ---- */
  .stage { display: grid; gap: 12px; }
  .stage.has-passage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 820px) { .stage.has-passage { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--paper); border-radius: 16px; padding: 16px 18px; min-width: 0; }
  .passage h3 { margin: 0 0 4px; font-size: 20px; }
  .passage .pnote { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 10px; }
  .passage p { margin: 0 0 10px; }
  .passage .poem { white-space: pre-line; font-size: 17px; line-height: 1.6; margin: 0 0 4px; }
  .passage .extract { border-left: 4px solid var(--kind); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .passage .extract b.tag { display: block; color: var(--kind); }
  .passage .gap { white-space: nowrap; font-weight: 700; background: #eef1f6; border-radius: 4px; padding: 0 4px; }
  .passage .gap.cur { background: var(--gold); box-shadow: 0 0 0 2px var(--navy); }
  @media (min-width: 821px) { .passage { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; } }
  .qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .stem { font-size: 18px; }
  .stem p { margin: 0 0 10px; }
  .stem .box { background: var(--field); border-left: 4px solid var(--kind); border-radius: 6px; padding: 10px 14px; margin: 0 0 10px; }
  .figure { margin: 10px 0; text-align: center; overflow-x: auto; }
  .figure svg, .opt svg { max-width: 100%; height: auto; }
  table.grid { border-collapse: collapse; margin: 8px auto; font-size: 17px; }
  table.grid th, table.grid td { border: 1.5px solid var(--ink-soft); padding: 5px 10px; text-align: center; }
  table.grid th { background: var(--field); }
  table.grid td.fill { background: #fff3bf; font-weight: 800; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opts.visual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); border: 3px solid var(--line);
    border-radius: 10px; padding: 9px 12px; color: var(--ink); font-size: 17px; width: 100%; min-width: 0; }
  .opt:hover:not(:disabled) { border-color: var(--kind); background: var(--field); }
  .opt:disabled { cursor: default; }
  .opt .let { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--field); border: 1.5px solid var(--line); font-weight: 800; display: flex; align-items: center; justify-content: center; transform: skewX(-6deg); }
  .opt.right { border-color: var(--good); background: var(--good-bg); } .opt.right .let { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .opt.wrong .let { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dim { opacity: .55; }
  .fb { margin-top: 14px; border-radius: 12px; padding: 12px 16px; }
  .fb.good { background: var(--good-bg); border: 2px solid var(--good); } .fb.miss { background: var(--bad-bg); border: 2px solid var(--bad); }
  .fb h4 { margin: 0 0 4px; font-size: 19px; }
  .fb p { margin: 0 0 8px; } .fb p:last-child { margin: 0; }
  .fb .why-not { color: var(--ink-soft); }
  .next { margin-top: 14px; display: flex; justify-content: flex-end; }
  .aimhelp { text-align: center; font-size: 18px; padding: 8px 0; }
  .aimhelp .btn { margin-top: 8px; font-size: 22px; }

  /* ---- shop, locker, results ---- */
  .shelf { background: var(--paper); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .shelf h3 { margin: 0 0 4px; font: italic 900 20px "Arial Black", Impact, sans-serif; text-transform: uppercase; }
  .shelf p.sub { margin: 0 0 10px; color: var(--ink-soft); font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .tile { border: 3px solid var(--navy); border-bottom-width: 7px; border-radius: 10px; text-align: center; padding: 8px 6px; font-size: 13.5px; line-height: 1.3; color: #fff;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rar) 55%, #fff), color-mix(in srgb, var(--rar) 90%, #000)); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tile b { font: italic 900 14px "Arial Black", Impact, sans-serif; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .tile img { width: 88px; height: 88px; object-fit: contain; } .tile .gunpic { width: 116px; height: 58px; } .tile .itempic { width: 64px; height: 64px; object-fit: contain; }
  .tile .btn { margin-top: auto; }
  .tile.off { --rar: #5d6578 !important; } .tile.off img { filter: brightness(0) opacity(.55); }
  .tile.cur { box-shadow: 0 0 0 4px var(--gold); }
  button.tile { cursor: pointer; }
  .result { text-align: center; }
  .result h2 { font: italic 900 34px "Arial Black", Impact, sans-serif; text-transform: uppercase; margin: 6px 0; }
  .result .big img { width: 150px; height: 146px; object-fit: contain; animation: bob 2.6s ease-in-out infinite; }
  .result .big img.vic { width: 120px; height: 100px; animation-delay: -1.2s; }
  .result .rows { display: inline-grid; grid-template-columns: auto auto; gap: 4px 18px; text-align: left; margin: 10px auto; font-size: 18px; }
  .result .rows b { text-align: right; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  details.parents { background: rgba(255,255,255,.94); border-radius: 12px; padding: 10px 16px; font-size: 15px; }
  details.parents summary { cursor: pointer; font-weight: 700; color: var(--ink-soft); }
  details.parents table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  details.parents td, details.parents th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  details.parents td.n, details.parents th.n { text-align: right; }
  details.parents input { font: inherit; width: 80px; padding: 4px 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .legal { color: rgba(255,255,255,.78); font-size: 12.5px; line-height: 1.45; margin: 16px 4px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const INK = "#1b2a41";
const READING = [], THINKING = [], MATHS = [], GENS = [];
/* ---------------------------------------------------------------
   STORM ISLAND: shared drawing and option helpers for the question files.
   Loaded first (the files are joined in name order by tools/build_game3.py).
   --------------------------------------------------------------- */
const LIB = (() => {
  const T = (x, y, s, o = "") => `<text x="${x}" y="${y}" font-size="15" fill="${INK}" ${o}>${s}</text>`;
  const fig = (svg) => `<div class="figure">${svg}</div>`;
  const tbl = (head, rows, fill = []) => `<div class="figure"><table class="grid"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map((r, ri) => `<tr>${r.map((c, i) => i ? `<td${fill.some(f => f[0] === ri && f[1] === i) ? ' class="fill"' : ""}>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table></div>`;
  const money = c => "$" + (c / 100).toFixed(2);
  const clock = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 === 0 ? 12 : h % 12}:${String(mm).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`; };
  const dur = m => m < 60 ? `${m} minutes` : `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + " min" : ""}`.trim();
  const frac = (n, d) => `<sup>${n}</sup>⁄<sub>${d}</sub>`;

  /* a column graph: series = [{name, color, values}], gridlines every `step` up to `max` */
  function colGraph({ labels, series, max, step, ylabel, numbers = true, aria }) {
    const gw = series.length * 26 + 30, W = 70 + labels.length * gw, y = v => 205 - v * (170 / max);
    let g = "";
    for (let v = 0; v <= max; v += step) g += `<line x1="50" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#c5ccd8" stroke-width="1"/>` + (numbers ? T(42, y(v) + 5, v, 'text-anchor="end"') : "");
    labels.forEach((n, i) => {
      const x0 = 66 + i * gw;
      series.forEach((s, k) => { g += `<rect x="${x0 + k * 26}" y="${y(s.values[i])}" width="24" height="${205 - y(s.values[i])}" fill="${s.color}" stroke="${INK}" stroke-width="1.5"/>`; });
      g += T(x0 + series.length * 13, 224, n, 'text-anchor="middle"');
    });
    g += `<line x1="50" x2="50" y1="${y(max)}" y2="205" stroke="${INK}" stroke-width="2"/><line x1="50" x2="${W - 10}" y1="205" y2="205" stroke="${INK}" stroke-width="2"/>`;
    g += `<text x="14" y="120" font-size="13" fill="${INK}" text-anchor="middle" transform="rotate(-90 14 120)">${ylabel}</text>`;
    if (series.length > 1) series.forEach((s, k) => { g += `<rect x="${60 + k * 110}" y="236" width="14" height="12" fill="${s.color}" stroke="${INK}"/>` + T(80 + k * 110, 247, s.name); });
    return fig(`<svg viewBox="0 0 ${W} ${series.length > 1 ? 256 : 238}" width="${W}" role="img" aria-label="${aria}">${g}</svg>`);
  }
  /* a picture graph: rows = [[label, symbols]] where symbols may end in .5; keyText is "" for a missing key */
  function pictGraph({ rows, keyText, color, aria }) {
    const sym = (x, y, half) => half ? `<path d="M${x + 13} ${y + 2}a13 13 0 0 0 0 26z" fill="${color}" stroke="${INK}" stroke-width="1.5"/>` : `<circle cx="${x + 13}" cy="${y + 15}" r="13" fill="${color}" stroke="${INK}" stroke-width="1.5"/>`;
    const wide = Math.max(...rows.map(r => Math.ceil(r[1]))), W = 118 + wide * 32 + 10;
    let g = "";
    rows.forEach(([d, n], i) => {
      const y = 10 + i * 40;
      g += T(98, y + 21, d, 'text-anchor="end"') + `<line x1="106" x2="106" y1="${y - 5}" y2="${y + 35}" stroke="${INK}" stroke-width="2"/>`;
      for (let k = 0; k < Math.floor(n); k++) g += sym(114 + k * 32, y);
      if (n % 1) g += sym(114 + Math.floor(n) * 32, y, true);

    if (keyText) g += sym(114, ky) + T(148, ky + 21, "= " + keyText);
    return fig(`<svg viewBox="0 0 ${Math.max(W, 290)} ${ky + (keyText ? 36 : 0)}" width="${Math.max(W, 290)}" role="img" aria-label="${aria}">${g}</svg>`);
  }

  function dotPlot({ counts, first = 0, label, aria }) {
    const W = 60 + counts.length * 40, top = Math.max(...counts), base = 30 + top * 22;
    let g = `<line x1="20" x2="${W - 10}" y1="${base}" y2="${base}" stroke="${INK}" stroke-width="2"/>`;
    counts.forEach((c, v) => {
      const x = 45 + v * 40;
      g += `<line x1="${x}" x2="${x}" y1="${base}" y2="${base + 6}" stroke="${INK}" stroke-width="2"/>` + T(x, base + 22, first + v, 'text-anchor="middle"');
      for (let k = 0; k < c; k++) g += `<circle cx="${x}" cy="${base - 12 - k * 22}" r="8" fill="#ff8a65" stroke="${INK}" stroke-width="1.5"/>`;
    });
    g += T(W / 2, base + 42, label, 'text-anchor="middle"');
    return fig(`<svg viewBox="0 0 ${W} ${base + 50}" width="${W}" role="img" aria-label="${aria}">${g}</svg>`);
  }
  /* an upright container with a scale: labels every `major` up to `max`, `minor` small steps between labels, liquid at `level` */
  function jugSvg({ x = 0, max, major, minor, level, unit, color = "#f6c453", title = "" }) {
    const y = v => 240 - v * (200 / max), small = major / minor;
    let g = `<path d="M${x + 40} 30 L${x + 40} 242 Q${x + 40} 250 ${x + 48} 250 L${x + 132} 250 Q${x + 140} 250 ${x + 140} 242 L${x + 140} 30" fill="none" stroke="${INK}" stroke-width="3"/>`;
    g += `<rect x="${x + 42}" y="${y(level)}" width="96" height="${248 - y(level)}" fill="${color}" opacity=".75"/>`;
    for (let i = 0; i <= max / small + 1e-9; i++) {
      const v = i * small, big = i % minor === 0;

  }
  const jugAria = ({ max, major, minor, level, unit, title = "A container" }) => `${title}: the scale is labelled every ${major} ${unit} up to ${max} ${unit}, with ${minor - 1} small unlabelled mark${minor - 1 === 1 ? "" : "s"} between each pair of labels. The liquid reaches ${level % major === 0 ? "the " + level + " " + unit + " label" : "small mark number " + ((level % major) / (major / minor)) + " above the " + (level - level % major) + " " + unit + " label"}.`;

    int: (a, b) => a + Math.floor(r() * (b - a + 1)),

    chance: p => r() < p,
  });
  /* Number options in order of size. `wrongs` are the values real mistakes give, most tempting first: the first two are
     always used. The correct value is then steered to a random letter by choosing how many options sit below and above it,
     topping up with near misses (a `step` out) where there are not enough real mistakes on that side. */
  function opts(R, correct, wrongs, fmt = String, n = 5, step = 1) {
    const w = []; for (const x of wrongs) if (Number.isFinite(x) && x > 0 && x !== correct && !w.includes(x)) w.push(x);
    const must = w.slice(0, 2), room = Math.floor((correct - 1e-9) / step);            // how many near misses fit below
    const lo = w.filter(x => x < correct), hi = w.filter(x => x > correct);
    const tMin = must.filter(x => x < correct).length, tMax = Math.min(n - 1 - must.filter(x => x > correct).length, lo.length + room);
    const t = tMax >= tMin ? R.int(tMin, tMax) : tMin;

    const below = take(lo, t, -1), above = take(hi, n - 1 - below.length, 1);
    const vals = [...below, correct, ...above].sort((a, b) => a - b);
    return { options: vals.map(fmt), answer: vals.indexOf(correct) };
  }
  const gen = (id, kind, tier, cat, fn) => GENS.push({ id, kind, tier, cat, make: r => fn(R(r)) });
  const NAMES = ["Ava", "Ben", "Cleo", "Dev", "Esha", "Finn", "Gia", "Hugo", "Isla", "Jai", "Kira", "Leo", "Mila", "Noah", "Omar", "Pia", "Remy", "Suki", "Theo", "Uma", "Vera", "Will", "Yusuf", "Zoe"];
  return { T, fig, tbl, money, clock, dur, frac, colGraph, pictGraph, dotPlot, jugSvg, jugAria, R, opts, gen, NAMES };
})();

/* ---------------------------------------------------------------
   STORM ISLAND: question templates that redraw themselves with new numbers.
   Each template takes a seeded random source and returns
   { stem, options, answer, explain, data }. `data` holds the numbers the
   picture was drawn from; tools/check_game3.js re-solves every question from
   `data` with its own separate working, over many seeds.
   Maths templates have five options (A–E); thinking templates have four.
   --------------------------------------------------------------- */
(() => {
  const { T, fig, tbl, money, clock, colGraph, pictGraph, dotPlot, jugSvg, jugAria, opts, gen, NAMES } = LIB;
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const B = s => `<b>${s}</b>`;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const list = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const sy = n => n === 0.5 ? "half a symbol" : Number.isInteger(n) ? `${n} symbol${n === 1 ? "" : "s"}` : `${Math.floor(n)} and a half symbols`;

  /* ================= MATHS, circle 1 ================= */

  gen("pict", "maths", 1, "Graphs & data", R => {
    const c = R.pick([
      { intro: "The picture graph shows how many books a library lent each day.", rows: ["Mon", "Tue", "Wed", "Thu"], item: "books", verb: "were lent on", col: "#4dabf7" },
      { intro: "The picture graph shows how many ice creams a kiosk sold each day.", rows: ["Fri", "Sat", "Sun", "Mon"], item: "ice creams", verb: "were sold on", col: "#f783ac" },
      { intro: "The picture graph shows how many trees each class planted.", rows: ["Class 4A", "Class 4B", "Class 4C", "Class 4D"], item: "trees", verb: "were planted by", col: "#51cf66" },
      { intro: "The picture graph shows how many shells each child collected.", rows: ["Mai", "Otis", "Priya", "Sam"], item: "shells", verb: "were collected by", col: "#ffa94d" },
    ]);
    const key = R.pick([2, 4, 6, 10, 20]);
    let h, i, j;
    do { h = R.shuffle([2, 3, 4, 5, 6, 7, 8, 9, 10]).slice(0, 4); [i, j] = R.shuffle([0, 1, 2, 3]); if (h[i] < h[j]) [i, j] = [j, i]; } while ((h[i] % 2 === 0 && h[j] % 2 === 0) || h[i] - h[j] < 2);
    const rows = c.rows.map((n, k) => [n, h[k] / 2]), a = rows[i][1], b = rows[j][1], correct = (a - b) * key;
    const o = opts(R, correct, [Math.ceil(a - b), a * key, (Math.ceil(a) - Math.ceil(b)) * key, (a + b) * key], String, 5, key / 2);
    return { ...o, data: { rows, key, a: i, b: j },
      stem: `<p>${c.intro}</p>${pictGraph({ rows, keyText: `${key} ${c.item}`, color: c.col, aria: `A picture graph. ${rows.map(r => `${r[0]}: ${sy(r[1])}`).join(". ")}. Key: one whole symbol = ${key} ${c.item}.` })}<p>How many ${B("more")} ${c.item} ${c.verb} ${B(rows[i][0])} than ${B(rows[j][0])}?</p>`,
      explain: `<p>One symbol stands for ${key} ${c.item}, so half a symbol stands for ${key / 2}.</p><p>${rows[i][0]}: ${sy(a)} = ${a * key}. ${rows[j][0]}: ${sy(b)} = ${b * key}. The difference is ${a * key} − ${b * key} = ${B(correct)}.</p><p class="why-not">Counting the symbols without using the key gives a number that is far too small. Counting a half symbol as a whole one, or giving only ${rows[i][0]}’s amount (${a * key}), are the other common slips.</p>` };
  });

  gen("jug", "maths", 1, "Measurement & scales", R => {
    const [major, minor] = R.pick([[100, 2], [100, 4], [200, 4], [100, 5], [200, 2], [500, 5]]), small = major / minor, max = major * 5;
    const base = major * R.int(2, 4), t = R.int(1, minor - 1), level = base + t * small;
    const p = R.pick([small, 2 * small, major, major + small].filter(v => v < level - small));
    const who = R.pick(NAMES), liquid = R.pick(["juice", "milk", "water", "soup"]);
    const o = opts(R, level - p, [level, base + t * 10 - p, base - p, base + major - p, level + p], v => v + " mL", 5, small);
    const spec = { max, major, minor, level, unit: "mL", color: liquid === "milk" ? "#dfe7f5" : liquid === "water" ? "#8fd3ff" : "#f6c453" };
    return { ...o, data: { major, minor, level, p },
      stem: `<p>The jug shows how much ${liquid} ${who} has.</p>${fig(`<svg viewBox="0 0 200 262" width="200" role="img" aria-label="${jugAria({ ...spec, title: "A measuring jug" })}">${jugSvg(spec)}</svg>`)}<p>${who} pours out ${B(p + " mL")}. How much ${liquid} is left in the jug?</p>`,
      explain: `<p>From one label to the next is ${major} mL, split into ${minor} equal steps, so each small step is ${major} ÷ ${minor} = ${small} mL.</p><p>The ${liquid} is ${t} small step${t === 1 ? "" : "s"} above ${base} mL: ${base} + ${t * small} = ${level} mL. After pouring: ${level} − ${p} = ${B(level - p + " mL")}.</p><p class="why-not">${level} mL is the amount before pouring. Reading only the nearest label (${base} or ${base + major}), or counting each small mark as 10 mL when it is not, gives the other wrong answers.</p>` };
  });

  gen("endtime", "maths", 1, "Time & timetables", R => {
    const c = R.pick([["A film", "starts", "runs for", "finish"], ["A train", "leaves", "travels for", "arrive"], ["A swimming carnival", "starts", "lasts", "finish"], ["A bushwalk", "starts", "takes", "end"]]);
    const sm = R.pick([30, 35, 40, 45, 50, 55]), start = R.int(8, 16) * 60 + sm, h = R.int(1, 2), m = R.pick([15, 20, 25, 30, 35, 40, 45, 50].filter(v => v + sm >= 65));
    const correct = start + h * 60 + m;
    const o = opts(R, correct, [correct - 60, start + m, start + h * 60, correct + 60], clock, 5, 10);
    return { ...o, data: { start, h, m },
      stem: `<p>${c[0]} ${c[1]} at ${B(clock(start))} and ${c[2]} ${B(`${h} hour${h > 1 ? "s" : ""} ${m} minutes`)}.</p><p>What time does it ${c[3]}?</p>`,
      explain: `<p>Add the hours first: ${clock(start)} + ${h} hour${h > 1 ? "s" : ""} = ${clock(start + h * 60)}.</p><p>Then the minutes: ${60 - sm} minutes takes you to ${clock(start + h * 60 + 60 - sm)}, and the other ${m - (60 - sm)} minutes makes ${B(clock(correct))}.</p><p class="why-not">${clock(correct - 60)} forgets that the minutes go past the hour. ${clock(start + m)} forgets the hour${h > 1 ? "s" : ""}, and ${clock(start + h * 60)} forgets the minutes.</p>` };
  });

  gen("change", "maths", 1, "Money & best value", R => {
    const shop = R.pick([["a pen", "a ruler", "a notebook"], ["a drink", "a muffin", "an apple"], ["a comic", "a sticker sheet", "a bookmark"], ["a bun", "a juice", "a yoghurt"]]);
    const n = R.int(2, 3), who = R.pick(NAMES);
    let prices, total, note;
    do { prices = Array.from({ length: n }, () => R.int(24, 139) * 5); total = sum(prices); note = total < 900 ? 1000 : 2000; } while (total > 1800 || prices.some(p => p % 100 === 0) || total % 100 === 0);

    return { ...o, data: { prices, note },
      stem: `<p>${who} buys ${list(prices.map((p, k) => `${shop[k]} for ${B(money(p))}`))}.</p><p>${who} pays with a ${B("$" + note / 100 + " note")}. How much change does ${who} get?</p>`,
      explain: `<p>Add the prices: ${prices.map(money).join(" + ")} = ${money(total)}.</p><p>Change: ${money(note)} − ${money(total)} = ${B(money(correct))}.</p><p class="why-not">${money(total)} is what was spent, not the change. ${money(correct + 100)} comes from a slip when taking away the dollars, and ${money(note - prices[0])} leaves out part of the shopping.</p>` };
  });

  gen("missing", "maths", 1, "Number & place value", R => {
    const form = R.int(1, 3), a = R.int(12, 48), c = R.int(6, 25);

    else if (form === 2) { b = R.int(20, 60); correct = a + b + c; line = `☐ − ${a} = ${b} + ${c}`; wrongs = [b + c - a, b + c, a + b, correct + 10]; how = `The right-hand side is ${b} + ${c} = ${b + c}. So ☐ − ${a} = ${b + c}, and ☐ = ${b + c} + ${a} = ${B(correct)}.`; }
    else { b = a + c + R.int(11, 40); correct = b - a - c; line = `${b} − ☐ = ${a} + ${c}`; wrongs = [a + c, b + a + c, b - a, b - c]; how = `The right-hand side is ${a} + ${c} = ${a + c}. So ${b} − ☐ = ${a + c}, and ☐ = ${b} − ${a + c} = ${B(correct)}.`; }

      explain: `<p>Both sides of the equals sign must be worth the same. ${how}</p><p class="why-not">The other answers come from working out only one side, or from adding where you should subtract (or the other way round). Check by putting your number back in the box.</p>` };

  gen("bar", "maths", 1, "Graphs & data", R => {
    const c = R.pick([
      { labels: ["Red", "Blue", "Green", "Gold"], y: "House points", q: (a, b, d) => `How many more points do ${B(a)} and ${B(b)} have ${B("together")} than ${B(d)}?`, col: "#ffa94d" },
      { labels: ["Apple", "Pear", "Plum", "Fig"], y: "Trees in the orchard", q: (a, b, d) => `How many more ${B(a.toLowerCase())} and ${B(b.toLowerCase())} trees are there ${B("altogether")} than ${B(d.toLowerCase())} trees?`, col: "#69db7c" },
      { labels: ["Bus", "Car", "Bike", "Train"], y: "Children", q: (a, b, d) => `How many more children travel by ${B(a.toLowerCase())} or ${B(b.toLowerCase())} than by ${B(d.toLowerCase())}?`, col: "#4dabf7" },
    ]);

      explain: `<p>The lines go up in ${step}s, so a column that stops halfway between two lines is ${step / 2} more than the lower line.</p><p>${c.labels[i]} = ${v[i]}, ${c.labels[j]} = ${v[j]}, ${c.labels[k]} = ${v[k]}. Together ${v[i]} + ${v[j]} = ${v[i] + v[j]}, and ${v[i] + v[j]} − ${v[k]} = ${B(correct)}.</p><p class="why-not">${v[i] + v[j]} is only the first step: the question asks how many <i>more</i>. Reading a halfway column as if it stopped on the line below gives a different wrong answer.</p>` };
  });

  gen("tabletotal", "maths", 1, "Graphs & data", R => {

  });

  gen("dot", "maths", 2, "Graphs & data", R => {
    const c = R.pick([["goals scored in a shoot-out", "Goals scored", "scored"], ["books read in the holidays", "Books read", "read"], ["pets at home", "Number of pets", "have"], ["laps swum at the carnival", "Laps swum", "swam"]]);
    let counts; do { counts = Array.from({ length: 7 }, () => R.int(0, 5)); } while (sum(counts) < 14 || sum(counts) > 24 || counts.filter(x => x === 0).length > 1);

    const slip = type === "more than" ? cnt(v => v >= k) : type === "fewer than" ? cnt(v => v <= k) : cnt(v => v > k);
    const cols = type === "more than" ? 6 - k : type === "fewer than" ? k : 7 - k;
    const o = opts(R, correct, [slip, counts[k], sum(counts) - correct, cols]);
    const which = type === "more than" ? `${k + 1} or more` : type === "fewer than" ? `${k - 1} or fewer` : `${k} or more`;
    return { ...o, data: { counts, type, k },
      stem: `<p>Some children were asked about ${c[0]}. Each dot is one child.</p>${dotPlot({ counts, label: c[1], aria: `A dot plot. ${counts.map((n, v) => `${v}: ${n} dot${n === 1 ? "" : "s"}`).join(". ")}.` })}<p>How many children ${c[2]} ${B(type + " " + k)}?</p>`,
      explain: `<p>“${type[0].toUpperCase() + type.slice(1)} ${k}” means ${which}. Count the dots above those numbers only: ${counts.map((n, v) => [n, v]).filter(([n, v]) => type === "more than" ? v > k : type === "fewer than" ? v < k : v >= k).map(([n]) => n).join(" + ")} = ${B(correct)}.</p><p class="why-not">${slip} ${type === "at least" ? "leaves out" : "wrongly includes"} the dots above ${k} itself. ${counts[k]} is only the dots above ${k}. ${cols} counts the numbers along the bottom, not the children.</p>` };
  });

    /* ===================== circle 1 ===================== */
    { id: "m101", tier: 1, cat: "Number & place value",
      stem: `<p>What is <b>4 052 − 300</b>?</p>`,
      options: ["3 752", "3 952", "4 022", "4 049", "4 352"], answer: 0,
      explain: `<p>300 is 3 hundreds, but 4 052 has no hundreds to take them from. So break a thousand into 10 hundreds: 4 052 is 40 hundreds and 52. Then 40 hundreds − 3 hundreds = 37 hundreds, which gives <b>3 752</b>.</p><p class="why-not">4 022 takes away 30 and 4 049 takes away 3: the 3 is in the wrong place. 4 352 adds instead of subtracting. 3 952 trades the thousand but takes away only one hundred.</p>` },
    { id: "m102", tier: 1, cat: "Fractions",
      stem: `<p>A block of chocolate has <b>20</b> squares. Ned eats <b>one quarter</b> of the block. Then his mum eats <b>3</b> squares.</p><p>How many squares are left?</p>`,
      options: ["10", "12", "13", "15", "17"], answer: 1,
      explain: `<p>One quarter of 20 is 20 ÷ 4 = 5 squares. After Ned: 20 − 5 = 15. After Mum: 15 − 3 = <b>12</b>.</p><p class="why-not">15 forgets Mum’s squares and 17 forgets Ned’s. 13 treats “one quarter” as 4 squares. A quarter means the block is split into 4 equal parts, and each part is 5 squares.</p>` },
    { id: "m103", tier: 1, cat: "Measurement & scales",
      stem: `<p>The minute hand of a clock turns from <b>2:00 pm</b> to <b>2:45 pm</b>.</p><p>How many <b>right angles</b> does the minute hand turn through?</p>`,

      explain: `<p>A full turn of the minute hand takes 60 minutes and is 4 right angles. So every 15 minutes is one right angle (a quarter turn). 45 minutes is 3 lots of 15: <b>3</b> right angles.</p><p class="why-not">4 would be a whole hour. 9 is the number the hand points to at the end, not the amount of turning.</p>` },
    { id: "m104", tier: 1, cat: "Measurement & scales",
      stem: `<p>A bag holds <b>350 g</b> of rice.</p><p>How much more rice is needed to make exactly <b>one and a half kilograms</b>?</p>`,

      explain: `<p>One kilogram is 1 000 g, so one and a half kilograms is 1 500 g. 1 500 − 350 = <b>1 150 g</b>.</p><p class="why-not">650 g only reaches one kilogram and 150 g only reaches half a kilogram. 1 850 g adds the 350 g instead of taking it away.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "m201", tier: 2, cat: "Chance & counting",
      stem: `<p>This spinner has eight equal sections.</p>${SPINNER}<p>Here are three statements about one spin.</p><div class="box">1. Red is the most likely colour.<br>2. Landing on blue is just as likely as landing on green.<br>3. It is impossible for the spinner to land on yellow.</div><p>Which statements are <b>correct</b>?</p>`,
      options: ["1 only", "2 only", "1 and 2 only", "1 and 3 only", "1, 2 and 3"], answer: 2,
      explain: `<p>Count the sections: red 3, blue 2, green 2, yellow 1.</p><p>1 is correct: red has the most sections. 2 is correct: blue and green have 2 each. 3 is wrong: yellow is the <i>least likely</i> colour, but it has a section, so it can happen.</p><p>So the answer is <b>1 and 2 only</b>.</p><p class="why-not">“Unlikely” is not the same as “impossible”. Impossible would mean no yellow section at all.</p>` },
    { id: "m202", tier: 2, cat: "Chance & counting",
      stem: `<p>A lunch deal lets you pick <b>one</b> sandwich, <b>one</b> drink and <b>one</b> piece of fruit.</p><p>There are 4 kinds of sandwich, 3 kinds of drink and 2 kinds of fruit.</p><p>How many different lunches can be made?</p>`,

      explain: `<p>Each sandwich can go with each of the 3 drinks: 4 × 3 = 12 pairs. Each pair can go with either fruit: 12 × 2 = <b>24</b>.</p><p class="why-not">9 adds the numbers instead of multiplying. 12 forgets the fruit. 14 multiplies the first two and then adds the fruit.</p>` },
    { id: "m203", tier: 2, cat: "Area, perimeter & 3D", visual: true,
      stem: `<p>A line of symmetry splits a shape into two halves that are mirror images of each other.</p><p>Which of these letters has exactly <b>two</b> lines of symmetry?</p>`,

      explain: `<p>The letter <b>H</b> can be folded in half top to bottom, and also left to right. That is two lines of symmetry.</p><p class="why-not">A and T each have only one (a line straight down the middle). N and Z have none: they look the same after a half turn, but turning is not folding. Fold either of them and the halves do not match.</p>` },
    { id: "m204", tier: 2, cat: "Patterns & sequences",
      stem: `<p>In a number pattern, each number is found by <b>doubling</b> the number before it and then <b>subtracting 4</b>.</p><p>The <b>fourth</b> number in the pattern is 36.</p><p>What is the <b>first</b> number?</p>`,
      options: ["8", "10", "12", "20", "68"], answer: 0,
      explain: `<p>Work backwards: undo “subtract 4” by adding 4, then undo “double” by halving.</p><p>Third number: (36 + 4) ÷ 2 = 20. Second: (20 + 4) ÷ 2 = 12. First: (12 + 4) ÷ 2 = <b>8</b>.</p><p>Check forwards: 8, 12, 20, 36.</p><p class="why-not">20 and 12 stop too early (they are the third and second numbers). 68 goes forwards from 36 instead of backwards.</p>` },
    { id: "m205", tier: 2, cat: "Area, perimeter & 3D",
      stem: `<p>A solid shape has <b>5 faces</b>: one square and four triangles. The four triangles meet at a point.</p><p>How many <b>edges</b> does the shape have?</p>`,
      options: ["5", "6", "8", "12", "16"], answer: 2,
      explain: `<p>The shape is a square-based pyramid. The square base has 4 edges, and 4 more edges run from the corners of the base up to the point: 4 + 4 = <b>8</b>.</p><p class="why-not">5 is the number of faces (and also the number of corners). 16 counts 4 edges for the square and 3 for every triangle, but each edge is shared by two faces, so that counts every edge twice. 12 counts the triangles’ edges only.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "m301", tier: 3, cat: "Money & best value",
      stem: `<p>Ella has only <b>20c</b> and <b>50c</b> coins in her purse. She has <b>9 coins</b> altogether, and they are worth exactly <b>$3.00</b>.</p><p>How many 50c coins does Ella have?</p>`,
      options: ["3", "4", "5", "6", "7"], answer: 1,
      explain: `<p>Suppose all 9 coins were 20c: that is $1.80, which is $1.20 short. Each time a 20c coin is swapped for a 50c coin, the total goes up by 30c. $1.20 ÷ 30c = 4 swaps, so there are <b>4</b> fifty-cent coins.</p><p>Check: 4 × 50c = $2.00 and 5 × 20c = $1.00, which makes $3.00 with 9 coins.</p><p class="why-not">5 is the number of 20c coins. 6 fifty-cent coins already make $3.00, but that is only 6 coins, not 9.</p>` },
    { id: "m302", tier: 3, cat: "Fractions",
      stem: `<p>A frog sits at <b>0</b> on a number line. Every jump takes it exactly ${frac(3, 4)} of a unit forward.</p><p>How many jumps does the frog need to get <b>past 5</b>?</p>`,
      options: ["5", "6", "7", "8", "9"], answer: 2,

    { id: "m303", tier: 3, cat: "Area, perimeter & 3D",
      stem: `<p>Six identical square tiles are joined to make this rectangle. The perimeter of <b>one tile</b> is <b>20 cm</b>.</p>${TILES}<p>What is the perimeter of the rectangle?</p>`,
      options: ["25 cm", "30 cm", "50 cm", "120 cm", "150 cm"], answer: 2,
      explain: `<p>A square has 4 equal sides, so each tile’s side is 20 ÷ 4 = 5 cm. The rectangle is 3 tiles long (15 cm) and 2 tiles wide (10 cm).</p><p>Perimeter: 15 + 10 + 15 + 10 = <b>50 cm</b>.</p><p class="why-not">120 cm is 6 × 20: it counts the sides where tiles touch, and those are inside the rectangle, not on its edge. 150 is the area in square centimetres. 25 cm adds only two of the four sides.</p>` },
    { id: "m304", tier: 3, cat: "Time & timetables",
      stem: `<p>School camp starts on <b>9 March</b>. Permission notes must be handed in exactly <b>three weeks</b> before camp starts.</p><p>It is not a leap year, so February has 28 days.</p><p>On what date must the notes be handed in?</p>`,
      options: ["15 February", "16 February", "17 February", "18 February", "19 February"], answer: 1,
      explain: `<p>Three weeks is 21 days. Going back 9 days from 9 March reaches the last day of February (28 February). There are 21 − 9 = 12 more days to go back: 28 − 12 = <b>16 February</b>.</p><p>Check: 16 February + 12 days = 28 February, + 9 more days = 9 March.</p><p class="why-not">17 February would be right in a leap year. 18 and 19 February come from giving February 30 or 31 days.</p>` },
    { id: "m305", tier: 3, cat: "Measurement & scales",
      stem: `<p>A full jar of honey weighs <b>900 g</b>. When exactly <b>half</b> of the honey has been used, the jar and the honey left in it weigh <b>550 g</b>.</p><p>How much does the empty jar weigh?</p>`,
      options: ["200 g", "350 g", "450 g", "550 g", "700 g"], answer: 0,
      explain: `<p>The weight dropped by 900 − 550 = 350 g, and that was half the honey. So all the honey weighs 700 g, and the jar weighs 900 − 700 = <b>200 g</b>.</p><p class="why-not">350 g is half the honey and 700 g is all the honey: both stop before finding the jar. 450 g just halves 900, as if the jar were made of honey too.</p>` },

    /* ===================== the boss ===================== */
    { id: "m401", tier: 4, cat: "Rates",
      stem: `<p>At a fair, prizes are swapped for tickets.</p><div class="box">4 blue tickets are worth the same as 6 red tickets.<br>9 red tickets are worth the same as 2 gold tickets.</div><p>How many <b>blue</b> tickets are worth the same as <b>4 gold</b> tickets?</p>`,
      options: ["12", "16", "18", "24", "27"], answer: 0,
      explain: `<p>Go through red. 2 gold = 9 red, so 4 gold = 18 red.</p><p>6 red = 4 blue, and 18 red is 3 lots of 6 red, so it is worth 3 × 4 = <b>12</b> blue.</p><p class="why-not">18 stops at red tickets. 27 turns red into blue the wrong way round (18 red is worth fewer blue tickets, not more). 16 and 24 come from multiplying the numbers in the box without matching up the colours.</p>` },
    { id: "m402", tier: 4, cat: "Number & place value",
      stem: `<p>Ana is <b>4 years older</b> than Ben. Ben is <b>twice as old</b> as Cara. The three children’s ages add up to <b>34</b>.</p><p>How old is Ana?</p>`,
      options: ["10", "12", "16", "18", "20"], answer: 2,
      explain: `<p>Think of Cara’s age as one block. Ben is two blocks, and Ana is two blocks and 4. Together that is five blocks and 4, which equals 34. So five blocks = 30 and one block = 6.</p><p>Cara is 6, Ben is 12 and Ana is 12 + 4 = <b>16</b>. Check: 6 + 12 + 16 = 34.</p><p class="why-not">12 is Ben’s age: one step short. 10 adds the 4 to Cara’s age instead of Ben’s. 18 and 20 do not give three ages that add up to 34.</p>` },
    { id: "m403", tier: 4, cat: "Area, perimeter & 3D",
      stem: `<p>A rectangle is 12 cm long and 8 cm wide. A square with sides of 3 cm is cut out of one corner.</p>${NOTCH}<p>What is the <b>perimeter</b> of the shape that is left?</p>`,

      explain: `<p>The rectangle’s perimeter was 12 + 8 + 12 + 8 = 40 cm. Cutting out the corner removes 3 cm from the top edge and 3 cm from the side edge, but it adds two new 3 cm edges inside the notch. What is taken away is put straight back: the perimeter is still <b>40 cm</b>.</p><p>Go round to check: 12 + 5 + 3 + 3 + 9 + 8 = 40.</p><p class="why-not">46 cm adds the two new edges without taking off the two that were lost. 37 cm thinks a smaller shape must have a smaller perimeter. Cutting a corner changes the area (it is now 96 − 9 = 87 cm²), not the distance round.</p>` },
    { id: "m404", tier: 4, cat: "Money & best value",
      stem: `<p>Zed starts saving on a <b>Monday</b>. He puts <b>$2.00</b> in his money box that day. Every day after that he puts in <b>50c more</b> than he did the day before.</p><p>On which day does the total in his money box first become <b>more than $15</b>?</p>`,
      options: ["Wednesday", "Thursday", "Friday", "Saturday", "Sunday"], answer: 3,
      explain: `<p>Keep a running total. Monday $2.00 (total $2.00). Tuesday $2.50 (total $4.50). Wednesday $3.00 (total $7.50). Thursday $3.50 (total $11.00). Friday $4.00 (total $15.00). Saturday $4.50 (total $19.50).</p><p>On Friday the total is exactly $15, which is not <i>more than</i> $15. It first passes $15 on <b>Saturday</b>.</p><p class="why-not">Friday is the trap: “more than $15” does not include $15 itself. The earlier days come from adding $2 every day and forgetting the amounts grow.</p>` },

/* ---------------------------------------------------------------
   STORM ISLAND: reading passages (hand-written, all original). Four options (A–D),

(() => {
  const G = n => `<span data-g="${n}" class="gap">(${n}) ______</span>`;
  const gapQ = (id, n, options, answer, explain) => ({ id, gap: n, cat: "Vocabulary & idioms", stem: `<p>Which word fits <b>gap ${n}</b>?</p>`, options, answer, explain });

  READING.push({
    id: "wheel", tier: 1, format: "cloze", title: "At the Wheel",
    note: "Some words are missing from this piece about a first pottery lesson. Choose the word that fits each gap best.",
    html: `<p>I had watched potters at work on television and privately decided that it looked easy. A lump of clay, a spinning wheel, a pair of wet hands: within seconds a bowl would ${G(1)} as if by magic. So when my uncle offered me a lesson in his studio, I accepted without ${G(2)}.</p>
<p>My confidence ${G(3)} about a minute. The clay must sit in the exact centre of the wheel, and mine would not. It wobbled, lurched sideways and finally flew off, landing on the floor with a slap. My uncle said nothing. He simply handed me another lump.</p>
<p>By the fourth attempt I had learned to keep my elbows tucked in and my hands still, letting the wheel do the work. Slowly, a wall of clay began to rise between my fingers. I was so ${G(4)} in watching it grow that I forgot to breathe. Then I pressed a fraction too hard, and the whole thing folded in on itself like a tired balloon.</p>
<p>I expected to feel ${G(5)}. Instead I found myself laughing, and reaching for the clay again. The bowl I finally took home is thick, lopsided and far from perfect, yet I would not ${G(6)} it for the finest one in my uncle’s shop.</p>`,
    questions: [
      gapQ("r1a", 1, ["arrive", "emerge", "happen", "result"], 1, `<p>A bowl slowly appears out of a shapeless lump, so it would <b>emerge</b>: come into view out of something.</p><p class="why-not">A bowl does not “arrive” (it was never travelling) or “happen” (events happen, objects don’t). “Result” would need more words, such as “result from the spinning”.</p>`),
      gapQ("r1b", 2, ["exception", "permission", "interruption", "hesitation"], 3, `<p>To accept “without <b>hesitation</b>” is to say yes at once, without stopping to think. It fits a writer who is sure the job will be easy.</p><p class="why-not">“Without exception” means “every single one”. “Without permission” and “without interruption” are real phrases, but nobody is giving permission or interrupting here.</p>`),
      gapQ("r1c", 3, ["lasted", "stayed", "kept", "continued"], 0, `<p>Something that goes on for a length of time <b>lasts</b> that long: “My confidence lasted about a minute.”</p><p class="why-not">“Stayed” and “kept” need something after them (stayed high, kept going). “Continued” would need “for”: “continued for about a minute”.</p>`),
      gapQ("r1d", 4, ["fascinated", "attracted", "absorbed", "delighted"], 2, `<p>The clue is the little word “in”. You are <b>absorbed in</b> something when it takes all your attention.</p><p class="why-not">The others take different words after them: fascinated <i>by</i>, attracted <i>to</i>, delighted <i>with</i> or <i>by</i>.</p>`),
      gapQ("r1e", 5, ["crushed", "thrilled", "relieved", "amused"], 0, `<p>Read on: “Instead I found myself laughing.” The word “instead” tells us the gap is the opposite of laughing. After watching the bowl collapse, the writer expected to feel <b>crushed</b> (bitterly disappointed).</p><p class="why-not">“Thrilled”, “relieved” and “amused” are all happy feelings, so “instead” would make no sense after them. “Crushed” also echoes what has just happened to the clay.</p>`),
      gapQ("r1f", 6, ["alter", "replace", "convert", "swap"], 3, `<p>You <b>swap</b> one thing <i>for</i> another. The writer means the wobbly bowl is worth more to them than a perfect one.</p><p class="why-not">You replace something <i>with</i> another and convert something <i>into</i> another, so “for” does not fit them. “Alter” means to change a thing a little, not to exchange it.</p>`),
    ],

  /* ============ circle 1: story ============ */
  READING.push({
    id: "biscuit", tier: 1, format: "story", title: "Biscuit",
    note: "Read the story, then answer the questions.",
    html: `<p>The dog arrived in the middle of a thunderstorm, which Mum said was typical of uninvited guests. He was small, the colour of toast, and so wet that he seemed to be made mostly of ears. Arlo found him shivering under the carport and carried him inside wrapped in a beach towel.</p>
<p>“One night,” said Mum. “He belongs to somebody.”</p>
<p>By the third day the dog had a name, Biscuit, a bed made from a washing basket, and a habit of sleeping across Arlo’s feet. Arlo had also put up posters, because Mum made him. He drew them himself. The dog in his drawing was rather larger and fiercer than Biscuit, and the phone number was written in the smallest writing Arlo could manage.</p>
<p>On Saturday the phone rang anyway.</p>
<p>The woman who came to the door was older than Arlo’s grandmother and leaned on a stick. Before she could say a word, Biscuit shot between Arlo’s ankles, skidded on the tiles and flung himself at her knees, making a noise Arlo had never heard from him: a high, wobbling song.</p>
<p>“Pepper,” the woman said. That was all. She lowered herself onto the front step, not seeming to notice that it was still damp, and the dog climbed into her lap as if he were pouring himself into a bowl.</p>
<p>Arlo looked at his own feet. They felt strangely light.</p>
<p>“He likes his ears rubbed,” he said at last. “Sort of backwards. And he’s scared of the vacuum cleaner.”</p>
<p>“He always was,” said the woman, and she smiled at Arlo for the first time. “You’ve looked after him beautifully. I can see that.” She glanced at the washing basket in the hall, then back at him. “I’m only two streets away, you know. Pepper needs walking every afternoon, and my legs aren’t what they were.”</p>
<p>Arlo went to find the lead before she had finished the sentence.</p>`,
    questions: [
      { id: "r2a", cat: "Purpose of a detail", stem: `<p>On Arlo’s posters the dog was “<b>larger and fiercer than Biscuit</b>” and the phone number was in “<b>the smallest writing Arlo could manage</b>”. What do these details show?</p>`,
        options: ["Arlo was not very good at drawing dogs.", "Arlo did not really want the owner to ring.", "Arlo wanted to finish the posters quickly.", "Arlo thought a fierce dog would be noticed."], answer: 1,
        explain: `<p>A picture that doesn’t look like the dog and a number that is hard to read make a poster that is unlikely to work. Arlo did as he was told, but in a way that gave him the best chance of keeping Biscuit: <b>he didn’t want the owner to ring</b>.</p><p class="why-not">The tiny phone number can’t be explained by bad drawing or by hurrying: he made it small on purpose (“the smallest … he could manage”). Wanting the poster noticed is the opposite of what he was up to.</p>` },
      { id: "r2b", cat: "Vocabulary & idioms", stem: `<p>“On Saturday the phone rang <b>anyway</b>.” What does the word “anyway” tell us?</p>`,
        options: ["The telephone often rang on Saturdays.", "Mum had telephoned the owner herself.", "Arlo had been hoping all week that it would ring.", "The call came in spite of what Arlo had done."], answer: 3,
        explain: `<p>“Anyway” means “even so”. Arlo had made the posters as unhelpful as he could, and the owner still found the dog: the call came <b>in spite of</b> what he had done.</p><p class="why-not">Nothing says Mum rang anyone or that Saturdays were busy. Arlo was hoping for the opposite: that the phone would stay silent.</p>` },
      { id: "r2c", cat: "Feelings & inference", stem: `<p>“Arlo looked at his own feet. <b>They felt strangely light.</b>” Why does the writer tell us this?</p>`,
        options: ["Arlo is relieved that the dog has found its owner.", "Arlo has been standing still for too long.", "Arlo already misses the dog that slept on them.", "Arlo wants to run after the old woman."], answer: 2,
        explain: `<p>Earlier we were told the dog had “a habit of sleeping across Arlo’s feet”. Now the dog is in someone else’s lap, and Arlo notices the weight that is gone. The writer shows us he <b>already misses the dog</b> without saying so.</p><p class="why-not">Arlo is not relieved: he tried to stop this happening. The woman has not gone anywhere, so there is nobody to run after.</p>` },
      { id: "r2d", cat: "Comparisons & imagery", stem: `<p>The dog climbed into the woman’s lap “<b>as if he were pouring himself into a bowl</b>”. What does this comparison suggest?</p>`,
        options: ["He settled there easily, as if he belonged.", "He was still dripping wet from the thunderstorm.", "He was hungry and hoping to be fed.", "He was too heavy for her to hold."], answer: 0,
        explain: `<p>Something poured into a bowl flows in and fills the space exactly. The dog fits her lap in the same easy, complete way: this is <b>where he belongs</b>.</p><p class="why-not">The storm was days ago, so he is not wet. The bowl is only a comparison: there is no food in the scene. Nothing suggests he is a burden to her.</p>` },
      { id: "r2e", cat: "Character & structure", stem: `<p>The story ends: “Arlo went to find the lead <b>before she had finished the sentence</b>.” What does this ending show?</p>`,
        options: ["Arlo wanted the woman to leave as quickly as possible.", "Arlo was doing only what Mum expected.", "Arlo wanted to prove the dog was his.", "Arlo understood her offer and leapt at it."], answer: 3,
        explain: `<p>The woman never actually asks. She mentions that she lives close, that the dog needs walking and that her legs are weak, and lets Arlo work it out. He does so at once, and fetching the lead is his “yes”: he <b>understood the offer and leapt at it</b>.</p><p class="why-not">He is not sending her away: the lead is for walks he will be taking. Mum plays no part in this moment, and Arlo has already accepted that the dog is hers by telling her how to look after him.</p>` },
    ],
  });

  /* ============ circle 1: missing sentences ============ */

  const bowerQ = (id, n, answer, explain) => ({ id, gap: n, cat: "Sentence links", stem: `<p>Which sentence fits <b>gap ${n}</b>? (Each sentence is used once only, and one is not used at all.)</p>`, options: BOWER_BANK, answer, explain });
  READING.push({
    id: "bower", tier: 1, format: "missing sentences", title: "The Bird That Collects Blue", bank: true,
    note: "Five sentences have been taken out of this article. Choose the sentence that fits each gap. There is one extra sentence that is not needed.",
    html: `<p>In the forests of eastern Australia lives a bird with an unusual hobby. The male satin bowerbird is a collector, and what he collects is anything blue. ${G(1)} Bottle tops, pegs, drinking straws, pen lids and parrot feathers are all carried off and arranged with great care.</p>
<p>The treasures are laid out in front of his bower, which he builds on the forest floor from hundreds of thin sticks. It has two curved walls standing side by side, with a narrow path between them. ${G(2)} It is more like a stage, built for one purpose only: to impress a visiting female.</p>
<p>When a female arrives, she steps into the path between the walls and watches. The male picks up his best blue objects one at a time, puffs out his feathers and dances, buzzing and whirring like a faulty machine. ${G(3)} If she is not impressed, she simply flies off to inspect the bower of a rival.</p>
<p>Competition between neighbours is fierce. A male with a fine collection must guard it, because other males will raid his bower the moment he leaves. ${G(4)} Some go further and wreck the walls as well, so the owner returns to a pile of sticks.</p>
<p>Nobody is certain why blue is the favourite colour. One idea is that blue things are rare in the forest, so a large collection proves that its owner is clever and hard-working. ${G(5)} Not every male is blue, though. A young male is green and brown, and needs about seven years to grow the glossy blue-black feathers of an adult. Until then he practises, building clumsy bowers that fall down and watching the older birds to see how it is done.</p>`,
    questions: [
      bowerQ("r3a", 1, 3, `<p>The sentence after the gap lists things from very different places: bottle tops, pegs, straws, feathers. That list is the proof of “<b>He is not fussy about where the colour comes from.</b>” “The colour” points back to “anything blue”.</p><p class="why-not">The sentences about the bower, the female and the thieves have nothing to refer to yet: none of them has been mentioned.</p>`),
      bowerQ("r3b", 2, 0, `<p>The walls and the path have just been described, and the next sentence says “It is more like a stage”. More like a stage than what? The missing sentence must say what the bower is <i>not</i>: “<b>Although it is built from sticks, the bower is not a nest…</b>”</p><p class="why-not">“This is why the female builds her nest high in a tree” is about nests too, but nothing before the gap gives a reason, and the “It” that follows would then mean her nest, not the bower.</p>`),
      bowerQ("r3c", 3, 5, `<p>The male has just danced, and the next sentence begins “If she is not impressed”. In between, we need the female judging him: “<b>The female studies the whole performance closely before making up her mind.</b>” “The whole performance” points back to the dance.</p><p class="why-not">The sentence about stealing starts with “They”, but only one male and one female are in this paragraph.</p>`),
      bowerQ("r3d", 4, 1, `<p>“Other males will raid his bower” needs to be followed by what the raiders do. “<b>They steal the brightest pieces…</b>” does that (“They” = the other males), and the next sentence builds on it: “Some go further and wreck the walls <i>as well</i>.”</p><p class="why-not">“As well” only makes sense if stealing has just been mentioned, so no other sentence can go here.</p>`),
      bowerQ("r3e", 5, 4, `<p>“<i>One</i> idea is…” sets up a second idea. “<b>Another is that it matches the colour of the bird himself</b>” supplies it, and leads on to “Not every male is blue, though.”</p><p class="why-not">The sentence left over is “This is why the female builds her nest high in a tree.” It is on the right subject, but nowhere in the article is there a reason for it to follow.</p>`),
    ],
  });

  /* ============ circle 2: poem ============ */
  READING.push({

    note: "Read the poem, then answer the questions.",
    html: `<p class="poem">All summer he has held his arms out wide
as though the field were something he had caught.
His coat belonged to someone’s grandfather;
his hat has never had a single thought.

The crows were frightened for about a day.
Now two of them are sitting on his sleeve,
discussing, in their scratchy way, the weather,
and whether it is time for them to leave.

He does not mind. He has a painted smile
that rain has pulled a little to one side,
and when the wheat is cut and carted off
he goes on guarding nothing, satisfied.

The farmer will forget him until spring.

    questions: [
      { id: "r4a", cat: "Comparisons & imagery", stem: `<p>The scarecrow holds his arms out “<b>as though the field were something he had caught</b>”. What does this make him seem like?</p>`,
        options: ["someone proudly showing off a prize", "someone waving his arms for help", "someone chasing the birds away", "someone who is just about to fall over"], answer: 0,
        explain: `<p>People spread their arms wide to show how big their catch was. The poet pretends the scarecrow’s stiff, outstretched arms are doing the same thing, as if the whole field were <b>his prize</b>.</p><p class="why-not">He is not waving or chasing: he has held the same pose “all summer”. Nothing suggests he is falling.</p>` },
      { id: "r4b", cat: "Purpose of a detail", stem: `<p>Why does the poet say that the scarecrow’s hat “<b>has never had a single thought</b>”?</p>`,
        options: ["to show that the hat is brand new", "to suggest the grandfather was forgetful", "to remind us there is no real head inside it", "to show the scarecrow is bored out in the field"], answer: 2,
        explain: `<p>A hat sits on a head, and a head has thoughts. This hat never has, because there is <b>no real head under it</b>: only straw. It is a gentle joke that reminds us the scarecrow is not alive.</p><p class="why-not">The coat, not the hat, came from a grandfather, and old clothes are not “brand new”. A scarecrow with no thoughts cannot be bored.</p>` },
      { id: "r4c", cat: "Feelings & inference", stem: `<p>In the second verse, two crows sit on the scarecrow’s sleeve “<b>discussing … the weather</b>”. What does this show?</p>`,
        options: ["The crows are planning to steal the wheat.", "The crows are completely at ease with him.", "The crows feel sorry for the scarecrow.", "A storm is on its way to the farm."], answer: 1,
        explain: `<p>Chatting about the weather is what you do when you are relaxed. The crows were “frightened for about a day”, and now they use him as a seat: they are <b>completely at ease</b>.</p><p class="why-not">They are talking about leaving, not stealing. The poem gives the crows no pity for him, and “the weather” is just small talk, not a warning of a storm.</p>` },
      { id: "r4d", cat: "Comparisons & imagery", stem: `<p>“<b>The frost will stitch white buttons on his chest.</b>” What is the poet describing?</p>`,
        options: ["The farmer will mend the old coat during the winter.", "Snow will bury the scarecrow completely.", "Someone will dress him in a new shirt.", "Small white patches of frost will form on him."], answer: 3,
        explain: `<p>Frost can’t sew. The poet imagines it as a tailor, and the “white buttons” are the <b>small round patches of frost</b> that will appear on the front of his coat.</p><p class="why-not">The farmer “will forget him until spring”, so nobody is mending or dressing him. Buttons are small spots, not a covering of snow.</p>` },
      { id: "r4e", cat: "Main idea", stem: `<p>Think about the whole poem. By the end, what has the scarecrow become?</p>`,
        options: ["a failure that the farmer is ashamed of", "a frightening figure once winter arrives", "the opposite of what he was made to be", "a lonely figure who longs to leave the field"], answer: 2,
        explain: `<p>A scarecrow is made to scare birds away. This one frightens them “for about a day”, and the poem ends with him <i>welcoming</i> “every bird that wants a rest”. He has become <b>the opposite of what he was made to be</b>, and “he does not mind”.</p><p class="why-not">The farmer forgets him, which is not the same as being ashamed. He never becomes frightening again, and “patient arms” and a smile do not suggest longing to leave.</p>` },

  /* ============ circle 2: four extracts ============ */

  READING.push({
    id: "trees", tier: 2, format: "four extracts", title: "Trees",
    note: "Read the four extracts about trees. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>The mulberry tree in our backyard was older than the house, and my sisters and I treated it as an extra room. Each of us had her own branch. Mine was the third one up, worn smooth where I sat, and from it I could see over three fences to the railway line. In November we came down with purple hands, purple mouths and purple school shirts, and my mother would sigh and reach for the lemon juice. When the tree came down in a storm, years later, we stood about on the lawn as though someone had died. In a way, someone had.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>A tree keeps a diary, although it has to be cut open before anyone can read it. In places with warm and cold seasons, a tree lays down a new layer of wood beneath its bark every year, and in a sawn trunk these layers show up as rings. Counting them gives the tree’s age. Their width tells a longer story: a broad ring records a year of good rain, while a narrow one marks a year of drought. Scientists no longer need to fell a tree to study it. They drill out a core of wood no thicker than a pencil, and the tree goes on growing.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>“Twenty-nine, thirty. Ready or not!” Somewhere below, Dominic began crashing through the garden. Wren pressed herself against the trunk of the fig and tried to breathe more quietly. She had never climbed this high. The ground looked a long way down, and rather hard. Dominic checked the shed, the water tank and the wheelie bins. He stood directly beneath her, hands on hips, and announced to nobody that she must have gone home. Wren grinned. Then she looked for the branch she had used to get up, and found that, from above, every branch looked exactly the same.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>The council plans to remove the plane trees from Station Street because their roots are lifting the footpath. I would ask the councillors to walk down that street at noon in January before they vote. Under the trees it is cool enough to stop and talk; beyond them, the pavement shimmers. A cracked footpath can be repaired in a week. A sixty-year-old tree cannot be replaced in a lifetime. By all means fix the path. But let us mend what is broken without destroying what is not.</p></div>`,
    questions: [
      exQ("r5a", "Feelings & inference", "shows somebody whose success leads straight to a new problem", 2, `<p>In <b>Extract C</b> Wren hides so well that Dominic gives up. She grins, and then finds she cannot tell which branch leads down. Winning the game is what has left her stuck.</p><p class="why-not">In D the problem (the footpath) has not been solved yet. The storm in A is a loss, not something caused by a success. B describes a method, not a person in trouble.</p>`),
      exQ("r5b", "Comparisons & imagery", "compares a natural thing to a written record", 1, `<p><b>Extract B</b> begins “A tree keeps a diary” and carries the idea on: the rings can be “read” and they “tell a longer story”. The rings are being compared to writing.</p><p class="why-not">Extract A compares the tree to “an extra room”, which is a place, not a record. C and D describe their trees plainly.</p>`),
      exQ("r5c", "Tone & attitude", "describes a loss that was felt like the loss of a person", 0, `<p>In <b>Extract A</b>, when the mulberry falls the family stands about “as though someone had died. In a way, someone had.” The tree had been part of the family.</p><p class="why-not">The writer of D fears losing trees, but they are still standing, and the argument is about shade, not grief. Nothing is lost in B or C.</p>`),
      exQ("r5d", "Main idea", "argues that one thing can be fixed without ruining another", 3, `<p><b>Extract D</b> ends: “let us mend what is broken without destroying what is not.” The writer wants the footpath repaired <i>and</i> the trees kept.</p><p class="why-not">Extract B also mentions not harming a tree, but it is explaining what scientists do, not arguing for what should be done.</p>`),
      exQ("r5e", "Purpose of a detail", "explains how something is now studied without being destroyed", 1, `<p><b>Extract B</b>: “Scientists no longer need to fell a tree to study it. They drill out a core of wood no thicker than a pencil, and the tree goes on growing.”</p><p class="why-not">Extract D is about saving trees too, but it is about a street, not about studying anything. A and C are a memory and a story.</p>`),

  /* ============ circle 2: cloze ============ */
  READING.push({
    id: "stamps", tier: 2, format: "cloze", title: "The Stamp Album",
    note: "Some words are missing from this piece. Choose the word that fits each gap best.",
    html: `<p>When my grandfather died he left me his stamp album, a fat green book that smelled of dust and peppermints. I am ${G(1)} to say that I was not at all grateful. I was eleven, and I had been hoping for his telescope.</p>
<p>For months the album sat ${G(2)} on my shelf. Then, one wet Sunday, with nothing better to do, I opened it. Every page was ruled in pencil, and every stamp sat squarely in its place above a line of tiny, careful handwriting: the country, the year, and often a note about how he had ${G(3)} it. “Swapped with a sailor, 1958.” “From Aunt Vera’s letter, the one with the bad news.”</p>
<p>I had assumed that a collection was simply a heap of things. This was a life, sorted and labelled. I turned the pages more and more slowly, ${G(4)} to reach the end.</p>
<p>On the last page there were six empty squares, and a line in his handwriting that I have never forgotten: “For whoever comes next.” I went out the following Saturday and bought my first stamp. It was a common one, worth almost nothing, but I ruled the line beneath it as ${G(5)} as I could.</p>`,
    questions: [
      gapQ("r6a", 1, ["ashamed", "embarrassing", "guilty", "shy"], 0, `<p>“I am <b>ashamed</b> to say” is the set phrase for admitting something you are not proud of.</p><p class="why-not">“Embarrassing” describes a thing, not a person’s feeling: the writer would be <i>embarrassed</i>. “Guilty” and “shy” are not followed by “to say”.</p>`),
      gapQ("r6b", 2, ["unaware", "unharmed", "untouched", "unknown"], 2, `<p>Nobody opened the album for months: it sat <b>untouched</b>.</p><p class="why-not">“Unaware” describes a person who does not know something, not a book. “Unharmed” would mean something had threatened it. “Unknown” is wrong because the writer knew exactly where it was.</p>`),
      gapQ("r6c", 3, ["required", "acquired", "inquired", "achieved"], 1, `<p>To <b>acquire</b> something is to come to own it. The notes say how each stamp was got: swapped, or taken from a letter.</p><p class="why-not">The look-alikes mean different things: “required” is needed and “inquired” is asked. You achieve a goal, not an object.</p>`),
      gapQ("r6d", 4, ["impatient", "resistant", "incapable", "reluctant"], 3, `<p>The writer turns the pages “more and more slowly”. You slow down when you do not want something to finish: <b>reluctant</b> to reach the end.</p><p class="why-not">“Impatient to reach the end” is good English, but an impatient reader speeds up. “Resistant” is followed by “to” and a thing (resistant to change), and “incapable” by “of”.</p>`),
      gapQ("r6e", 5, ["quickly", "carefully", "cheaply", "boldly"], 1, `<p>Look back at how the grandfather worked: every page “ruled in pencil”, with “tiny, careful handwriting”. The writer has taken up his place (“whoever comes next”) and copies his way of doing things: as <b>carefully</b> as possible.</p><p class="why-not">The stamp was cheap, but a line can’t be ruled “cheaply”. “Quickly” and “boldly” are the opposite of the patient, exact work the album has taught the writer to admire.</p>`),
