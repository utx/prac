    { id: "n201", tier: 2, cat: "Fractions",
      stem: `<p>A box holds <b>24 pencils</b>. One third of them are red and one quarter are blue. The rest are green.</p><p>How many pencils are green?</p>`,
      options: ["7", "10", "12", "14", "17"], answer: 1,
      explain: `<p>Red: 24 ÷ 3 = 8. Blue: 24 ÷ 4 = 6. Green: 24 − 8 − 6 = <b>10</b>.</p><p class="why-not">12 takes the rest as half. 17 subtracts 3 and 4 instead of the fractions of 24. 14 forgets one of the colours.</p>` },
    { id: "n202", tier: 2, cat: "Area, perimeter & 3D",
      stem: `<p>A square-based pyramid is glued on top of a cube so that the pyramid’s base fits exactly over the top of the cube.</p><p>How many <b>faces</b> does the new solid have?</p>`,
      options: ["8", "9", "10", "11", "12"], answer: 1,
      explain: `<p>The cube has 6 faces and the pyramid has 5. When they are glued, the top of the cube and the base of the pyramid are hidden inside: 6 + 5 − 2 = <b>9</b>.</p><p>Check by counting: the cube’s bottom and 4 sides, plus the pyramid’s 4 triangles, is 9.</p><p class="why-not">11 just adds the two solids. 10 takes away only one of the glued faces, but both are hidden.</p>` },
    { id: "n203", tier: 2, cat: "Chance & counting",
      stem: `<p>A bag holds <b>4 red</b>, <b>4 blue</b> and <b>2 green</b> counters. Lee takes one without looking.</p><div class="box">1. Red and blue are equally likely.<br>2. Green is more likely than blue.<br>3. It is impossible to take a yellow counter.</div><p>Which statements are <b>correct</b>?</p>`,
      options: ["1 only", "3 only", "1 and 2 only", "1 and 3 only", "1, 2 and 3"], answer: 3,
      explain: `<p>1 is correct: there are 4 red and 4 blue. 2 is wrong: there are fewer green (2) than blue (4), so green is less likely. 3 is correct: there are no yellow counters. So <b>1 and 3 only</b>.</p><p class="why-not">Statement 2 has the comparison the wrong way round, so any answer that includes 2 is wrong.</p>` },
    { id: "n204", tier: 2, cat: "Patterns & sequences",
      stem: `<p>Matchsticks are used to make a row of squares. One square needs 4 matchsticks, two squares in a row need 7, and three need 10.</p><p>How many matchsticks are needed for a row of <b>12 squares</b>?</p>`,
      options: ["34", "36", "37", "40", "48"], answer: 2,
      explain: `<p>The first square needs 4 matchsticks. Every square after that shares a side with the one before, so it needs only 3 more: 4 + 11 × 3 = <b>37</b>.</p><p class="why-not">48 = 12 × 4 forgets that the squares share sides. 36 = 12 × 3 forgets the extra matchstick at the start.</p>` },
    { id: "n205", tier: 2, cat: "Measurement & scales",
      stem: `<p>What is the angle between the hour hand and the minute hand of a clock at exactly <b>4:00</b>?</p>`,
      options: ["90°", "100°", "120°", "140°", "160°"], answer: 2,
      explain: `<p>A full turn is 360° and the 12 numbers split it into 12 equal parts of 30°. At 4:00 the hands point at 12 and 4, four parts apart: 4 × 30° = <b>120°</b>.</p><p class="why-not">90° is a quarter turn (3:00). 100° and 140° come from using 25° or 35° for each step between numbers.</p>` },

    { id: "n206", tier: 2, cat: "Graphs & data",
      stem: colGraph({ labels: ["Mar", "Apr", "May", "Jun"], series: [{ name: "", color: "#69db7c", values: [15, 10, 25, 20] }], max: 30, step: 5, ylabel: "Books read",
        aria: "A column graph of books read each month. The scale goes 0, 5, 10, 15, 20, 25, 30. March reaches 15, April 10, May 25 and June 20." }) + `<p>How many more books were read in the <b>two busiest</b> months together than in the <b>two quietest</b> months together?</p>`,
      options: ["5", "10", "15", "20", "45"], answer: 3,
      explain: `<p>Read each column: March 15, April 10, May 25, June 20. Busiest two: May and June, 25 + 20 = 45. Quietest two: March and April, 15 + 10 = 25. Difference: 45 − 25 = <b>20</b>.</p><p class="why-not">45 stops after adding the busiest months. 15 compares only the busiest and quietest single months (25 − 10).</p>` },
    { id: "n207", tier: 2, cat: "Time & timetables",
      stem: `<p>Ferries run from City Wharf to Palm Isle.</p>${tbl(["", "Ferry 1", "Ferry 2", "Ferry 3", "Ferry 4"], [["City Wharf", "9:15 am", "10:05 am", "10:45 am", "11:25 am"], ["Palm Isle", "9:50 am", "10:40 am", "11:20 am", "12:00 pm"]])}<p>Zoe reaches City Wharf at <b>10:20 am</b> and takes the next ferry. How long is it from when she reaches the wharf until she arrives at Palm Isle?</p>`,
      options: ["1 hour", "25 minutes", "35 minutes", "55 minutes", "1 hour 20 minutes"], answer: 0,
      explain: `<p>Ferry 2 left at 10:05, before Zoe arrived. The next is Ferry 3 at 10:45, which reaches Palm Isle at 11:20. From 10:20 to 11:20 is <b>1 hour</b> (25 minutes waiting and 35 minutes on the ferry).</p><p class="why-not">35 minutes is only the trip and 25 minutes only the wait. 1 hour 20 minutes would mean taking Ferry 4.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "n301", tier: 3, cat: "Area, perimeter & 3D",
      stem: `<p>The six faces of a cube have a total area of <b>54 cm²</b>.</p><p>How long is one edge of the cube?</p>`,
      options: ["3 cm", "4.5 cm", "6 cm", "9 cm", "27 cm"], answer: 0,
      explain: `<p>The 6 faces are equal squares, so one face is 54 ÷ 6 = 9 cm². A square of 9 cm² has sides of <b>3 cm</b>, because 3 × 3 = 9.</p><p class="why-not">9 cm is the area of one face, not its side. 4.5 cm halves the area instead of finding the square root. 27 cm halves 54.</p>` },
    { id: "n302", tier: 3, cat: "Rates",
      stem: `<p>Three taps, all running together, fill a tub in <b>12 minutes</b>.</p><p>How long would <b>four</b> taps, running at the same rate, take to fill it?</p>`,
      options: ["8 minutes", "9 minutes", "11 minutes", "13 minutes", "16 minutes"], answer: 1,
      explain: `<p>One tap alone would take 3 × 12 = 36 minutes. Four taps share the job: 36 ÷ 4 = <b>9 minutes</b>.</p><p class="why-not">16 minutes thinks more taps take longer. 13 and 11 just add or take away one minute for one tap.</p>` },
    { id: "n303", tier: 3, cat: "Number & place value",
      stem: `<p>Three numbers in a row (like 5, 6, 7) add up to <b>72</b>.</p><p>What is the <b>largest</b> of the three?</p>`,
      options: ["23", "24", "25", "26", "36"], answer: 2,
      explain: `<p>The middle number is 72 ÷ 3 = 24, so the numbers are 23, 24 and 25. The largest is <b>25</b>.</p><p class="why-not">24 is the middle number and 23 the smallest. 36 is half of 72, which would be two numbers, not three.</p>` },
    { id: "n304", tier: 3, cat: "Chance & counting",
      stem: `<p>At a bike shop you choose one bike, one helmet and one bell. There are <b>3 bikes</b>, <b>2 helmets</b> and <b>5 bells</b>.</p><p>How many different sets can you choose?</p>`,
      options: ["10", "11", "15", "30", "60"], answer: 3,
      explain: `<p>Each bike can go with either helmet: 3 × 2 = 6 pairs. Each pair can go with any of 5 bells: 6 × 5 = <b>30</b>.</p><p class="why-not">11 adds instead of multiplying. 15 forgets the helmets, and 10 forgets the bikes.</p>` },
    { id: "n305", tier: 3, cat: "Money & best value",
      stem: `<p>The same juice is sold in five sizes.</p><p>Which is the <b>cheapest for each litre</b>?</p>`,
      options: ["250 mL for $0.65", "500 mL for $1.30", "1 L for $2.40", "2 L for $4.60", "3 L for $6.60"], answer: 4,
      explain: `<p>Work out the price of 1 litre each time. 250 mL × 4: $2.60. 500 mL × 2: $2.60. 1 L: $2.40. 2 L ÷ 2: $2.30. 3 L ÷ 3: $2.20. The cheapest is <b>3 L for $6.60</b>.</p><p class="why-not">The 250 mL bottle has the smallest price tag, but you get very little juice. A bigger size isn’t always better value, so you have to work each one out.</p>` },

    { id: "n306", tier: 3, cat: "Graphs & data",
      stem: `<p>The graph shows the temperature on one day.</p>${LINE}<p>Between which two times <b>next to each other</b> did the temperature rise the most?</p>`,
      options: ["6 am and 9 am", "9 am and 12 pm", "12 pm and 3 pm", "3 pm and 6 pm", "It rose the same each time"], answer: 1,
      explain: `<p>Read each point (the lines are 2 degrees apart): 8, 14, 22, 24, 18. The rises are 6 (6 am to 9 am), 8 (9 am to 12 pm) and 2 (12 pm to 3 pm), and then it falls. The biggest rise is <b>between 9 am and 12 pm</b>.</p><p class="why-not">The highest temperature is at 3 pm, but the rise into it is only 2. Between 3 pm and 6 pm the temperature goes down.</p>` },

    /* ===================== the boss ===================== */
    { id: "n401", tier: 4, cat: "Area, perimeter & 3D",
      stem: `<p>A block is made of small cubes: <b>5 long</b>, <b>3 wide</b> and <b>4 high</b>. The whole outside is painted, and then the block is taken apart.</p>${box(5, 3, 4, { u: 26, aria: "A block of small cubes, 5 long, 3 wide and 4 high." })}<p>How many small cubes have <b>no paint at all</b>?</p>`,
      options: ["2", "6", "12", "24", "60"], answer: 1,
      explain: `<p>The unpainted cubes are hidden inside, one layer in from every face. Take one cube off each end of every direction: 5 − 2 = 3 long, 3 − 2 = 1 wide, 4 − 2 = 2 high. That hidden block has 3 × 1 × 2 = <b>6</b> cubes.</p><p class="why-not">60 is every cube. 12 and 24 only take one layer off one side of each direction instead of both.</p>` },
    { id: "n402", tier: 4, cat: "Fractions",
      stem: `<p>Ava spent <b>one quarter</b> of her money on a book and then <b>$6</b> on lunch. She now has exactly <b>half</b> of her money left.</p><p>How much did she start with?</p>`,
      options: ["$12", "$18", "$24", "$32", "$48"], answer: 2,
      explain: `<p>She spent half of her money altogether: one quarter on the book and $6 on lunch. So the $6 must be the other quarter. One quarter is $6, so she started with 4 × $6 = <b>$24</b>.</p><p>Check: $24 − $6 (book) − $6 (lunch) = $12, which is half of $24.</p><p class="why-not">$12 is what she has left. $48 treats $6 as one eighth.</p>` },
    { id: "n403", tier: 4, cat: "Time & timetables",
      stem: `<p>In a year that is <b>not</b> a leap year, what date is exactly <b>100 days after 1 January</b>?</p>`,
      options: ["9 April", "10 April", "11 April", "12 April", "10 May"], answer: 2,
      explain: `<p>Count the days. 31 January is 30 days after 1 January. 28 February is 30 + 28 = 58 days after. 31 March is 58 + 31 = 89 days after. 11 more days reaches <b>11 April</b>.</p><p class="why-not">10 April counts 1 January itself as the first day. 12 April counts the days in February as 29 or 30. 10 May is a month too far.</p>` },
    { id: "n404", tier: 4, cat: "Measurement & scales",
      stem: `<p>On a map, <b>1 cm</b> stands for <b>250 m</b>. Two towns are <b>6.4 cm</b> apart on the map.</p><p>How far apart are they really?</p>`,
      options: ["160 m", "250 m", "640 m", "1.6 km", "16 km"], answer: 3,
      explain: `<p>6 cm is 6 × 250 = 1 500 m, and 0.4 cm is 0.4 × 250 = 100 m. Altogether 1 600 m = <b>1.6 km</b>.</p><p class="why-not">640 m treats every centimetre as 100 m. 16 km is ten times too big, and 160 m is ten times too small.</p>` },
    { id: "n405", tier: 4, cat: "Graphs & data",
      stem: colGraph({ labels: ["Chess", "Drama", "Art"], series: [{ name: "Boys", color: "#4dabf7", values: [8, 4, 6] }, { name: "Girls", color: "#ffa94d", values: [6, 10, 9] }], max: 12, step: 2, ylabel: "Children",
        aria: "A column graph with two columns for each club, boys and girls. The scale goes up in 2s to 12. Chess: boys 8, girls 6. Drama: boys 4, girls 10. Art: boys 6, girls halfway between 8 and 10." }) + `<p>The graph shows how many boys and girls are in three clubs. Nobody is in more than one club.</p><p>Altogether, how many more girls than boys are in the clubs?</p>`,
      options: ["7", "3", "5", "9", "25"], answer: 0,
      explain: `<p>Girls: 6 + 10 + 9 = 25. Boys: 8 + 4 + 6 = 18. Difference: 25 − 18 = <b>7</b>. (The girls’ Art column stops halfway between 8 and 10, so it is 9.)</p><p class="why-not">25 is the number of girls, not the difference. Reading the Art column as 8 or 10 gives 6 or 8. Comparing only one club gives a different answer again.</p>` },
  );
})();

/* ---------------------------------------------------------------
   STORM ISLAND: third set of maths questions (Nov 2026). Five options (A–E).
   New kinds of question: rounding, a number line, fewest coins, an addition pyramid,
   missing digits, shapes by their properties, a mirror line on a map grid, a pie chart,
   a turn in degrees, a temperature table, digit swaps, perimeter versus area and more.
   tier 1–3 = storm circle 1–3; tier 4 = the boss.
   --------------------------------------------------------------- */
(() => {
  const { fig, frac, T, tbl, colGraph } = LIB;

  const NUMLINE = (() => {
    const X = v => 30 + (v - 200) * 2.8;
    let g = `<line x1="20" x2="330" y1="60" y2="60" stroke="${INK}" stroke-width="2.5"/>`;
    for (let v = 200; v <= 300; v += 20) { const big = v % 100 === 0; g += `<line x1="${X(v)}" x2="${X(v)}" y1="${big ? 46 : 52}" y2="${big ? 74 : 68}" stroke="${INK}" stroke-width="2.5"/>`; if (big) g += T(X(v), 96, v, 'text-anchor="middle" font-weight="700"'); }
    g += `<path d="M${X(260)} 14 L${X(260)} 44 M${X(260) - 7} 35 L${X(260)} 46 L${X(260) + 7} 35" fill="none" stroke="#e5484d" stroke-width="3.5" stroke-linecap="round"/>`;
    return fig(`<svg viewBox="0 0 350 106" width="340" role="img" aria-label="A number line from 200 to 300. Between 200 and 300 there are four small unlabelled marks, evenly spaced. An arrow points to the third small mark after 200.">${g}</svg>`);
  })();

  const PYR = (() => {
    const b = (x, y, s, hi) => `<rect x="${x}" y="${y}" width="70" height="40" fill="${hi ? "#ffe066" : "#fff"}" stroke="${INK}" stroke-width="2.5"/>` + T(x + 35, y + 27, s, 'text-anchor="middle" font-size="19" font-weight="700"');
    return fig(`<svg viewBox="0 0 230 136" width="230" role="img" aria-label="An addition pyramid. Bottom row: 4, a missing number in a yellow brick, 7. Middle row: two empty bricks. Top brick: 31.">${b(80, 6, "31")}${b(45, 48, "")}${b(115, 48, "")}${b(10, 90, "4")}${b(80, 90, "?", true)}${b(150, 90, "7")}</svg>`);
  })();

  const PIE = (() => {
    const cx = 110, cy = 110, r = 92, pt = a => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
    const seg = (a, b, c) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${b - a > 180 ? 1 : 0} 1 ${x2} ${y2} Z" fill="${c}" stroke="${INK}" stroke-width="2.5"/>`; };
    const lab = (a, s) => { const [x, y] = [cx + 56 * Math.sin(a * Math.PI / 180), cy - 56 * Math.cos(a * Math.PI / 180)]; return T(x, y + 5, s, 'text-anchor="middle" font-size="14" font-weight="700"'); };
    return fig(`<svg viewBox="0 0 220 220" width="220" role="img" aria-label="A pie chart cut into four parts. Soccer takes half of the circle. Swimming takes a quarter. Tennis and Dance each take an eighth.">${seg(0, 180, "#69db7c")}${seg(180, 270, "#4dabf7")}${seg(270, 315, "#ffa94d")}${seg(315, 360, "#f783ac")}${lab(90, "Soccer")}${lab(225, "Swimming")}${lab(292, "Tennis")}${lab(338, "Dance")}</svg>`);
  })();

  const MAP = (() => {
    const u = 34, cols = "ABCDEF";
    let g = "";
    for (let c = 0; c < 6; c++) { g += T(40 + c * u + u / 2, 22, cols[c], 'text-anchor="middle" font-weight="700"'); for (let r = 0; r < 5; r++) g += `<rect x="${40 + c * u}" y="${30 + r * u}" width="${u}" height="${u}" fill="#e7f5ff" stroke="#8aa0b8" stroke-width="1.2"/>`; }
    for (let r = 0; r < 5; r++) g += T(26, 30 + r * u + u / 2 + 5, r + 1, 'text-anchor="middle" font-weight="700"');
    g += `<line x1="${40 + 3 * u}" x2="${40 + 3 * u}" y1="24" y2="${36 + 5 * u}" stroke="#e5484d" stroke-width="4" stroke-dasharray="8 5"/>`;
    g += T(40 + 1 * u + u / 2, 30 + 3 * u + u / 2 + 7, "★", 'text-anchor="middle" font-size="22" fill="#f08c00"');
    return fig(`<svg viewBox="0 0 260 210" width="260" role="img" aria-label="A map grid with columns A to F and rows 1 to 5. A dashed red mirror line runs down between columns C and D. A star is in square B4.">${g}</svg>`);
  })();

  const BOX = fig(`<svg viewBox="0 0 230 150" width="230" role="img" aria-label="A closed box shaped like a cuboid. The front face has an area of 12 square centimetres, the top face 20 square centimetres and the side face 15 square centimetres."><polygon points="20,60 150,60 150,140 20,140" fill="#ffe8cc" stroke="${INK}" stroke-width="2.5"/><polygon points="20,60 70,20 200,20 150,60" fill="#fff4e6" stroke="${INK}" stroke-width="2.5"/><polygon points="150,60 200,20 200,100 150,140" fill="#ffd8a8" stroke="${INK}" stroke-width="2.5"/>${T(85, 106, "12 cm²", 'text-anchor="middle" font-weight="700"')}${T(110, 45, "20 cm²", 'text-anchor="middle" font-weight="700"')}${T(176, 86, "15", 'text-anchor="middle" font-weight="700"')}${T(176, 102, "cm²", 'text-anchor="middle" font-size="12" font-weight="700"')}</svg>`);


  const SCALE = (() => {
    const X = g => 24 + g * 0.15;
    let s = `<rect x="14" y="30" width="322" height="46" rx="6" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
    for (let g = 0; g <= 2000; g += 100) { const big = g % 500 === 0; s += `<line x1="${X(g)}" x2="${X(g)}" y1="30" y2="${big ? 56 : 46}" stroke="${INK}" stroke-width="${big ? 2.5 : 1.8}"/>`; if (big) s += T(X(g), 72, g === 0 ? "0" : g % 1000 === 0 ? g / 1000 + " kg" : g >= 1000 ? "1.5 kg" : "500 g", 'text-anchor="middle" font-size="13" font-weight="700"'); }
    s += `<path d="M${X(1300)} 4 L${X(1300)} 40 M${X(1300) - 7} 31 L${X(1300)} 42 L${X(1300) + 7} 31" fill="none" stroke="#e5484d" stroke-width="3.5" stroke-linecap="round"/>`;
    return fig(`<svg viewBox="0 0 350 84" width="340" role="img" aria-label="The scale of a kitchen scale, from 0 to 2 kg. It is labelled 0, 500 g, 1 kg, 1.5 kg and 2 kg, with four small marks between each pair of labels. The red pointer is at the third small mark after 1 kg.">${s}</svg>`);
  })();
  const RULER = (() => {
    const X = c => 20 + c * 30;
    let s = `<rect x="10" y="50" width="330" height="42" fill="#fff3bf" stroke="${INK}" stroke-width="2"/>`;
    for (let mm = 0; mm <= 105; mm++) { const cm = mm % 10 === 0, half = mm % 5 === 0; s += `<line x1="${X(mm / 10)}" x2="${X(mm / 10)}" y1="50" y2="${cm ? 66 : half ? 61 : 56}" stroke="${INK}" stroke-width="${cm ? 1.8 : 0.9}"/>`; if (cm) s += T(X(mm / 10), 84, mm / 10, 'text-anchor="middle" font-size="13"'); }
    s += `<rect x="${X(2)}" y="18" width="${X(8.5) - X(2) - 18}" height="22" fill="#ffa94d" stroke="${INK}" stroke-width="2"/><polygon points="${X(8.5) - 18},18 ${X(8.5)},29 ${X(8.5) - 18},40" fill="#ffe8cc" stroke="${INK}" stroke-width="2"/><line x1="${X(2)}" x2="${X(2)}" y1="12" y2="50" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="${X(8.5)}" x2="${X(8.5)}" y1="12" y2="50" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    return fig(`<svg viewBox="0 0 350 98" width="340" role="img" aria-label="A pencil lying above a ruler marked in centimetres and millimetres, from 0 to 10 cm. The flat end of the pencil is at 2 cm and its point is at the halfway mark between 8 and 9 cm.">${s}</svg>`);
  })();
  const TALLY = (() => {
    const rows = [["Red", 13], ["Blue", 17], ["Green", 9], ["Yellow", 11]];
    const tally = (c, y) => { let g = "", x = 100; for (let k = 0; k < Math.floor(c / 5); k++) { for (let j = 0; j < 4; j++) g += `<line x1="${x + j * 8}" x2="${x + j * 8}" y1="${y - 14}" y2="${y + 10}" stroke="${INK}" stroke-width="2.5"/>`; g += `<line x1="${x - 4}" x2="${x + 28}" y1="${y + 6}" y2="${y - 10}" stroke="${INK}" stroke-width="2.5"/>`; x += 46; } for (let j = 0; j < c % 5; j++) g += `<line x1="${x + j * 8}" x2="${x + j * 8}" y1="${y - 14}" y2="${y + 10}" stroke="${INK}" stroke-width="2.5"/>`; return g; };
    let g = ""; rows.forEach(([n, c], i) => { const y = 30 + i * 38; g += T(12, y + 5, n, 'font-weight="700"') + tally(c, y) + `<line x1="6" x2="294" y1="${y + 19}" y2="${y + 19}" stroke="#c5ccd8"/>`; });
    return fig(`<svg viewBox="0 0 300 172" width="300" role="img" aria-label="A tally chart of favourite colours. Red: two bundles of five and 3 more strokes. Blue: three bundles of five and 2 more. Green: one bundle of five and 4 more. Yellow: two bundles of five and 1 more.">${g}</svg>`);
  })();

  MATHS.push(
    /* ===================== circle 1 ===================== */
    { id: "w101", tier: 1, cat: "Number & place value",
      stem: `<p>Which number rounds to <b>4 500</b> when it is rounded to the nearest hundred?</p>`,
      options: ["4 405", "4 449", "4 549", "4 551", "4 650"], answer: 2,
      explain: `<p>Numbers from 4 450 up to 4 549 round to 4 500. <b>4 549</b> is in that range: its tens digit is 4, so it rounds <i>down</i> to 4 500.</p><p class="why-not">4 551 has 5 tens, so it rounds up to 4 600. 4 449 and 4 405 round down to 4 400. 4 650 rounds to 4 700. Look at the tens digit, not the ones.</p>` },
    { id: "w102", tier: 1, cat: "Measurement & scales",
      stem: `<p>What number is the arrow pointing to?</p>${NUMLINE}`,
      options: ["203", "230", "250", "260", "280"], answer: 3,
      explain: `<p>From 200 to 300 is 100. The four small marks split it into <b>5</b> equal jumps, so each jump is 100 ÷ 5 = 20. The arrow is at the third mark: 200 + 3 × 20 = <b>260</b>.</p><p class="why-not">230 counts each jump as 10, and 203 as 1. 250 guesses “about halfway”. 280 counts four jumps.</p>` },
    { id: "w103", tier: 1, cat: "Money & best value",
      stem: `<p>Australian coins are 5c, 10c, 20c, 50c, $1 and $2.</p><p>What is the <b>fewest</b> coins you need to pay exactly <b>$3.85</b>?</p>`,
      options: ["4", "5", "6", "7", "8"], answer: 2,
      explain: `<p>Use the biggest coin you can each time: $2 (leaves $1.85), $1 (85c), 50c (35c), 20c (15c), 10c (5c), 5c. That is <b>6</b> coins.</p><p class="why-not">5 or 4 coins can’t make the 85c part: it needs 50c, 20c, 10c and 5c. 7 or 8 come from using two 20c coins or two $1 coins instead of a bigger one.</p>` },
    { id: "w104", tier: 1, cat: "Time & timetables",
      stem: `<p>Part of a train timetable:</p>${tbl(["Station", "Time"], [["Hillview", "9:47 am"], ["Oak Park", "10:20 am"], ["Kingsford", "10:51 am"], ["Bay Road", "11:12 am"]])}<p>How many minutes does the train take from <b>Hillview</b> to <b>Bay Road</b>?</p>`,
      options: ["65 minutes", "75 minutes", "85 minutes", "95 minutes", "165 minutes"], answer: 2,
      explain: `<p>Count up in friendly steps: 9:47 to 10:00 is 13 minutes. 10:00 to 11:00 is 60 minutes. 11:00 to 11:12 is 12 minutes. 13 + 60 + 12 = <b>85 minutes</b>.</p><p class="why-not">165 comes from 1112 − 947, treating the times as ordinary numbers: but an hour has 60 minutes, not 100. 75 and 95 are 10 out, from slips in the first step.</p>` },
    { id: "w105", tier: 1, cat: "Graphs & data",
      stem: `<p>All <b>24</b> children in a class chose their favourite sport. The pie chart shows the results.</p>${PIE}<p>How many children chose <b>tennis</b>?</p>`,
      options: ["2", "3", "4", "6", "8"], answer: 1,
      explain: `<p>Tennis is <b>one eighth</b> of the circle: half of a quarter. One eighth of 24 is 24 ÷ 8 = <b>3</b>.</p><p class="why-not">6 is a quarter of 24 (swimming). 4 is a sixth, from counting the 4 parts and then guessing. 2 and 8 come from dividing by 12 or 3.</p>` },
    { id: "w106", tier: 1, cat: "Number & place value",
      stem: `<p>Which is the <b>best estimate</b> for 398 × 5?</p>`,
      options: ["200", "1 500", "1 600", "2 000", "20 000"], answer: 3,
      explain: `<p>398 is very close to 400. 400 × 5 = <b>2 000</b>, so 398 × 5 is just under 2 000. (It is exactly 1 990.)</p><p class="why-not">20 000 has one zero too many, and 200 one too few. 1 500 rounds 398 down to 300, and 1 600 multiplies 400 by 4 instead of 5.</p>` },
    { id: "w107", tier: 1, cat: "Number & place value",
      stem: `<p><b>96</b> children are going on an excursion. Each minibus can carry <b>14</b> children.</p><p>What is the smallest number of minibuses needed?</p>`,
      options: ["6", "7", "8", "14", "82"], answer: 1,
      explain: `<p>6 buses carry 6 × 14 = 84 children: 12 are left over. They need one more bus, so <b>7</b>.</p><p class="why-not">6 leaves 12 children behind. 8 is one bus too many (7 × 14 = 98 is already enough). 82 is 96 − 14, a take-away instead of a share.</p>` },
    { id: "w108", tier: 1, cat: "Measurement & scales",
      stem: `<p>Lena faces <b>east</b>. She turns <b>270°</b> clockwise.</p><p>Which way is she facing now?</p>`,
      options: ["North", "South", "East", "West", "North-east"], answer: 0,
      explain: `<p>270° is three quarter turns (3 × 90°). Clockwise from east: south, west, <b>north</b>.</p><p class="why-not">South is one quarter turn, and west is two. Turning 270° anticlockwise would give south. North-east is only half a quarter turn from either.</p>` },

    { id: "w109", tier: 1, cat: "Measurement & scales",
      stem: `<p>Some flour is put on a kitchen scale. How much does it weigh?</p>${SCALE}`,
      options: ["1 030 g", "1 060 g", "1 150 g", "1 200 g", "1 300 g"], answer: 4,
      explain: `<p>From 1 kg (1 000 g) to 1.5 kg (1 500 g) is 500 g. The four small marks split it into <b>5</b> equal steps of 100 g. The pointer is at the third mark: 1 000 + 3 × 100 = <b>1 300 g</b>.</p><p class="why-not">1 030 g counts each step as 10 g, 1 060 g as 20 g, and 1 150 g as 50 g. 1 200 g counts only two steps.</p>` },
    { id: "w110", tier: 1, cat: "Measurement & scales",
      stem: `<p>How long is the pencil?</p>${RULER}`,
      options: ["55 mm", "65 mm", "75 mm", "85 mm", "105 mm"], answer: 1,
      explain: `<p>The pencil does not start at 0. It goes from 2 cm to 8 cm 5 mm. From 2 cm to 8 cm is 6 cm = 60 mm, plus the 5 mm: <b>65 mm</b>.</p><p class="why-not">85 mm reads where the point is and forgets that the pencil starts at 2 cm, not 0. 75 mm counts from the 1 cm mark. 55 mm takes the 5 mm away instead of adding it.</p>` },
    /* ===================== circle 2 ===================== */
    { id: "w201", tier: 2, cat: "Number & place value",
      stem: `<p>In an addition pyramid, each brick is the <b>sum</b> of the two bricks under it.</p>${PYR}<p>What number goes in the yellow brick?</p>`,
      options: ["6", "8", "9", "10", "20"], answer: 3,
      explain: `<p>Call the yellow number ?. The middle bricks are 4 + ? and ? + 7. The top is (4 + ?) + (? + 7) = 11 + ? + ?.</p><p>So 11 + two lots of ? = 31. Two lots of ? = 20, and ? = <b>10</b>.</p><p>Check: middle bricks 14 and 17, and 14 + 17 = 31.</p><p class="why-not">20 is 31 − 11, forgetting that the yellow number is counted twice (it is under both middle bricks). 8 and 9 come from guessing the middle bricks instead of working them out.</p>` },
    { id: "w202", tier: 2, cat: "Number & place value",
      stem: `<p>Two digits are missing from this subtraction.</p><div class="box" style="font-size:22px;letter-spacing:4px;text-align:center">7 ▢ 2 − 3 8 △ = 3 4 6</div><p>Which digits are missing?</p>`,
      options: ["▢ = 2, △ = 6", "▢ = 3, △ = 4", "▢ = 3, △ = 6", "▢ = 4, △ = 6", "▢ = 3, △ = 8"], answer: 2,
      explain: `<p>Turn it round: 7▢2 = 346 + 38△. The ones must end in 2: 6 + △ ends in 2, so △ = <b>6</b>. Then 346 + 386 = 732, so ▢ = <b>3</b>.</p><p>Check: 732 − 386 = 346.</p><p class="why-not">△ = 4 comes from 6 − 2 = 4, taking the small digit from the big one. ▢ = 2 forgets the ten carried across from the ones. △ = 8 copies the 8.</p>` },
    { id: "w203", tier: 2, cat: "Area, perimeter & 3D",
      stem: `<p>A shape has <b>4 sides</b> that are all the <b>same length</b>, but it has <b>no right angles</b>.</p><p>What is the shape?</p>`,
      options: ["Rhombus", "Square", "Rectangle", "Trapezium", "Kite"], answer: 0,
      explain: `<p>Four equal sides make it a square or a <b>rhombus</b>. A square has four right angles, so this one, with none, is a rhombus: a “pushed over” square.</p><p class="why-not">A rectangle has right angles and its sides are usually not all equal. A kite has two pairs of equal sides next to each other, and a trapezium has one pair of parallel sides; neither needs four equal sides.</p>` },
    { id: "w204", tier: 2, cat: "Number & place value",
      stem: `<p>Two numbers add up to <b>50</b>. One of them is <b>4 times</b> the other.</p><p>What is the <b>difference</b> between the two numbers?</p>`,
      options: ["4", "10", "12.5", "25", "30"], answer: 4,
      explain: `<p>Think of the small number as 1 part and the big one as 4 parts: 5 parts make 50, so 1 part is 10. The numbers are 10 and 40, and the difference is 40 − 10 = <b>30</b>.</p><p class="why-not">10 is the smaller number, not the difference. 12.5 is 50 ÷ 4, forgetting there are 5 parts. 25 halves 50, and 4 is just the “times” number.</p>` },
    { id: "w205", tier: 2, cat: "Measurement & scales",
      stem: `<p>A goods lift can carry at most <b>400 kg</b>. A worker who weighs <b>80 kg</b> rides with the boxes. Each box weighs <b>35 kg</b>.</p><p>What is the greatest number of boxes the lift can take?</p>`,
      options: ["8", "9", "10", "11", "12"], answer: 1,
      explain: `<p>The worker uses 80 kg, leaving 400 − 80 = 320 kg for boxes. 9 boxes weigh 315 kg; 10 would weigh 350 kg, too much. So <b>9</b>.</p><p class="why-not">11 forgets the worker (400 ÷ 35 is just over 11). 10 rounds 320 ÷ 35 = 9.1… up, but you can’t take part of a box over the limit.</p>` },
    { id: "w206", tier: 2, cat: "Rates",
      stem: `<p>A pancake recipe uses <b>3 eggs</b> for every <b>2 cups</b> of flour.</p><p>How many cups of flour are needed with <b>12 eggs</b>?</p>`,
      options: ["6", "8", "11", "13", "18"], answer: 1,
      explain: `<p>12 eggs is 4 lots of 3 eggs (12 ÷ 3 = 4). So you need 4 lots of 2 cups: 4 × 2 = <b>8</b> cups.</p><p class="why-not">18 swaps the eggs and the cups (12 ÷ 2 × 3). 11 adds instead: 12 − 3 + 2. 6 halves the 12. 13 is 12 + 3 − 2.</p>` },
    { id: "w207", tier: 2, cat: "Time & timetables",
      stem: `<p>It is <b>10:40 am</b>. What time will it be in <b>500 minutes</b>?</p>`,
      options: ["3:40 pm", "6:20 pm", "6:40 pm", "7:00 pm", "7:20 pm"], answer: 3,
      explain: `<p>500 minutes = 8 × 60 + 20 = <b>8 hours 20 minutes</b>. 10:40 am + 8 hours = 6:40 pm. Then 20 more minutes = <b>7:00 pm</b>.</p><p class="why-not">3:40 pm treats 500 minutes as 5 hours. 6:40 pm forgets the last 20 minutes, and 6:20 pm takes them away instead of adding. 7:20 pm adds 20 minutes too many.</p>` },
    { id: "w208", tier: 2, cat: "Time & timetables",
      stem: `<p>Today is <b>4 March</b> in a year that is <b>not</b> a leap year.</p><p>What was the date <b>10 days ago</b>?</p>`,
      options: ["21 February", "22 February", "23 February", "24 February", "25 February"], answer: 1,
      explain: `<p>Count back 4 days to 28 February (February has 28 days when it isn’t a leap year). That is 4 of the 10. Count back the other 6: 27, 26, 25, 24, 23, <b>22 February</b>.</p><p class="why-not">24 February gives February 30 days, and 25 February 31 days. 23 or 21 February are one day out from counting today as one of the 10.</p>` },
    { id: "w209", tier: 2, cat: "Area, perimeter & 3D",
      stem: `<p>The dashed red line is a <b>mirror line</b>.</p>${MAP}<p>In which square is the reflection of the star?</p>`,
      options: ["B4", "D4", "E3", "E4", "F4"], answer: 3,
      explain: `<p>The star in B4 is <b>2 squares</b> to the left of the mirror line (C is between). Its reflection is 2 squares to the right: D, then <b>E</b>. It stays in the same row, so <b>E4</b>.</p><p class="why-not">D4 puts the reflection right next to the line, 1 square away instead of 2. F4 goes 3 squares. E3 moves the row as well: a mirror line going up and down doesn’t change the row. B4 is where the star already is.</p>` },
    { id: "w210", tier: 2, cat: "Money & best value",
      stem: `<p>Yoghurts cost <b>95c</b> each, or <b>$5.40</b> for a pack of 6.</p><p>How much do you save by buying <b>12</b> yoghurts in packs instead of one at a time?</p>`,
      options: ["30c", "55c", "60c", "$1.20", "$5.40"], answer: 2,
      explain: `<p>12 singles: 12 × 95c = $11.40. Two packs: 2 × $5.40 = $10.80. Saving: $11.40 − $10.80 = <b>60c</b>.</p><p class="why-not">30c is the saving on just one pack of 6. 55c is 95c − 40c, a mix-up. $1.20 doubles the saving twice. $5.40 is the price of a pack, not a saving.</p>` },
    { id: "w211", tier: 2, cat: "Measurement & scales",
      stem: `<p>A water tank holds <b>24 litres</b>. Mo fills it using a jug that holds <b>750 mL</b>.</p><p>How many full jugs does it take?</p>`,
      options: ["18", "30", "32", "36", "320"], answer: 2,
      explain: `<p>24 litres = 24 000 mL. Each 3 L is 4 jugs (4 × 750 mL = 3 000 mL). 24 L is 8 lots of 3 L, so 8 × 4 = <b>32</b> jugs.</p><p class="why-not">18 is 24 × ¾, multiplying instead of dividing. 320 loses a zero (24 000 ÷ 75). 30 and 36 come from rounding 750 mL to “about 1 litre” or to 700 mL and guessing.</p>` },
    { id: "w212", tier: 2, cat: "Graphs & data",
      stem: `<p>The table shows the lowest and highest temperatures on five school days.</p>${tbl(["", "Mon", "Tue", "Wed", "Thu", "Fri"], [["Lowest (°C)", 12, 8, 15, 5, 11], ["Highest (°C)", 21, 20, 24, 14, 22]])}<p>On which day was the <b>difference</b> between the lowest and highest temperature the <b>greatest</b>?</p>`,
      options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], answer: 1,
      explain: `<p>Find each difference: Mon 21 − 12 = 9. Tue 20 − 8 = <b>12</b>. Wed 24 − 15 = 9. Thu 14 − 5 = 9. Fri 22 − 11 = 11. Tuesday has the biggest.</p><p class="why-not">Wednesday has the highest temperature, and Thursday the lowest, but neither has the biggest gap. Friday is close, at 11.</p>` },

    { id: "w213", tier: 2, cat: "Graphs & data",
      stem: `<p>Every child in a class chose their favourite colour. The tally chart shows the results.</p>${TALLY}<p>How many children are in the class?</p>`,
      options: ["36", "40", "44", "48", "50"], answer: 4,
      explain: `<p>Each bundle (four strokes with one across) is <b>5</b>. Red 5 + 5 + 3 = 13. Blue 5 + 5 + 5 + 2 = 17. Green 5 + 4 = 9. Yellow 5 + 5 + 1 = 11. Total 13 + 17 + 9 + 11 = <b>50</b>.</p><p class="why-not">40 counts only the 8 bundles and forgets the single strokes. 36 counts each bundle as 4 (missing the stroke across). 44 and 48 are slips in adding.</p>` },
    /* ===================== circle 3 ===================== */
    { id: "w301", tier: 3, cat: "Fractions",
      stem: `<p>${frac(3, 5)} of a number is <b>24</b>.</p><p>What is ${frac(3, 4)} of the same number?</p>`,
      options: ["18", "20", "30", "32", "40"], answer: 2,
      explain: `<p>${frac(3, 5)} is 24, so ${frac(1, 5)} is 24 ÷ 3 = 8, and the whole number is 5 × 8 = 40.</p><p>Then ${frac(1, 4)} of 40 is 10, and ${frac(3, 4)} is 3 × 10 = <b>30</b>.</p><p class="why-not">40 is the whole number, one step short. 18 takes ${frac(3, 4)} of 24 instead of the whole number. 32 is ${frac(4, 5)} of 40.</p>` },
    { id: "w302", tier: 3, cat: "Rates",
      stem: `<p>Ava reads <b>12 pages every 10 minutes</b>. Ben reads <b>9 pages every 6 minutes</b>.</p><p>In <b>one hour</b>, how many more pages does Ben read than Ava?</p>`,
      options: ["3", "9", "12", "18", "90"], answer: 3,
      explain: `<p>One hour is 60 minutes. Ava: 60 ÷ 10 = 6 lots of 12 = 72 pages. Ben: 60 ÷ 6 = 10 lots of 9 = 90 pages. Ben reads 90 − 72 = <b>18</b> more.</p><p class="why-not">3 compares the 12 and 9 pages, ignoring the different times. That even makes Ava look faster! 90 is how many Ben reads, not the difference.</p>` },
    { id: "w303", tier: 3, cat: "Chance & counting",
      stem: `<p>Two spinners are each numbered <b>1, 2 and 3</b>, with equal sections. Both are spun and the two numbers are <b>added</b>.</p><p>Which total is the <b>most likely</b>?</p>`,
      options: ["2", "3", "4", "5", "6"], answer: 2,
      explain: `<p>List all 9 ways (first spinner + second):</p><p>1+1 = 2; 1+2, 2+1 = 3; 1+3, 2+2, 3+1 = 4; 2+3, 3+2 = 5; 3+3 = 6.</p><p>Total <b>4</b> can be made in 3 ways, more than any other.</p><p class="why-not">6 is the biggest total but can only be made one way (3 + 3). 3 and 5 can each be made 2 ways. 2 is as unlikely as 6.</p>` },
    { id: "w304", tier: 3, cat: "Area, perimeter & 3D",
      stem: `<p>A rectangle is 8 cm long and 5 cm wide. Its length is made <b>3 cm longer</b> and its width is made <b>3 cm shorter</b>.</p><p>What happens to its perimeter and its area?</p>`,
      options: ["Both stay the same", "Perimeter stays the same; area gets smaller", "Perimeter stays the same; area gets bigger", "Perimeter gets bigger; area stays the same", "The perimeter and the area both get smaller"], answer: 1,
      explain: `<p>Before: perimeter 8 + 5 + 8 + 5 = 26 cm, area 8 × 5 = 40 cm².</p><p>After: 11 cm by 2 cm. Perimeter 11 + 2 + 11 + 2 = 26 cm (the same), area 11 × 2 = 22 cm² (<b>smaller</b>).</p><p class="why-not">Adding 3 and taking 3 cancels out for the perimeter, but not for the area. A long thin rectangle covers less space than a squarer one with the same perimeter.</p>` },
    { id: "w305", tier: 3, cat: "Patterns & sequences",
      stem: `<p>This pattern keeps repeating:</p><div class="box" style="font-size:26px;letter-spacing:6px;text-align:center"><span style="color:#f08c00">★</span><span style="color:#1c7ed6">●●</span><span style="color:#2f9e44">▲</span> <span style="color:#f08c00">★</span><span style="color:#1c7ed6">●●</span><span style="color:#2f9e44">▲</span> <span style="color:#f08c00">★</span><span style="color:#1c7ed6">●●</span><span style="color:#2f9e44">▲</span> …</div><p>How many <span style="color:#1c7ed6">●</span> are there in the first <b>50</b> shapes?</p>`,
      options: ["12", "13", "24", "25", "26"], answer: 3,
      explain: `<p>The repeating block ★●●▲ has 4 shapes, with 2 circles. 50 ÷ 4 = 12 blocks (48 shapes) with 2 left over.</p><p>12 blocks have 12 × 2 = 24 circles. The 2 extra shapes are ★ and ●: one more circle. Total <b>25</b>.</p><p class="why-not">24 forgets the 2 shapes left over. 26 counts both leftovers as circles, but the block starts with a star. 12 and 13 count the blocks, not the circles.</p>` },
    { id: "w306", tier: 3, cat: "Number & place value",
      stem: `<p>I am a two-digit number. My digits add up to <b>11</b>. If you swap my digits, the new number is <b>27 more</b> than me.</p><p>What number am I?</p>`,
      options: ["29", "38", "47", "56", "74"], answer: 2,
      explain: `<p>The swapped number is bigger, so my ones digit is bigger than my tens digit. Try the numbers whose digits add to 11: 29 → 92 (63 more). 38 → 83 (45 more). <b>47 → 74</b> (27 more). ✓</p><p class="why-not">74 is the swapped number, not me (swapping 74 gives 47, which is smaller). 56 → 65 is only 9 more, and 38 and 29 give too big a jump.</p>` },
    { id: "w307", tier: 3, cat: "Fractions",
      stem: `<p>Which fraction is <b>closest</b> to one half?</p>`,
      options: [frac(1, 5), frac(2, 5), frac(5, 8), frac(7, 10), frac(3, 4)], answer: 1,
      explain: `<p>Compare each with a half of the same size pieces:</p><p>${frac(2, 5)}: a half is ${frac(2.5, 5)}, so it is half a fifth away = ${frac(1, 10)}. ${frac(5, 8)}: a half is ${frac(4, 8)}, so it is ${frac(1, 8)} away. ${frac(7, 10)} is ${frac(2, 10)} away, ${frac(3, 4)} is ${frac(1, 4)} away, ${frac(1, 5)} is ${frac(3, 10)} away.</p><p>${frac(1, 10)} is the smallest gap, so <b>${frac(2, 5)}</b> is closest.</p><p class="why-not">${frac(5, 8)} is very close too: just 1 eighth over. But an eighth is bigger than a tenth.</p>` },
    { id: "w308", tier: 3, cat: "Graphs & data",
      stem: `<p>Four classes collected cans for recycling.</p>${colGraph({ labels: ["4A", "4B", "4C", "4D"], series: [{ name: "", color: "#4dabf7", values: [70, 110, 90, 45] }], max: 120, step: 10, ylabel: "Cans", numbers: false, aria: "A column graph of cans collected by four classes. The scale has a line every 10 cans, but only 0, 40, 80 and 120 are labelled. 4A: 70. 4B: 110. 4C: 90. 4D: 45, halfway between two lines." }).replace("</svg>", [0, 40, 80, 120].map(v => T(42, 205 - v * 170 / 120 + 5, v, 'text-anchor="end"')).join("") + "</svg>")}<p>The scale has a line for every <b>10</b> cans. How many <b>more</b> cans did 4B collect than 4D?</p>`,
      options: ["55", "60", "65", "70", "75"], answer: 2,
      explain: `<p>4B reaches 110. 4D is halfway between 40 and 50, so 45. The difference is 110 − 45 = <b>65</b>.</p><p class="why-not">60 and 70 read 4D as 50 or 40. 55 and 75 read 4B one line out.</p>` },

    { id: "w309", tier: 3, cat: "Time & timetables",
      stem: `<p>Films at the cinema on Saturday:</p>${tbl(["Film", "Starts", "Length"], [["Dino Dash", "1:45 pm", "1 h 50 min"], ["Space Pups", "2:15 pm", "2 h 5 min"], ["Robo Race", "2:40 pm", "2 h 25 min"], ["Ocean Song", "3:15 pm", "1 h 50 min"]])}<p>Mia gets to the cinema at <b>2:00 pm</b> and must leave by <b>5:00 pm</b>. Which film can she see from start to finish?</p>`,
      options: ["Dino Dash", "Space Pups", "Robo Race", "Ocean Song", "None of them"], answer: 1,
      explain: `<p>Work out when each one ends. Dino Dash starts at 1:45 pm, before Mia arrives. Space Pups: 2:15 pm + 2 h 5 min = <b>4:20 pm</b>, in time. Robo Race: 2:40 pm + 2 h 25 min = 5:05 pm, too late. Ocean Song: 3:15 pm + 1 h 50 min = 5:05 pm, too late.</p><p>So the answer is <b>Space Pups</b>.</p><p class="why-not">Ocean Song is the shortest film she could get to, but it starts late, so it finishes after 5:00. Robo Race also ends 5 minutes too late. Dino Dash would be over by 3:35, but it starts before she gets there.</p>` },
    /* ===================== boss ===================== */
    { id: "w401", tier: 4, cat: "Area, perimeter & 3D",
      stem: `<p>The faces of a closed box have these areas: <b>12 cm²</b>, <b>15 cm²</b> and <b>20 cm²</b>. Every length is a whole number of centimetres.</p>${BOX}<p>What is the <b>volume</b> of the box?</p>`,
      options: ["47 cm³", "60 cm³", "94 cm³", "120 cm³", "3 600 cm³"], answer: 1,
      explain: `<p>Find three edges that make all three areas: 12 = 3 × 4, 15 = 3 × 5, 20 = 4 × 5. So the edges are 3 cm, 4 cm and 5 cm, and the volume is 3 × 4 × 5 = <b>60 cm³</b>.</p><p class="why-not">47 adds the areas, and 94 is the whole surface area (each face appears twice). 3 600 multiplies the three areas. 120 doubles the volume.</p>` },
    { id: "w402", tier: 4, cat: "Fractions",
      stem: `<p>What number is exactly <b>halfway</b> between ${frac(1, 4)} and ${frac(1, 2)}?</p>`,
      options: [frac(1, 8), frac(1, 3), frac(3, 8), frac(3, 6), frac(3, 4)], answer: 2,
      explain: `<p>Use eighths: ${frac(1, 4)} = ${frac(2, 8)} and ${frac(1, 2)} = ${frac(4, 8)}. Halfway between 2 eighths and 4 eighths is <b>${frac(3, 8)}</b>.</p><p class="why-not">${frac(1, 3)} comes from “between 4 and 2 is 3”, using the bottom numbers. ${frac(1, 8)} is half the <i>gap</i> (${frac(1, 4)} ÷ 2), not the point halfway along. ${frac(3, 4)} adds the two fractions. ${frac(3, 6)} is a half.</p>` },
    { id: "w403", tier: 4, cat: "Rates",
      stem: `<p><b>4 painters</b> take <b>4 hours</b> to paint <b>4 fences</b>. All the painters work at the same speed, and all the fences are the same.</p><p>How long would <b>8 painters</b> take to paint <b>8 fences</b>?</p>`,
      options: ["30 minutes", "1 hour", "2 hours", "4 hours", "8 hours"], answer: 3,
      explain: `<p>4 painters paint 4 fences in 4 hours, so each painter paints <b>one fence in 4 hours</b>. With 8 painters each doing one of the 8 fences, the job still takes <b>4 hours</b>.</p><p class="why-not">8 hours doubles the time because the fences doubled, forgetting the painters doubled too. 2 hours halves it for the painters but forgets the extra fences. 30 minutes and 1 hour shrink the time, as if more fences made the job quicker.</p>` },
    { id: "w404", tier: 4, cat: "Rates",
      stem: `<p>A train travels <b>20 km every 15 minutes</b>. It leaves at <b>9:40 am</b> for a town <b>140 km</b> away.</p><p>When does it arrive?</p>`,
      options: ["9:55 am", "10:45 am", "11:05 am", "11:25 am", "4:40 pm"], answer: 3,
      explain: `<p>140 km is 7 lots of 20 km, so the trip takes 7 × 15 = 105 minutes = <b>1 hour 45 minutes</b>.</p><p>9:40 am + 1 hour = 10:40 am. Then 45 more minutes: 10:40 → 11:00 is 20, and 25 more makes <b>11:25 am</b>.</p><p class="why-not">10:45 am reads 105 minutes as 1 hour 5 minutes. 4:40 pm thinks each 20 km takes an hour. 9:55 am adds just one 15-minute step, and 11:05 am adds 1 hour 25 minutes.</p>` },
  );
})();

/* ---------------------------------------------------------------
   STORM ISLAND: reading passages (hand-written, all original). Four options (A–D),

   option set for every gap. A reading opponent shows one passage and asks several
   of its questions. tier 1–3 = storm circle 1–3.
   All five reading formats are here: cloze ×2, story ×2, missing sentences, poem, four extracts ×2.
   --------------------------------------------------------------- */
(() => {
  const G = n => `<span data-g="${n}" class="gap">(${n}) ______</span>`;
  const gapQ = (id, n, options, answer, explain) => ({ id, gap: n, cat: "Vocabulary & idioms", stem: `<p>Which word fits <b>gap ${n}</b>?</p>`, options, answer, explain });

  READING.push({
    id: "wheel", tier: 1, format: "cloze", title: "At the Wheel",
    note: "Some words are missing from this piece about a first pottery lesson. Choose the word that fits each gap best.",
    html: `<p>I had watched potters at work on television and privately decided that it looked easy. A lump of clay, a spinning wheel, a pair of wet hands: within seconds a bowl would ${G(1)} as if by magic. So when my uncle offered me a lesson in his studio, I accepted without ${G(2)}.</p>
<p>My confidence ${G(3)} about a minute. The clay must sit in the exact centre of the wheel, and mine would not. It wobbled, lurched sideways and finally flew off, landing on the floor with a slap. My uncle said nothing. He simply handed me another lump.</p>
<p>By the fourth attempt I had learned to keep my elbows tucked in and my hands still, letting the wheel do the work. Slowly, a wall of clay began to rise between my fingers. I was so ${G(4)} in watching it grow that I forgot to breathe. Then I pressed a fraction too hard, and the whole thing folded in on itself like a tired balloon.</p>
<p>I expected to feel ${G(5)}. Instead I found myself laughing, and reaching for the clay again. The bowl I finally took home is thick, lopsided and far from perfect, yet I would not ${G(6)} it for the finest one in my uncle’s shop.</p>`,
    questions: [
      gapQ("r1a", 1, ["arrive", "emerge", "happen", "result"], 1, `<p>A bowl slowly appears out of a shapeless lump, so it would <b>emerge</b>: come into view out of something.</p><p class="why-not">A bowl does not “arrive” (it was never travelling) or “happen” (events happen, objects don’t). “Result” would need more words, such as “result from the spinning”.</p>`),
      gapQ("r1b", 2, ["exception", "permission", "interruption", "hesitation"], 3, `<p>To accept “without <b>hesitation</b>” is to say yes at once, without stopping to think. It fits a writer who is sure the job will be easy.</p><p class="why-not">“Without exception” means “every single one”. “Without permission” and “without interruption” are real phrases, but nobody is giving permission or interrupting here.</p>`),
      gapQ("r1c", 3, ["lasted", "stayed", "kept", "continued"], 0, `<p>Something that goes on for a length of time <b>lasts</b> that long: “My confidence lasted about a minute.”</p><p class="why-not">“Stayed” and “kept” need something after them (stayed high, kept going). “Continued” would need “for”: “continued for about a minute”.</p>`),
      gapQ("r1d", 4, ["fascinated", "attracted", "absorbed", "delighted"], 2, `<p>The clue is the little word “in”. You are <b>absorbed in</b> something when it takes all your attention.</p><p class="why-not">The others take different words after them: fascinated <i>by</i>, attracted <i>to</i>, delighted <i>with</i> or <i>by</i>.</p>`),
      gapQ("r1e", 5, ["crushed", "thrilled", "relieved", "amused"], 0, `<p>Read on: “Instead I found myself laughing.” The word “instead” tells us the gap is the opposite of laughing. After watching the bowl collapse, the writer expected to feel <b>crushed</b> (bitterly disappointed).</p><p class="why-not">“Thrilled”, “relieved” and “amused” are all happy feelings, so “instead” would make no sense after them. “Crushed” also echoes what has just happened to the clay.</p>`),
      gapQ("r1f", 6, ["alter", "replace", "convert", "swap"], 3, `<p>You <b>swap</b> one thing <i>for</i> another. The writer means the wobbly bowl is worth more to them than a perfect one.</p><p class="why-not">You replace something <i>with</i> another and convert something <i>into</i> another, so “for” does not fit them. “Alter” means to change a thing a little, not to exchange it.</p>`),
    ],
  });

  /* ============ circle 1: story ============ */
  READING.push({
    id: "biscuit", tier: 1, format: "story", title: "Biscuit",
    note: "Read the story, then answer the questions.",
    html: `<p>The dog arrived in the middle of a thunderstorm, which Mum said was typical of uninvited guests. He was small, the colour of toast, and so wet that he seemed to be made mostly of ears. Arlo found him shivering under the carport and carried him inside wrapped in a beach towel.</p>
<p>“One night,” said Mum. “He belongs to somebody.”</p>
<p>By the third day the dog had a name, Biscuit, a bed made from a washing basket, and a habit of sleeping across Arlo’s feet. Arlo had also put up posters, because Mum made him. He drew them himself. The dog in his drawing was rather larger and fiercer than Biscuit, and the phone number was written in the smallest writing Arlo could manage.</p>
<p>On Saturday the phone rang anyway.</p>
<p>The woman who came to the door was older than Arlo’s grandmother and leaned on a stick. Before she could say a word, Biscuit shot between Arlo’s ankles, skidded on the tiles and flung himself at her knees, making a noise Arlo had never heard from him: a high, wobbling song.</p>
<p>“Pepper,” the woman said. That was all. She lowered herself onto the front step, not seeming to notice that it was still damp, and the dog climbed into her lap as if he were pouring himself into a bowl.</p>
<p>Arlo looked at his own feet. They felt strangely light.</p>
<p>“He likes his ears rubbed,” he said at last. “Sort of backwards. And he’s scared of the vacuum cleaner.”</p>
<p>“He always was,” said the woman, and she smiled at Arlo for the first time. “You’ve looked after him beautifully. I can see that.” She glanced at the washing basket in the hall, then back at him. “I’m only two streets away, you know. Pepper needs walking every afternoon, and my legs aren’t what they were.”</p>
<p>Arlo went to find the lead before she had finished the sentence.</p>`,
    questions: [
      { id: "r2a", cat: "Purpose of a detail", stem: `<p>On Arlo’s posters the dog was “<b>larger and fiercer than Biscuit</b>” and the phone number was in “<b>the smallest writing Arlo could manage</b>”. What do these details show?</p>`,
        options: ["Arlo was not very good at drawing dogs.", "Arlo did not really want the owner to ring.", "Arlo wanted to finish the posters quickly.", "Arlo thought a fierce dog would be noticed."], answer: 1,
        explain: `<p>A picture that doesn’t look like the dog and a number that is hard to read make a poster that is unlikely to work. Arlo did as he was told, but in a way that gave him the best chance of keeping Biscuit: <b>he didn’t want the owner to ring</b>.</p><p class="why-not">The tiny phone number can’t be explained by bad drawing or by hurrying: he made it small on purpose (“the smallest … he could manage”). Wanting the poster noticed is the opposite of what he was up to.</p>` },
      { id: "r2b", cat: "Vocabulary & idioms", stem: `<p>“On Saturday the phone rang <b>anyway</b>.” What does the word “anyway” tell us?</p>`,
        options: ["The telephone often rang on Saturdays.", "Mum had telephoned the owner herself.", "Arlo had been hoping all week that it would ring.", "The call came in spite of what Arlo had done."], answer: 3,
        explain: `<p>“Anyway” means “even so”. Arlo had made the posters as unhelpful as he could, and the owner still found the dog: the call came <b>in spite of</b> what he had done.</p><p class="why-not">Nothing says Mum rang anyone or that Saturdays were busy. Arlo was hoping for the opposite: that the phone would stay silent.</p>` },
      { id: "r2c", cat: "Feelings & inference", stem: `<p>“Arlo looked at his own feet. <b>They felt strangely light.</b>” Why does the writer tell us this?</p>`,
        options: ["Arlo is relieved that the dog has found its owner.", "Arlo has been standing still for too long.", "Arlo already misses the dog that slept on them.", "Arlo wants to run after the old woman."], answer: 2,
        explain: `<p>Earlier we were told the dog had “a habit of sleeping across Arlo’s feet”. Now the dog is in someone else’s lap, and Arlo notices the weight that is gone. The writer shows us he <b>already misses the dog</b> without saying so.</p><p class="why-not">Arlo is not relieved: he tried to stop this happening. The woman has not gone anywhere, so there is nobody to run after.</p>` },
      { id: "r2d", cat: "Comparisons & imagery", stem: `<p>The dog climbed into the woman’s lap “<b>as if he were pouring himself into a bowl</b>”. What does this comparison suggest?</p>`,
        options: ["He settled there easily, as if he belonged.", "He was still dripping wet from the thunderstorm.", "He was hungry and hoping to be fed.", "He was too heavy for her to hold."], answer: 0,
        explain: `<p>Something poured into a bowl flows in and fills the space exactly. The dog fits her lap in the same easy, complete way: this is <b>where he belongs</b>.</p><p class="why-not">The storm was days ago, so he is not wet. The bowl is only a comparison: there is no food in the scene. Nothing suggests he is a burden to her.</p>` },
      { id: "r2e", cat: "Character & structure", stem: `<p>The story ends: “Arlo went to find the lead <b>before she had finished the sentence</b>.” What does this ending show?</p>`,
        options: ["Arlo wanted the woman to leave as quickly as possible.", "Arlo was doing only what Mum expected.", "Arlo wanted to prove the dog was his.", "Arlo understood her offer and leapt at it."], answer: 3,
        explain: `<p>The woman never actually asks. She mentions that she lives close, that the dog needs walking and that her legs are weak, and lets Arlo work it out. He does so at once, and fetching the lead is his “yes”: he <b>understood the offer and leapt at it</b>.</p><p class="why-not">He is not sending her away: the lead is for walks he will be taking. Mum plays no part in this moment, and Arlo has already accepted that the dog is hers by telling her how to look after him.</p>` },
    ],
  });

  /* ============ circle 1: missing sentences ============ */
  const BOWER_BANK = [
    "Although it is built from sticks, the bower is not a nest, and no eggs are ever laid in it.",
    "They steal the brightest pieces and carry them home to their own displays.",
    "This is why the female builds her nest high in a tree.",
    "He is not fussy about where the colour comes from.",
    "Another is that it matches the colour of the bird himself.",
    "The female studies the whole performance closely before making up her mind.",
  ];
  const bowerQ = (id, n, answer, explain) => ({ id, gap: n, cat: "Sentence links", stem: `<p>Which sentence fits <b>gap ${n}</b>? (Each sentence is used once only, and one is not used at all.)</p>`, options: BOWER_BANK, answer, explain });
  READING.push({
    id: "bower", tier: 1, format: "missing sentences", title: "The Bird That Collects Blue", bank: true,
    note: "Five sentences have been taken out of this article. Choose the sentence that fits each gap. There is one extra sentence that is not needed.",
    html: `<p>In the forests of eastern Australia lives a bird with an unusual hobby. The male satin bowerbird is a collector, and what he collects is anything blue. ${G(1)} Bottle tops, pegs, drinking straws, pen lids and parrot feathers are all carried off and arranged with great care.</p>
<p>The treasures are laid out in front of his bower, which he builds on the forest floor from hundreds of thin sticks. It has two curved walls standing side by side, with a narrow path between them. ${G(2)} It is more like a stage, built for one purpose only: to impress a visiting female.</p>
<p>When a female arrives, she steps into the path between the walls and watches. The male picks up his best blue objects one at a time, puffs out his feathers and dances, buzzing and whirring like a faulty machine. ${G(3)} If she is not impressed, she simply flies off to inspect the bower of a rival.</p>
<p>Competition between neighbours is fierce. A male with a fine collection must guard it, because other males will raid his bower the moment he leaves. ${G(4)} Some go further and wreck the walls as well, so the owner returns to a pile of sticks.</p>
<p>Nobody is certain why blue is the favourite colour. One idea is that blue things are rare in the forest, so a large collection proves that its owner is clever and hard-working. ${G(5)} Not every male is blue, though. A young male is green and brown, and needs about seven years to grow the glossy blue-black feathers of an adult. Until then he practises, building clumsy bowers that fall down and watching the older birds to see how it is done.</p>`,
    questions: [
      bowerQ("r3a", 1, 3, `<p>The sentence after the gap lists things from very different places: bottle tops, pegs, straws, feathers. That list is the proof of “<b>He is not fussy about where the colour comes from.</b>” “The colour” points back to “anything blue”.</p><p class="why-not">The sentences about the bower, the female and the thieves have nothing to refer to yet: none of them has been mentioned.</p>`),
      bowerQ("r3b", 2, 0, `<p>The walls and the path have just been described, and the next sentence says “It is more like a stage”. More like a stage than what? The missing sentence must say what the bower is <i>not</i>: “<b>Although it is built from sticks, the bower is not a nest…</b>”</p><p class="why-not">“This is why the female builds her nest high in a tree” is about nests too, but nothing before the gap gives a reason, and the “It” that follows would then mean her nest, not the bower.</p>`),
      bowerQ("r3c", 3, 5, `<p>The male has just danced, and the next sentence begins “If she is not impressed”. In between, we need the female judging him: “<b>The female studies the whole performance closely before making up her mind.</b>” “The whole performance” points back to the dance.</p><p class="why-not">The sentence about stealing starts with “They”, but only one male and one female are in this paragraph.</p>`),
      bowerQ("r3d", 4, 1, `<p>“Other males will raid his bower” needs to be followed by what the raiders do. “<b>They steal the brightest pieces…</b>” does that (“They” = the other males), and the next sentence builds on it: “Some go further and wreck the walls <i>as well</i>.”</p><p class="why-not">“As well” only makes sense if stealing has just been mentioned, so no other sentence can go here.</p>`),
      bowerQ("r3e", 5, 4, `<p>“<i>One</i> idea is…” sets up a second idea. “<b>Another is that it matches the colour of the bird himself</b>” supplies it, and leads on to “Not every male is blue, though.”</p><p class="why-not">The sentence left over is “This is why the female builds her nest high in a tree.” It is on the right subject, but nowhere in the article is there a reason for it to follow.</p>`),

  /* ============ circle 2: poem ============ */
  READING.push({
    id: "scarecrow", tier: 2, format: "poem", title: "Scarecrow",
    note: "Read the poem, then answer the questions.",
    html: `<p class="poem">All summer he has held his arms out wide
as though the field were something he had caught.
His coat belonged to someone’s grandfather;
his hat has never had a single thought.

Now two of them are sitting on his sleeve,
discussing, in their scratchy way, the weather,

    questions: [
      { id: "r4a", cat: "Comparisons & imagery", stem: `<p>The scarecrow holds his arms out “<b>as though the field were something he had caught</b>”. What does this make him seem like?</p>`,
        options: ["someone proudly showing off a prize", "someone waving his arms for help", "someone chasing the birds away", "someone who is just about to fall over"], answer: 0,
        explain: `<p>People spread their arms wide to show how big their catch was. The poet pretends the scarecrow’s stiff, outstretched arms are doing the same thing, as if the whole field were <b>his prize</b>.</p><p class="why-not">He is not waving or chasing: he has held the same pose “all summer”. Nothing suggests he is falling.</p>` },
      { id: "r4b", cat: "Purpose of a detail", stem: `<p>Why does the poet say that the scarecrow’s hat “<b>has never had a single thought</b>”?</p>`,
        options: ["to show that the hat is brand new", "to suggest the grandfather was forgetful", "to remind us there is no real head inside it", "to show the scarecrow is bored out in the field"], answer: 2,
        explain: `<p>A hat sits on a head, and a head has thoughts. This hat never has, because there is <b>no real head under it</b>: only straw. It is a gentle joke that reminds us the scarecrow is not alive.</p><p class="why-not">The coat, not the hat, came from a grandfather, and old clothes are not “brand new”. A scarecrow with no thoughts cannot be bored.</p>` },
      { id: "r4c", cat: "Feelings & inference", stem: `<p>In the second verse, two crows sit on the scarecrow’s sleeve “<b>discussing … the weather</b>”. What does this show?</p>`,
        options: ["The crows are planning to steal the wheat.", "The crows are completely at ease with him.", "The crows feel sorry for the scarecrow.", "A storm is on its way to the farm."], answer: 1,
        explain: `<p>Chatting about the weather is what you do when you are relaxed. The crows were “frightened for about a day”, and now they use him as a seat: they are <b>completely at ease</b>.</p><p class="why-not">They are talking about leaving, not stealing. The poem gives the crows no pity for him, and “the weather” is just small talk, not a warning of a storm.</p>` },
      { id: "r4d", cat: "Comparisons & imagery", stem: `<p>“<b>The frost will stitch white buttons on his chest.</b>” What is the poet describing?</p>`,
        options: ["The farmer will mend the old coat during the winter.", "Snow will bury the scarecrow completely.", "Someone will dress him in a new shirt.", "Small white patches of frost will form on him."], answer: 3,
        explain: `<p>Frost can’t sew. The poet imagines it as a tailor, and the “white buttons” are the <b>small round patches of frost</b> that will appear on the front of his coat.</p><p class="why-not">The farmer “will forget him until spring”, so nobody is mending or dressing him. Buttons are small spots, not a covering of snow.</p>` },
      { id: "r4e", cat: "Main idea", stem: `<p>Think about the whole poem. By the end, what has the scarecrow become?</p>`,
        options: ["a failure that the farmer is ashamed of", "a frightening figure once winter arrives", "the opposite of what he was made to be", "a lonely figure who longs to leave the field"], answer: 2,
        explain: `<p>A scarecrow is made to scare birds away. This one frightens them “for about a day”, and the poem ends with him <i>welcoming</i> “every bird that wants a rest”. He has become <b>the opposite of what he was made to be</b>, and “he does not mind”.</p><p class="why-not">The farmer forgets him, which is not the same as being ashamed. He never becomes frightening again, and “patient arms” and a smile do not suggest longing to leave.</p>` },

  /* ============ circle 2: four extracts ============ */
  const exQ = (id, cat, what, answer, explain) => ({ id, cat, stem: `<p>Which extract ${what}?</p>`, options: EX, answer, explain });
  READING.push({
    id: "trees", tier: 2, format: "four extracts", title: "Trees",
    note: "Read the four extracts about trees. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>The mulberry tree in our backyard was older than the house, and my sisters and I treated it as an extra room. Each of us had her own branch. Mine was the third one up, worn smooth where I sat, and from it I could see over three fences to the railway line. In November we came down with purple hands, purple mouths and purple school shirts, and my mother would sigh and reach for the lemon juice. When the tree came down in a storm, years later, we stood about on the lawn as though someone had died. In a way, someone had.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>A tree keeps a diary, although it has to be cut open before anyone can read it. In places with warm and cold seasons, a tree lays down a new layer of wood beneath its bark every year, and in a sawn trunk these layers show up as rings. Counting them gives the tree’s age. Their width tells a longer story: a broad ring records a year of good rain, while a narrow one marks a year of drought. Scientists no longer need to fell a tree to study it. They drill out a core of wood no thicker than a pencil, and the tree goes on growing.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>“Twenty-nine, thirty. Ready or not!” Somewhere below, Dominic began crashing through the garden. Wren pressed herself against the trunk of the fig and tried to breathe more quietly. She had never climbed this high. The ground looked a long way down, and rather hard. Dominic checked the shed, the water tank and the wheelie bins. He stood directly beneath her, hands on hips, and announced to nobody that she must have gone home. Wren grinned. Then she looked for the branch she had used to get up, and found that, from above, every branch looked exactly the same.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>The council plans to remove the plane trees from Station Street because their roots are lifting the footpath. I would ask the councillors to walk down that street at noon in January before they vote. Under the trees it is cool enough to stop and talk; beyond them, the pavement shimmers. A cracked footpath can be repaired in a week. A sixty-year-old tree cannot be replaced in a lifetime. By all means fix the path. But let us mend what is broken without destroying what is not.</p></div>`,
    questions: [
      exQ("r5a", "Feelings & inference", "shows somebody whose success leads straight to a new problem", 2, `<p>In <b>Extract C</b> Wren hides so well that Dominic gives up. She grins, and then finds she cannot tell which branch leads down. Winning the game is what has left her stuck.</p><p class="why-not">In D the problem (the footpath) has not been solved yet. The storm in A is a loss, not something caused by a success. B describes a method, not a person in trouble.</p>`),
      exQ("r5b", "Comparisons & imagery", "compares a natural thing to a written record", 1, `<p><b>Extract B</b> begins “A tree keeps a diary” and carries the idea on: the rings can be “read” and they “tell a longer story”. The rings are being compared to writing.</p><p class="why-not">Extract A compares the tree to “an extra room”, which is a place, not a record. C and D describe their trees plainly.</p>`),
      exQ("r5c", "Tone & attitude", "describes a loss that was felt like the loss of a person", 0, `<p>In <b>Extract A</b>, when the mulberry falls the family stands about “as though someone had died. In a way, someone had.” The tree had been part of the family.</p><p class="why-not">The writer of D fears losing trees, but they are still standing, and the argument is about shade, not grief. Nothing is lost in B or C.</p>`),

    ],
  });

  /* ============ circle 2: cloze ============ */
  READING.push({
    id: "stamps", tier: 2, format: "cloze", title: "The Stamp Album",
    note: "Some words are missing from this piece. Choose the word that fits each gap best.",
    html: `<p>When my grandfather died he left me his stamp album, a fat green book that smelled of dust and peppermints. I am ${G(1)} to say that I was not at all grateful. I was eleven, and I had been hoping for his telescope.</p>
<p>For months the album sat ${G(2)} on my shelf. Then, one wet Sunday, with nothing better to do, I opened it. Every page was ruled in pencil, and every stamp sat squarely in its place above a line of tiny, careful handwriting: the country, the year, and often a note about how he had ${G(3)} it. “Swapped with a sailor, 1958.” “From Aunt Vera’s letter, the one with the bad news.”</p>
<p>I had assumed that a collection was simply a heap of things. This was a life, sorted and labelled. I turned the pages more and more slowly, ${G(4)} to reach the end.</p>
<p>On the last page there were six empty squares, and a line in his handwriting that I have never forgotten: “For whoever comes next.” I went out the following Saturday and bought my first stamp. It was a common one, worth almost nothing, but I ruled the line beneath it as ${G(5)} as I could.</p>`,
    questions: [
      gapQ("r6a", 1, ["ashamed", "embarrassing", "guilty", "shy"], 0, `<p>“I am <b>ashamed</b> to say” is the set phrase for admitting something you are not proud of.</p><p class="why-not">“Embarrassing” describes a thing, not a person’s feeling: the writer would be <i>embarrassed</i>. “Guilty” and “shy” are not followed by “to say”.</p>`),

<div class="extract"><b class="tag">Extract B</b><p>Every snowflake begins as a speck of dust high in a cloud. Water vapour freezes onto it, forming a tiny six-sided crystal, and as the crystal tumbles through the cloud its six arms grow. Because all six pass through the same patches of colder, warmer, wetter and drier air, they grow in the same way, which is why a snowflake looks so perfectly balanced. No two flakes take quite the same path, however. This is the reason usually given for the old saying that no two snowflakes are alike. In 1885 an American farmer named Wilson Bentley became the first person to photograph a single snow crystal, and he went on to capture more than five thousand of them.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>The sled had belonged to Per’s father, and to his grandfather before that, and it showed. One runner was held on with wire. “It’s faster than it looks,” Per said, which was what his father always said. Ingrid, who owned a new plastic one in a shade called Arctic Lime, was kind enough not to reply. They dragged both sleds to the top of Miller’s Hill. Halfway down, the plastic sled hit a buried root and stopped dead. The old one did not so much as shudder. It carried Per on, past the gate, past the frozen trough, and very nearly into the next farm.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>Our ski resorts now make much of their own snow, pumping water uphill and spraying it from cannons whenever the weather lets them down. I understand why. A resort without snow is a car park with a view, and whole towns depend on the visitors. But each machine swallows water and electricity in quantities that ought to trouble us, particularly in a dry country. If winters are growing shorter, the honest response is to ask what else these mountains might offer, in every season, rather than to keep painting the slopes white and hoping nobody looks too closely.</p></div>`,

        explain: `<p>The storm has “left a piece of sky” in the road. A puddle on a clear day <b>reflects the blue sky</b>, so it looks like a window you could see through.</p><p class="why-not">The poem is about the puddle all the way through. Nothing mentions a drain, glass or paint: “window” is a comparison.</p>` },
      { id: "r12b", cat: "Purpose of a detail", stem: `<p>Why does the poet say “a gull goes flying <b>underneath the ground</b>”?</p>`,
        options: ["The gull is diving into a drain.", "The gull is flying very low over the road after the storm.", "The gull’s reflection appears below the puddle’s surface.", "The gull is hiding from the storm."], answer: 2,
        explain: `<p>In a reflection, things in the sky appear <i>down</i> in the puddle. The gull’s <b>reflection</b> seems to fly below the road. That is also why the clouds walk “upside down”.</p><p class="why-not">A gull flying low would still be above the ground, and the storm is over. Nothing suggests a drain.</p>` },
      { id: "r12c", cat: "Character & structure", stem: `<p>In the second verse, where is the speaker and what are they doing?</p>`,
        options: ["Standing at the red door of number twenty-three", "Lying on the road, looking up at the sky", "Watching the street from an upstairs window", "Looking down into the puddle at the reflections"], answer: 3,
        explain: `<p>Everything in this verse is seen <i>in</i> the puddle, ending with “my face … looking up at me”. The speaker is <b>bending over the puddle</b>, seeing their own reflection look back.</p><p class="why-not">The red door is one of the reflections, not where the speaker stands. Their face looks <i>up</i> from the puddle, so they are looking down, not lying on the road or watching from a window.</p>` },
      { id: "r12d", cat: "Comparisons & imagery", stem: `<p>“<b>the lamp post wobbles like a jelly mould, / and number twenty-three goes swimming off</b>”. What is happening?</p>`,
        options: ["Billy’s splash makes the reflections shake and slide.", "Billy knocks over the lamp post as he runs.", "The storm starts again and floods the street.", "Billy’s heavy boots shake the houses all along the street."], answer: 0,
        explain: `<p>Billy runs through the puddle and the water ripples. The <b>reflections</b> of the lamp post and the house shake and slide about. The real ones don’t move at all.</p><p class="why-not">These lines are still about what the puddle shows. A splash can’t knock down a lamp post or shake a house, and the storm has gone.</p>` },
      { id: "r12e", cat: "Main idea", stem: `<p>What does the last verse suggest about the puddle?</p>`,
        options: ["It dries up once the sun comes out.", "It is angry with Billy for splashing through it so hard.", "It shows a different sky from before.", "It calmly mends itself, as if nothing happened."], answer: 3,
        explain: `<p>The pieces “find their places”, the edges “knit together”, and the puddle puts the sky back “quietly, as if nothing had happened”. The puddle <b>calmly repairs</b> the picture.</p><p class="why-not">The puddle is given human actions, but they are calm, not angry. It puts the same sky back “where it goes”, and nothing dries up.</p>` },
    ],
