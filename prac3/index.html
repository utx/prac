  /* ============ circle 3: story ============ */
  READING.push({
    id: "volcano", tier: 3, format: "story", title: "The Science Fair",
    note: "Read the story, then answer the questions.",
    html: `<p>Hamid had built the volcano over three weekends, and it was magnificent. It stood knee-high on its plywood base, with papier-mâché ridges, a crater ringed in orange paint, and a tiny village of matchbox houses that he privately looked forward to destroying.</p>
<p>At the next table, Clementine Park had a row of bean plants in jam jars and a poster with a great deal of writing on it. Hamid had glanced at it once, in the way you might glance at a bus timetable for a town you never intend to visit.</p>
<p>The judges reached him at half past two. There were three of them, with clipboards.</p>
<p>“Whenever you’re ready,” said the tallest.</p>
<p>Hamid tipped in the vinegar. For one glorious second the crater hissed. Then a single orange bubble rose to the rim, considered the view, and sank. Nothing else happened. The matchbox village stood unharmed in the sunshine.</p>
<p>“Ah,” said the tallest judge, and wrote something short.</p>
<p>Hamid kept his eyes on the plywood. He was aware of his ears, which seemed to have grown.</p>
<p>“Is it the bicarb?” said a voice. Clementine was leaning over from her table, frowning at the crater the way a mechanic frowns at an engine. “If it gets damp it goes flat. Mine’s new. I used it for the soil test.” She was already holding out a paper cup.</p>
<p>The judges had moved on to her beans and were waiting, pens raised. Clementine did not appear to have noticed.</p>
<p>Hamid looked at the cup, and at the long poster she had clearly written herself, every line of it, and at the judges standing in front of an empty chair.</p>
<p>“They’re waiting for you,” he said.</p>
<p>“They can wait a minute,” said Clementine. “Go on. Two spoonfuls.”</p>
<p>The eruption, when it came, was everything he had hoped for. Orange foam swallowed the village whole. But the judges had their backs to it, and Hamid found that he did not much mind. He was reading, from the top, a poster about beans.</p>`,
    questions: [
      { id: "r7a", cat: "Comparisons & imagery", stem: `<p>Hamid glanced at Clementine’s poster “<b>in the way you might glance at a bus timetable for a town you never intend to visit</b>”. What does this tell us?</p>`,
        options: ["He found the poster too hard to understand.", "He thought her project had nothing to do with him.", "He was planning to read it properly later that day.", "He was worried that it was better than his."], answer: 1,
        explain: `<p>A timetable for a town you will never visit is of no use to you, so you barely look. Hamid gives the poster the same quick, uninterested glance: he thinks her project <b>has nothing to do with him</b>.</p><p class="why-not">He doesn’t read enough of it to find it hard, and “never intend to visit” rules out coming back later. He thinks his volcano is “magnificent”, so he isn’t worried.</p>` },
      { id: "r7b", cat: "Tone & attitude", stem: `<p>“Then a single orange bubble rose to the rim, <b>considered the view</b>, and sank.” Why does the writer describe the bubble like this?</p>`,
        options: ["to show that the eruption was just beginning", "to suggest that Hamid was not watching closely", "to show the vinegar was the wrong colour", "to make the failure seem slow and rather comic"], answer: 3,
        explain: `<p>The bubble is described like a person strolling up for a look and wandering off. After three weekends of work, one unhurried bubble is all Hamid gets. The joke makes the moment <b>slow and comic</b>, and shows just how little happened.</p><p class="why-not">The next sentence is “Nothing else happened”, so nothing is beginning. Hamid is watching every second. The colour of the bubble is not what goes wrong.</p>` },
      { id: "r7c", cat: "Feelings & inference", stem: `<p>“He was aware of his ears, <b>which seemed to have grown</b>.” What is Hamid feeling?</p>`,
        options: ["hot with embarrassment", "angry with Clementine", "proud of having tried", "eager to hear the judges"], answer: 0,
        explain: `<p>When you are embarrassed your ears burn and feel huge, as if everyone must be staring at them. Hamid won’t look up (“kept his eyes on the plywood”): he is <b>hot with embarrassment</b>.</p><p class="why-not">Clementine has not spoken yet, so he can’t be angry with her. He is hiding from the judges, not straining to hear them, and there is no pride in this moment.</p>` },
      { id: "r7d", cat: "Purpose of a detail", stem: `<p>The writer tells us that the judges “<b>were waiting, pens raised</b>” at Clementine’s table and that she “<b>did not appear to have noticed</b>”. Why are these details included?</p>`,
        options: ["to show that the judges were impatient people", "to show that Clementine was nervous about being judged", "to show that helping Hamid might cost her something", "to show that she did not care about her own project"], answer: 2,
        explain: `<p>Her own judging has begun and she is not there, because she is busy with his crater. The detail shows that her help is not free: <b>it could cost her</b> marks. That is what makes it generous.</p><p class="why-not">She did the soil test and wrote the whole poster herself, so she plainly cares about her project. Nothing shows nerves, and the judges are simply waiting, not complaining.</p>` },
      { id: "r7e", cat: "Character & structure", stem: `<p>At the end, the judges miss the eruption, yet Hamid “<b>did not much mind. He was reading, from the top, a poster about beans.</b>” What has changed in Hamid?</p>`,
        options: ["He has decided that volcanoes are childish.", "He has stopped caring about science altogether.", "He now thinks Clementine’s work deserves his attention.", "He wants to copy her idea for next year’s science fair."], answer: 2,
        explain: `<p>At the start he gave her poster one bored glance. Now he reads it “from the top”: all of it, properly. Her kindness has made him see her, and her work, as <b>worth his attention</b>, and that matters more to him than being watched by the judges.</p><p class="why-not">The eruption “was everything he had hoped for”, so he still loves his volcano. Reading a science poster is the opposite of giving up on science, and nothing suggests copying.</p>` },
    ],

  /* ============ circle 3: four extracts ============ */
  READING.push({
    id: "snow", tier: 3, format: "four extracts", title: "Snow",
    note: "Read the four extracts about snow. For each question, choose the extract that fits best.",
    html: `<div class="extract"><b class="tag">Extract A</b><p>I grew up in Darwin, where winter means a dry breeze and a cardigan you never quite need. So when my aunt in Canada pulled back the curtains on my first morning there, I did not at first understand what I was looking at. The street had been rubbed out. Cars had become soft white loaves, and the fence wore a tall hat on every post. What struck me most was the quiet. I had expected snow to be cold. Nobody had warned me that it would also turn the volume of the whole world down.</p></div>
<div class="extract"><b class="tag">Extract B</b><p>Every snowflake begins as a speck of dust high in a cloud. Water vapour freezes onto it, forming a tiny six-sided crystal, and as the crystal tumbles through the cloud its six arms grow. Because all six pass through the same patches of colder, warmer, wetter and drier air, they grow in the same way, which is why a snowflake looks so perfectly balanced. No two flakes take quite the same path, however. This is the reason usually given for the old saying that no two snowflakes are alike. In 1885 an American farmer named Wilson Bentley became the first person to photograph a single snow crystal, and he went on to capture more than five thousand of them.</p></div>
<div class="extract"><b class="tag">Extract C</b><p>The sled had belonged to Per’s father, and to his grandfather before that, and it showed. One runner was held on with wire. “It’s faster than it looks,” Per said, which was what his father always said. Ingrid, who owned a new plastic one in a shade called Arctic Lime, was kind enough not to reply. They dragged both sleds to the top of Miller’s Hill. Halfway down, the plastic sled hit a buried root and stopped dead. The old one did not so much as shudder. It carried Per on, past the gate, past the frozen trough, and very nearly into the next farm.</p></div>
<div class="extract"><b class="tag">Extract D</b><p>Our ski resorts now make much of their own snow, pumping water uphill and spraying it from cannons whenever the weather lets them down. I understand why. A resort without snow is a car park with a view, and whole towns depend on the visitors. But each machine swallows water and electricity in quantities that ought to trouble us, particularly in a dry country. If winters are growing shorter, the honest response is to ask what else these mountains might offer, in every season, rather than to keep painting the slopes white and hoping nobody looks too closely.</p></div>`,
    questions: [
      exQ("r8a", "Main idea", "describes something that proved to be better than it looked", 2, `<p>In <b>Extract C</b> the old sled is held together with wire, and the new plastic one looks far smarter. On the hill it is the old sled that sails on “very nearly into the next farm”.</p><p class="why-not">In A the snow is a surprise, but the writer never thought it looked poor. D argues that artificial snow is <i>worse</i> than it looks, which is the reverse.</p>`),
      exQ("r8b", "Purpose of a detail", "explains why something has such a regular shape", 1, `<p><b>Extract B</b> gives the reason for a snowflake’s balance: all six arms pass through the same air, so “they grow in the same way, which is why a snowflake looks so perfectly balanced”.</p><p class="why-not">Extract A describes shapes too (loaves, hats), but only to show what the street looked like. It doesn’t explain anything.</p>`),
      exQ("r8c", "Feelings & inference", "describes being struck by something the writer had not been told to expect", 0, `<p>In <b>Extract A</b> the writer “had expected snow to be cold”, but “Nobody had warned me” about the quiet. The silence is the surprise.</p><p class="why-not">In C the sled’s speed is exactly what Per said it would be. B and D explain and argue: neither describes a surprise.</p>`),
      exQ("r8d", "Tone & attitude", "suggests that people are avoiding an uncomfortable truth", 3, `<p><b>Extract D</b> calls for “the honest response” and accuses resorts of “painting the slopes white and hoping nobody looks too closely”. The writer thinks they would rather cover up shorter winters than face them.</p><p class="why-not">Ingrid in C keeps quiet about the sled, but that is politeness to a friend, and she turns out to be wrong. No truth is being hidden in A or B.</p>`),
      exQ("r8e", "Feelings & inference", "shows one person choosing not to hurt another’s feelings", 2, `<p>In <b>Extract C</b>, when Per claims his battered sled is fast, Ingrid “was kind enough not to reply”. She doesn’t believe him, and she keeps that to herself.</p><p class="why-not">The writer of D says “I understand why”, but that is being fair in an argument, not sparing someone’s feelings. The aunt in A simply opens the curtains.</p>`),
    ],
  });

/* ---------------------------------------------------------------
   STORM ISLAND: thinking questions (hand-written). Four options (A–D).
   tier 1–3 = storm circle 1–3; tier 4 = the boss (hardest third of the sample papers).

(() => {
  const { tbl, fig } = LIB;
  const WHO = (a, b) => [`${a} only`, `${b} only`, `Both ${a} and ${b}`, `Neither ${a} nor ${b}`];

  /* a five-square tile (a 2 × 2 block with one extra square), turned or flipped. Cells are [row, col]. */
  const norm = c => { const r0 = Math.min(...c.map(x => x[0])), c0 = Math.min(...c.map(x => x[1])); return c.map(([r, k]) => [r - r0, k - c0]); };
  const turn = c => norm(c.map(([r, k]) => [k, -r]));            // a quarter turn clockwise
  const flip = c => norm(c.map(([r, k]) => [r, -k]));            // turned over (mirror image)
  const P = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]];
  const tile = cells => {
    const u = 24, W = 3 * u + 6, has = (r, k) => cells.some(c => c[0] === r && c[1] === k);
    const desc = "A tile of five squares on a 3 by 3 grid. " + [0, 1, 2].map(r => `Row ${r + 1}: ${[0, 1, 2].map(k => has(r, k) ? "square" : "empty").join(", ")}`).join(". ") + ".";
    return `<svg viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" role="img" aria-label="${desc}">${cells.map(([r, k]) => `<rect x="${3 + k * u}" y="${3 + r * u}" width="${u}" height="${u}" fill="#b9e3c6" stroke="${INK}" stroke-width="2"/>`).join("")}</svg>`;
  };
  const PTILE = fig(tile(P));

  /* towers of cubes seen from above, and a view of them from one side */
  const PLAN = `<div class="figure"><div style="display:inline-flex;align-items:center;gap:10px"><div><table class="grid" style="font-weight:700;margin:0"><tr><td>1</td><td>3</td><td>1</td></tr><tr><td>2</td><td>1</td><td>1</td></tr><tr><td>1</td><td>1</td><td>2</td></tr></table><div style="font-size:14px;font-weight:700;letter-spacing:2px;margin-top:4px">▲ FRONT ▲</div></div><div style="font-size:14px;font-weight:700;text-align:left">◀ Mia stands here,<br>on the right-hand side,<br>looking at the towers</div></div></div>`;
  const view = h => {
    const u = 22, H = 3 * u + 6;
    return `<svg viewBox="0 0 ${3 * u + 6} ${H}" width="${3 * u + 6}" height="${H}" role="img" aria-label="Three columns of squares side by side. From left to right they are ${h.join(", ")} squares tall.">${h.map((n, c) => Array.from({ length: n }, (_, k) => `<rect x="${3 + c * u}" y="${H - 3 - (k + 1) * u}" width="${u}" height="${u}" fill="#c9d6f2" stroke="${INK}" stroke-width="2"/>`).join("")).join("")}</svg>`;
  };

  THINKING.push(
    /* ===================== circle 1 ===================== */
    { id: "t101", tier: 1, cat: "Supports the claim",
      stem: `<div class="box">Ranger Kim: “Visitors should keep to the marked track through the sand dunes. That way the dune plants will have a chance to grow back.”</div><p>Which statement, if true, best supports Ranger Kim’s claim?</p>`,
      options: ["The marked track has the best view of the sea.", "Dune plants help to hold the sand in place during storms.", "Dune plants are easily crushed when people walk on them.", "Most visitors already carry a map that shows the track."], answer: 2,
      explain: `<p>The claim joins two things: staying on the track, and the plants growing back. The best support explains the link. If plants are <b>crushed by feet</b>, then keeping feet on the track is what lets them grow.</p><p class="why-not">The view and the maps are about the track, not the plants. The fact about storms tells us why the plants matter, but not why staying on the track helps them.</p>` },
    { id: "t102", tier: 1, cat: "Spot the mistake",
      stem: `<div class="box">Sam’s mum has a red tag on her keys. In the park, Sam finds a bunch of keys with a red tag.<br>Sam: “These must be Mum’s keys.”</div><p>Which one of these shows the mistake Sam has made?</p>`,
      options: ["Other people’s keys may have a red tag too.", "Sam’s mum may have more than one bunch of keys.", "The keys may have been in the park for a long time.", "Red may not be Sam’s mum’s favourite colour."], answer: 0,
      explain: `<p>Sam has matched just <b>one thing</b>: the red tag. That would only prove the keys are Mum’s if nobody else had a red tag, and Sam doesn’t know that.</p><p class="why-not">How many bunches Mum owns, how long the keys have been there and which colour she likes best don’t show what is wrong with jumping from “red tag” to “Mum’s keys”.</p>` },
    { id: "t103", tier: 1, cat: "Order & arrangement",
      stem: `<p>Three jars stand in a row on a shelf: jam, honey and pickles.</p><p>The jam is somewhere to the left of the honey.<br>The pickles are not next to the jam.</p><p>Which jar is in the middle?</p>`,
      options: ["the jam", "the honey", "the pickles", "It is impossible to tell."], answer: 1,
      explain: `<p>The pickles are not next to the jam, so those two must be at the two ends, with the <b>honey</b> between them. The jam is left of the honey, so the row is jam, honey, pickles.</p><p class="why-not">If the jam or the pickles were in the middle, the pickles would be right next to the jam. There is only one row that fits, so it is possible to tell.</p>` },
    { id: "t104", tier: 1, cat: "Rules & codes",
      stem: `<p>Mika only eats sandwiches that have <b>cheese</b> in them but <b>no tomato</b>.</p>${tbl(["Sandwich", "Fillings"], [["1", "cheese, ham"], ["2", "cheese, tomato"], ["3", "egg, lettuce"], ["4", "cheese, lettuce, tomato"], ["5", "cheese, cucumber"]])}<p>How many of these sandwiches will Mika eat?</p>`,
      options: ["1", "2", "3", "4"], answer: 1,
      explain: `<p>Both parts of the rule must be true. Sandwiches 1 and 5 have cheese and no tomato, so Mika eats <b>2</b>.</p><p class="why-not">Four sandwiches have cheese, but two of those also have tomato. Three sandwiches have no tomato, but one of those (egg and lettuce) has no cheese.</p>` },
    { id: "t105", tier: 1, cat: "Number problems",
      stem: `<p>Leo feeds his lizard every <b>second</b> day. He feeds it on a Monday, then on the Wednesday, and so on.</p><p>On which day of the week does Leo feed the lizard for the <b>fifth</b> time?</p>`,
      options: ["Friday", "Saturday", "Sunday", "Tuesday"], answer: 3,
      explain: `<p>List the feeds: 1st Monday, 2nd Wednesday, 3rd Friday, 4th Sunday, 5th <b>Tuesday</b>.</p><p class="why-not">Sunday is the fourth feed: the Monday counts as the first feed, not as number zero. Friday is the third. Saturday is never a feeding day in that week.</p>` },
    { id: "t106", tier: 1, cat: "Tables & timetables",
      stem: `<p>The table shows four children’s marks out of 20 in two spelling tests.</p>${tbl(["", "Test 1", "Test 2"], [["Ana", 12, 17], ["Bo", 15, 19], ["Cy", 9, 16], ["Di", 18, 20]])}<p>Who <b>improved</b> the most from Test 1 to Test 2?</p>`,
      options: ["Ana", "Bo", "Cy", "Di"], answer: 2,
      explain: `<p>Improvement is the gain, Test 2 take away Test 1. Ana +5, Bo +4, <b>Cy +7</b>, Di +2.</p><p class="why-not">Di has the highest marks in both tests but gained the least. The question asks who went up the most, not who scored the most.</p>` },
    { id: "t107", tier: 1, cat: "Must or cannot be true",
      stem: `<div class="box">Every child in the Dolphins swimming group can swim 25 metres.<br>Nadia is in the Dolphins.<br>Omar can swim 25 metres.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["Nadia can swim 25 metres.", "Omar is in the Dolphins.", "Nadia is a faster swimmer than Omar.", "Only Dolphins can swim 25 metres."], answer: 0,
      explain: `<p>Every Dolphin can swim 25 metres and Nadia is a Dolphin, so <b>Nadia can swim 25 metres</b>.</p><p class="why-not">Omar can swim 25 metres, but the rule never says that <i>only</i> Dolphins can, so he might be in another group. Nothing is said about speed.</p>` },
    { id: "t108", tier: 1, cat: "Spatial",
      stem: `<p>Jo stands facing <b>north</b>. She makes a quarter turn to her right. Then she makes a half turn.</p><p>Which way is Jo facing now?</p>`,
      options: ["north", "east", "south", "west"], answer: 3,
      explain: `<p>A quarter turn to the right from north takes Jo to east. A half turn then points her the opposite way: <b>west</b>.</p><p class="why-not">East is where she faces after only the first turn. South would need just one more quarter turn, not a half turn.</p>` },

    /* ===================== circle 2 ===================== */
    { id: "t201", tier: 2, cat: "Spot the mistake",
      stem: `<div class="box">To enter the art prize, a painting must be handed in by Friday. Zane handed his painting in on Wednesday.<br>Zane: “I got mine in early, so I am sure to win a prize.”</div><p>Which one of these shows the mistake Zane has made?</p>`,
      options: ["Zane may have painted more quickly than the other children.", "Being on time may only let Zane’s painting into the contest.", "The judges may not look at any of the paintings until the following week.", "Some children may hand in their paintings on Thursday."], answer: 1,
      explain: `<p>Being on time is <b>needed</b> to enter, but it does not <b>guarantee</b> a prize. Every painting handed in by Friday is in the same position.</p><p class="why-not">How fast Zane painted, when the judging happens and when other children hand theirs in don’t explain why “on time” is not the same as “winner”.</p>` },
    { id: "t202", tier: 2, cat: "Supports the claim",
      stem: `<div class="box">Mr Diaz, the caretaker: “We should put a second bin beside the oval. Then less rubbish will be left on the grass.”</div><p>Which statement, if true, best supports Mr Diaz’s claim?</p>`,
      options: ["Three different classes use the oval for games every lunchtime.", "Rubbish left on the grass attracts ibises.", "The school already has a bin near the canteen.", "Children say the only bin is too far away from the oval."], answer: 3,
      explain: `<p>The claim needs a reason why a bin <i>beside the oval</i> would cut the rubbish. If children drop rubbish because the bin is <b>too far away</b>, a nearer bin fixes exactly that.</p><p class="why-not">How many classes use the oval and what the rubbish attracts show that rubbish is a problem, not that a second bin would solve it. A bin near the canteen is the far-away bin already there.</p>` },
    { id: "t203", tier: 2, cat: "Whose reasoning",
      stem: `<div class="box">Most of the apples in a box are green. The rest are red.</div><p>Priya: “If I take an apple from the box without looking, it will probably be green.”</p><p>Quentin: “The apple on the teacher’s desk is green, so it probably came from this box.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Priya", "Quentin"), answer: 0,
      explain: `<p>“Most apples in the box are green” tells us about apples <i>from the box</i>. So an apple taken from it is probably green: <b>Priya</b> is right.</p><p class="why-not">Quentin turns it round. We are told nothing about where green apples usually come from. There could be thousands of green apples that were never in this box.</p>` },
    { id: "t205", tier: 2, cat: "Order & arrangement",
      stem: `<p>Four boats finished a race, one after another.</p><p>The red boat finished before the blue boat but after the green boat.<br>The yellow boat finished after the red boat.<br>The blue boat was not last.</p><p>Which boat came <b>third</b>?</p>`,
      options: ["the red boat", "the yellow boat", "the blue boat", "the green boat"], answer: 2,
      explain: `<p>Green is before red, and red is before both blue and yellow, so the race starts green, red. Blue was not last, so blue is third and yellow is fourth: green, red, <b>blue</b>, yellow.</p><p class="why-not">Yellow is tempting because it is the last boat mentioned, but the final clue pushes yellow to the back. Red and green are fixed in second and first place.</p>` },
    { id: "t206", tier: 2, cat: "Rules & codes",
      stem: `<p>In a word game, each letter is worth points:</p>${tbl(["A", "E", "T", "M", "S"], [["1", "2", "3", "4", "5"]]).replace("<th>1</th>", "<td>1</td>")}<p>A word’s score is the total of its letters. So <b>TEAM</b> scores 3 + 2 + 1 + 4 = 10.</p><p>Which of these words scores the most?</p>`,
      options: ["MATES", "TASTE", "STEAM", "MESS"], answer: 3,
      explain: `<p>Add each word: MATES = 4 + 1 + 3 + 2 + 5 = 15. TASTE = 3 + 1 + 5 + 3 + 2 = 14. STEAM = 15. <b>MESS</b> = 4 + 2 + 5 + 5 = 16.</p><p class="why-not">The longer words look as if they should win, but MESS has two letters worth 5. MATES and STEAM use the same five letters, so they tie on 15.</p>` },
    { id: "t207", tier: 2, cat: "Tables & timetables",
      stem: `<p>The table shows how many stickers two children have.</p>${tbl(["", "Animal", "Space", "Sport"], [["Ivy", 6, 5, 4], ["Jon", 7, 2, 8]])}<p>Ivy gives Jon <b>3 space</b> stickers. Jon gives Ivy <b>2 sport</b> stickers.</p><p>After the swap, how many <b>more</b> stickers does Jon have than Ivy?</p>`,
      options: ["2", "3", "4", "8"], answer: 2,
      explain: `<p>Before: Ivy 6 + 5 + 4 = 15 and Jon 7 + 2 + 8 = 17.</p><p>After: Ivy 15 − 3 + 2 = 14 and Jon 17 + 3 − 2 = 18. Jon has <b>4</b> more.</p><p class="why-not">2 is the gap before the swap. 3 changes only one child’s total: every sticker that moves makes one pile smaller <i>and</i> the other bigger. 8 stops after Ivy’s gift and forgets the stickers Jon gives back.</p>` },
    { id: "t208", tier: 2, cat: "Number problems",
      stem: `<p>A dentist sees patients from <b>9:00 am</b> until <b>5:00 pm</b>, with a lunch break from 12:30 pm to 1:30 pm.</p><p>Every check-up takes exactly 30 minutes, and there are no gaps between them.</p><p>How many check-ups can the dentist do in one day?</p>`,
      options: ["7", "14", "15", "16"], answer: 1,
      explain: `<p>Morning: 9:00 to 12:30 is 3½ hours = 7 check-ups. Afternoon: 1:30 to 5:00 is 3½ hours = 7 check-ups. Altogether <b>14</b>.</p><p class="why-not">16 forgets the lunch break (8 hours of check-ups). 15 takes off only half an hour for lunch. 7 is just the morning.</p>` },
    { id: "t209", tier: 2, cat: "Must or cannot be true",
      stem: `<p>Asha is taller than Ben, and Ben is taller than Col.</p><p>The three friends stand on a staircase, each on a different step. Now the tops of their heads are exactly level.</p><p>Which one of these <b>cannot</b> be true?</p>`,
      options: ["Ben is on a higher step than Col.", "Asha is on the lowest step.", "Col is on the highest step.", "Ben is on a step between the other two."], answer: 0,
      explain: `<p>For the heads to be level, the shortest person needs the most help from the stairs. So Col is highest, Ben is in between and Asha is lowest.</p><p>That makes “<b>Ben is on a higher step than Col</b>” impossible: Ben is taller, so on a higher step his head would be above Col’s.</p><p class="why-not">The other three statements describe exactly how they must be standing.</p>` },
    { id: "t210", tier: 2, cat: "Spatial", visual: true,
      stem: `<p>Here is a tile made of five squares.</p>${PTILE}<p>Three of the tiles below are this tile <b>turned round</b>. One has been <b>flipped over</b>, so it is a mirror image.</p><p>Which tile has been flipped over?</p>`,
      options: [tile(flip(turn(P))), tile(turn(P)), tile(turn(turn(P))), tile(turn(turn(turn(P))))], answer: 0,
      explain: `<p>Turn the first tile in your head, a quarter turn at a time. Going clockwise round the block of four, the extra square always sits just <i>after</i> the same corner. Three of the tiles keep that pattern.</p><p>In the <b>first tile (A)</b> the extra square is on the other side of the block. No amount of turning does that: the tile must have been flipped over.</p><p class="why-not">The other three are the tile after a quarter turn, a half turn and a three-quarter turn.</p>` },

    /* ===================== circle 3 ===================== */
    { id: "t301", tier: 3, cat: "Whose reasoning",
      stem: `<div class="box">A rule in a board game: “If you roll a six, you get another turn.” The rule is always followed.</div><p>Ed: “Fay got another turn, so she must have rolled a six.”</p><p>Gus: “Hana did not get another turn, so she cannot have rolled a six.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Ed", "Gus"), answer: 1,
      explain: `<p>The rule says what happens <i>after a six</i>. If Hana had rolled a six she would have had another turn. She didn’t, so she didn’t roll one: <b>Gus</b> is right.</p><p class="why-not">Ed runs the rule backwards. The rule does not say a six is the <i>only</i> way to get another turn. Fay might have landed on a bonus square.</p>` },
    { id: "t302", tier: 3, cat: "Spot the mistake",
      stem: `<div class="box">A survey found that most children at Hillside School like the new playground.<br>Mia: “My cousin goes to Hillside, so she likes the new playground.”</div><p>Which one of these shows the mistake Mia has made?</p>`,
      options: ["The survey may have been done before the playground was finished.", "Mia may not have seen the new playground herself.", "Children at other schools may like their playgrounds more.", "Mia’s cousin may be one of the children who do not like it."], answer: 3,
      explain: `<p>“Most” is not “all”. Some Hillside children do not like the playground, and Mia’s <b>cousin could be one of them</b>. Mia can only say her cousin <i>probably</i> likes it.</p><p class="why-not">The timing of the survey, whether Mia has seen the playground and what other schools think don’t explain what is wrong with going from “most children” to “this child”.</p>` },
    { id: "t303", tier: 3, cat: "Supports the claim",
      stem: `<div class="box">Dr Osei: “High schools should start lessons an hour later in the morning. Then students would learn more in their first lesson of the day.”</div><p>Which statement, if true, best supports Dr Osei’s claim?</p>`,
      options: ["Students who are still sleepy take in less of what they are taught.", "Many high school students say they would like a later start.", "Teenagers tend to go to bed later than younger children do.", "Students who learn more in the mornings usually go on to get better marks."], answer: 0,
      explain: `<p>The claim needs a link from “starting later” to “learning more”. If <b>sleepy students take in less</b>, then a later start (more sleep) means more is learned.</p><p class="why-not">What students would like is not about learning. Going to bed later explains why they are tired, but stops before learning. Better marks is about what happens <i>after</i> learning more, not what causes it.</p>` },
    { id: "t304", tier: 3, cat: "Spatial", visual: true,
      stem: `<p>Towers of cubes stand on a 3 by 3 board. This plan shows the board from <b>above</b>. Each number tells you how many cubes are in that tower.</p>${PLAN}<p>What does Mia see?</p>`,
      options: [view([2, 3, 2]), view([3, 2, 2]), view([2, 2, 3]), view([2, 1, 1])], answer: 2,
      explain: `<p>From the side, Mia sees one column for each <i>row</i> of the plan, and each column is as tall as the tallest tower in that row. Front row: 2. Middle row: 2. Back row: 3.</p><p>Standing on the right-hand side, the front of the board is on Mia’s left, so she sees <b>2, 2, 3</b> from left to right (C).</p><p class="why-not">2, 3, 2 is the view from the front. 3, 2, 2 is the view from the opposite side. 2, 1, 1 is only the nearest line of towers: taller towers behind them still show over the top.</p>` },
    { id: "t305", tier: 3, cat: "Rules & codes",
      stem: `<p>A coach must choose <b>three</b> of these five swimmers for a relay: Ada, Bo, Cy, Di and Eli.</p><div class="box">Ada and Bo will not swim in the same team.<br>If Cy is chosen, Di must be chosen too.<br>Eli must be chosen.</div><p>Which team can the coach choose?</p>`,
      options: ["Bo, Di and Eli", "Ada, Bo and Eli", "Ada, Cy and Eli", "Bo, Cy and Di"], answer: 0,
      explain: `<p>Test each team against all three rules. <b>Bo, Di and Eli</b>: Ada and Bo are not together, Cy is not chosen so the second rule does not matter, and Eli is in. It works.</p><p class="why-not">Ada, Bo and Eli puts Ada and Bo together. Ada, Cy and Eli has Cy without Di. Bo, Cy and Di leaves out Eli.</p>` },
    { id: "t306", tier: 3, cat: "Tables & timetables",
      stem: `<p>Four garden lamps are on timers.</p>${tbl(["Lamp", "Switches on", "Switches off"], [["A", "5:00 pm", "8:30 pm"], ["B", "6:15 pm", "9:00 pm"], ["C", "7:00 pm", "7:45 pm"], ["D", "8:00 pm", "10:00 pm"]])}<p>For how long altogether are <b>three</b> lamps on at the same time?</p>`,
      options: ["30 minutes", "45 minutes", "1 hour 15 minutes", "2 hours 15 minutes"], answer: 2,
      explain: `<p>A and B are both on from 6:15 to 8:30. During that time C joins them from 7:00 to 7:45 (45 minutes), and D joins them from 8:00 until A goes off at 8:30 (30 minutes).</p><p>45 + 30 = <b>1 hour 15 minutes</b>. (C and D are never on together, so there are never four.)</p><p class="why-not">45 minutes and 30 minutes are each only one of the two stretches. 2 hours 15 minutes is how long A and B are on together, which is only two lamps.</p>` },
    { id: "t307", tier: 3, cat: "Must or cannot be true",
      stem: `<div class="box">In a hockey league, a team wins a game only if it scores more goals than the other team. If the two teams score the same, the game is a draw.<br>Last Saturday the Otters scored no goals.</div><p>Which one of these <b>must</b> be true?</p>`,
      options: ["The Otters lost on Saturday.", "The other team scored at least one goal.", "The Otters have not won a game this season.", "The Otters did not win on Saturday."], answer: 3,
      explain: `<p>To win you must score more than the other team, and nobody can score fewer than zero. So with no goals <b>the Otters did not win</b>.</p><p class="why-not">They need not have lost: if the other team also scored nothing, it was a 0–0 draw. That is also why the other team need not have scored. One Saturday tells us nothing about the rest of the season.</p>` },
    { id: "t308", tier: 3, cat: "Number problems",
      stem: `<p>There are <b>24</b> children in a class. <b>15</b> play soccer and <b>12</b> play netball. <b>2</b> children play neither sport.</p><p>How many children play <b>both</b> soccer and netball?</p>`,
      options: ["3", "5", "7", "10"], answer: 1,
      explain: `<p>24 − 2 = 22 children play at least one sport. But 15 + 12 = 27, which is 5 too many. The extra 5 are the children who were counted twice, once for each sport: <b>5</b> play both.</p><p>Check: 10 soccer only + 5 both + 7 netball only + 2 neither = 24.</p><p class="why-not">3 is just 15 − 12. 7 is the number who play netball only, and 10 is the number who play soccer only.</p>` },

    /* ===================== the boss ===================== */
    { id: "t401", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">A bag holds 6 lemon, 4 mint and 3 berry lollies. They are all wrapped the same, so nobody can tell them apart.</div><p>Pia: “If I take out 4 lollies, I am certain to get at least two of the same flavour.”</p><p>Raj: “If I take out 8 lollies, I am certain to get at least one berry.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Pia", "Raj"), answer: 0,
      explain: `<p>To be <i>certain</i>, think of the unluckiest case. There are only 3 flavours, so the first 3 lollies could all be different, but the 4th must match one of them. <b>Pia</b> is right.</p><p class="why-not">Raj is wrong: there are 6 + 4 = 10 lollies that are not berry, so his 8 could all be lemon and mint. He would need 11 to be certain.</p>` },
    { id: "t402", tier: 4, cat: "Spot the mistake",
      stem: `<div class="box">After recess, the door of the class hamster’s cage was found open. Only Ivy and Jack were in the room during recess.<br>Ivy: “I didn’t open it, so Jack must have.”</div><p>Which one of these shows the mistake Ivy has made?</p>`,
      options: ["Jack may like the hamster more than Ivy does.", "Ivy may have been in the room for much longer than Jack was.", "The hamster may not have left its cage.", "The door may not have been latched properly before recess."], answer: 3,
      explain: `<p>Ivy thinks there are only two possibilities: she opened it, or Jack did. There is a third: <b>nobody opened it at recess</b>. A door that was not latched could have swung open by itself.</p><p class="why-not">Who likes the hamster, who was in the room longer and whether the hamster got out don’t point to anything wrong with her “me or Jack” thinking.</p>` },
    { id: "t403", tier: 4, cat: "Number problems",
      stem: `<p>A class of <b>20</b> children voted for a mascot: an owl, a fox or a frog. Every child voted for exactly <b>two</b> of the three animals.</p><p>The owl got 14 votes and the fox got 15 votes.</p><p>How many votes did the frog get?</p>`,
      options: ["9", "11", "20", "29"], answer: 1,
      explain: `<p>20 children with 2 votes each makes 40 votes altogether. The owl and the fox took 14 + 15 = 29 of them, so the frog got 40 − 29 = <b>11</b>.</p><p class="why-not">29 is the owl’s and fox’s votes, not the frog’s. 20 is the number of children, and each of them had two votes, not one. 9 comes from taking 29 away from the wrong total.</p>` },
    { id: "t404", tier: 4, cat: "Spatial",
      stem: `<p>On a dice, the numbers on opposite faces always add up to <b>7</b>.</p><p>A dice sits on a table with <b>1 on top</b>, <b>2 facing you</b> and <b>3 on the right-hand side</b>.</p><p>You tip the dice over once to the <b>right</b>, so the top face becomes the right-hand face. Then you tip it once <b>towards you</b>, so the top face becomes the face that looks at you.</p><p>Which number is on top now?</p>`,
      options: ["2", "4", "5", "6"], answer: 2,
      explain: `<p>Start: top 1, bottom 6, front 2, back 5, right 3, left 4.</p><p>Tip to the right: the left face comes up, so the top is 4 (front and back stay as 2 and 5).</p><p>Tip towards you: the back face comes up, so the top is <b>5</b>.</p><p class="why-not">4 stops after the first tip. 6 is opposite the 1 you started with, but the bottom never comes straight to the top in one tip. 2 is the face that started at the front; after the second tip it is underneath.</p>` },
    { id: "t405", tier: 4, cat: "Order & arrangement",
      stem: `<p>Five shelves are numbered 1 (bottom) to 5 (top). Each holds one thing: a globe, a clock, a vase, a lamp and a trophy.</p><div class="box">The trophy is on shelf 3.<br>The lamp is on the shelf directly above the globe.<br>The clock is higher than the vase.<br>The vase is not on the bottom shelf.</div><p>What is on shelf <b>4</b>?</p>`,
      options: ["the clock", "the lamp", "the globe", "the vase"], answer: 3,
      explain: `<p>With the trophy on 3, the globe and lamp (one directly above the other) must be on 1 and 2, or on 4 and 5.</p><p>If they were on 4 and 5, the vase and clock would be on 1 and 2. The vase can’t be on 1, so it would be on 2 with the clock below it. But the clock must be higher. That fails.</p><p>So the globe is on 1 and the lamp on 2. The vase and clock take 4 and 5 with the clock higher: the <b>vase</b> is on 4.</p><p class="why-not">The clock is on 5, the lamp on 2 and the globe on 1.</p>` },
    { id: "t406", tier: 4, cat: "Whose reasoning",
      stem: `<div class="box">The canteen sells soup <b>only</b> on days when the temperature at 9 am is below 15 degrees. On every such day, it does sell soup.</div><p>Wes: “The canteen is selling soup today, so it was below 15 degrees at 9 am.”</p><p>Xan: “It was 20 degrees at 9 am today, so there will be no soup at the canteen.”</p><p>Whose reasoning is correct?</p>`,
      options: WHO("Wes", "Xan"), answer: 2,
      explain: `<p>“Only on days below 15 degrees” means soup is never sold on a warmer day. So if soup is on sale it must have been below 15 (Wes), and on a 20-degree morning there can be no soup (Xan). <b>Both</b> are right.</p><p class="why-not">Many rules only work in one direction, which is why “only one of them” is tempting. Here the word “only” makes Wes’s and Xan’s statements two ways of saying the same thing.</p>` },
    { id: "t407", tier: 4, cat: "Supports the claim",
      stem: `<div class="box">Councillor Abara: “We should plant shady trees along the footpaths of Main Street. Then more people will walk to the shops in summer instead of driving.”</div><p>Which statement, if true, best supports the councillor’s claim?</p>`,
      options: ["Streets lined with trees look more attractive to visitors.", "Many people say Main Street is too hot to walk along in summer.", "Parking spaces near the shops are very hard to find during summer.", "People who walk to the shops tend to visit more of them."], answer: 1,
      explain: `<p>The claim is that <i>shade</i> will get people walking. That only works if <b>heat is what stops them now</b>. If people say the street is too hot to walk along, shady trees remove the reason they drive.</p><p class="why-not">Looking attractive is a different benefit of trees. Scarce parking is a reason to walk that has nothing to do with trees. More shop visits is a result of walking, not a reason that trees would cause it.</p>` },
  );
})();

</script>
<script>
(() => {
"use strict";
const KEY = "prac3.v1";
const LETTERS = "ABCDEF";
const P2 = "../prac2/art/";          // pictures shared with Crown Quest
const app = document.getElementById("app");
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- the game's numbers ---------- */
const GUNS = [
  { id: "pistol", name: "Suppressed Pistol", rar: "Common", col: "#8a94a6", dmg: 25, cost: 0 },
  { id: "shotgun", name: "Tactical Shotgun", rar: "Rare", col: "#2f8fff", dmg: 35, cost: 250 },
  { id: "minigun", name: "Minigun", rar: "Legendary", col: "#ffb21a", dmg: 50, cost: 800 },
];
const ITEMS = [
  { id: "med", name: "Med Kit", img: "medkit", col: "#3fae2a", cost: 30, what: "+50 health" },
  { id: "shield", name: "Shield Potion", img: "shieldpotion", col: "#2f8fff", cost: 40, what: "+50 shield" },
];
const CARRY = 3, MAXHP = 100, MAXSH = 50, CAMP_HEAL = 40;
/* storm circles: enemy health, the damage a miss costs, coins for a win, and the storm's radius (% of the map) */
const STAGE = { 1: { hp: 60, dmg: 20, coins: 15, r: 80 }, 2: { hp: 75, dmg: 25, coins: 25, r: 37 }, 3: { hp: 90, dmg: 30, coins: 35, r: 25 }, 4: { hp: 150, dmg: 35, coins: 80, r: 13.5 } };
const WIN_COINS = 50;
const WIN_MIN = 8;                                   // Fortnite minutes for winning a match (the boss is beaten)
const missBonus = m => m === 0 ? 7 : m <= 2 ? 5 : m <= 4 ? 3 : m <= 6 ? 1 : 0;   // extra minutes for few misses
const KIND = {
  reading: { label: "Reading", icon: "📖", arena: "arena-forest", col: "#2e7d4f" },
  thinking: { label: "Thinking", icon: "🧩", arena: "arena-peaks", col: "#7a4bb5" },
  maths: { label: "Maths", icon: "🔢", arena: "arena-reef", col: "#0b6fa4" },
};
const FOES = {
  reading: [["lynx", "Lynx"], ["sparkle", "Sparkle Specialist"], ["ghoul", "Ghoul Trooper"]],
  thinking: [["visitor", "The Visitor"], ["darkvoyager", "Dark Voyager"], ["carbide", "Carbide"]],
  maths: [["rex", "Rex"], ["tomatohead", "Tomatohead"], ["beefboss", "Beef Boss"], ["meowscles", "Meowscles"]],
};
const BOSSES = [["omega", "Omega"], ["blackknight", "Black Knight"], ["iceking", "The Ice King"]];
/* outfits for the hero: [picture, name, rarity colour, crowns needed, folder] */
const SKINS = [["jonesy", "Jonesy", "#8a94a6", 0, "art/"], ["renegade", "Renegade Raider", "#2f8fff", 1, "art/"], ["britebomber", "Brite Bomber", "#2f8fff", 2, P2],
  ["fishstick", "Fishstick", "#2f8fff", 3, P2], ["peely", "Peely", "#a34dff", 5, P2], ["raptor", "Raptor", "#ffb21a", 7, "art/"], ["cuddle", "Cuddle Team Leader", "#ffb21a", 9, P2],
  ["drift", "Drift", "#ffb21a", 12, P2], ["crackshot", "Crackshot", "#ffb21a", 15, "art/"], ["midas", "Midas", "#ffb21a", 20, P2]];
/* where things stand on the island (% of the map) */
const SPOTS = { 1: [[20, 17], [75, 16], [82, 75]], 2: [[20, 58], [70, 33]], 3: [[33, 40], [69, 67]], 4: [[50, 45]] };
const SHOP_AT = [41, 58.5], CAMP_AT = [59, 57.5], EYE = [50, 52];   // the storm closes on EYE
const PLANS = [[["reading", "thinking"], ["maths", "thinking"]], [["thinking", "maths"], ["reading", "maths"]], [["reading", "maths"], ["thinking", "maths"]]];

/* Epic's own pictures of the guns and items (see the notice at the foot of the page) */
const gunPic = id => `<img class="gunpic" src="art/gun-${id}.webp" alt="">`;
const pic = (name, cls = "ico") => `<img class="${cls}" src="art/${name}.webp" alt="">`;

/* ---------- saved progress ---------- */
/* Practice mode: opened from the admin page (?admin=1 after the PIN). Everything is owned and nothing is saved. */
const PRACTICE = (() => { try { return new URLSearchParams(location.search).has("admin") && sessionStorage.getItem("prac.admin") === "1"; } catch (e) { return false; } })();
const FRESH = () => ({ coins: 0, crowns: 0, guns: { pistol: 1 }, gun: "pistol", items: { med: 1, shield: 0 }, skin: "jonesy", q: {}, seq: 1, n: 0, match: null, last: null,
  time: { cap: 30, days: {}, used: 0 }, stats: { wins: 0, kos: 0 }, sound: true });
function load() {
  if (PRACTICE) { const s = FRESH(); s.coins = 5000; GUNS.forEach(g => s.guns[g.id] = 1); s.items = { med: 3, shield: 3 }; s.crowns = 20; return s; }
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.guns) { const f = FRESH(); return Object.assign(f, s, { time: Object.assign(f.time, s.time), stats: Object.assign(f.stats, s.stats) }); } } catch (e) {}
  return FRESH();
}
let S = load();
const save = () => { if (PRACTICE) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const earnedToday = () => S.time.days[today()] || 0;
const earnedAll = () => Object.values(S.time.days).reduce((a, b) => a + b, 0);
const balance = () => Math.max(0, earnedAll() - S.time.used);
const gun = () => GUNS.find(g => g.id === S.gun) || GUNS[0];
const skin = () => SKINS.find(s => s[0] === S.skin) || SKINS[0];
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- sound ---------- */
let AC = null;
function beep(notes) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    for (const [f, d, type] of notes) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "square"; o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8;
    }
  } catch (e) {}
}
const SND = { hit: [[660, .08], [990, .14]], miss: [[200, .16, "sawtooth"], [140, .22, "sawtooth"]], win: [[523, .12], [659, .12], [784, .12], [1047, .3]], ko: [[300, .2, "sawtooth"], [200, .2, "sawtooth"], [120, .4, "sawtooth"]], buy: [[880, .08], [1320, .12]] };

/* ---------- questions ---------- */
const HAND = {}, GEN = {}, PASS = {};
for (const q of THINKING) HAND[q.id] = Object.assign(q, { kind: "thinking" });
for (const q of MATHS) HAND[q.id] = Object.assign(q, { kind: "maths" });
for (const p of READING) { PASS[p.id] = p; for (const q of p.questions) HAND[q.id] = Object.assign(q, { kind: "reading", pid: p.id }); }
for (const g of GENS) GEN[g.id] = g;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const qkey = ref => ref.t === "g" ? "g:" + ref.id : ref.id;
function resolve(ref) {
  if (ref.t === "g") { const g = GEN[ref.id]; return Object.assign({ id: "g:" + g.id, cat: g.cat, kind: g.kind }, g.make(rng(ref.seed))); }
  return HAND[ref.id];
}
const lastUsed = k => (S.q[k] && S.q[k].t) || 0;
/* least recently used first: questions never seen come first, then ones missed, then the oldest right answers */
function pickQ(kind, tier, M) {
  const hand = (kind === "thinking" ? THINKING : MATHS).filter(q => q.tier === tier).map(q => ({ t: "h", id: q.id }));
  const gens = GENS.filter(g => g.kind === kind && (g.tier === tier || (tier === 4 && g.tier === 3))).map(g => ({ t: "g", id: g.id }));
  let c = [...hand, ...gens];
  const fresh = c.filter(r => !M.asked.includes(qkey(r)));
  if (fresh.length) c = fresh;
  c = shuffle(c).sort((a, b) => lastUsed(qkey(a)) - lastUsed(qkey(b)));
  const ref = c[0];
  if (ref.t === "g") ref.seed = rnd(2 ** 31);
  return ref;
}
function pickPassage(tier, M, not) {
  let c = READING.filter(p => p.tier === tier && p.id !== not);
  const fresh = c.filter(p => !M.asked.includes("p:" + p.id));
  if (fresh.length) c = fresh;
  c = shuffle(c).sort((a, b) => lastUsed("p:" + a.id) - lastUsed("p:" + b.id));
  const p = c[0], st = S.q["p:" + p.id] || (S.q["p:" + p.id] = { t: 0, start: 0 });
  const ids = p.questions.map(q => q.id), k = (st.start || 0) % ids.length;
  st.t = ++S.seq; M.asked.push("p:" + p.id);
  return { pid: p.id, queue: [...ids.slice(k), ...ids.slice(0, k)] };
}
function nextQ(o) {
  const M = S.match;
  if (o.kind === "reading") {
    if (!o.pid || !o.queue.length) Object.assign(o, pickPassage(o.tier, M, o.pid));
    const id = o.queue.shift();
    const st = S.q["p:" + o.pid]; st.start = (PASS[o.pid].questions.findIndex(q => q.id === id) + 1) % PASS[o.pid].questions.length;
    o.pending = { ref: { t: "h", id }, chosen: null };
  } else {
    const kind = o.boss ? (o.shots % 2 ? "maths" : "thinking") : o.kind;
    const ref = pickQ(kind, o.tier, M);
    M.asked.push(qkey(ref));
    o.pending = { ref, chosen: null };
  }
  o.shots++;
}

/* ---------- matches ---------- */
function newMatch() {
  const n = S.n, opps = [];
  const used = {};
  const foe = kind => { const list = FOES[kind]; used[kind] = (used[kind] || 0) + 1; return list[(n + used[kind]) % list.length]; };
  const add = (kind, stage, at) => { const [img, name] = foe(kind); opps.push({ kind, tier: stage, stage, img, name, x: at[0], y: at[1], hp: STAGE[stage].hp, max: STAGE[stage].hp, dead: false, shots: 0, pending: null, pid: null, queue: [] }); };
  shuffle(["reading", "thinking", "maths"]).forEach((k, i) => add(k, 1, SPOTS[1][i]));
  const plan = PLANS[n % PLANS.length];
  [2, 3].forEach(st => shuffle(plan[st - 2]).forEach((k, i) => add(k, st, SPOTS[st][i])));
  const [bimg, bname] = BOSSES[n % BOSSES.length];
  opps.push({ kind: "thinking", boss: true, tier: 4, stage: 4, img: bimg, name: bname, x: SPOTS[4][0][0], y: SPOTS[4][0][1], hp: STAGE[4].hp, max: STAGE[4].hp, dead: false, shots: 0, pending: null });
  return { stage: 1, hp: MAXHP, shield: 0, misses: 0, hits: 0, opps, asked: [], camp: 0, cur: null, note: "" };
}
function hurt(M, dmg) { const s = Math.min(M.shield, dmg); M.shield -= s; M.hp = Math.max(0, M.hp - (dmg - s)); }
function addMinutes(min) { const d = today(), got = Math.max(0, Math.min(min, S.time.cap - earnedToday())); S.time.days[d] = earnedToday() + got; return got; }

/* ---------- drawing ---------- */
const bar = (cls, v, max) => `<div class="bar ${cls}"><i style="width:${Math.max(0, 100 * v / max)}%"></i><span>${Math.round(v)}</span></div>`;
const chestStage = () => { const p = 100 * earnedToday() / S.time.cap; return p <= 0 ? 0 : p >= 99.99 ? 4 : 1 + Math.min(2, Math.floor(p / 34)); };
const mins = m => `${m} min`;
function timeCard() {
  const e = earnedToday(), cap = S.time.cap;
  return `<div class="timecard" id="timecard" data-today="${e}" data-cap="${cap}" data-balance="${balance()}">
    <div class="pie" style="--p:${Math.min(100, 100 * e / cap)}"></div>
    <div class="txt"><div class="lab">FORTNITE TIME EARNED TODAY</div><div class="bigt">${mins(e)}</div>
      <div class="of">of today’s limit of ${mins(cap)}${e >= cap ? " · <b>Limit reached. More tomorrow!</b>" : ""}</div>
      <div class="of">Ready to use: <b>${mins(balance())}</b></div></div>
    <img class="chest" src="${P2}chest${chestStage()}.webp" alt="Treasure chest"></div>`;
}
function topBar() {
  return `<div class="top"><h1>Storm <span>Island</span></h1><span class="spacer"></span>
    <span class="pill" id="crowns"><img src="${P2}crown3d.webp" alt="Crowns"> ${S.crowns}</span><span class="pill" id="coins">${pic("coins")} ${S.coins}</span>
    <button class="pill" id="snd" title="Sound">${S.sound ? "🔊" : "🔇"}</button></div>`;
}
function islandSvg(M) {
  const r = M ? STAGE[M.stage].r * 6 : 480, cx = EYE[0] * 6, cy = EYE[1] * 6;
  return `<img class="mapimg" src="art/island.webp" alt="A map of the island">
    <svg viewBox="0 0 600 600" role="img" aria-label="The purple storm covers everything outside the circle.">
    <defs><mask id="storm"><rect width="600" height="600" fill="#fff"/><circle id="stormhole" cx="${cx}" cy="${cy}" style="r:${r}px" fill="#000"/></mask></defs>
    <rect width="600" height="600" fill="#7a2fe0" opacity=".66" mask="url(#storm)"/><circle cx="${cx}" cy="${cy}" style="r:${r}px" fill="none" stroke="#f0dcff" stroke-width="4" stroke-dasharray="10 8"/></svg>`;
}
function marker(o, i, M) {
  const k = o.boss ? { label: "Boss", icon: "👑", col: "#7a1f3d" } : KIND[o.kind];
  const state = o.dead ? "dead" : o.stage === M.stage ? "open" : "later";
  return `<button class="mk foe ${state}${o.boss ? " boss" : ""}" data-o="${i}" style="left:${o.x}%;top:${o.y}%;--kind:${k.col}" ${state === "open" ? "" : "disabled"} aria-label="${esc(o.name)}, ${k.label}${o.dead ? ", defeated" : state === "later" ? ", circle " + o.stage : ""}">
    <span class="pic"><img src="art/${o.img}.webp" alt=""><span class="tag">${o.dead ? "✖" : k.icon}</span></span>
    <span class="nm">${o.dead ? esc(o.name) : state === "later" ? (o.boss ? "Boss" : "Circle " + o.stage) : esc(o.name)}</span>
    ${state === "open" && o.hp < o.max ? `<span class="mhp"><i style="width:${100 * o.hp / o.max}%"></i></span>` : ""}</button>`;
}

/* ---------- the island (home) ---------- */
function home() {
  const M = S.match;
  if (M) M.cur = null;
  const res = S.last; S.last = null;
  let h = topBar();
  if (PRACTICE) h += `<div class="note" id="practice-note"><div class="txt"><b>Practice mode</b><br>You own every gun and nothing you do here is saved. The real game progress is not touched.${M ? `<br>Jump to: <button class="btn small ghost" data-jump="2">Circle 2</button> <button class="btn small ghost" data-jump="3">Circle 3</button> <button class="btn small ghost" data-jump="4">Boss</button>` : ""}</div><a class="btn" href="../pracadmin/index.html">← Admin page</a></div>`;
  if (res) h += resultCard(res);
  h += timeCard();
  if (M && M.note) { h += `<div class="banner">${pic("storm")} <span>${M.note}</span></div>`; M.note = ""; }
  if (M) {
    h += `<div class="me-strip"><img src="${skin()[4]}${skin()[0]}.webp" alt="" width="54" height="54" style="object-fit:contain">
      <div class="grow"><b>Storm circle ${M.stage} of 4</b>${bar("hp", M.hp, MAXHP)}${bar("sh", M.shield, MAXSH)}</div>
      <div class="kit">${gunPic(S.gun)}<small>${gun().name}</small></div><div class="kit">${pic("medkit")} ×${S.items.med} ${pic("shieldpotion")} ×${S.items.shield}</div></div>`;
  }
  h += `<div class="island" id="island">${islandSvg(M)}`;
  if (M) {
    h += M.opps.map((o, i) => marker(o, i, M)).join("");
    h += `<button class="mk spot" id="shop" style="left:${SHOP_AT[0]}%;top:${SHOP_AT[1]}%"><span class="pic">${pic("coins", "")}</span><span class="nm">Shop</span></button>`;
    h += `<button class="mk spot${M.camp >= M.stage ? " usedup" : ""}" id="camp" style="left:${CAMP_AT[0]}%;top:${CAMP_AT[1]}%" ${M.camp >= M.stage || M.hp >= MAXHP ? "disabled" : ""}><span class="pic">${pic("medkit", "")}</span><span class="nm">${M.camp >= M.stage ? "Supplies (used)" : "Supplies +" + CAMP_HEAL}</span></button>`;
  } else {
    h += `<div class="dropin">${pic("battlebus", "bus")}<button class="btn" id="drop">Drop in ▶</button><p>${S.n ? "Match " + (S.n + 1) + ". " : ""}Beat every opponent as the storm closes in, then face the boss in the last circle.</p></div>`;
  }
  h += `</div>`;
  h += M ? `<p class="legend">Tap a glowing opponent to fight. 📖 reading · 🧩 thinking · 🔢 maths. Beat everyone in the circle and the storm closes in.</p>`
         : `<p class="legend">Every shot is a question. A right answer is a hit. A wrong answer is a miss, and they shoot back.</p>`;
  h += shopHtml(false) + lockerHtml() + parentsHtml();
  h += `<p class="legal">A private, non-commercial fan project. Portions of the materials used are trademarks and/or copyrighted works of Epic Games, Inc. All rights reserved by Epic. This material is not official and is not endorsed by Epic.</p>`;
  app.innerHTML = h;
  save();
  wireCommon();
  const on = (sel, fn) => { const e = $(sel); if (e) e.onclick = fn; };
  on("#drop", () => { S.match = newMatch(); home(); window.scrollTo(0, 0); });
  on("#shop", () => { $("#shopshelf").scrollIntoView({ behavior: "smooth" }); });
  on("#camp", () => { M.camp = M.stage; M.hp = Math.min(MAXHP, M.hp + CAMP_HEAL); M.note = `You open the supply drop: +${CAMP_HEAL} health. A new one lands in the next circle.`; beep(SND.buy); home(); });
  app.querySelectorAll(".mk.foe.open").forEach(b => b.onclick = () => { M.cur = Number(b.dataset.o); battle(); window.scrollTo(0, 0); });
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { const st = Number(b.dataset.jump); M.opps.forEach(o => { if (o.stage < st) o.dead = true; }); M.stage = st; home(); });
  wireShop(home);
  app.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => { S.skin = b.dataset.skin; home(); });
  wireParents();
}
function wireCommon() { const s = $("#snd"); if (s) s.onclick = () => { S.sound = !S.sound; save(); s.textContent = S.sound ? "🔊" : "🔇"; }; }

function shopHtml() {
  const guns = GUNS.map(g => {
    const own = S.guns[g.id], cur = S.gun === g.id;
    return `<div class="tile${cur ? " cur" : ""}" style="--rar:${g.col}">${gunPic(g.id)}<b>${g.name}</b><span>${g.rar} · ${g.dmg} damage</span>
      ${cur ? `<span>Equipped</span>` : own ? `<button class="btn small ghost" data-equip="${g.id}">Equip</button>` : `<button class="btn small" data-buy="${g.id}" ${S.coins < g.cost ? "disabled" : ""}>${g.cost} coins</button>`}</div>`;
  }).join("");
  const items = ITEMS.map(it => `<div class="tile" style="--rar:${it.col}">${pic(it.img, "itempic")}<b>${it.name}</b><span>${it.what} · you have ${S.items[it.id]}</span>
      <button class="btn small" data-item="${it.id}" ${S.coins < it.cost || S.items[it.id] >= CARRY ? "disabled" : ""}>${S.items[it.id] >= CARRY ? "Full" : it.cost + " coins"}</button></div>`).join("");
  return `<div class="shelf" id="shopshelf"><h3>Shop</h3><p class="sub">You have <b>${S.coins} coins</b>. Win fights to earn coins. A better gun does more damage with every right answer. You can carry ${CARRY} of each item.</p><div class="tiles">${guns}${items}</div></div>`;
}
function wireShop(again) {
  app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => { const g = GUNS.find(x => x.id === b.dataset.buy); if (S.coins >= g.cost) { S.coins -= g.cost; S.guns[g.id] = 1; S.gun = g.id; beep(SND.buy); again(); } });
  app.querySelectorAll("[data-equip]").forEach(b => b.onclick = () => { S.gun = b.dataset.equip; again(); });
  app.querySelectorAll("[data-item]").forEach(b => b.onclick = () => { const it = ITEMS.find(x => x.id === b.dataset.item); if (S.coins >= it.cost && S.items[it.id] < CARRY) { S.coins -= it.cost; S.items[it.id]++; beep(SND.buy); again(); } });
}
function lockerHtml() {
  return `<div class="shelf"><h3>Locker</h3><p class="sub">Every match you win gives a crown. Crowns unlock outfits. Tap one you own to wear it.</p><div class="tiles">${SKINS.map(([img, name, col, need, dir]) => {
    const own = S.crowns >= need;
    return `<${own ? "button" : "div"} class="tile skin${own ? "" : " off"}${S.skin === img ? " cur" : ""}" style="--rar:${col}" ${own ? `data-skin="${img}"` : ""}><img src="${dir}${img}.webp" alt=""><b>${name}</b><span>${own ? (S.skin === img ? "Wearing" : "Unlocked") : need + (need === 1 ? " crown" : " crowns")}</span></${own ? "button" : "div"}>`;
  }).join("")}</div></div>`;
}
function resultCard(r) {
  if (r.ko) return `<div class="card result" id="result" style="margin-bottom:14px"><h2>Knocked out!</h2><p>The storm takes this match, but you keep your coins, your guns and your items.<br>Read the explanations, stock up at the shop, and drop in again.</p></div>`;
  return `<div class="card result" id="result" style="margin-bottom:14px"><div class="big">${pic("victory", "vic")}<img src="${P2}crown3d.webp" alt="Crown"></div><h2>Victory crown!</h2>
    <div class="rows"><span>Shots on target</span><b>${r.hits} of ${r.hits + r.misses}</b><span>Coins for the win</span><b>+${WIN_COINS}</b>
    <span>Fortnite time for winning</span><b>${mins(WIN_MIN)}</b><span>Bonus for ${r.misses === 0 ? "no misses" : r.misses + (r.misses === 1 ? " miss" : " misses")}</span><b>${mins(missBonus(r.misses))}</b>
    <span>Added today</span><b id="gained">${mins(r.got)}</b></div>
    ${r.got < WIN_MIN + missBonus(r.misses) ? `<p>Today’s limit of ${mins(S.time.cap)} is reached, so the rest was not added. You can still play for coins and crowns.</p>` : ""}</div>`;
}

/* ---------- for grown-ups ---------- */
function parentsHtml() {
  const cats = {};
  for (const [k, v] of Object.entries(S.q)) {
    if (k.startsWith("p:")) continue;
    const q = k.startsWith("g:") ? GEN[k.slice(2)] : HAND[k];
    if (!q) continue;
    const key = (q.kind === "reading" ? "Reading" : q.kind === "thinking" ? "Thinking" : "Maths") + " · " + q.cat;
    const c = cats[key] || (cats[key] = { r: 0, w: 0 });
    c.r += v.r || 0; c.w += v.w || 0;
  }
  const rows = Object.keys(cats).sort().map(k => `<tr><td>${esc(k)}</td><td class="n">${cats[k].r}</td><td class="n">${cats[k].w}</td></tr>`).join("");
  return `<details class="parents" id="parents"><summary>For grown-ups: Fortnite time and progress</summary>
    <p><b>Fortnite time.</b> Each match won earns ${WIN_MIN} minutes, plus up to 7 more for few misses (no misses 7, one or two 5, three or four 3, five or six 1). Earnings stop at the daily limit. Earned so far: ${mins(earnedAll())}. Recorded as used: ${mins(S.time.used)}. <b>Ready to use: <span id="bal">${mins(balance())}</span></b>.</p>
    <div class="row"><label for="cap">Daily limit (minutes):</label> <input id="cap" type="number" min="5" max="180" step="5" value="${S.time.cap}"> <button class="btn small ghost" id="capsave">Save</button></div>
    <div class="row">Record time used: ${[5, 10, 15, 30].map(m => `<button class="btn small ghost" data-used="${m}">${m} min</button>`).join(" ")} <button class="btn small ghost" data-used="all">All of it</button> <button class="btn small ghost" data-used="undo">Undo all</button></div>
    <p>Matches won: ${S.stats.wins}. Knock-outs: ${S.stats.kos}. Every question gets one go and no hints; after each answer the explanation is shown.</p>
    ${rows ? `<table><tr><th>Question type</th><th class="n">Right</th><th class="n">Missed</th></tr>${rows}</table>` : `<p>No questions answered yet.</p>`}
    <p>Progress is saved only in this browser on this device.</p>
    <div class="row"><button class="btn small ghost" id="reset">Start the whole game again</button></div></details>`;
}
function wireParents() {
  const keep = () => { home(); $("#parents").open = true; };
  $("#capsave").onclick = () => { const v = Math.round(Number($("#cap").value)); if (v >= 5 && v <= 180) { S.time.cap = v; keep(); } };
  app.querySelectorAll("[data-used]").forEach(b => b.onclick = () => {
    const u = b.dataset.used;
    S.time.used = u === "undo" ? 0 : u === "all" ? earnedAll() : Math.min(earnedAll(), S.time.used + Number(u));
    keep();
  });
  $("#reset").onclick = () => { if (confirm("Start again from nothing? Coins, crowns, guns and Fortnite time records will all be cleared.")) { S = FRESH(); if (!PRACTICE) save(); home(); } };
}

/* ---------- the battle ---------- */
function passageHtml(o, q) {
  const p = PASS[o.pid];
  let html = p.html;
  if (q.gap) html = html.replace(`data-g="${q.gap}" class="gap"`, `data-g="${q.gap}" class="gap cur"`);
  return `<div class="card passage"><h3>${p.title}</h3><p class="pnote">${p.note}</p>${html}</div>`;
}
function battle(fx) {
  const M = S.match, o = M.opps[M.cur], st = STAGE[o.stage], k = o.boss ? { label: "Boss", icon: "👑", arena: ["arena-peaks", "arena-reef", "arena-forest"][S.n % 3], col: "#7a1f3d" } : KIND[o.kind];
  const pend = o.pending, q = pend ? resolve(pend.ref) : null, done = pend && pend.chosen !== null;
  const qk = q ? KIND[q.kind] : k;
  document.documentElement.style.setProperty("--kind", qk.col);
  const over = M.hp <= 0, won = o.dead;
  let h = `<div class="playbar"><button class="pill" id="back" ${pend && !done ? "disabled title='Answer this shot first'" : ""}>◀ Island</button><span class="pill">Circle ${M.stage} of 4</span><span class="spacer" style="flex:1"></span>
    <span class="pill" id="coins">${pic("coins")} ${S.coins}</span><span class="pill">⏱ ${earnedToday()}/${S.time.cap} min today</span><button class="pill" id="snd">${S.sound ? "🔊" : "🔇"}</button></div>
  <div class="arena" style="background-image:url(${P2}${k.arena}.webp)">
    <div class="hud me"><b>You</b>${bar("hp", M.hp, MAXHP)}${bar("sh", M.shield, MAXSH)}</div>
    <div class="hud foe"><b>${esc(o.name)}</b><small>${k.icon} ${o.boss ? "Boss · thinking and maths" : k.label + " opponent"}</small>${bar("ehp", o.hp, o.max)}</div>
    <div class="fighter me${over ? " ko" : ""}" id="hero"><img src="${skin()[4]}${skin()[0]}.webp" alt="Your hero"></div>
    <button class="fighter foe${won ? " ko" : ""}${!pend && !won && !over ? " aim" : ""}" id="enemy" ${pend || won || over ? "disabled" : ""} aria-label="Shoot at ${esc(o.name)}"><img src="art/${o.img}.webp" alt=""><span class="cross"></span></button>
  </div>
  <div class="actions">
    <button class="act gun" id="shoot" style="--rar:${gun().col}" ${pend || won || over ? "disabled" : ""}>${gunPic(S.gun)}<span><b>${gun().name}</b><small>${gun().dmg} damage a hit</small></span><span class="go">Shoot</span></button>
    <button class="act" id="usemed" style="--rar:#3fae2a" ${!S.items.med || M.hp >= MAXHP || over ? "disabled" : ""}>${pic("medkit")}<span><b>Med Kit ×${S.items.med}</b><small>+50 health</small></span></button>
    <button class="act" id="useshield" style="--rar:#2f8fff" ${!S.items.shield || M.shield >= MAXSH || over ? "disabled" : ""}>${pic("shieldpotion")}<span><b>Shield ×${S.items.shield}</b><small>+50 shield</small></span></button>
  </div>`;
  const showPassage = q && q.kind === "reading";
  h += `<div class="stage${showPassage ? " has-passage" : ""}">${showPassage ? passageHtml(o, q) : ""}<div class="card" id="qcard" data-q="${pend ? qkey(pend.ref) : ""}" data-seed="${pend && pend.ref.seed !== undefined ? pend.ref.seed : ""}">`;
  if (!q) {
    h += `<div class="aimhelp"><b>${esc(o.name)}</b> is in your sights.<br>Tap your gun or the enemy to take a shot. Every shot is a question.<br>
      <small>A right answer hits for ${gun().dmg}. A wrong answer misses, and ${esc(o.name)} shoots back for ${st.dmg}.</small></div>`;
  } else {
    h += `<div class="qhead"><span>${qk.icon} ${qk.label} · ${esc(q.cat)}</span><span>One go, no hints</span></div><div class="stem">${q.stem}</div>
      <div class="opts${q.visual ? " visual" : ""}">${q.options.map((op, i) => `<button class="opt${done ? (i === q.answer ? " right" : i === pend.chosen ? " wrong" : " dim") : ""}" data-i="${i}" ${done ? "disabled" : ""}><span class="let">${LETTERS[i]}</span><span>${op}</span></button>`).join("")}</div>`;
    if (done) {
      const ok = pend.chosen === q.answer;
      h += `<div class="fb ${ok ? "good" : "miss"}"><h4>${ok ? `Hit! ${gun().dmg} damage.` : `Miss! ${esc(o.name)} shoots back: ${st.dmg} damage.`}</h4>${ok ? "" : `<p>The answer was <b>${LETTERS[q.answer]}</b>.</p>`}${q.explain}</div>
        <div class="next"><button class="btn" id="next">${over ? "Knocked out…" : won ? (o.boss ? "Claim your crown ▶" : `${esc(o.name)} is out! Back to the island ▶`) : "Next shot ▶"}</button></div>`;
    }
  }
  h += `</div></div>`;
  app.innerHTML = h;
  save();
  wireCommon();
  if (fx) {
    const f = document.createElement("div"); f.className = "float " + (fx.hit ? "onfoe" : "onme"); f.textContent = fx.hit ? "−" + fx.dmg : "MISS! −" + fx.dmg; $(".arena").appendChild(f);
    $(fx.hit ? "#enemy" : "#hero").classList.add("hit");
  }
  $("#back").onclick = () => { if (!(pend && !done)) home(); };
  const shoot = () => { if (o.pending || o.dead || M.hp <= 0) return; nextQ(o); battle(); const c = $("#qcard"); if (c && window.innerWidth < 821) c.scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#shoot").onclick = shoot; $("#enemy").onclick = shoot;
  $("#usemed").onclick = () => { if (S.items.med && M.hp < MAXHP) { S.items.med--; M.hp = Math.min(MAXHP, M.hp + 50); beep(SND.buy); battle(); } };
  $("#useshield").onclick = () => { if (S.items.shield && M.shield < MAXSH) { S.items.shield--; M.shield = Math.min(MAXSH, M.shield + 50); beep(SND.buy); battle(); } };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(Number(b.dataset.i)));
  const nx = $("#next");
  if (nx) nx.onclick = () => {
    o.pending = null;
    if (M.hp <= 0) return knockedOut();
    if (o.dead) return o.boss ? victory() : home(window.scrollTo(0, 0));
    nextQ(o); battle(); window.scrollTo(0, 0);
  };
}
function answer(i) {
  const M = S.match, o = M.opps[M.cur], pend = o.pending;
  if (!pend || pend.chosen !== null) return;
  const q = resolve(pend.ref), key = qkey(pend.ref), rec = S.q[key] || (S.q[key] = { r: 0, w: 0, t: 0 });
  pend.chosen = i;
  let fx;
  if (i === q.answer) {
    rec.r++; rec.t = ++S.seq; M.hits++;
    o.hp = Math.max(0, o.hp - gun().dmg);
    fx = { hit: true, dmg: gun().dmg }; beep(SND.hit);
    if (o.hp <= 0) {
      o.dead = true; S.coins += STAGE[o.stage].coins;
      if (!o.boss && M.opps.every(x => x.dead || x.stage !== M.stage)) {
        M.stage++;
        M.note = M.stage === 4 ? "The storm closes to the last circle. Only the boss is left!" : `The storm is closing! Circle ${M.stage}: tougher opponents, harder questions.`;
      }
    }
  } else {
    rec.w++; rec.t = 1; M.misses++;
    hurt(M, STAGE[o.stage].dmg);
    fx = { hit: false, dmg: STAGE[o.stage].dmg }; beep(M.hp <= 0 ? SND.ko : SND.miss);
  }
  battle(fx);
  const fb = $(".fb"); if (fb && window.innerWidth < 821) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function victory() {
  const M = S.match, want = WIN_MIN + missBonus(M.misses);
  S.coins += WIN_COINS; S.crowns++; S.stats.wins++; S.n++;
  S.last = { hits: M.hits, misses: M.misses, got: addMinutes(want) };
  S.match = null; beep(SND.win);
  home(); window.scrollTo(0, 0);
}
function knockedOut() {
  S.stats.kos++; S.match = null; S.last = { ko: true };
  home(); window.scrollTo(0, 0);
}

/* In practice mode only: show any one question in a battle (used by tools/check_game3.js to look at every question). */
if (PRACTICE) window.__preview = ref => {
  if (!S.match) S.match = newMatch();
  const M = S.match, q = resolve(ref), o = M.opps.find(x => !x.boss && x.kind === q.kind);
  M.opps.forEach(x => { x.dead = false; x.hp = x.max; x.pending = null; }); M.hp = MAXHP; M.cur = M.opps.indexOf(o);
  if (q.kind === "reading") { o.pid = q.pid; o.queue = []; }
  o.pending = { ref, chosen: null };
  battle();
};

/* ---------- start ---------- */
if (S.match && S.match.cur !== null && S.match.opps[S.match.cur] && !S.match.opps[S.match.cur].dead && S.match.opps[S.match.cur].pending) battle(); else home();
})();
</script>
</body>
</html>
