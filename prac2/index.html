<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown Quest</title>
<style>
  :root {
    --ink: #1b2a41; --ink-soft: #55627a; --line: #d8dde6; --paper: #ffffff; --field: #f3f5f8;
    --sky1: #1a1f4b; --sky2: #3b2a7a; --gold: #f5b82e; --gold-deep: #b97f00;
    --good: #1e8a55; --good-bg: #e2f5ea; --bad: #c0392b; --bad-bg: #fde8e5; --hint-bg: #fff6dc;
    --world: #2e7d4f;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky2); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; }
  body { background: linear-gradient(160deg, var(--sky1), var(--sky2)) fixed; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: #fff; margin-bottom: 14px; }
  .top h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  .top h1 span { color: var(--gold); }
  .top .spacer { flex: 1; }
  .pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  button.pill:hover { background: rgba(255,255,255,.25); }
  .rank { background: rgba(255,255,255,.1); border-radius: 12px; padding: 10px 14px; color: #fff; margin-bottom: 16px; }
  .rank b { color: var(--gold); }
  .xpbar { height: 10px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe08a); border-radius: 999px; transition: width .6s; }

  /* ---- map ---- */
  .world { background: var(--paper); border-radius: 16px; padding: 16px 18px 18px; margin-bottom: 16px; border-top: 6px solid var(--world); }
  .world h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .world h2 small { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin-left: auto; }
  .world p.sub { margin: 2px 0 12px; color: var(--ink-soft); font-size: 15px; }
  .path { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
  .node { flex: 1 1 120px; min-width: 104px; background: var(--field); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 8px; text-align: center; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .12s, border-color .12s; }
  .node:hover { transform: translateY(-2px); border-color: var(--world); }
  .node .num { width: 44px; height: 44px; border-radius: 50%; background: var(--world); color: #fff; font-weight: 800; font-size: 20px;
    display: flex; align-items: center; justify-content: center; }
  .node .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .node .st { font-size: 17px; letter-spacing: 1px; }
  .node .st .off { opacity: .22; filter: grayscale(1); }
  .node .req { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .node.locked { opacity: .72; }
  .node.locked .num { background: #9aa3b5; }
  .node.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,184,46,.35); animation: pulse 1.8s infinite; }
  .node.boss .num { background: #7a1f3d; font-size: 24px; }
  .node.boss.beaten .num { background: var(--gold); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(245,184,46,.12); } }
  .speed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--ink-soft); }
  .speed b { color: var(--ink); }
  .speedchip { font: inherit; font-size: 13.5px; font-weight: 700; border: 2px solid #0d1330; border-radius: 99px; background: #fff; color: var(--ink); padding: 3px 11px; }
  .speedchip:hover { background: #ffe81a; }
  .speedchip.done { background: #ffe81a; }
  #clock.low { background: #c0392b; border-color: #fff; animation: pulse 1s infinite; }
  .cave { background: #fff8e6; border: 2px dashed var(--gold-deep); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .cave .txt { flex: 1 1 240px; }
  .cave b { font-size: 19px; }
  .btn { background: var(--world); color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 17px; }
  .btn:hover { filter: brightness(1.1); }
  .btn.gold { background: var(--gold); color: #3a2a00; }
  .btn.ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); }
  .shelf { background: var(--paper); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px; }
  .shelf h3 { margin: 0 0 8px; font-size: 18px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 14px; display: flex; gap: 6px; align-items: center; background: var(--field); }
  .badge.off { opacity: .45; filter: grayscale(1); }
  .badge i { font-style: normal; font-size: 20px; }
  details.parents { background: rgba(255,255,255,.92); border-radius: 12px; padding: 10px 16px; font-size: 15px; }
  details.parents summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); }
  details.parents table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  details.parents td, details.parents th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  details.parents td.n, details.parents th.n { text-align: right; }

  /* ---- play ---- */
  .playbar { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 12px; flex-wrap: wrap; }
  .playbar .title { font-weight: 700; font-size: 19px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.25); display: block; }
  .dots i.cur { background: #fff; }
  .dots i.p2 { background: var(--gold); } .dots i.p1 { background: #9bd3b4; } .dots i.p0 { background: #e58a7f; }
  .bossbox { background: rgba(0,0,0,.28); border-radius: 16px; padding: 10px 16px; color: #fff; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .bossbox .face { font-size: 54px; line-height: 1; transition: transform .2s; }
  .bossbox .face.hit { animation: hit .5s; }
  .bossbox .face.laugh { animation: laugh .6s; }
  @keyframes hit { 20% { transform: translateX(-10px) rotate(-12deg) scale(.9); filter: brightness(2); } 60% { transform: translateX(8px) rotate(8deg); } }
  @keyframes laugh { 30% { transform: scale(1.25) rotate(6deg); } 60% { transform: scale(1.15) rotate(-6deg); } }
  .bossbox .info { flex: 1; }
  .bossbox .say { font-size: 15px; opacity: .9; min-height: 22px; }
  .hp { height: 16px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin: 4px 0; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, #e5484d, #ff8a65); transition: width .6s; }
  .stage { display: grid; gap: 14px; }
  .stage.has-passage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 820px) { .stage.has-passage { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--paper); border-radius: 16px; padding: 18px 20px; min-width: 0; }
  .passage h3 { margin: 0 0 4px; font-size: 20px; }
  .passage .note { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 10px; }
  .passage p { margin: 0 0 10px; }
  .passage .poem { white-space: pre-line; font-size: 17px; line-height: 1.6; margin: 0 0 4px; }
  .passage .extract { border-left: 4px solid var(--world); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .passage .extract b.tag { display: block; color: var(--world); }
  @media (min-width: 821px) { .passage { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; } }
  .qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-soft); font-weight: 600; margin-bottom: 6px; }
  .stem { font-size: 18px; }
  .stem p { margin: 0 0 10px; }
  .stem .box { background: var(--field); border-left: 4px solid var(--world); border-radius: 6px; padding: 10px 14px; margin: 0 0 10px; }
  .stem .gapline { font-size: 19px; background: var(--field); border-radius: 8px; padding: 12px 14px; margin: 0 0 10px; }
  .gapn { white-space: nowrap; background: var(--hint-bg); border-radius: 4px; padding: 0 4px; }
  .stem .gapw { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--ink); }
  .figure { margin: 10px 0; text-align: center; overflow-x: auto; }
  .figure svg, .opt svg { max-width: 100%; height: auto; }
  table.grid { border-collapse: collapse; margin: 8px auto; font-size: 17px; }
  table.grid th, table.grid td { border: 1.5px solid var(--ink-soft); padding: 6px 12px; text-align: center; }
  table.grid th { background: var(--field); }
  .opts { display: grid; gap: 9px; margin-top: 14px; }
  .opts.visual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); border: 2px solid var(--line);
    border-radius: 12px; padding: 10px 14px; color: var(--ink); font-size: 17px; width: 100%; transition: border-color .1s, background .1s; }
  .opt:hover:not(:disabled) { border-color: var(--world); background: var(--field); }
  .opt:disabled { cursor: default; }
  .opt .let { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--field); border: 1.5px solid var(--line);
    font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.right .let { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: .8; animation: shake .35s; }
  .opt.wrong .let { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dim { opacity: .55; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .fb { margin-top: 14px; border-radius: 12px; padding: 12px 16px; }
  .fb.hint { background: var(--hint-bg); border: 1.5px solid var(--gold); }
  .fb.good { background: var(--good-bg); border: 1.5px solid var(--good); }
  .fb.miss { background: var(--field); border: 1.5px solid var(--line); }
  .fb h4 { margin: 0 0 4px; font-size: 18px; }
  .fb p { margin: 0 0 8px; } .fb p:last-child { margin: 0; }
  .fb .why-not { color: var(--ink-soft); }
  .next { margin-top: 14px; display: flex; justify-content: flex-end; }
  .combo { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: #ff7a1a; color: #fff; font-weight: 800;
    font-size: 24px; padding: 10px 22px; border-radius: 999px; z-index: 30; pointer-events: none; animation: pop 1.6s forwards; white-space: nowrap; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111a; background: rgba(15,20,40,.94); color: #fff;
    padding: 10px 18px; border-radius: 12px; z-index: 30; max-width: 90vw; text-align: center; }

  /* ---- result ---- */
  .result { text-align: center; padding: 28px 20px; }
  .result .big { font-size: 64px; line-height: 1.1; }
  .result h2 { font-size: 28px; margin: 6px 0; }
  .result .stars { font-size: 46px; letter-spacing: 6px; }
  .result .stars span { display: inline-block; opacity: .2; filter: grayscale(1); }
  .result .stars span.on { opacity: 1; filter: none; animation: starin .5s backwards; }
  .result .stars span.on:nth-child(2) { animation-delay: .25s; } .result .stars span.on:nth-child(3) { animation-delay: .5s; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
  .result .lines { margin: 12px auto; max-width: 460px; text-align: left; }
  .result .lines div { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .result .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  @media (max-width: 520px) { .wrap { padding: 12px 12px 70px; } .top h1 { font-size: 22px; } .card { padding: 14px; } .opts.visual { gap: 6px; } .opt { padding: 9px 10px; gap: 9px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---- battle-royale look: all original, drawn with CSS (no third-party artwork) ---- */
  html { background: #2a1266; }
  body { background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 26px, transparent 26px 70px),
      radial-gradient(900px 500px at 85% -10%, rgba(255,90,220,.45), transparent 70%),
      linear-gradient(180deg, #1668e3 0%, #5a2fd8 52%, #2a1266 100%) fixed; }
  .top h1, .world h2, .shelf h3, .btn, .pill, .node .nm, .fb h4, .playbar .title, .result h2, .cave b, .timecard .lab, .rank b {
    font-family: "Arial Black", "Segoe UI Black", Impact, "Segoe UI", sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .4px; }
  .top h1 { font-size: 30px; text-shadow: 0 3px 0 #0d1330; transform: skewX(-4deg); }
  .top h1 span { color: #ffe81a; }
  .world, .card, .shelf, .cave, .timecard { border: 3px solid #0d1330; box-shadow: 0 6px 0 #0d1330; }
  .world { border-top: 8px solid var(--world); }
  .btn { background: #ffe81a !important; color: #111 !important; border: 3px solid #0d1330; box-shadow: 0 4px 0 #0d1330; border-radius: 8px; transform: skewX(-4deg); }
  .btn:hover { filter: none; transform: skewX(-4deg) translateY(-2px); box-shadow: 0 6px 0 #0d1330; }
  .btn:active { transform: skewX(-4deg) translateY(3px); box-shadow: 0 1px 0 #0d1330; }
  .btn.ghost { background: #fff !important; color: var(--ink-soft) !important; }
  .pill { background: rgba(13,19,48,.55); border: 2px solid rgba(255,255,255,.35); }
  .node { border-width: 3px; border-color: #0d1330; border-bottom-width: 7px; border-radius: 10px; background: #fff; }
  .node .num { border-radius: 10px; transform: skewX(-6deg); border: 2px solid #0d1330; background: var(--rar); }
  .node { --rar: #8a94a6; } .node.r2 { --rar: #43a629; } .node.r3 { --rar: #2f8fff; } .node.r4 { --rar: #a34dff; } .node.boss { --rar: #ffb21a; }
  .node:not(.locked) { border-bottom-color: var(--rar); background: linear-gradient(180deg, #fff 55%, color-mix(in srgb, var(--rar) 22%, #fff)); }
  .node .rar { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--rar); filter: brightness(.8); }
  .node.boss .num, .node.boss.beaten .num { background: var(--rar); }
  .node.locked .num { background: #9aa3b5; }
  .node.next { border-color: #0d1330; border-bottom-color: #ffe81a; box-shadow: 0 0 0 4px #ffe81a; }
  .rank { background: rgba(13,19,48,.55); border: 2px solid rgba(255,255,255,.25); }
  .xpbar i { background: linear-gradient(90deg, #ffe81a, #ff9d1a); }
  .bossbox { background: rgba(13,19,48,.7); border: 3px solid #0d1330; }
  .opt { border-width: 3px; border-radius: 10px; }
  .opt .let { border-radius: 8px; transform: skewX(-6deg); }
  .result h2 { font-size: 32px; }

  /* ---- Fortnite art (Epic's outfit renders, see the notice at the foot of the page) ---- */
  .hero { width: 150px; height: 150px; object-fit: contain; flex: none; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); margin: -10px 0; }
  .node .num img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
  .node.boss .num { width: 64px; height: 64px; overflow: hidden; padding: 0; }
  .bossbox .face img { width: 84px; height: 84px; object-fit: contain; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
  .result .big img { width: 150px; height: 150px; object-fit: contain; }
  .locker { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
  .skin { border: 3px solid #0d1330; border-bottom-width: 7px; border-radius: 10px; text-align: center; padding: 6px 4px 8px; font-size: 13px; line-height: 1.25;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rar) 55%, #fff), color-mix(in srgb, var(--rar) 90%, #000)); color: #fff; }
  .skin img { width: 92px; height: 92px; object-fit: contain; display: block; margin: 0 auto; }
  .skin b { display: block; font-family: "Arial Black", Impact, sans-serif; font-style: italic; text-transform: uppercase; font-size: 13.5px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .skin.off { --rar: #5d6578 !important; }
  .skin.off img { filter: brightness(0) opacity(.55); }
  .skin.cur { box-shadow: 0 0 0 4px #ffe81a; }
  .legal { color: rgba(255,255,255,.75); font-size: 12.5px; line-height: 1.45; margin: 16px 4px 0; text-align: center; }

  /* ---- our own 3D art, rendered in Blender (game/art/render.py) ---- */
  .top h1 img { width: 62px; height: 60px; object-fit: contain; vertical-align: -16px; margin-right: 4px; filter: drop-shadow(0 4px 0 rgba(13,19,48,.8)); animation: bob 3.2s ease-in-out infinite; }
  .whead { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .whead .isle { width: 132px; height: 150px; object-fit: contain; flex: none; margin: -46px 0 -8px -6px; filter: drop-shadow(0 8px 6px rgba(13,19,48,.45)); animation: bob 4s ease-in-out infinite; }
  .world:nth-of-type(2n) .isle { animation-delay: -1.3s; } .world:nth-of-type(3n) .isle { animation-delay: -2.6s; }
  .whead .wtxt { flex: 1; min-width: 0; }
  .whead p.sub { margin: 2px 0 0; }
  .world { margin-top: 34px; }
  .result .big img.crown3d { width: 170px; height: 166px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @media (max-width: 520px) { .whead .isle { width: 96px; height: 110px; margin-top: -40px; } .top h1 img { width: 48px; height: 46px; vertical-align: -12px; } }

  /* ---- the treasure chest that fills up, and the boss arenas ---- */
  .chest { width: 150px; height: 150px; object-fit: contain; flex: none; margin: -8px 0; filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)); }
  .result .big img.chest { width: 190px; height: 190px; margin: 0; animation: bob 2.6s ease-in-out infinite; }
  .bossbox.arena { position: relative; display: block; padding: 0; height: 250px; overflow: hidden; border-radius: 16px;
    background: #0d1330 center bottom / cover no-repeat; }
  .bossbox.arena .info { position: absolute; left: 0; right: 0; top: 0; padding: 10px 16px 22px;
    background: linear-gradient(180deg, rgba(13,19,48,.92), rgba(13,19,48,.6) 70%, transparent); }
  .bossbox.arena .info b { font-family: "Arial Black", Impact, sans-serif; font-style: italic; text-transform: uppercase; font-size: 19px; }
  .bossbox.arena .stagepos { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; }
  .bossbox.arena .face { line-height: 0; }
  .bossbox.arena .face img { width: 150px; height: 150px; filter: drop-shadow(0 0 14px rgba(255,255,255,.55)) drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
  .bossbox.arena .face:not(.hit):not(.laugh) { animation: bob 3s ease-in-out infinite; }
  @media (max-width: 520px) { .chest { width: 104px; height: 104px; } .bossbox.arena { height: 210px; } .bossbox.arena .face img { width: 120px; height: 120px; } .bossbox.arena .stagepos { bottom: 22px; } }

  /* ---- Fortnite time: the reward pie ---- */
  .timecard { background: #0d1330; color: #fff; border-radius: 16px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .pie { --p: 0; width: 132px; height: 132px; border-radius: 50%; flex: none; position: relative;
    background: conic-gradient(#ffe81a calc(var(--p) * 1%), #2b3566 0); border: 5px solid #fff; box-shadow: 0 0 0 4px #0d1330, 0 0 24px rgba(255,232,26,.55); }
  .pie::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(rgba(13,19,48,.55) 0 1deg, transparent 1deg 30deg); }
  .pie.mini { width: 22px; height: 22px; border-width: 2px; box-shadow: none; display: inline-block; vertical-align: -5px; margin-right: 6px; }
  .pie.mini::after { display: none; }
  .pie.grow { animation: piegrow .7s; }
  @keyframes piegrow { 40% { transform: scale(1.45); filter: brightness(1.4); } }
  .timecard .txt { flex: 1 1 220px; }
  .timecard .lab { color: #ffe81a; font-size: 17px; }
  .timecard .bigt { font-size: 38px; font-weight: 900; line-height: 1.1; font-family: "Arial Black", Impact, sans-serif; }
  .timecard .of { opacity: .85; font-size: 15px; }
  .tgain { background: #0d1330; color: #ffe81a; font-weight: 800; border-radius: 8px; padding: 6px 12px; display: inline-block; margin: 0 0 8px !important; }
  .usedrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .usedrow .btn { padding: 5px 12px; font-size: 14px; }
</style>
</head>

  const T = (x, y, s, o = "") => `<text x="${x}" y="${y}" font-size="14" fill="${INK}" ${o}>${s}</text>`;

  /* a column graph: series = [{name, color, values}], gridlines every `step` up to `max` */
  function colGraph({ labels, series, max, step, ylabel, numbers = true, aria }) {
    const W = 70 + labels.length * (series.length * 26 + 30), H = 250, y = v => 205 - v * (170 / max);
    let g = "";
    for (let v = 0; v <= max; v += step) g += `<line x1="50" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#c5ccd8" stroke-width="1"/>` + (numbers ? T(42, y(v) + 5, v, 'text-anchor="end"') : "");

      series.forEach((s, k) => { g += `<rect x="${x0 + k * 26}" y="${y(s.values[i])}" width="24" height="${205 - y(s.values[i])}" fill="${s.color}" stroke="${INK}" stroke-width="1.5"/>`; });

    return `<div class="figure"><svg viewBox="0 0 ${W} ${H + (series.length > 1 ? 6 : -12)}" width="${W}" role="img" aria-label="${aria}">${g}</svg></div>`;
  }

  const cw = cells => norm(cells.map(([r, c]) => [c, 2 - r]));
  const mirror = cells => norm(cells.map(([r, c]) => [r, 2 - c]));
  const TILE_DESC = {
    start: "three squares in a column with one more square to the right of the bottom square, like a capital L",

            stem: `<p>One fruit cup needs <b>3 strawberries</b>, <b>2 kiwi slices</b> and <b>5 grapes</b>.</p><p>Sam has 20 strawberries, 15 kiwi slices and 28 grapes. What is the <b>largest</b> number of complete fruit cups he can make?</p>`,

            stem: `<p class="box">This season the Hawks won 12 games and the Eagles won 9 games.<br><br>Tom: “The Hawks won more games, so they are clearly the better team.”</p><p>Which one of these shows the mistake Tom has made?</p>`,

            explain: `<p>Gus is directly in front of Hana, and Hana is directly in front of Fay, so Gus, Hana, Fay stand together in that order. Ivy is at the front, so the block takes places 2–4 or places 3–5. Eli has to be behind Fay, so there must be a place left after her: the block is in places 2–4 and Eli is last. The queue is Ivy, Gus, <b>Hana</b>, Fay, Eli, and Hana is in the middle.</p><p class="why-not">Gus is in the middle only if you count from Gus instead of from Ivy at the front. Fay is in the middle if the block is pushed to the back, but then Eli would have nowhere to stand behind her.</p>` },

/* ---------------------------------------------------------------
   CROWN QUEST: Number Reef (maths). Five options (A–E) per question.
   Levels climb from warm-up to the hardest third of the sample papers.
   --------------------------------------------------------------- */
(() => {
  const T = (x, y, s, o = "") => `<text x="${x}" y="${y}" font-size="15" fill="${INK}" ${o}>${s}</text>`;

  /* L2 Q1: a measuring jug, labelled every 100 mL with one unlabelled mark between */
  const JUG = (() => {
    const y = v => 230 - v * 0.4;                      // 0 mL at y=230, 500 mL at y=30
    let g = `<path d="M70 20 L70 232 Q70 240 78 240 L182 240 Q190 240 190 232 L190 20" fill="none" stroke="${INK}" stroke-width="3"/>`;
    g += `<rect x="72" y="${y(350)}" width="116" height="${238 - y(350)}" fill="#f6c453" opacity=".75"/>`;
    for (let v = 0; v <= 500; v += 50) {
      const big = v % 100 === 0;
      g += `<line x1="70" x2="${big ? 98 : 86}" y1="${y(v)}" y2="${y(v)}" stroke="${INK}" stroke-width="2"/>`;
      if (big && v) g += T(104, y(v) + 5, v + " mL");
    }
    return `<div class="figure"><svg viewBox="0 0 260 250" width="240" height="231" role="img" aria-label="A measuring jug. Marks are labelled 100 mL, 200 mL, 300 mL, 400 mL and 500 mL, with one small unlabelled mark halfway between each pair of labels. The juice reaches the small mark between 300 mL and 400 mL.">${g}</svg></div>`;
  })();

  /* Boss Q2: column graph of books read */
  const GRAPH = (() => {
    const data = [["Ava", 8], ["Ben", 5], ["Cy", 11], ["Dee", 6], ["Eli", 10]];
    const y = v => 210 - v * 15;
    let g = "";
    for (let v = 0; v <= 12; v += 2) g += `<line x1="50" x2="330" y1="${y(v)}" y2="${y(v)}" stroke="#c5ccd8" stroke-width="1"/>` + T(42, y(v) + 5, v, 'text-anchor="end"');
    data.forEach(([n, v], i) => {
      const x = 68 + i * 54;
      g += `<rect x="${x}" y="${y(v)}" width="34" height="${210 - y(v)}" fill="#4dabf7" stroke="${INK}" stroke-width="1.5"/>` + T(x + 17, 230, n, 'text-anchor="middle"');
    });
    g += `<line x1="50" x2="50" y1="${y(12)}" y2="210" stroke="${INK}" stroke-width="2"/><line x1="50" x2="330" y1="210" y2="210" stroke="${INK}" stroke-width="2"/>`;
    g += `<text x="14" y="120" font-size="14" fill="${INK}" text-anchor="middle" transform="rotate(-90 14 120)">Books read</text>`;
    return `<div class="figure"><svg viewBox="0 0 340 240" width="340" height="240" role="img" aria-label="A column graph of books read. The scale is marked 0, 2, 4, 6, 8, 10, 12. Ava's column reaches 8. Ben's column is halfway between 4 and 6. Cy's column is halfway between 10 and 12. Dee's column reaches 6. Eli's column reaches 10.">${g}</svg></div>`;
  })();

  /* Boss Q3: a 3 × 3 × 3 cube drawn from one corner */
  const CUBE = (() => {
    const u = 30, dx = 15, dy = 12, ox = 30, oy = 60;
    let g = "";
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      g += `<rect x="${ox + c * u}" y="${oy + r * u}" width="${u}" height="${u}" fill="#ff8a65" stroke="${INK}" stroke-width="1.5"/>`;                                            // front
      const tx = ox + c * u + (2 - r) * dx, ty = oy - (2 - r) * dy;
      g += `<polygon points="${tx},${ty} ${tx + u},${ty} ${tx + u + dx},${ty - dy} ${tx + dx},${ty - dy}" fill="#ffb39b" stroke="${INK}" stroke-width="1.5"/>`;                    // top
      const sx = ox + 3 * u + c * dx, sy = oy + r * u - c * dy;
      g += `<polygon points="${sx},${sy} ${sx + dx},${sy - dy} ${sx + dx},${sy - dy + u} ${sx},${sy + u}" fill="#e0664a" stroke="${INK}" stroke-width="1.5"/>`;                    // side
    }
    return `<div class="figure"><svg viewBox="0 0 190 160" width="190" height="160" role="img" aria-label="A large cube made of 27 small cubes, 3 small cubes long, 3 wide and 3 high.">${g}</svg></div>`;
  })();

  const tbl = (head, rows) => `<div class="figure"><table class="grid"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table></div>`;

  /* M1: picture graph */
  const book = (x, y, half) => `<rect x="${x}" y="${y}" width="${half ? 13 : 26}" height="30" rx="2" fill="#4dabf7" stroke="${INK}" stroke-width="1.5"/>` + (half ? "" : `<line x1="${x + 6}" x2="${x + 6}" y1="${y}" y2="${y + 30}" stroke="${INK}" stroke-width="1.5"/>`);
  const PICT = (() => {
    const rows = [["Monday", 3], ["Tuesday", 4.5], ["Wednesday", 2], ["Thursday", 3.5]];
    let g = "";
    rows.forEach(([d, n], i) => {
      const y = 12 + i * 42;
      g += T(92, y + 21, d, 'text-anchor="end"') + `<line x1="100" x2="100" y1="${y - 6}" y2="${y + 36}" stroke="${INK}" stroke-width="2"/>`;
      for (let k = 0; k < Math.floor(n); k++) g += book(110 + k * 32, y);
      if (n % 1) g += book(110 + Math.floor(n) * 32, y, true);
    });
    g += book(110, 186) + T(144, 207, "= 4 books");
    return `<div class="figure"><svg viewBox="0 0 290 224" width="290" role="img" aria-label="A picture graph of books borrowed. Monday: 3 book symbols. Tuesday: 4 and a half symbols. Wednesday: 2 symbols. Thursday: 3 and a half symbols. Key: one symbol = 4 books.">${g}</svg></div>`;
  })();

  /* M2: dot plot */
  const DOTS = (() => {
    const counts = [1, 3, 5, 4, 4, 2, 1];
    let g = `<line x1="20" x2="300" y1="130" y2="130" stroke="${INK}" stroke-width="2"/>`;
    counts.forEach((c, v) => {
      const x = 40 + v * 40;
      g += `<line x1="${x}" x2="${x}" y1="130" y2="136" stroke="${INK}" stroke-width="2"/>` + T(x, 152, v, 'text-anchor="middle"');
      for (let k = 0; k < c; k++) g += `<circle cx="${x}" cy="${118 - k * 22}" r="8" fill="#ff8a65" stroke="${INK}" stroke-width="1.5"/>`;
    });
    g += T(160, 172, "Goals scored", 'text-anchor="middle"');
    return `<div class="figure"><svg viewBox="0 0 320 180" width="320" role="img" aria-label="A dot plot. Each dot is one child. 0 goals: 1 dot. 1 goal: 3 dots. 2 goals: 5 dots. 3 goals: 4 dots. 4 goals: 4 dots. 5 goals: 2 dots. 6 goals: 1 dot.">${g}</svg></div>`;
  })();

  /* L2 Q3: the rectangle, not to scale */
  const RECT = `<div class="figure"><svg viewBox="0 0 260 130" width="260" role="img" aria-label="A rectangle. The long side is labelled 8 cm. The short side is labelled with a question mark. The diagram is not to scale."><rect x="40" y="20" width="170" height="70" fill="#dff0d8" stroke="${INK}" stroke-width="2.4"/>${T(125, 14, "8 cm", 'text-anchor="middle" font-weight="700"')}${T(218, 60, "?", 'font-weight="700"')}<text x="125" y="112" font-size="13" text-anchor="middle" fill="#55607a">not to scale</text></svg></div>`;

  /* a column graph: series = [{name, color, values}], gridlines every `step` up to `max` */
  function colGraph({ labels, series, max, step, ylabel, numbers = true, aria }) {
    const W = 70 + labels.length * (series.length * 26 + 30), H = 250, y = v => 205 - v * (170 / max);
    let g = "";
    for (let v = 0; v <= max; v += step) g += `<line x1="50" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#c5ccd8" stroke-width="1"/>` + (numbers ? T(42, y(v) + 5, v, 'text-anchor="end"') : "");
    labels.forEach((n, i) => {
      const x0 = 66 + i * (series.length * 26 + 30);
      series.forEach((s, k) => { g += `<rect x="${x0 + k * 26}" y="${y(s.values[i])}" width="24" height="${205 - y(s.values[i])}" fill="${s.color}" stroke="${INK}" stroke-width="1.5"/>`; });
      g += T(x0 + series.length * 13, 224, n, 'text-anchor="middle"');
    });
    g += `<line x1="50" x2="50" y1="${y(max)}" y2="205" stroke="${INK}" stroke-width="2"/><line x1="50" x2="${W - 10}" y1="205" y2="205" stroke="${INK}" stroke-width="2"/>`;
    g += `<text x="14" y="120" font-size="13" fill="${INK}" text-anchor="middle" transform="rotate(-90 14 120)">${ylabel}</text>`;
    if (series.length > 1) series.forEach((s, k) => { g += `<rect x="${60 + k * 110}" y="236" width="14" height="12" fill="${s.color}" stroke="${INK}"/>` + T(80 + k * 110, 247, s.name); });
    return `<div class="figure"><svg viewBox="0 0 ${W} ${H + (series.length > 1 ? 6 : -12)}" width="${W}" role="img" aria-label="${aria}">${g}</svg></div>`;
  }

  /* L4 (Chart Cove) Q1: cupcakes sold */
  const CUPCAKES = colGraph({ labels: ["Mon", "Tue", "Wed"], max: 30, step: 10, ylabel: "Cupcakes sold",
    series: [{ name: "", color: "#f783ac", values: [15, 25, 10] }],
    aria: "A column graph of cupcakes sold. The scale goes 0, 10, 20, 30. Monday's column is halfway between 10 and 20. Tuesday's column is halfway between 20 and 30. Wednesday's column reaches 10." });
  /* L4 Q2: shells, scale missing */
  const SHELLS = colGraph({ labels: ["Aki", "Bo"], max: 10, step: 1, ylabel: "Shells collected", numbers: false,
    series: [{ name: "", color: "#63e6be", values: [6, 9] }],
    aria: "A column graph with no numbers on its scale. There are evenly spaced lines across the graph. Aki's column reaches the 6th line above the bottom. Bo's column reaches the 9th line." });
  /* L4 Q3: two rain gauges with different scales */
  function gauge(x, title, labels, gaps, level, top) {
    const y = v => 190 - v * (150 / top), unit = (labels[1] - labels[0]) / gaps;
    let g = `<path d="M${x} 30 L${x} 192 Q${x} 198 ${x + 6} 198 L${x + 54} 198 Q${x + 60} 198 ${x + 60} 192 L${x + 60} 30" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
    g += `<rect x="${x + 2}" y="${y(level)}" width="56" height="${196 - y(level)}" fill="#74c0fc" opacity=".8"/>`;
    for (let v = 0; v <= top + 0.01; v += unit) {
      const big = labels.includes(Math.round(v));
      g += `<line x1="${x}" x2="${x + (big ? 22 : 12)}" y1="${y(v)}" y2="${y(v)}" stroke="${INK}" stroke-width="1.8"/>` + (big ? T(x + 66, y(v) + 5, Math.round(v) + " mm") : "");
    }
    return g + T(x + 30, 218, title, 'text-anchor="middle" font-weight="700"');
  }
  const GAUGES = `<div class="figure"><svg viewBox="0 0 330 226" width="330" role="img" aria-label="Two rain gauges. Monday's gauge is labelled 0, 10, 20 and 30 millimetres, with four small marks between each pair of labels. Its water reaches the third small mark above 10. Tuesday's gauge is labelled 0, 20 and 40 millimetres, with three small marks between each pair of labels. Its water reaches the third small mark above 20.">${gauge(20, "Monday", [0, 10, 20, 30], 5, 16, 30)}${gauge(190, "Tuesday", [0, 20, 40], 4, 35, 40)}</svg></div>`;

  /* ---- Shape Shoals (level 3): four shape-and-space diagrams ---- */

  /* Q4: an L-shaped garden, not to scale (real sizes 10 by 7, with a 6 by 4 corner missing) */
  const ELL = `<div class="figure"><svg viewBox="0 0 280 200" width="280" role="img" aria-label="An L-shaped garden. Every corner is a right angle. The bottom side is 10 m. The left side is 7 m. The top side, which only goes part of the way across, is 4 m. The short side on the right is 3 m. Two sides, the ones that make the step in the L, have no lengths marked. Not to scale."><polygon points="40,20 120,20 120,100 240,100 240,160 40,160" fill="#dff0d8" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>${T(140, 180, "10 m", 'text-anchor="middle" font-weight="700"')}${T(32, 95, "7 m", 'text-anchor="end" font-weight="700"')}${T(80, 14, "4 m", 'text-anchor="middle" font-weight="700"')}${T(248, 135, "3 m", 'font-weight="700"')}<text x="140" y="197" font-size="12" text-anchor="middle" fill="#55607a">not to scale</text></svg></div>`;

  WORLDS.push({

        questions: [

          stem: `<p>The picture graph shows how many books a class borrowed each day.</p>${PICT}<p>How many <b>more</b> books were borrowed on <b>Tuesday</b> than on <b>Wednesday</b>?</p>`,

          { id: "m1c", cat: "Money & best value",
            stem: `<p>Zoe buys a drink for <b>$2.60</b> and a sandwich for <b>$4.75</b>. She pays with a <b>$10</b> note. How much change does she get?</p>`,

            hint: `Two steps: first find the total cost, then take it away from $10.`,

          { id: "m1d", cat: "Number & place value",
            stem: `<p>What number goes in the box?</p><p class="gapline" style="text-align:center">57 + ☐ = 100 − 15</p>`,

      {
        id: "m2", name: "Coral Maze",
        questions: [
          { id: "m2a", cat: "Measurement & scales",
            stem: `<p>The jug shows how much juice Ali has.</p>${JUG}<p>He pours <b>100 mL</b> into a glass. How much juice is left in the jug?</p>`,

          { id: "m2b", cat: "Fractions",

          { id: "m2d", cat: "Patterns & sequences",
            stem: `<p>Beads on a string repeat in this pattern:</p>${BEADS("🔴🔴🔵🟢🔴🔴🔵🟢🔴🔴🔵🟢")}<p>How many of the <b>first 22 beads</b> are <b>red</b>?</p>`,

        questions: [
          { id: "m6a", cat: "Area, perimeter & 3D",
            stem: `<p>Some squares of this grid are shaded. The red dashed line must become a <b>line of symmetry</b>: each side must be a mirror image of the other.</p>${SYM}<p>What is the <b>smallest</b> number of <b>extra</b> squares that must be shaded?</p>`,

            hint: `Take each shaded square in turn and find its mirror partner: the same row, and the same number of squares from the dashed line on the other side. Is the partner shaded already?`,

          { id: "m6b", cat: "Area, perimeter & 3D",
            stem: `<p>The corner of a page fits exactly into a right angle.</p>${TEE}<p>Imagine the shape is a flat tray. At how many of its corners would a page corner fit exactly <b>inside</b> the tray?</p>`,

            explain: `<p>The shape has 8 corners. At 6 of them (the four ends of the top bar and the two at the bottom of the stem) a page corner fits snugly inside: these are right angles. At the 2 corners where the stem meets the bar, the <em>inside</em> of the shape wraps round the corner: that angle is three square corners, not one. So <b>6</b> are right angles.</p><p class="why-not">8 counts every corner, including the two where the right angle is on the outside. 4 counts only the top bar. 2 counts only the corners that are different.</p>` },
          { id: "m6c", cat: "Measurement & scales",
            stem: `<p>The map shows a park. Each square is one step, and north is at the top.</p>${PARK}<p>Ravi starts at the <b>Tree</b>. He walks <b>3 steps north</b>, <b>2 steps east</b>, <b>1 step south</b> and then <b>4 steps west</b>. Where does he finish?</p>`,
            options: ["Bench", "Gate", "Pond", "Shed", "Well"], answer: 4,
            hint: `Trace each move with your finger from where the last one ended. East is to the right and west is to the left; north is up the page.`,
            explain: `<p>From the Tree, 3 north takes him level with the Bench. 2 east moves him right, 1 south brings him down a row, and 4 west takes him back past the Tree's column to 2 squares left of it. He is 2 rows above the Tree and 2 columns to its left: the <b>Well</b>.</p><p class="why-not">The Shed is where he ends up if he forgets the last move west. The Pond is where he would be without the step south. The Bench is where he is after the first move only. The Gate is 4 steps west of the Tree, ignoring everything else.</p>` },
          { id: "m6d", cat: "Area, perimeter & 3D",
            stem: `<p>The diagram shows an L-shaped garden. Every corner is a right angle. Two of the sides have no length marked.</p>${ELL}<p>What is the <b>perimeter</b> of the garden?</p>`,

            hint: `Find the two missing sides first. The top side and the missing flat side together stretch as far as the bottom side. The same idea works for the upright sides.`,
            explain: `<p>The two flat sides on top must add up to the bottom side: 4 + ? = 10, so the missing flat side is 6 m. The two upright sides on the right must add up to the left side: 3 + ? = 7, so the missing upright side is 4 m. Perimeter: 10 + 7 + 4 + 3 + 6 + 4 = <b>34 m</b>.</p><p class="why-not">24 m adds only the four sides that are marked. 28 m and 30 m find only one of the missing sides. 70 m multiplies 10 by 7, which is neither the perimeter nor the area of this shape.</p>` },

      {
        id: "m3", name: "Kelp Canyon",
        questions: [
          { id: "m3a", cat: "Money & best value",
            stem: `<p>A shop sells pencils three ways:</p><ul style="margin:0 0 10px"><li>one pencil for <b>80c</b></li><li>a pack of 4 for <b>$3.00</b></li><li>a pack of 10 for <b>$7.00</b></li></ul><p>What is the <b>least</b> Ravi can pay for <b>exactly 12</b> pencils?</p>`,
            options: ["$8.60", "$9.00", "$9.20", "$9.60", "$10.00"], answer: 0,
            hint: `Three packs of 4 looks neat, but is it the cheapest? Try each way of making 12 and compare.`,
            explain: `<p>Ways to make 12: a pack of 10 + 2 singles = $7.00 + $1.60 = <b>$8.60</b>; three packs of 4 = $9.00; two packs of 4 + 4 singles = $9.20; 12 singles = $9.60. The cheapest is $8.60.</p><p class="why-not">$9.00 is the tidy answer (three packs of 4), but the pack of 10 is better value per pencil. $10.00 buys both packs, which is 14 pencils, not 12.</p>` },
          { id: "m3b", cat: "Chance & counting",
            stem: `<p>A bag holds <b>5 red</b>, <b>3 blue</b> and <b>2 green</b> marbles. Kim takes one without looking.</p><div class="box">1. A red marble is more likely than a marble that is not red.<br>2. Green is the least likely colour.<br>3. It is impossible to take a yellow marble.</div><p>Which statements are correct?</p>`,
            options: ["1 only", "2 only", "1 and 2 only", "2 and 3 only", "1, 2 and 3"], answer: 3,
            hint: `For statement 1, count the marbles that are <b>not</b> red: blue and green together.`,
            explain: `<p>Statement 1: there are 5 red and 3 + 2 = 5 not red, so they are <b>equally</b> likely. Not correct. Statement 2: green has the fewest marbles (2), so it is least likely. Correct. Statement 3: there are no yellow marbles, so it is impossible. Correct. So <b>2 and 3 only</b>.</p><p class="why-not">Statement 1 is the trap: red is the most likely <em>colour</em>, but it is not more likely than all the other marbles put together.</p>` },
          { id: "m3e", cat: "Graphs & data",

            stem: `<p>Today is <b>Wednesday</b>. What day of the week will it be in <b>40 days</b>?</p>`,

        questions: [
          { id: "m5a", cat: "Graphs & data",
            stem: `<p>A school stall wants to sell <b>80 cupcakes</b> in four days. The graph shows the first three days.</p>${CUPCAKES}<p>How many cupcakes must the stall sell on <b>Thursday</b> to reach its target?</p>`,
            options: ["20", "30", "35", "40", "50"], answer: 1,
            hint: `Two of the columns stop <b>halfway</b> between two lines. The lines go up in 10s, so what is halfway worth?`,

          { id: "m5b", cat: "Graphs & data",
            stem: `<p>Aki and Bo collected shells. The numbers have been left off the graph’s scale, but the lines are evenly spaced and start at 0.</p>${SHELLS}<p>Together they collected <b>60 shells</b>. How many did <b>Bo</b> collect?</p>`,

            explain: `<p>Aki’s column reaches 6 lines and Bo’s reaches 9: 15 lines for 60 shells, so each line is 60 ÷ 15 = 4 shells. Bo collected 9 × 4 = <b>36</b>.</p><p class="why-not">9 treats each line as 1 shell. 24 is Aki’s number. 30 just halves the total, but the columns are not the same height. 45 guesses that each line is worth 5.</p>` },
          { id: "m5c", cat: "Measurement & scales",
            stem: `<p>The two gauges show how much rain fell on Monday and on Tuesday. <b>Their scales are different.</b></p>${GAUGES}<p>How much <b>more</b> rain fell on Tuesday than on Monday?</p>`,

          { id: "m5d", cat: "Graphs & data",
            stem: `<p>The table shows a netball competition so far. A win earns <b>3 points</b>, a draw earns <b>1 point</b> and a loss earns none.</p>${tbl(["Team", "Played", "Won", "Drawn", "Lost"], [["Reds", 8, 5, 1, 2], ["Blues", 8, 4, 4, 0], ["Greens", 7, 4, 1, 2], ["Golds", 8, 2, 3, 3]])}<div class="box">1. The Reds have more points than the Blues.<br>2. The Blues have not lost a game.<br>3. If the Greens win their next game, they will have as many points as the Reds have now.</div><p>Which statements are correct?</p>`,

          explain: `<p>She reaches the Market at 9:28 and finishes shopping at 9:28 + 40 minutes = 10:08. Bus 2 left the Market at 9:58, so she has missed it. Bus 3 leaves at 10:38 and reaches the Beach at <b>11:05 am</b>.</p><p class="why-not">10:25 is when Bus 2 arrives, but she was still shopping when it left. 10:38 is when Bus 3 <em>leaves</em> the Market. 10:08 is when her shopping ends. 10:35 adds 40 minutes to Bus 1’s arrival at the Beach.</p>` },
          { id: "m4c", cat: "Area, perimeter & 3D",

          { id: "mbb", cat: "Graphs & data",
            stem: `<p>The graph shows how many books five children read last term.</p>${GRAPH}<div class="box">1. Cy read exactly twice as many books as Ben.<br>2. Ava and Ben together read fewer books than Dee and Eli together.<br>3. Three of the children read more than 8 books.</div><p>Which statements are correct?</p>`,
            options: ["2 only", "3 only", "1 and 2 only", "2 and 3 only", "1, 2 and 3"], answer: 0,
            hint: `The lines go up in 2s, so a column that stops <b>halfway</b> between two lines is an odd number. Read Ben and Cy carefully.`,
            explain: `<p>Read the columns: Ava 8, Ben 5, Cy 11, Dee 6, Eli 10. Statement 1: twice 5 is 10, but Cy read 11. Not correct. Statement 2: 8 + 5 = 13 and 6 + 10 = 16, and 13 is fewer than 16. Correct. Statement 3: only Cy (11) and Eli (10) read <b>more than</b> 8; Ava read exactly 8. Not correct. So <b>2 only</b>.</p><p class="why-not">Statement 1 looks right if you read Cy's column as 12 or Ben's as 6. Statement 3 looks right if you count Ava, but 8 is not more than 8.</p>` },

            options: ["8", "12", "18", "24", "26"], answer: 1,
            hint: `Corner cubes have three painted faces. Look for the cubes in the <b>middle of each edge</b> of the large cube. How many edges does a cube have?`,

            options: ["603", "683", "687", "693", "707"], answer: 3,

            explain: `<p>Largest: 962. Smallest: 269. 962 − 269: take away 262 to get 700, then 7 more: <b>693</b>.</p><p class="why-not">707 takes the smaller digit from the larger in every column (9 − 2, 6 − 6, 9 − 2) instead of trading. 683 and 603 are slips in the trading.</p>` },
          { id: "mbe", cat: "Money & best value",
            stem: `<p><b>3 pens and 2 rulers</b> cost <b>$9.50</b>.<br><b>1 pen and 2 rulers</b> cost <b>$5.50</b>.</p><p>How much do <b>1 pen and 1 ruler</b> cost together?</p>`,

        ],

    ],
  });
})();

<script>
(() => {
"use strict";
const KEY = "prac2.v1";

  ["cuddle", "Cuddle Team Leader", "#ffb21a"], ["drift", "Drift", "#ffb21a"], ["midas", "Midas", "#ffb21a"]];

  ["first", "🥾", "First steps", "Finish your first level"],

  ["days7", "🗓️", "A whole week", "Play 7 days in a row"],

/* ---------- saved progress ---------- */

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function dayStreak() {

  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (!set.has(k)) break; n++; d.setDate(d.getDate() - 1); }

/* ---------- rules ---------- */
const best = lv => (S.levels[lv.id] || {}).stars || 0;
const regular = w => w.levels.filter(l => !l.boss);
const worldStars = w => regular(w).reduce((a, l) => a + best(l), 0);
const bossGate = w => regular(w).length * 3 - 3;   // 9 of 12 stars with four levels, 12 of 15 with five
function starsFor(lv, pts) {

  if (lv.boss) return pts >= max ? 3 : pts >= max - 2 ? 2 : pts >= max - 3 ? 1 : 0;
  return pts >= max - 1 ? 3 : pts >= max - 3 ? 2 : pts >= max - 5 ? 1 : 0;
}
function lockReason(w, i) {
  if (PRACTICE) return "";
  const lv = w.levels[i];
  if (lv.boss) { const s = worldStars(w); return s >= bossGate(w) ? "" : `Collect ${bossGate(w)} ⭐ in ${w.name} to wake the boss (you have ${s})`; }

}
const rankOf = xp => { let r = 0; RANKS.forEach((x, i) => { if (xp >= x[0]) r = i; }); return r; };
const allQuestions = () => WORLDS.flatMap(w => w.levels.flatMap(l => l.questions.map(q => ({ q, lv: l, w }))));
/* Fortnite time. Every question is worth a share of one hour, by how hard its level is
   (level 1 = 1 share, level 2 = 2 … and a boss question = twice the last level). Right first

const HOUR = 3600;
const TIME = (() => {
  const w = {}; let total = 0;
  WORLDS.forEach(wd => { const n = regular(wd).length; wd.levels.forEach((lv, i) => lv.questions.forEach(q => { w[q.id] = lv.boss ? n * 2 : i + 1; total += w[q.id]; })); });
  Object.keys(w).forEach(k => w[k] = HOUR * w[k] / total);
  return w;
})();
const earned = () => Object.keys(TIME).reduce((a, id) => a + TIME[id] * (((S.q[id] || {}).best || 0) / 2), 0);
const fmt = s => {

const caveList = () => allQuestions().filter(x => S.q[x.q.id] && S.q[x.q.id].seen && (S.q[x.q.id].best || 0) < 2);

}
const SFX = { right: () => tone([523, 784]), retry: () => tone([392, 587]), wrong: () => tone([196, 147], 0.16, "sawtooth", 0.07),
  win: () => tone([523, 659, 784, 1047], 0.14), boss: () => tone([392, 523, 659, 784, 1047, 1319], 0.15), hit: () => tone([150, 90], 0.1, "square", 0.08) };
function confetti(n = 140) {

function flash(cls, text, ms = 1700) { const d = document.createElement("div"); d.className = cls; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function award(id) { if (S.badges[id]) return false; S.badges[id] = today(); const b = BADGES.find(b => b[0] === id); if (b) newBadges.push(b); return true; }
let newBadges = [];

      <div class="badges">${BADGES.map(b => `<span class="badge${S.badges[b[0]] ? "" : " off"}" title="${esc(b[3])}"><i>${b[1]}</i><span><b>${esc(b[2])}</b><br><small>${esc(b[3])}</small></span></span>`).join("")}</div></div>
    ${parents()}
    <p class="legal">A private, non-commercial fan project. Portions of the materials used are trademarks and/or copyrighted works of Epic Games, Inc. All rights reserved by Epic. This material is not official and is not endorsed by Epic.</p>`;
  $("#snd").onclick = () => { S.sound = !S.sound; save(); showMap(); if (S.sound) SFX.right(); };
  if ($("#cave")) $("#cave").onclick = startCave;
  app.querySelectorAll(".speedchip").forEach(c => c.onclick = () => { const w = WORLDS.find(w => w.id === c.dataset.w); startSpeed(w, w.levels.find(l => l.id === c.dataset.l)); });
  app.querySelectorAll(".node").forEach(n => n.onclick = () => {
    if (n.dataset.why) { flash("toast", "🔒 " + n.dataset.why, 2600); SFX.wrong(); return; }

  });

  if (reset) reset.onclick = () => { if (confirm("Wipe ALL progress in this game on this device? This can't be undone.")) { localStorage.removeItem(KEY); S = load(); showMap(); } };

}
function parents() {

  allQuestions().forEach(({ q, w }) => {
    const k = w.name + " · " + q.cat, r = rows[k] = rows[k] || { n: 0, seen: 0, first: 0, second: 0 }, s = S.q[q.id];

  });
  return `<details class="parents"><summary>For grown-ups: progress by question type</summary>
    <p><b>Fortnite time:</b> ${fmt(earned())} earned of 60 minutes, ${fmt(S.used || 0)} marked as used, <b>${fmt(Math.max(0, earned() - (S.used || 0)))} left</b>. When he has had some of his time, record it here:</p>
    <div class="usedrow"><button class="btn ghost" data-used="300">+5 min used</button><button class="btn ghost" data-used="900">+15 min used</button><button class="btn ghost" data-used="1800">+30 min used</button><button class="btn ghost" data-used="0">Clear used time</button></div>
    <p>“Right first time” counts the very first attempt at each question. Progress is saved in this browser on this device only.</p>
    <table><tr><th>Question type</th><th class="n">Tried</th><th class="n">Right first time</th><th class="n">Right after a hint</th></tr>
    ${Object.entries(rows).map(([k, r]) => `<tr><td>${esc(k)}</td><td class="n">${r.seen} of ${r.n}</td><td class="n">${r.first}</td><td class="n">${r.second}</td></tr>`).join("")}</table>
    ${PRACTICE ? "" : `<button class="btn ghost" id="reset">Reset all progress…</button>`}</details>`;
}

/* ---------- playing a level ---------- */
let play = null;
function startLevel(w, lv) { play = { w, lv, items: lv.questions.map(q => ({ q, lv })), idx: 0, pts: 0, res: [], cave: false }; begin(); }
function startCave() {
  const items = caveList().slice(0, 5).map(x => ({ q: x.q, lv: x.lv, w: x.w }));
  play = { w: { name: "Comeback Cave", color: "#b97f00" }, lv: { id: "cave", name: "Comeback Cave" }, items, idx: 0, pts: 0, res: [], cave: true }; begin();
}
function begin() {
  newBadges = []; play.rank0 = rankOf(S.xp); play.t0 = earned();
  const t = today(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-60); save(); }
  showQuestion();
}
function showQuestion() {
  const p = play, it = p.items[p.idx], q = it.q, lv = it.lv, boss = p.lv.boss;
  p.tries = 0; p.done = false;
  document.querySelectorAll(".combo").forEach(c => c.remove());
  const max = p.items.length * 2;
  const passage = lv.passage ? `<div class="card passage"><h3>${lv.passage.title}</h3>${lv.passage.note ? `<p class="note">${lv.passage.note}</p>` : ""}${lv.passage.html}</div>` : "";
  app.innerHTML = `
    <div class="playbar"><button class="pill" id="quit">← Map</button><span class="title">${esc(p.w.name)} · ${esc(boss ? p.w.boss.name : p.lv.name)}</span><span class="spacer" style="flex:1"></span>
      <span class="dots">${p.items.map((_, i) => `<i class="${i < p.idx ? "p" + p.res[i] : i === p.idx ? "cur" : ""}"></i>`).join("")}</span><span class="pill" id="tpill"><i class="pie mini" id="minipie" style="--p:${piePct()}"></i><span id="ttxt">${fmt(earned())}</span></span><span class="pill" id="gems">💎 ${p.pts}</span></div>
    ${boss ? `<div class="bossbox arena" style="background-image:url(art/${ARENA[p.w.id]}.webp)"><div class="stagepos"><div class="face" id="face">${art(p.w.boss.img, p.w.boss.name)}</div></div><div class="info"><b>${esc(p.w.boss.name)}</b>
      <div class="hp"><i id="hp" style="width:${100 * (max - p.pts) / max}%"></i></div><div class="say" id="say">${esc(p.idx === 0 ? p.w.boss.taunt : "Is that all you've got?")}</div></div></div>` : ""}
    <div class="stage${passage ? " has-passage" : ""}" style="--world:${p.w.color}">${passage}
      <div class="card"><div class="qhead"><span>Question ${p.idx + 1} of ${p.items.length}</span><span>${esc(q.cat)}</span></div>
        <div class="stem">${q.stem}</div>
        <div class="opts${q.visual ? " visual" : ""}" id="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="let">${LETTERS[i]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="fb" aria-live="polite"></div></div></div>`;
  $("#quit").onclick = () => { if (p.idx === 0 && p.tries === 0 || confirm("Leave this level? Your stars for this try won't be saved.")) showMap(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(Number(b.dataset.i), b));
  window.scrollTo(0, 0);
}
function choose(i, btn) {
  const p = play, it = p.items[p.idx], q = it.q;
  if (p.done || btn.disabled) return;
  p.tries++;
  const right = i === q.answer, fb = $("#fb"), boss = p.lv.boss;
  if (!right && p.tries === 1) {
    btn.classList.add("wrong"); btn.disabled = true; SFX.wrong(); streak = 0;
    if (boss) { const f = $("#face"); f.classList.remove("laugh"); void f.offsetWidth; f.classList.add("laugh"); $("#say").textContent = "Ha! Not quite…"; }
    fb.innerHTML = `<div class="fb hint"><h4>💡 Not yet. Here's a hint</h4><p>${q.hint}</p><p><b>Have another go.</b></p></div>`;
    return;
  }
  p.done = true;
  const pts = right ? (p.tries === 1 ? 2 : 1) : 0;
  p.pts += pts; p.res[p.idx] = pts;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const j = Number(b.dataset.i); if (j === q.answer) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); else b.classList.add("dim"); });
  $("#gems").textContent = "💎 " + p.pts;
  /* remember how this question went */
  const s = S.q[q.id] = S.q[q.id] || { seen: 0, best: 0 };
  const before = s.best || 0, wasMissed = s.seen > 0 && before < 2;
  const e0 = earned();
  if (!s.seen) s.first = pts;
  s.seen++; s.best = Math.max(before, pts);
  const dt = earned() - e0;
  let gain = Math.max(0, pts - before) * 10 + (pts ? 1 : 0);
  if (pts === 2 && wasMissed) { gain += 10; award("comeback"); }
  S.xp += gain;
  if (pts === 2) { streak++; if (streak === 5) award("streak5"); if (streak === 10) award("streak10"); } else streak = 0;
  save();
  if (boss && pts) { const f = $("#face"); f.classList.remove("hit"); void f.offsetWidth; f.classList.add("hit"); $("#hp").style.width = (100 * (p.items.length * 2 - p.pts) / (p.items.length * 2)) + "%"; $("#say").textContent = pts === 2 ? "Ouch! A direct hit!" : "Oof… that one grazed me."; SFX.hit(); }
  if (pts === 2) { SFX.right(); if (streak >= 3) flash("combo", `🔥 ${streak} in a row!`); } else if (pts === 1) SFX.retry(); else SFX.wrong();
  const head = pts === 2 ? (wasMissed ? "💪 You beat it this time! +2 💎" : "✅ Right first time! +2 💎") : pts === 1 ? "👍 Got it on the second go. +1 💎" : "This one got away. Here's how it works";
  const last = p.idx === p.items.length - 1;
  if (dt > 0) { const mp = $("#minipie"); mp.style.setProperty("--p", piePct()); mp.classList.add("grow"); $("#ttxt").textContent = fmt(earned()); }
  const tline = dt > 0 ? `<p class="tgain">🎮 +${fmt(dt)} of Fortnite time!${pts === 1 ? " (half: get it first time in the Comeback Cave for the rest)" : ""}</p>` : "";
  fb.innerHTML = `<div class="fb ${pts ? "good" : "miss"}"><h4>${head}</h4>${tline}${q.explain}${pts < 2 ? `<p><b>${p.cave ? "It stays in the Comeback Cave until you get it first time." : "You'll meet this one again in the Comeback Cave."}</b></p>` : ""}</div>
    <div class="next"><button class="btn" id="next" style="background:${p.w.color}">${last ? "Finish →" : "Next question →"}</button></div>`;
  $("#next").onclick = () => { if (last) finish(); else { p.idx++; showQuestion(); } };
  $("#next").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function finish() {
  const p = play, lv = p.lv, n = p.items.length, max = n * 2;
  const lines = [];
  let stars = 0, title, big;
  if (p.cave) {
    const beat = p.res.filter(r => r === 2).length, left = caveList().length;
    big = beat === n ? "💪" : "🕯️"; title = beat ? `You beat ${beat} of ${n}!` : "They got away again";
    lines.push(left ? `${left} question${left > 1 ? "s" : ""} still hiding in the cave.` : "The cave is empty. Every question you have met is beaten!");
    if (beat) { SFX.win(); if (beat === n) confetti(90); }
  } else {
    stars = starsFor(lv, p.pts);
    const rec = S.levels[lv.id] = S.levels[lv.id] || { stars: 0, pts: 0, plays: 0 };
    const beforeStars = rec.stars, unlockedBefore = unlockedIds();
    rec.plays++; rec.pts = Math.max(rec.pts, p.pts);
    if (stars > beforeStars) { S.xp += (stars - beforeStars) * 10 + (lv.boss && !beforeStars ? 100 : 0); rec.stars = stars; }
    award("first"); if (stars === 3 && !lv.boss) award("three");
    if (lv.boss && stars) { award("boss_" + p.w.id); if (p.pts === max) award("perfect"); if (WORLDS.every(w => best(w.levels[w.levels.length - 1]) > 0)) award("all"); }
    const ds = dayStreak(); if (ds >= 3) award("days3"); if (ds >= 7) award("days7");
    save();
    const opened = unlockedIds().filter(id => !unlockedBefore.includes(id));
    if (lv.boss) {
      if (stars) { big = art(p.w.boss.img, "") + art("crown3d", "A golden crown", "crown3d"); title = `You defeated ${p.w.boss.name}!`; lines.push(esc(p.w.boss.defeat)); if (!beforeStars) lines.push(`You won the <b>${esc(p.w.crown)}</b>. +100 XP`); SFX.boss(); confetti(260); }
      else { big = art(p.w.boss.img, ""); title = `${p.w.boss.name} got away…`; lines.push(`You did ${p.pts} damage out of ${max}. You need ${max - 3} to win. Read the explanations, then come back stronger!`); SFX.wrong(); }
    } else {
      big = (stars === 3 ? "🎉" : stars ? "" : "🌱") + art("chest" + chestStage(), "Your treasure chest", "chest"); title = stars === 3 ? "Perfect level!" : stars === 2 ? "Level cleared!" : stars === 1 ? "Nearly there!" : "Keep training!";
      lines.push(`You scored ${p.pts} of ${max} 💎.`);
      if (stars < 2) lines.push("You need 2 ⭐ to unlock the next level. Have another go: you've seen how each one works now.");
      else if (stars === 2 && rec.stars < 3) lines.push("Play again and get every question first time for 3 ⭐.");
      if (stars >= 2) { SFX.win(); if (stars === 3) confetti(); }
    }
    opened.forEach(id => { const x = findLevel(id); lines.push(`🔓 Unlocked: <b>${esc(x.lv.boss ? x.w.boss.name + " (boss!)" : x.lv.name)}</b>`); });
    if (!lv.boss && !opened.length && stars >= 2) { const s = worldStars(p.w); if (s < bossGate(p.w) && lockReason(p.w, p.w.levels.length - 1) && regular(p.w).every(l => best(l) >= 2)) lines.push(`You have ${s} ⭐ here. Get ${bossGate(p.w)} ⭐ to wake the boss: replay a level for 3 ⭐.`); }
  }
  const dt = earned() - p.t0;
  lines.unshift(dt > 0 ? `🎮 <b>+${fmt(dt)}</b> of Fortnite time this round. You now have <b>${fmt(earned())}</b> of 60 minutes.` : `🎮 No new Fortnite time this round. You have ${fmt(earned())} of 60 minutes.`);
  const missed = p.res.filter(r => r < 2).length;
  if (!p.cave && missed) lines.push(`${missed} question${missed > 1 ? "s are" : " is"} waiting in the 💪 Comeback Cave.`);
  newBadges.forEach(b => lines.push(`${b[1]} New badge: <b>${esc(b[2])}</b>`));
  const r = rankOf(S.xp);
  if (p.rank0 !== undefined && r > p.rank0) { lines.push(`⬆️ New rank: <b>${RANKS[r][1]}</b>! New skin unlocked: <b>${esc(SKINS[r][1])}</b>`); big = art(SKINS[r][0], SKINS[r][1]) + (p.lv.boss && stars ? art("crown3d", "A golden crown", "crown3d") : ""); }
  save();
  app.innerHTML = `<div class="card result"><div class="big">${big}</div><h2>${esc(title)}</h2>
    ${p.cave ? "" : `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? "on" : ""}">⭐</span>`).join("")}</div>`}
    <div class="lines">${lines.map(l => `<div>${l}</div>`).join("")}</div>
    <div class="acts"><button class="btn ghost" id="again">Play again</button><button class="btn" id="map" style="background:${p.w.color}">Back to the map →</button></div></div>`;
  $("#map").onclick = showMap;
  $("#again").onclick = () => { if (p.cave) { if (caveList().length) startCave(); else showMap(); } else startLevel(p.w, lv); };
  window.scrollTo(0, 0);
}
/* ---------- speed runs: a level he has already passed, against the clock ----------
   Like the real test: about 70 seconds a question (plus reading time for a passage), one go at
   each question, no hints. All but one right before the clock runs out wins the level's ⚡.
   Speed runs never change the stars, the question records or the Fortnite time. */
let speed = null, speedTimer = null;
const speedSecs = lv => lv.questions.length * 70 + (lv.passage ? 120 : 0);
const clockText = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function stopSpeed() { clearInterval(speedTimer); speedTimer = null; speed = null; }
function startSpeed(w, lv) {
  stopSpeed(); play = null;
  speed = { w, lv, idx: 0, right: 0, left: speedSecs(lv), paused: false };
  speedTimer = setInterval(() => {
    if (!speed || speed.paused) return;
    speed.left--;
    const c = $("#clock"); if (c) { c.textContent = "⏱ " + clockText(Math.max(0, speed.left)); c.classList.toggle("low", speed.left <= 30); }
    if (speed.left <= 0) endSpeed(true);
  }, 1000);
  showSpeedQuestion();
}
function showSpeedQuestion() {
  const s = speed, lv = s.lv, q = lv.questions[s.idx];
  s.paused = false;
  const passage = lv.passage ? `<div class="card passage"><h3>${lv.passage.title}</h3>${lv.passage.note ? `<p class="note">${lv.passage.note}</p>` : ""}${lv.passage.html}</div>` : "";
  app.innerHTML = `
    <div class="playbar"><button class="pill" id="quit">← Map</button><span class="title">⚡ Speed run · ${esc(lv.boss ? s.w.boss.name : lv.name)}</span><span class="spacer" style="flex:1"></span>
      <span class="dots">${lv.questions.map((_, i) => `<i class="${i === s.idx ? "cur" : ""}"></i>`).join("")}</span><span class="pill${s.left <= 30 ? " low" : ""}" id="clock">⏱ ${clockText(s.left)}</span></div>
    <div class="stage${passage ? " has-passage" : ""}" style="--world:${s.w.color}">${passage}
      <div class="card"><div class="qhead"><span>Question ${s.idx + 1} of ${lv.questions.length}</span><span>One go · no hints</span></div>
        <div class="stem">${q.stem}</div>
        <div class="opts${q.visual ? " visual" : ""}">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="let">${LETTERS[i]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="fb" aria-live="polite"></div></div></div>`;
  $("#quit").onclick = showMap;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (s.paused) return;
    s.paused = true;                                    // the clock waits while he looks at the result
    const i = Number(b.dataset.i), ok = i === q.answer;
    if (ok) { s.right++; SFX.right(); } else SFX.wrong();
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; const j = Number(x.dataset.i); x.classList.add(j === q.answer ? "right" : j === i ? "wrong" : "dim"); });
    const last = s.idx === lv.questions.length - 1;
    $("#fb").innerHTML = `<div class="fb ${ok ? "good" : "miss"}"><h4>${ok ? "✅ Right!" : "❌ Not this time"}</h4></div><div class="next"><button class="btn" id="next">${last ? "Finish →" : "Next question →"}</button></div>`;
    $("#next").onclick = () => { if (last) endSpeed(false); else { s.idx++; showSpeedQuestion(); } };
    $("#next").scrollIntoView({ block: "nearest" });
  });
  window.scrollTo(0, 0);
}
function endSpeed(timeUp) {
  const s = speed, lv = s.lv, n = lv.questions.length, won = s.right >= n - 1;
  clearInterval(speedTimer); speedTimer = null;
  newBadges = [];
  const lines = [`You got <b>${s.right} of ${n}</b> right${timeUp ? " before the clock ran out" : ` with ${clockText(Math.max(0, s.left))} to spare`}.`];
  if (won) {
    const rec = S.levels[lv.id] = S.levels[lv.id] || { stars: 0, pts: 0, plays: 0 };
    if (!rec.fast) { rec.fast = true; S.xp += 30; lines.push("First time beaten: +30 XP."); }
    award("speed1"); if (Object.values(S.levels).filter(l => l.fast).length >= 5) award("speed5");
    save(); SFX.win(); confetti(120);
  } else { lines.push(`You need ${n - 1} right to win the ⚡. ${timeUp ? "Keep moving: if one question is taking too long, pick your best answer and go on." : "Slow down just enough to read each question properly."}`); SFX.wrong(); }
  newBadges.forEach(b => lines.push(`${b[1]} New badge: <b>${esc(b[2])}</b>`));
  app.innerHTML = `<div class="card result"><div class="big">${won ? "⚡" : timeUp ? "⏰" : "🌱"}</div><h2>${won ? "Speed run beaten!" : timeUp ? "Out of time" : "Not quite"}</h2>
    <div class="lines">${lines.map(l => `<div>${l}</div>`).join("")}</div>
    <div class="acts"><button class="btn ghost" id="again">Try again</button><button class="btn" id="map">Back to the map →</button></div></div>`;
  const w = s.w; speed = null;
  $("#map").onclick = showMap; $("#again").onclick = () => startSpeed(w, lv);
  window.scrollTo(0, 0);
}
const unlockedIds = () => WORLDS.flatMap(w => w.levels.filter((l, i) => !lockReason(w, i)).map(l => l.id));
const findLevel = id => { for (const w of WORLDS) { const lv = w.levels.find(l => l.id === id); if (lv) return { w, lv }; } };
showMap();
})();
</script>
