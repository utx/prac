<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown Quest</title>
<style>
  :root {
    --ink: #1b2a41; --ink-soft: #55627a; --line: #d8dde6; --paper: #ffffff; --field: #f3f5f8;
    --sky1: #1a1f4b; --sky2: #3b2a7a; --gold: #f5b82e; --gold-deep: #b97f00;
    --good: #1e8a55; --good-bg: #e2f5ea; --bad: #c0392b; --bad-bg: #fde8e5; --hint-bg: #fff6dc;
    --world: #2e7d4f;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky2); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; }
  body { background: linear-gradient(160deg, var(--sky1), var(--sky2)) fixed; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: #fff; margin-bottom: 14px; }
  .top h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  .top h1 span { color: var(--gold); }
  .top .spacer { flex: 1; }
  .pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  button.pill:hover { background: rgba(255,255,255,.25); }
  .rank { background: rgba(255,255,255,.1); border-radius: 12px; padding: 10px 14px; color: #fff; margin-bottom: 16px; }
  .rank b { color: var(--gold); }
  .xpbar { height: 10px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe08a); border-radius: 999px; transition: width .6s; }

  /* ---- map ---- */
  .world { background: var(--paper); border-radius: 16px; padding: 16px 18px 18px; margin-bottom: 16px; border-top: 6px solid var(--world); }
  .world h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .world h2 small { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin-left: auto; }
  .world p.sub { margin: 2px 0 12px; color: var(--ink-soft); font-size: 15px; }
  .path { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
  .node { flex: 1 1 120px; min-width: 104px; background: var(--field); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 8px; text-align: center; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .12s, border-color .12s; }
  .node:hover { transform: translateY(-2px); border-color: var(--world); }
  .node .num { width: 44px; height: 44px; border-radius: 50%; background: var(--world); color: #fff; font-weight: 800; font-size: 20px;
    display: flex; align-items: center; justify-content: center; }
  .node .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .node .st { font-size: 17px; letter-spacing: 1px; }
  .node .st .off { opacity: .22; filter: grayscale(1); }
  .node .req { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .node.locked { opacity: .72; }
  .node.locked .num { background: #9aa3b5; }
  .node.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,184,46,.35); animation: pulse 1.8s infinite; }
  .node.boss .num { background: #7a1f3d; font-size: 24px; }
  .node.boss.beaten .num { background: var(--gold); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(245,184,46,.12); } }
  .cave { background: #fff8e6; border: 2px dashed var(--gold-deep); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .cave .txt { flex: 1 1 240px; }
  .cave b { font-size: 19px; }
  .btn { background: var(--world); color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 17px; }
  .btn:hover { filter: brightness(1.1); }
  .btn.gold { background: var(--gold); color: #3a2a00; }
  .btn.ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); }
  .shelf { background: var(--paper); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px; }
  .shelf h3 { margin: 0 0 8px; font-size: 18px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 14px; display: flex; gap: 6px; align-items: center; background: var(--field); }
  .badge.off { opacity: .45; filter: grayscale(1); }
  .badge i { font-style: normal; font-size: 20px; }
  details.parents { background: rgba(255,255,255,.92); border-radius: 12px; padding: 10px 16px; font-size: 15px; }
  details.parents summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); }
  details.parents table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  details.parents td, details.parents th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  details.parents td.n, details.parents th.n { text-align: right; }

  /* ---- play ---- */
  .playbar { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 12px; flex-wrap: wrap; }
  .playbar .title { font-weight: 700; font-size: 19px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.25); display: block; }
  .dots i.cur { background: #fff; }
  .dots i.p2 { background: var(--gold); } .dots i.p1 { background: #9bd3b4; } .dots i.p0 { background: #e58a7f; }
  .bossbox { background: rgba(0,0,0,.28); border-radius: 16px; padding: 10px 16px; color: #fff; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .bossbox .face { font-size: 54px; line-height: 1; transition: transform .2s; }
  .bossbox .face.hit { animation: hit .5s; }
  .bossbox .face.laugh { animation: laugh .6s; }
  @keyframes hit { 20% { transform: translateX(-10px) rotate(-12deg) scale(.9); filter: brightness(2); } 60% { transform: translateX(8px) rotate(8deg); } }
  @keyframes laugh { 30% { transform: scale(1.25) rotate(6deg); } 60% { transform: scale(1.15) rotate(-6deg); } }
  .bossbox .info { flex: 1; }
  .bossbox .say { font-size: 15px; opacity: .9; min-height: 22px; }
  .hp { height: 16px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin: 4px 0; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, #e5484d, #ff8a65); transition: width .6s; }
  .stage { display: grid; gap: 14px; }
  .stage.has-passage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 820px) { .stage.has-passage { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--paper); border-radius: 16px; padding: 18px 20px; min-width: 0; }
  .passage h3 { margin: 0 0 4px; font-size: 20px; }
  .passage .note { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 10px; }
  .passage p { margin: 0 0 10px; }
  .passage .poem { white-space: pre-line; font-size: 17px; line-height: 1.6; margin: 0 0 4px; }
  .passage .extract { border-left: 4px solid var(--world); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .passage .extract b.tag { display: block; color: var(--world); }
  @media (min-width: 821px) { .passage { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; } }
  .qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-soft); font-weight: 600; margin-bottom: 6px; }
  .stem { font-size: 18px; }
  .stem p { margin: 0 0 10px; }
  .stem .box { background: var(--field); border-left: 4px solid var(--world); border-radius: 6px; padding: 10px 14px; margin: 0 0 10px; }
  .stem .gapline { font-size: 19px; background: var(--field); border-radius: 8px; padding: 12px 14px; margin: 0 0 10px; }
  .stem .gapw { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--ink); }
  .figure { margin: 10px 0; text-align: center; overflow-x: auto; }
  .figure svg, .opt svg { max-width: 100%; height: auto; }
  table.grid { border-collapse: collapse; margin: 8px auto; font-size: 17px; }
  table.grid th, table.grid td { border: 1.5px solid var(--ink-soft); padding: 6px 12px; text-align: center; }
  table.grid th { background: var(--field); }
  .opts { display: grid; gap: 9px; margin-top: 14px; }
  .opts.visual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); border: 2px solid var(--line);
    border-radius: 12px; padding: 10px 14px; color: var(--ink); font-size: 17px; width: 100%; transition: border-color .1s, background .1s; }
  .opt:hover:not(:disabled) { border-color: var(--world); background: var(--field); }
  .opt:disabled { cursor: default; }
  .opt .let { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--field); border: 1.5px solid var(--line);
    font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.right .let { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: .8; animation: shake .35s; }
  .opt.wrong .let { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dim { opacity: .55; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .fb { margin-top: 14px; border-radius: 12px; padding: 12px 16px; }
  .fb.hint { background: var(--hint-bg); border: 1.5px solid var(--gold); }
  .fb.good { background: var(--good-bg); border: 1.5px solid var(--good); }
  .fb.miss { background: var(--field); border: 1.5px solid var(--line); }
  .fb h4 { margin: 0 0 4px; font-size: 18px; }
  .fb p { margin: 0 0 8px; } .fb p:last-child { margin: 0; }
  .fb .why-not { color: var(--ink-soft); }
  .next { margin-top: 14px; display: flex; justify-content: flex-end; }
  .combo { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: #ff7a1a; color: #fff; font-weight: 800;
    font-size: 24px; padding: 10px 22px; border-radius: 999px; z-index: 30; pointer-events: none; animation: pop 1.6s forwards; white-space: nowrap; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111a; background: rgba(15,20,40,.94); color: #fff;
    padding: 10px 18px; border-radius: 12px; z-index: 30; max-width: 90vw; text-align: center; }

  /* ---- result ---- */
  .result { text-align: center; padding: 28px 20px; }
  .result .big { font-size: 64px; line-height: 1.1; }
  .result h2 { font-size: 28px; margin: 6px 0; }
  .result .stars { font-size: 46px; letter-spacing: 6px; }
  .result .stars span { display: inline-block; opacity: .2; filter: grayscale(1); }
  .result .stars span.on { opacity: 1; filter: none; animation: starin .5s backwards; }
  .result .stars span.on:nth-child(2) { animation-delay: .25s; } .result .stars span.on:nth-child(3) { animation-delay: .5s; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
  .result .lines { margin: 12px auto; max-width: 460px; text-align: left; }
  .result .lines div { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .result .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  @media (max-width: 520px) { .wrap { padding: 12px 12px 70px; } .top h1 { font-size: 22px; } .card { padding: 14px; } .opts.visual { gap: 6px; } .opt { padding: 9px 10px; gap: 9px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---- battle-royale look: all original, drawn with CSS (no third-party artwork) ---- */
  html { background: #2a1266; }
  body { background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 26px, transparent 26px 70px),
      radial-gradient(900px 500px at 85% -10%, rgba(255,90,220,.45), transparent 70%),
      linear-gradient(180deg, #1668e3 0%, #5a2fd8 52%, #2a1266 100%) fixed; }
  .top h1, .world h2, .shelf h3, .btn, .pill, .node .nm, .fb h4, .playbar .title, .result h2, .cave b, .timecard .lab, .rank b {
    font-family: "Arial Black", "Segoe UI Black", Impact, "Segoe UI", sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .4px; }
  .top h1 { font-size: 30px; text-shadow: 0 3px 0 #0d1330; transform: skewX(-4deg); }
  .top h1 span { color: #ffe81a; }
  .world, .card, .shelf, .cave, .timecard { border: 3px solid #0d1330; box-shadow: 0 6px 0 #0d1330; }
  .world { border-top: 8px solid var(--world); }
  .btn { background: #ffe81a !important; color: #111 !important; border: 3px solid #0d1330; box-shadow: 0 4px 0 #0d1330; border-radius: 8px; transform: skewX(-4deg); }
  .btn:hover { filter: none; transform: skewX(-4deg) translateY(-2px); box-shadow: 0 6px 0 #0d1330; }
  .btn:active { transform: skewX(-4deg) translateY(3px); box-shadow: 0 1px 0 #0d1330; }
  .btn.ghost { background: #fff !important; color: var(--ink-soft) !important; }
  .pill { background: rgba(13,19,48,.55); border: 2px solid rgba(255,255,255,.35); }
  .node { border-width: 3px; border-color: #0d1330; border-bottom-width: 7px; border-radius: 10px; background: #fff; }
  .node .num { border-radius: 10px; transform: skewX(-6deg); border: 2px solid #0d1330; background: var(--rar); }
  .node { --rar: #8a94a6; } .node.r2 { --rar: #43a629; } .node.r3 { --rar: #2f8fff; } .node.r4 { --rar: #a34dff; } .node.boss { --rar: #ffb21a; }
  .node:not(.locked) { border-bottom-color: var(--rar); background: linear-gradient(180deg, #fff 55%, color-mix(in srgb, var(--rar) 22%, #fff)); }
  .node .rar { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--rar); filter: brightness(.8); }
  .node.boss .num, .node.boss.beaten .num { background: var(--rar); }
  .node.locked .num { background: #9aa3b5; }
  .node.next { border-color: #0d1330; border-bottom-color: #ffe81a; box-shadow: 0 0 0 4px #ffe81a; }
  .rank { background: rgba(13,19,48,.55); border: 2px solid rgba(255,255,255,.25); }
  .xpbar i { background: linear-gradient(90deg, #ffe81a, #ff9d1a); }
  .bossbox { background: rgba(13,19,48,.7); border: 3px solid #0d1330; }
  .opt { border-width: 3px; border-radius: 10px; }
  .opt .let { border-radius: 8px; transform: skewX(-6deg); }
  .result h2 { font-size: 32px; }

  /* ---- Fortnite art (Epic's outfit renders, see the notice at the foot of the page) ---- */
  .hero { width: 150px; height: 150px; object-fit: contain; flex: none; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); margin: -10px 0; }
  .node .num img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
  .node.boss .num { width: 64px; height: 64px; overflow: hidden; padding: 0; }
  .bossbox .face img { width: 84px; height: 84px; object-fit: contain; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
  .result .big img { width: 150px; height: 150px; object-fit: contain; }
  .locker { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
  .skin { border: 3px solid #0d1330; border-bottom-width: 7px; border-radius: 10px; text-align: center; padding: 6px 4px 8px; font-size: 13px; line-height: 1.25;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rar) 55%, #fff), color-mix(in srgb, var(--rar) 90%, #000)); color: #fff; }
  .skin img { width: 92px; height: 92px; object-fit: contain; display: block; margin: 0 auto; }
  .skin b { display: block; font-family: "Arial Black", Impact, sans-serif; font-style: italic; text-transform: uppercase; font-size: 13.5px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .skin.off { --rar: #5d6578 !important; }
  .skin.off img { filter: brightness(0) opacity(.55); }
  .skin.cur { box-shadow: 0 0 0 4px #ffe81a; }
  .legal { color: rgba(255,255,255,.75); font-size: 12.5px; line-height: 1.45; margin: 16px 4px 0; text-align: center; }

  /* ---- our own 3D art, rendered in Blender (game/art/render.py) ---- */
  .top h1 img { width: 62px; height: 60px; object-fit: contain; vertical-align: -16px; margin-right: 4px; filter: drop-shadow(0 4px 0 rgba(13,19,48,.8)); animation: bob 3.2s ease-in-out infinite; }
  .whead { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .whead .isle { width: 132px; height: 150px; object-fit: contain; flex: none; margin: -46px 0 -8px -6px; filter: drop-shadow(0 8px 6px rgba(13,19,48,.45)); animation: bob 4s ease-in-out infinite; }
  .world:nth-of-type(2n) .isle { animation-delay: -1.3s; } .world:nth-of-type(3n) .isle { animation-delay: -2.6s; }
  .whead .wtxt { flex: 1; min-width: 0; }
  .whead p.sub { margin: 2px 0 0; }
  .world { margin-top: 34px; }
  .result .big img.crown3d { width: 170px; height: 166px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @media (max-width: 520px) { .whead .isle { width: 96px; height: 110px; margin-top: -40px; } .top h1 img { width: 48px; height: 46px; vertical-align: -12px; } }

  /* ---- Fortnite time: the reward pie ---- */
  .timecard { background: #0d1330; color: #fff; border-radius: 16px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .pie { --p: 0; width: 132px; height: 132px; border-radius: 50%; flex: none; position: relative;
    background: conic-gradient(#ffe81a calc(var(--p) * 1%), #2b3566 0); border: 5px solid #fff; box-shadow: 0 0 0 4px #0d1330, 0 0 24px rgba(255,232,26,.55); }
  .pie::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(rgba(13,19,48,.55) 0 1deg, transparent 1deg 30deg); }
  .pie.mini { width: 22px; height: 22px; border-width: 2px; box-shadow: none; display: inline-block; vertical-align: -5px; margin-right: 6px; }
  .pie.mini::after { display: none; }
  .pie.grow { animation: piegrow .7s; }
  @keyframes piegrow { 40% { transform: scale(1.45); filter: brightness(1.4); } }
  .timecard .txt { flex: 1 1 220px; }
  .timecard .lab { color: #ffe81a; font-size: 17px; }
  .timecard .bigt { font-size: 38px; font-weight: 900; line-height: 1.1; font-family: "Arial Black", Impact, sans-serif; }
  .timecard .of { opacity: .85; font-size: 15px; }
  .tgain { background: #0d1330; color: #ffe81a; font-weight: 800; border-radius: 8px; padding: 6px 12px; display: inline-block; margin: 0 0 8px !important; }
  .usedrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .usedrow .btn { padding: 5px 12px; font-size: 14px; }
</style>
</head>

<script>
(() => {
"use strict";
const KEY = "prac2.v1";
const LETTERS = "ABCDE";
const RANKS = [[0, "Rookie"], [100, "Scout"], [250, "Explorer"], [450, "Pathfinder"], [700, "Champion"], [1000, "Hero"], [1300, "Legend"]];
/* One outfit per rank: [image, name, rarity colour] */
const SKINS = [["recruit", "Recruit", "#8a94a6"], ["britebomber", "Brite Bomber", "#2f8fff"], ["fishstick", "Fishstick", "#2f8fff"], ["peely", "Peely", "#a34dff"],
  ["cuddle", "Cuddle Team Leader", "#ffb21a"], ["drift", "Drift", "#ffb21a"], ["midas", "Midas", "#ffb21a"]];
const ISLE = { reading: "world-forest", thinking: "world-peaks", maths: "world-reef" };
const art = (name, alt, cls = "") => `<img class="${cls}" src="art/${name}.webp" alt="${alt}">`;
const BADGES = [
  ["first", "🥾", "First steps", "Finish your first level"],
  ["three", "🌟", "Three stars", "Get 3 stars on a level"],
  ["streak5", "🔥", "On fire", "5 right first time in a row"],
  ["streak10", "☄️", "Unstoppable", "10 right first time in a row"],
  ["comeback", "💪", "Comeback kid", "Beat a question that beat you before"],
  ["days3", "📅", "Three days running", "Play 3 days in a row"],
  ["days7", "🗓️", "A whole week", "Play 7 days in a row"],
  ...WORLDS.map(w => ["boss_" + w.id, "👑", w.crown, "Defeat " + w.boss.name]),
  ["perfect", "💎", "Flawless", "Defeat a boss without a single miss"],
  ["all", "🏆", "Triple crown", "Win all three crowns"],
];
const app = document.getElementById("app");
const $ = (s, el = document) => el.querySelector(s);

/* ---------- saved progress ---------- */
/* Practice mode: opened from the admin page (?admin=1 after the PIN). Everything is unlocked and nothing is saved. */
const PRACTICE = (() => { try { return new URLSearchParams(location.search).has("admin") && sessionStorage.getItem("prac.admin") === "1"; } catch (e) { return false; } })();
const FRESH = () => ({ levels: {}, q: {}, xp: 0, badges: {}, days: [], sound: true, used: 0 });
function load() {
  if (PRACTICE) return FRESH();
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.levels) return Object.assign(FRESH(), s); } catch (e) {}
  return FRESH();
}
let S = load();
const save = () => { if (PRACTICE) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function dayStreak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (!set.has(k)) break; n++; d.setDate(d.getDate() - 1); }

}

/* ---------- rules ---------- */
const best = lv => (S.levels[lv.id] || {}).stars || 0;
const regular = w => w.levels.filter(l => !l.boss);
const worldStars = w => regular(w).reduce((a, l) => a + best(l), 0);
const BOSS_GATE = 9;
function starsFor(lv, pts) {
  const max = lv.questions.length * 2;
  if (lv.boss) return pts >= max ? 3 : pts >= max - 2 ? 2 : pts >= max - 3 ? 1 : 0;
  return pts >= max - 1 ? 3 : pts >= max - 3 ? 2 : pts >= max - 5 ? 1 : 0;
}
function lockReason(w, i) {
  if (PRACTICE) return "";
  const lv = w.levels[i];
  if (lv.boss) { const s = worldStars(w); return s >= BOSS_GATE ? "" : `Collect ${BOSS_GATE} ⭐ in ${w.name} to wake the boss (you have ${s})`; }
  if (i === 0 || best(w.levels[i - 1]) >= 2) return "";
  return `Get 2 ⭐ on “${w.levels[i - 1].name}” to unlock`;
}
const rankOf = xp => { let r = 0; RANKS.forEach((x, i) => { if (xp >= x[0]) r = i; }); return r; };

/* Fortnite time. Every question is worth a share of one hour, by how hard its level is
   (level 1 = 1 share, level 2 = 2 … and a boss question = twice the last level). Right first
   time earns the whole share; right after a hint earns half. A later first-time answer tops
   it up to the whole share, so the pie can always reach the full hour. */
const HOUR = 3600;
const TIME = (() => {
  const w = {}; let total = 0;
  WORLDS.forEach(wd => { const n = regular(wd).length; wd.levels.forEach((lv, i) => lv.questions.forEach(q => { w[q.id] = lv.boss ? n * 2 : i + 1; total += w[q.id]; })); });
  Object.keys(w).forEach(k => w[k] = HOUR * w[k] / total);
  return w;
})();
const earned = () => Object.keys(TIME).reduce((a, id) => a + TIME[id] * (((S.q[id] || {}).best || 0) / 2), 0);
const fmt = s => {
  s = Math.round(s * 2) / 2;
  const m = Math.floor(s / 60), r = s - m * 60, half = r % 1 ? "½" : "", whole = Math.floor(r);
  const secs = (whole || !half ? whole : "") + half + " s";
  return m ? m + " min" + (r ? " " + secs : "") : secs;
};
const piePct = () => Math.min(100, 100 * earned() / HOUR);
const caveList = () => allQuestions().filter(x => S.q[x.q.id] && S.q[x.q.id].seen && (S.q[x.q.id].best || 0) < 2);

/* ---------- sound and sparkle ---------- */
let actx = null;
function tone(freqs, dur = 0.12, type = "triangle", gain = 0.12) {

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const SFX = { right: () => tone([523, 784]), retry: () => tone([392, 587]), wrong: () => tone([196, 147], 0.16, "sawtooth", 0.07),
  win: () => tone([523, 659, 784, 1047], 0.14), boss: () => tone([392, 523, 659, 784, 1047, 1319], 0.15), hit: () => tone([150, 90], 0.1, "square", 0.08) };
function confetti(n = 140) {

  const c = document.getElementById("confetti"), x = c.getContext("2d");

  const cols = ["#f5b82e", "#ff6b6b", "#4dabf7", "#51cf66", "#cc5de8", "#fff"];
  const ps = Array.from({ length: n }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, s: 5 + Math.random() * 7, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));

  if ($("#cave")) $("#cave").onclick = startCave;
  app.querySelectorAll(".node").forEach(n => n.onclick = () => {

  });
  return `<details class="parents"><summary>For grown-ups: progress by question type</summary>
    <p><b>Fortnite time:</b> ${fmt(earned())} earned of 60 minutes, ${fmt(S.used || 0)} marked as used, <b>${fmt(Math.max(0, earned() - (S.used || 0)))} left</b>. When he has had some of his time, record it here:</p>

/* ---------- playing a level ---------- */
let play = null;
function startLevel(w, lv) { play = { w, lv, items: lv.questions.map(q => ({ q, lv })), idx: 0, pts: 0, res: [], cave: false }; begin(); }
function startCave() {
  const items = caveList().slice(0, 5).map(x => ({ q: x.q, lv: x.lv, w: x.w }));
  play = { w: { name: "Comeback Cave", color: "#b97f00" }, lv: { id: "cave", name: "Comeback Cave" }, items, idx: 0, pts: 0, res: [], cave: true }; begin();
}
function begin() {
  newBadges = []; play.rank0 = rankOf(S.xp); play.t0 = earned();
  const t = today(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-60); save(); }
  showQuestion();
}
function showQuestion() {
  const p = play, it = p.items[p.idx], q = it.q, lv = it.lv, boss = p.lv.boss;
  p.tries = 0; p.done = false;
  document.querySelectorAll(".combo").forEach(c => c.remove());
  const max = p.items.length * 2;
  const passage = lv.passage ? `<div class="card passage"><h3>${lv.passage.title}</h3>${lv.passage.note ? `<p class="note">${lv.passage.note}</p>` : ""}${lv.passage.html}</div>` : "";
  app.innerHTML = `
    <div class="playbar"><button class="pill" id="quit">← Map</button><span class="title">${esc(p.w.name)} · ${esc(boss ? p.w.boss.name : p.lv.name)}</span><span class="spacer" style="flex:1"></span>
      <span class="dots">${p.items.map((_, i) => `<i class="${i < p.idx ? "p" + p.res[i] : i === p.idx ? "cur" : ""}"></i>`).join("")}</span><span class="pill" id="tpill"><i class="pie mini" id="minipie" style="--p:${piePct()}"></i><span id="ttxt">${fmt(earned())}</span></span><span class="pill" id="gems">💎 ${p.pts}</span></div>
    ${boss ? `<div class="bossbox"><div class="face" id="face">${art(p.w.boss.img, p.w.boss.name)}</div><div class="info"><b>${esc(p.w.boss.name)}</b>
      <div class="hp"><i id="hp" style="width:${100 * (max - p.pts) / max}%"></i></div><div class="say" id="say">${esc(p.idx === 0 ? p.w.boss.taunt : "Is that all you've got?")}</div></div></div>` : ""}
    <div class="stage${passage ? " has-passage" : ""}" style="--world:${p.w.color}">${passage}
      <div class="card"><div class="qhead"><span>Question ${p.idx + 1} of ${p.items.length}</span><span>${esc(q.cat)}</span></div>
        <div class="stem">${q.stem}</div>
        <div class="opts${q.visual ? " visual" : ""}" id="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="let">${LETTERS[i]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="fb" aria-live="polite"></div></div></div>`;
  $("#quit").onclick = () => { if (p.idx === 0 && p.tries === 0 || confirm("Leave this level? Your stars for this try won't be saved.")) showMap(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(Number(b.dataset.i), b));
  window.scrollTo(0, 0);
}
function choose(i, btn) {
  const p = play, it = p.items[p.idx], q = it.q;
  if (p.done || btn.disabled) return;
  p.tries++;
  const right = i === q.answer, fb = $("#fb"), boss = p.lv.boss;
  if (!right && p.tries === 1) {
    btn.classList.add("wrong"); btn.disabled = true; SFX.wrong(); streak = 0;
    if (boss) { const f = $("#face"); f.classList.remove("laugh"); void f.offsetWidth; f.classList.add("laugh"); $("#say").textContent = "Ha! Not quite…"; }
    fb.innerHTML = `<div class="fb hint"><h4>💡 Not yet. Here's a hint</h4><p>${q.hint}</p><p><b>Have another go.</b></p></div>`;
    return;
  }
  p.done = true;
  const pts = right ? (p.tries === 1 ? 2 : 1) : 0;
  p.pts += pts; p.res[p.idx] = pts;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const j = Number(b.dataset.i); if (j === q.answer) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); else b.classList.add("dim"); });
  $("#gems").textContent = "💎 " + p.pts;
  /* remember how this question went */
  const s = S.q[q.id] = S.q[q.id] || { seen: 0, best: 0 };
  const before = s.best || 0, wasMissed = s.seen > 0 && before < 2;
  const e0 = earned();
  if (!s.seen) s.first = pts;
  s.seen++; s.best = Math.max(before, pts);
  const dt = earned() - e0;
  let gain = Math.max(0, pts - before) * 10 + (pts ? 1 : 0);
  if (pts === 2 && wasMissed) { gain += 10; award("comeback"); }
  S.xp += gain;
  if (pts === 2) { streak++; if (streak === 5) award("streak5"); if (streak === 10) award("streak10"); } else streak = 0;
  save();
  if (boss && pts) { const f = $("#face"); f.classList.remove("hit"); void f.offsetWidth; f.classList.add("hit"); $("#hp").style.width = (100 * (p.items.length * 2 - p.pts) / (p.items.length * 2)) + "%"; $("#say").textContent = pts === 2 ? "Ouch! A direct hit!" : "Oof… that one grazed me."; SFX.hit(); }
  if (pts === 2) { SFX.right(); if (streak >= 3) flash("combo", `🔥 ${streak} in a row!`); } else if (pts === 1) SFX.retry(); else SFX.wrong();
  const head = pts === 2 ? (wasMissed ? "💪 You beat it this time! +2 💎" : "✅ Right first time! +2 💎") : pts === 1 ? "👍 Got it on the second go. +1 💎" : "This one got away. Here's how it works";
  const last = p.idx === p.items.length - 1;
  if (dt > 0) { const mp = $("#minipie"); mp.style.setProperty("--p", piePct()); mp.classList.add("grow"); $("#ttxt").textContent = fmt(earned()); }
  const tline = dt > 0 ? `<p class="tgain">🎮 +${fmt(dt)} of Fortnite time!${pts === 1 ? " (half: get it first time in the Comeback Cave for the rest)" : ""}</p>` : "";
  fb.innerHTML = `<div class="fb ${pts ? "good" : "miss"}"><h4>${head}</h4>${tline}${q.explain}${pts < 2 ? `<p><b>${p.cave ? "It stays in the Comeback Cave until you get it first time." : "You'll meet this one again in the Comeback Cave."}</b></p>` : ""}</div>
    <div class="next"><button class="btn" id="next" style="background:${p.w.color}">${last ? "Finish →" : "Next question →"}</button></div>`;
  $("#next").onclick = () => { if (last) finish(); else { p.idx++; showQuestion(); } };
  $("#next").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function finish() {
  const p = play, lv = p.lv, n = p.items.length, max = n * 2;
  const lines = [];
  let stars = 0, title, big;
  if (p.cave) {
    const beat = p.res.filter(r => r === 2).length, left = caveList().length;
    big = beat === n ? "💪" : "🕯️"; title = beat ? `You beat ${beat} of ${n}!` : "They got away again";
    lines.push(left ? `${left} question${left > 1 ? "s" : ""} still hiding in the cave.` : "The cave is empty. Every question you have met is beaten!");
    if (beat) { SFX.win(); if (beat === n) confetti(90); }
  } else {
    stars = starsFor(lv, p.pts);
    const rec = S.levels[lv.id] = S.levels[lv.id] || { stars: 0, pts: 0, plays: 0 };
    const beforeStars = rec.stars, unlockedBefore = unlockedIds();
    rec.plays++; rec.pts = Math.max(rec.pts, p.pts);
    if (stars > beforeStars) { S.xp += (stars - beforeStars) * 10 + (lv.boss && !beforeStars ? 100 : 0); rec.stars = stars; }

    if (lv.boss && stars) { award("boss_" + p.w.id); if (p.pts === max) award("perfect"); if (WORLDS.every(w => best(w.levels[w.levels.length - 1]) > 0)) award("all"); }

    save();
    const opened = unlockedIds().filter(id => !unlockedBefore.includes(id));
    if (lv.boss) {
      if (stars) { big = art(p.w.boss.img, "") + art("crown3d", "A golden crown", "crown3d"); title = `You defeated ${p.w.boss.name}!`; lines.push(esc(p.w.boss.defeat)); if (!beforeStars) lines.push(`You won the <b>${esc(p.w.crown)}</b>. +100 XP`); SFX.boss(); confetti(260); }
      else { big = art(p.w.boss.img, ""); title = `${p.w.boss.name} got away…`; lines.push(`You did ${p.pts} damage out of ${max}. You need ${max - 3} to win. Read the explanations, then come back stronger!`); SFX.wrong(); }
    } else {
      big = stars === 3 ? "🎉" : stars ? "🙂" : "🌱"; title = stars === 3 ? "Perfect level!" : stars === 2 ? "Level cleared!" : stars === 1 ? "Nearly there!" : "Keep training!";
      lines.push(`You scored ${p.pts} of ${max} 💎.`);
      if (stars < 2) lines.push("You need 2 ⭐ to unlock the next level. Have another go: you've seen how each one works now.");
      else if (stars === 2 && rec.stars < 3) lines.push("Play again and get every question first time for 3 ⭐.");
      if (stars >= 2) { SFX.win(); if (stars === 3) confetti(); }
    }
    opened.forEach(id => { const x = findLevel(id); lines.push(`🔓 Unlocked: <b>${esc(x.lv.boss ? x.w.boss.name + " (boss!)" : x.lv.name)}</b>`); });
    if (!lv.boss && !opened.length && stars >= 2) { const s = worldStars(p.w); if (s < BOSS_GATE && lockReason(p.w, p.w.levels.length - 1) && regular(p.w).every(l => best(l) >= 2)) lines.push(`You have ${s} ⭐ here. Get ${BOSS_GATE} ⭐ to wake the boss: replay a level for 3 ⭐.`); }
  }
  const dt = earned() - p.t0;
  lines.unshift(dt > 0 ? `🎮 <b>+${fmt(dt)}</b> of Fortnite time this round. You now have <b>${fmt(earned())}</b> of 60 minutes.` : `🎮 No new Fortnite time this round. You have ${fmt(earned())} of 60 minutes.`);
  const missed = p.res.filter(r => r < 2).length;
  if (!p.cave && missed) lines.push(`${missed} question${missed > 1 ? "s are" : " is"} waiting in the 💪 Comeback Cave.`);
  newBadges.forEach(b => lines.push(`${b[1]} New badge: <b>${esc(b[2])}</b>`));
  const r = rankOf(S.xp);
  if (p.rank0 !== undefined && r > p.rank0) { lines.push(`⬆️ New rank: <b>${RANKS[r][1]}</b>! New skin unlocked: <b>${esc(SKINS[r][1])}</b>`); big = art(SKINS[r][0], SKINS[r][1]) + (p.lv.boss && stars ? art("crown3d", "A golden crown", "crown3d") : ""); }
  save();
  app.innerHTML = `<div class="card result"><div class="big">${big}</div><h2>${esc(title)}</h2>
    ${p.cave ? "" : `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? "on" : ""}">⭐</span>`).join("")}</div>`}
    <div class="lines">${lines.map(l => `<div>${l}</div>`).join("")}</div>
    <div class="acts"><button class="btn ghost" id="again">Play again</button><button class="btn" id="map" style="background:${p.w.color}">Back to the map →</button></div></div>`;
  $("#map").onclick = showMap;
  $("#again").onclick = () => { if (p.cave) { if (caveList().length) startCave(); else showMap(); } else startLevel(p.w, lv); };
  window.scrollTo(0, 0);
}
const unlockedIds = () => WORLDS.flatMap(w => w.levels.filter((l, i) => !lockReason(w, i)).map(l => l.id));
const findLevel = id => { for (const w of WORLDS) { const lv = w.levels.find(l => l.id === id); if (lv) return { w, lv }; } };
showMap();
})();
</script>
