<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Island</title>
<style>
  :root {
    --ink: #1b2a41; --ink-soft: #55627a; --line: #d8dde6; --paper: #ffffff; --field: #f3f5f8;
    --navy: #0d1330; --sky1: #16205c; --sky2: #5b2a9d; --gold: #ffe81a; --gold-deep: #ff9d1a; --storm: #8a3ff0;
    --good: #1e8a55; --good-bg: #e2f5ea; --bad: #c0392b; --bad-bg: #fde8e5; --kind: #0b6fa4;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky2); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; }
  body { background: linear-gradient(160deg, var(--sky1), var(--sky2)) fixed; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 14px 70px; }
  .caps { font-family: "Arial Black", Impact, sans-serif; font-style: italic; text-transform: uppercase; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #fff; margin-bottom: 12px; }
  .top h1 { font: italic 900 30px "Arial Black", Impact, sans-serif; text-transform: uppercase; margin: 0; letter-spacing: .5px; text-shadow: 0 3px 0 var(--navy); }
  .top h1 span { color: var(--gold); }
  .top .spacer { flex: 1; }
  .pill { background: rgba(13,19,48,.6); border: 2px solid rgba(255,255,255,.28); color: #fff; border-radius: 999px;
    padding: 4px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill img { width: 24px; height: 24px; object-fit: contain; }
  button.pill:hover { background: rgba(255,255,255,.22); }
  .btn { background: var(--gold); color: #2a2100; border: 3px solid var(--navy); border-bottom-width: 6px; border-radius: 10px; padding: 8px 20px;
    font: italic 900 18px "Arial Black", Impact, sans-serif; text-transform: uppercase; text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(2px); border-bottom-width: 4px; }
  .btn.blue { background: #3fa7ff; color: #fff; } .btn.ghost { background: #fff; color: var(--ink); } .btn.small { font-size: 14px; padding: 4px 12px; border-width: 2px; border-bottom-width: 4px; }
  .btn:disabled { filter: grayscale(1); opacity: .6; cursor: default; }
  .note { background: #fff8e6; border: 2px dashed var(--gold-deep); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .note .txt { flex: 1 1 240px; }
  .banner { background: var(--storm); color: #fff; border: 3px solid var(--navy); border-radius: 12px; padding: 8px 16px; margin-bottom: 12px; font-weight: 700; animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } }

  /* ---- Fortnite time ---- */
  .timecard { background: var(--navy); color: #fff; border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .pie { --p: 0; width: 112px; height: 112px; border-radius: 50%; flex: none; position: relative;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), #2b3566 0); border: 5px solid #fff; box-shadow: 0 0 0 4px var(--navy), 0 0 22px rgba(255,232,26,.5); }
  .pie::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(13,19,48,.55) 0 1.2deg, transparent 1.2deg 60deg); }
  .timecard .txt { flex: 1 1 200px; }
  .timecard .lab { color: var(--gold); font-size: 16px; font-weight: 700; }
  .timecard .bigt { font: 900 34px/1.1 "Arial Black", Impact, sans-serif; }
  .timecard .of { opacity: .88; font-size: 15px; }
  .chest { width: 128px; height: 120px; object-fit: contain; flex: none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)); }
  @media (max-width: 520px) { .pie { width: 84px; height: 84px; } .chest { width: 84px; height: 80px; } .timecard .bigt { font-size: 26px; } .top h1 { font-size: 24px; } }

  /* ---- the island ---- */
  .island { position: relative; width: 100%; max-width: 640px; margin: 0 auto 14px; aspect-ratio: 1; border-radius: 18px; overflow: hidden; border: 4px solid var(--navy); background: #1d6fd0; }
  .island svg, .island .mapimg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
  .island #stormhole { transition: r 1.4s ease-in-out; }
  .mk { position: absolute; transform: translate(-50%, -50%); width: 68px; padding: 0; border: 0; background: none; text-align: center; color: #fff; line-height: 1.1; }
  .mk .pic { width: 60px; height: 60px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--navy); background: var(--kind); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 0 rgba(13,19,48,.6); }
  .mk .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 50%; }
  .mk .pic .em { font-size: 32px; }
  .mk .tag { position: absolute; right: -8px; bottom: -6px; font-size: 18px; background: #fff; border: 2px solid var(--navy); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .mk .nm { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 800; background: rgba(13,19,48,.82); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .mk .mhp { height: 6px; width: 46px; margin: 3px auto 0; background: rgba(13,19,48,.7); border-radius: 4px; overflow: hidden; }
  .mk .mhp i { display: block; height: 100%; background: #ff5a4d; }
  .mk.open .pic { border-color: var(--gold); animation: glow 1.6s infinite; }
  .mk.open:hover .pic { transform: scale(1.08); }
  .mk.later { opacity: .8; } .mk.later .pic { filter: grayscale(.7) brightness(.8); }
  .mk.dead .pic { filter: grayscale(1) brightness(.55); } .mk.dead .nm { text-decoration: line-through; opacity: .8; }
  .mk.boss .pic { width: 74px; height: 74px; background: #7a1f3d; } .mk.boss { width: 84px; }
  .mk.spot .pic { background: #fff; border-radius: 14px; }
  .mk.spot.usedup { opacity: .55; }
  .mk:disabled { pointer-events: none; } .mk.open { z-index: 2; }
  @keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(255,232,26,.35), 0 4px 0 rgba(13,19,48,.6); } }
  .dropin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(13,19,48,.45); text-align: center; color: #fff; padding: 20px; }
  .dropin .btn { font-size: 26px; padding: 12px 34px; }
  .dropin p { margin: 0; font-weight: 700; text-shadow: 0 2px 0 var(--navy); max-width: 420px; }
  @media (max-width: 520px) { .mk { width: 56px; } .mk .pic { width: 46px; height: 46px; } .mk.boss .pic { width: 56px; height: 56px; } .mk .nm { font-size: 10px; padding: 0 4px; } .mk .tag { width: 22px; height: 22px; font-size: 13px; } .mk .pic .em { font-size: 24px; } }
  .legend { color: #fff; font-size: 14.5px; text-align: center; margin: -4px 0 14px; opacity: .92; }
  .me-strip { background: rgba(13,19,48,.7); border: 2px solid rgba(255,255,255,.25); color: #fff; border-radius: 14px; padding: 8px 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .me-strip .grow { flex: 1 1 180px; }

  /* ---- bars ---- */
  .bar { position: relative; height: 18px; background: rgba(13,19,48,.75); border: 2px solid var(--navy); border-radius: 6px; overflow: hidden; margin-top: 3px; min-width: 110px; }
  .bar i { display: block; height: 100%; transition: width .5s; }
  .bar.hp i { background: linear-gradient(180deg, #7dff6b, #23b53a); } .bar.sh i { background: linear-gradient(180deg, #7fd4ff, #2f8fff); } .bar.ehp i { background: linear-gradient(180deg, #ff8a65, #e5484d); }
  .bar span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 #000; }
  .bar.sh { height: 12px; } .bar.sh span { line-height: 8px; font-size: 10px; }

  /* ---- battle ---- */
  .playbar { display: flex; align-items: center; gap: 8px; color: #fff; margin-bottom: 10px; flex-wrap: wrap; }
  .arena { position: relative; height: 290px; border-radius: 16px; overflow: hidden; border: 4px solid var(--navy); background: var(--navy) center bottom / cover no-repeat; margin-bottom: 10px; }
  .hud { position: absolute; top: 8px; width: 42%; max-width: 250px; color: #fff; background: rgba(13,19,48,.78); border-radius: 10px; padding: 6px 10px 8px; font-size: 14px; }
  .hud.me { left: 8px; } .hud.foe { right: 8px; }
  .hud b { font: italic 900 16px "Arial Black", Impact, sans-serif; text-transform: uppercase; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud small { display: block; opacity: .9; font-size: 12.5px; }
  .fighter { position: absolute; bottom: 6px; width: 170px; height: 170px; padding: 0; border: 0; background: none; }
  .fighter img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); display: block; }
  .fighter.me { left: 6%; } .fighter.foe { right: 6%; }
  .fighter.foe:not(:disabled):hover img { filter: drop-shadow(0 0 12px #fff) drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
  .fighter.foe:disabled { cursor: default; }
  .fighter.foe .cross { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 4px solid var(--gold); border-radius: 50%; opacity: 0; pointer-events: none; }
  .fighter.foe .cross::before, .fighter.foe .cross::after { content: ""; position: absolute; background: var(--gold); }
  .fighter.foe .cross::before { left: 50%; top: -12px; bottom: -12px; width: 4px; margin-left: -2px; } .fighter.foe .cross::after { top: 50%; left: -12px; right: -12px; height: 4px; margin-top: -2px; }
  .fighter.foe.aim .cross { opacity: .95; animation: aim 1.2s infinite; }
  @keyframes aim { 50% { transform: scale(1.15); } }
  .fighter.hit { animation: hit .55s; } .fighter.ko img { transform: rotate(80deg) translateY(30px); opacity: .5; transition: transform .6s, opacity .6s; }
  @keyframes hit { 20% { transform: translateX(-10px) rotate(-10deg); filter: brightness(2.2); } 60% { transform: translateX(8px) rotate(6deg); } }
  .float { position: absolute; top: 42%; font: italic 900 34px "Arial Black", Impact, sans-serif; color: var(--gold); text-shadow: 0 3px 0 var(--navy), 0 0 8px #000; pointer-events: none; animation: rise 1.5s forwards; white-space: nowrap; }
  .float.onfoe { right: 12%; } .float.onme { left: 10%; color: #ff6b5e; }
  @keyframes rise { 0% { transform: translateY(20px) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { transform: translateY(-60px); opacity: 0; } }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .act { flex: 1 1 130px; display: flex; align-items: center; gap: 8px; text-align: left; background: linear-gradient(180deg, color-mix(in srgb, var(--rar, #5d6578) 60%, #fff), color-mix(in srgb, var(--rar, #5d6578) 92%, #000));
    color: #fff; border: 3px solid var(--navy); border-bottom-width: 6px; border-radius: 10px; padding: 6px 10px; line-height: 1.2; min-width: 0; }
  .act b { font: italic 900 14.5px "Arial Black", Impact, sans-serif; text-transform: uppercase; display: block; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .act small { font-size: 12.5px; display: block; }
  .gunpic { width: 76px; height: 38px; object-fit: cover; border-radius: 6px; border: 2px solid var(--navy); flex: none; display: block; }
  .ico { width: 30px; height: 30px; object-fit: contain; flex: none; vertical-align: middle; }
  .pill .ico { width: 24px; height: 24px; }
  .kit { text-align: center; font-size: 14px; font-weight: 700; } .kit small { display: block; }
  .banner { display: flex; align-items: center; gap: 10px; } .banner .ico { width: 44px; height: 44px; }
  .dropin .bus { width: 110px; height: 110px; object-fit: contain; animation: bob 3s ease-in-out infinite; }
  .mk.spot .pic img { object-fit: contain; border-radius: 0; padding: 5px; }
  .act.gun { flex: 2 1 220px; } .act.gun .go { margin-left: auto; background: var(--gold); color: #2a2100; border-radius: 8px; padding: 4px 12px; font: italic 900 17px "Arial Black", Impact, sans-serif; }
  .act:disabled { filter: grayscale(.8); opacity: .65; cursor: default; }
  @media (max-width: 520px) { .act.gun { flex-basis: 100%; } .arena { height: 236px; } .fighter { width: 124px; height: 124px; } .fighter.me { left: 2%; } .fighter.foe { right: 2%; } .float { font-size: 26px; } }

  /* ---- question ---- */
  .stage { display: grid; gap: 12px; }
  /* wide screens (laptops and monitors, David Nov 2026: "lots of unused space at the sides"): the arena and items sit in a
     column beside the question, so a question and its answers fit without scrolling */
  @media (min-width: 1100px) {
    .wrap.wide { max-width: 1520px; }
    .battle { display: grid; grid-template-columns: minmax(400px, 5fr) minmax(0, 7fr); gap: 0 16px; align-items: start; }
    .battle > .playbar { grid-column: 1 / -1; }
    .battle > .side { position: sticky; top: 10px; }
    .battle .side .actions .act { flex-basis: 45%; }
    .battle .side .act.gun { flex-basis: 100%; }
    .battle.reading { grid-template-columns: minmax(340px, 4fr) minmax(0, 9fr); }
    .battle.reading .side .arena { height: 230px; }
    /* the showdown: a big canvas that still fits the screen's height, the round card beside it */
    .battle.fighting { grid-template-columns: minmax(0, 1fr) minmax(260px, 330px); }
    .battle.fighting .arena.pixarena { width: min(100%, calc((100vh - 200px) * 16 / 9)); margin-left: auto; margin-right: auto; }
  }
  @media (min-width: 1100px) and (max-width: 1399px) { .battle .stage.has-passage { grid-template-columns: minmax(0, 1fr); } .battle .stage.has-passage .passage { position: static; max-height: none; } }
  .stage.has-passage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 820px) { .stage.has-passage { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--paper); border-radius: 16px; padding: 16px 18px; min-width: 0; }
  .passage h3 { margin: 0 0 4px; font-size: 20px; }
  .passage .pnote { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 10px; }
  .passage p { margin: 0 0 10px; }
  .passage .poem { white-space: pre-line; font-size: 17px; line-height: 1.6; margin: 0 0 4px; }
  .passage .extract { border-left: 4px solid var(--kind); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .passage .extract b.tag { display: block; color: var(--kind); }
  .passage .gap { white-space: nowrap; font-weight: 700; background: #eef1f6; border-radius: 4px; padding: 0 4px; }
  .passage .gap.cur { background: var(--gold); box-shadow: 0 0 0 2px var(--navy); }
  @media (min-width: 821px) { .passage { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; } }
  .qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .stem { font-size: 18px; }
  .stem p { margin: 0 0 10px; }
  .stem .box { background: var(--field); border-left: 4px solid var(--kind); border-radius: 6px; padding: 10px 14px; margin: 0 0 10px; }
  .figure { margin: 10px 0; text-align: center; overflow-x: auto; }
  .figure svg, .opt svg { max-width: 100%; height: auto; }
  table.grid { border-collapse: collapse; margin: 8px auto; font-size: 17px; }
  table.grid th, table.grid td { border: 1.5px solid var(--ink-soft); padding: 5px 10px; text-align: center; }
  table.grid th { background: var(--field); }
  table.grid td.fill { background: #fff3bf; font-weight: 800; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opts.visual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); border: 3px solid var(--line);
    border-radius: 10px; padding: 9px 12px; color: var(--ink); font-size: 17px; width: 100%; min-width: 0; }
  .opt:hover:not(:disabled) { border-color: var(--kind); background: var(--field); }
  .opt:disabled { cursor: default; }
  .opt .let { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--field); border: 1.5px solid var(--line); font-weight: 800; display: flex; align-items: center; justify-content: center; transform: skewX(-6deg); }
  .opt.right { border-color: var(--good); background: var(--good-bg); } .opt.right .let { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .opt.wrong .let { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dim { opacity: .55; }
  .fb { margin-top: 14px; border-radius: 12px; padding: 12px 16px; }
  .fb.good { background: var(--good-bg); border: 2px solid var(--good); } .fb.miss { background: var(--bad-bg); border: 2px solid var(--bad); }
  .fb h4 { margin: 0 0 4px; font-size: 19px; }
  .fb p { margin: 0 0 8px; } .fb p:last-child { margin: 0; }
  .fb .why-not { color: var(--ink-soft); }
  .next { margin-top: 14px; display: flex; justify-content: flex-end; }
  .aimhelp { text-align: center; font-size: 18px; padding: 8px 0; }
  .aimhelp .btn { margin-top: 8px; font-size: 22px; }

  /* ---- shop, locker, results ---- */
  .shelf { background: var(--paper); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .shelf h3 { margin: 0 0 4px; font: italic 900 20px "Arial Black", Impact, sans-serif; text-transform: uppercase; }
  .shelf p.sub { margin: 0 0 10px; color: var(--ink-soft); font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .tile { border: 3px solid var(--navy); border-bottom-width: 7px; border-radius: 10px; text-align: center; padding: 8px 6px; font-size: 13.5px; line-height: 1.3; color: #fff;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rar) 55%, #fff), color-mix(in srgb, var(--rar) 90%, #000)); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tile b { font: italic 900 14px "Arial Black", Impact, sans-serif; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .tile img { width: 88px; height: 88px; object-fit: contain; } .tile .gunpic { width: 116px; height: 58px; } .tile .itempic { width: 64px; height: 64px; object-fit: contain; }
  .tile .btn { margin-top: auto; }
  .tile.off { --rar: #5d6578 !important; } .tile.off img { filter: brightness(0) opacity(.55); }
  .tile.cur { box-shadow: 0 0 0 4px var(--gold); }
  button.tile { cursor: pointer; }
  .result { text-align: center; }
  .result h2 { font: italic 900 34px "Arial Black", Impact, sans-serif; text-transform: uppercase; margin: 6px 0; }
  .result .big img { width: 150px; height: 146px; object-fit: contain; animation: bob 2.6s ease-in-out infinite; }
  .result .big img.vic { width: 120px; height: 100px; animation-delay: -1.2s; }
  .result .rows { display: inline-grid; grid-template-columns: auto auto; gap: 4px 18px; text-align: left; margin: 10px auto; font-size: 18px; }
  .result .rows b { text-align: right; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  details.parents { background: rgba(255,255,255,.94); border-radius: 12px; padding: 10px 16px; font-size: 15px; }
  details.parents summary { cursor: pointer; font-weight: 700; color: var(--ink-soft); }
  details.parents table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  details.parents td, details.parents th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  details.parents td.n, details.parents th.n { text-align: right; }
  details.parents input { font: inherit; width: 80px; padding: 4px 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .legal { color: rgba(255,255,255,.78); font-size: 12.5px; line-height: 1.45; margin: 16px 4px 0; text-align: center; }

  /* ---- battle royale: the bus, other players, the feed (Nov 2026 rebuild) ---- */
  .island.pick { cursor: crosshair; }
  .island .botdot { fill: #fff; stroke: #0d1330; stroke-width: 2.5; }
  .island .drop { animation: drop 1.1s ease-out both; transform-box: fill-box; transform-origin: center; }
  @keyframes drop { 0% { transform: translateY(-70px) scale(1.8); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  .island .kill { stroke: #ff4d4d; stroke-width: 4; stroke-linecap: round; fill: none; transform-box: fill-box; transform-origin: center; animation: killfade 2.6s ease-out forwards; }
  @keyframes killfade { 0% { opacity: 0; transform: scale(2.2); } 15% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  .island .stormanim { animation: storm 1.8s ease-in-out both; transform-box: view-box; }
  @keyframes storm { from { transform: translate(var(--dx), var(--dy)) scale(var(--k)); } to { transform: none; } }
  .feed { position: absolute; left: 8px; top: 8px; max-width: 66%; display: flex; flex-direction: column; gap: 3px; pointer-events: none; z-index: 3; }
  .fe { background: rgba(13,19,48,.8); color: #fff; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; line-height: 1.35; width: fit-content; max-width: 100%; }
  .fe.me { background: rgba(255,178,26,.95); color: #2a2100; } .fe.storm { background: rgba(138,63,240,.92); } .fe.info { background: rgba(47,143,255,.9); }
  .fe.new { animation: slidein .5s ease-out both; }
  @keyframes slidein { from { transform: translateX(-30px); opacity: 0; } }

function tryMatch() {

  const c = { 1: [50, 50] };

  ch.chosen = i;
  if (ok) {
    const l = rollLoot(), h0 = M.hp, s0 = M.shield, c0 = S.coins;
    ch.loot = l.id;
    if (["med", "shield", "boogie", "bush"].includes(l.id)) {
      if (S.items[l.id] < CARRY) { S.items[l.id]++; ch.got = `<b>You now have ${S.items[l.id]} ${S.items[l.id] === 1 ? HOLD[l.id][0] : HOLD[l.id][1]}.</b> ${HOLD[l.id][2]}`; ch.glow = l.id; }
      else { S.coins += 20; S.stats.lootCoins += 20; ch.got = `You already carry ${CARRY}, the most you can hold, so you sell it: <b>coins ${c0} → ${S.coins}</b>.`; }
    } else if (l.id === "gold") { S.coins += 60; S.stats.lootCoins += 60; ch.got = `<b>Coins ${c0} → ${S.coins}.</b> Spend them in the shop on the island.`; }
    else {
      if (l.id === "slurp") { M.hp = Math.min(MAXHP, M.hp + 25); M.shield = Math.min(MAXSH, M.shield + 25); } else { M.hp = MAXHP; M.shield = MAXSH; }
      ch.got = `You drink it straight away: <b>health ${h0} → ${M.hp}</b> and <b>shield ${s0} → ${M.shield}</b>.${h0 === MAXHP && s0 === MAXSH ? " (You were already full.)" : ""}`;
    }
    beep(SND.chest);
  } else beep(SND.miss);
  others(rnd(2));
  battle(ok ? { loot: LOOT.find(x => x.id === ch.loot).name } : undefined);
  const r = $("#loot") || $(".fb"); if (r) r.scrollIntoView({ block: "center" });
}
function next() {
  const M = S.match, o = M.opps[M.cur];
  if (o.pending && o.pending.chosen !== null) {
    const p = o.pending; o.pending = null;
    if (M.hp <= 0) return knockedOut();
    if (p.chest) o.chestDue = true;
    if (p.round) { o.round = p.round; if (o.kind === "reading") o.passRight = 0; return battle(); }
  } else if (o.roundOut) {
    o.roundOut = null;
    if (o.chestDue) { o.chestDue = false; if (!(o.dead && o.boss)) M.chest = { phase: "offer", kind: chestKind(o) }; }
  } else if (M.chest && M.chest.phase === "q" && M.chest.chosen !== null) M.chest = null;
  proceed();
}
function proceed() {
  const M = S.match, o = M.opps[M.cur];
  window.scrollTo(0, 0);
  if (M.chest || o.round || o.roundOut) return battle();
  if (!o.dead) { if (!o.pending) nextQ(o); return battle(); }   // straight on to the next question
  if (o.boss) return victory();
  home();
}
function victory() {
  const M = S.match;
  S.coins += WIN_COINS; S.crowns++; S.stats.wins++; S.n++;
  S.last = { win: true, hits: M.hits, misses: M.misses, earned: M.earned, elims: M.opps.filter(o => o.dead).length };
  S.match = null; beep(SND.win);
  home(); window.scrollTo(0, 0);
}
function knockedOut() {
  const M = S.match;
  S.stats.kos++; S.last = { ko: true, place: alive(M), earned: M.earned }; S.match = null;
  home(); window.scrollTo(0, 0);
}

/* In practice mode only: show any one question in a battle, and the match maker (used by tools/check_game3.js). */
if (PRACTICE) {
  window.__preview = ref => {
    if (!S.match) S.match = newMatch();
    const M = S.match;
    if (M.phase === "bus") land(landNear([50, 50], 40));
    const q = resolve(ref), o = M.opps.find(x => !x.boss && x.kind === q.kind);
    M.opps.forEach(x => { x.dead = false; x.hp = x.max; x.pending = null; x.round = null; x.roundOut = null; }); M.chest = null; M.hp = MAXHP; M.cur = M.opps.indexOf(o);
    if (q.kind === "reading") { o.pid = q.pid; o.queue = []; }
    o.pending = { ref, chosen: null };
    battle();
  };
  window.__debug = { newMatch, landAt, STAGE, BOTS_AFTER, START, GAP, state: () => S };
}

/* ---------- start ---------- */
if (S.match && S.match.phase === "play" && S.match.cur !== null && S.match.opps[S.match.cur] && busy()) battle(); else home();
})();
</script>
