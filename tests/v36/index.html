<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 36</title>
<style>
  :root {
    --ink: #1b2a41;
    --ink-soft: #55627a;
    --line: #d8dde6;
    --paper: #ffffff;
    --field: #f3f5f8;
    --pitch: #2e7d4f;
    --pitch-deep: #23603c;
    --correct: #1e8e5a;
    --wrong: #c43d3d;
    --correct-bg: #e6f5ec;
    --wrong-bg: #fbe9e9;
    --amber: #b8860b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--field); color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; }

  header {
    background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 5;
  }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
  .bar .title { font-weight: 600; }
  .bar a.home { color: #fff; opacity: .85; text-decoration: none; font-size: .9em; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 3px 10px; white-space: nowrap; }
  .bar a.home:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .bar .section-name { color: #c6d0e0; }
  .bar .spacer { flex: 1; }
  .bar .admin-badge { display: none; background: #f2c14e; color: #1b2a41; font-size: 13px; font-weight: 700; border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  body.admin .bar .admin-badge { display: inline-block; }
  .done-note { background: var(--correct-bg); color: var(--correct); border-radius: 6px; padding: 10px 14px; margin: 0 0 18px; font-weight: 600; }

  main { max-width: 960px; margin: 28px auto 80px; padding: 0 24px; }
  .sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 32px 40px; }
  h1 { font-size: 28px; margin: 0 0 6px; font-weight: 700; }
  h2 { font-size: 22px; margin: 0 0 16px; font-weight: 700; }
  p.lead { color: var(--ink-soft); margin: 0 0 20px; }

  .instructions ol { padding-left: 22px; }
  .instructions li { margin-bottom: 6px; }
  .plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0 28px; }
  .plan div { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .plan strong { display: block; margin-bottom: 4px; }
  .plan span { color: var(--ink-soft); font-size: 15px; }

  button.primary {
    background: var(--pitch); color: #fff; border: 0; border-radius: 6px; font-size: 17px; font-weight: 600;
    padding: 12px 26px; cursor: pointer; font-family: inherit;
  }
  button.primary:hover { background: var(--pitch-deep); }
  button.primary:focus-visible, .option:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* passage + questions */
  .two-col { display: grid; grid-template-columns: 5fr 6fr; gap: 40px; align-items: start; }
  .passage { position: sticky; top: 76px; }
  .passage-note { margin: 0 0 14px; font-style: italic; color: var(--ink-soft); }

  .question { margin-bottom: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .question:last-of-type { border-bottom: 0; }
  .qhead { display: flex; gap: 12px; align-items: baseline; margin-bottom: 12px; }
  .qnum { font-weight: 700; min-width: 26px; }
  .stem { margin: 0; }
  .stem em.speaker { font-style: normal; font-weight: 600; }
  .stem .facts { margin: 8px 0 0 0; padding-left: 20px; }
  .stem .facts li { margin: 2px 0; }
  .stem .quote { margin: 10px 0 0 0; padding: 10px 14px; background: var(--field); border-left: 3px solid var(--line); border-radius: 0 4px 4px 0; }
  .options { display: grid; gap: 8px; margin: 14px 0 0 38px; }
  .option {
    display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%;
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px;
    cursor: pointer; font: inherit; color: inherit;
  }
  .option:hover { border-color: var(--ink-soft); }
  .option .letter { flex: 0 0 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .option.selected { border-color: var(--ink); background: #eef2f8; }
  .option.selected .letter { background: var(--ink); color: #fff; }

  .submit-row { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .submit-row .status { color: var(--ink-soft); font-size: 15px; }


  /* prose passage */
  .prose { font-family: Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.6; }
  .prose h3 { font-family: inherit; font-size: 22px; margin: 0 0 14px; font-weight: 700; }
  .prose p { margin: 0 0 12px; }
  .passage { max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 8px; }


  /* poem passage */
  .poem { font-size: 17px; line-height: 1.6; }
  .poem .stanza { margin: 0 0 18px; position: relative; padding-left: 32px; }
  .poem .stanza .vn { position: absolute; left: 0; top: 1px; font-family: "Segoe UI", Arial, sans-serif;
    font-size: 13px; color: var(--ink-soft); }
  .poem .stanza .line { display: block; }



  /* letter-only options and shared option lists */
  .options.letters { grid-template-columns: repeat(5, 54px); gap: 10px; }
  .options.letters .option { justify-content: center; padding: 9px; }
  .choice-list { border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; margin: 0 0 26px; }
  .choice-list ol { list-style: none; margin: 0; padding: 0; }
  .choice-list li { display: flex; gap: 12px; margin-bottom: 8px; }
  .choice-list li:last-child { margin-bottom: 0; }
  .choice-list .letter { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }


  /* multi-extract passage */
  .extract { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; }
  .extract h4 { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; margin: 0 0 6px; letter-spacing: .02em; }
  .extract p { margin: 0; font-size: 16px; line-height: 1.55; }
  .options.letters.four { grid-template-columns: repeat(4, 54px); }

  /* cloze gaps */
  .gap { color: var(--ink-soft); }
  .gap.filled { color: var(--ink); font-weight: 600; background: #eef2f8; box-shadow: inset 0 -2px 0 var(--pitch); }
  .gap.filled.correct { color: var(--correct); background: var(--correct-bg); box-shadow: inset 0 -2px 0 var(--correct); }

  /* data tables inside stems */
  table.grid { border-collapse: collapse; margin: 10px 0 0; font-size: 16px; }
  table.grid th, table.grid td { border: 1px solid var(--ink); padding: 5px 14px; text-align: left; }
  table.grid th { background: var(--field); font-weight: 600; }

  /* visual (picture) options */
  .options.visual { grid-template-columns: repeat(auto-fit, minmax(0, max-content)); gap: 14px; }
  .options.visual .option { flex-direction: column; align-items: center; gap: 8px; padding: 10px; }
  .options.visual .option .letter { flex: none; width: 28px; height: 28px; }
  .options.visual .option svg { display: block; }
  @media (max-width: 760px) { .options.visual { grid-template-columns: repeat(2, max-content); } }


  /* v7 additions */
  .stem .note { margin: 0 0 8px; font-style: italic; color: var(--ink-soft); font-size: 15px; }
  .stem ol.statements { margin: 10px 0 0; padding-left: 26px; }
  .stem ol.statements li { margin: 4px 0; padding-left: 4px; }
  .figure { margin: 12px 0; }
  .figure svg { display: block; max-width: 100%; height: auto; }
  .option svg { display: block; max-width: 100%; height: auto; }
  .option:has(svg) { align-items: center; }
  .digit-cards { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 14px; }
  .digit-card { width: 80px; height: 106px; border: 1.5px solid var(--ink); border-radius: 10px; background: #fdf3e1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .digit-card span { font-size: 56px; font-weight: 700; line-height: 1; }
  .digit-card small { font-size: 12px; margin-top: 6px; letter-spacing: .03em; }
  .table-wrap { overflow-x: auto; max-width: 100%; }
  @media (max-width: 760px) { table.grid th, table.grid td { padding: 4px 8px; font-size: 14px; } }
  .poem .stanza .line { padding-left: 1.2em; text-indent: -1.2em; }
  .tags { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 14px; }
  .tag { border: 1.5px solid var(--ink); border-radius: 8px 22px 22px 8px; padding: 8px 22px 8px 14px; background: #fdf3e1;
    display: flex; flex-direction: column; min-width: 96px; }
  .tag small { font-size: 13px; color: var(--ink-soft); }
  .tag span { font-size: 22px; font-weight: 700; }
  .hrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin: 14px 0 16px; }
  .hnum { display: inline-flex; gap: 3px; }
  .hnum .dig, .hnum .hid { width: 30px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid var(--ink); border-radius: 5px; font-size: 22px; font-weight: 700; background: #fff; }
  .hnum .hid { background: var(--ink); color: #fff; font-size: 18px; }
  .hnum .hid.sq { color: #f2c14e; }
  .hnum .hid.tri { color: #8fd3c7; }
  .explain .skill { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--ink-soft); }

  /* review */
  .result-line { display: flex; gap: 10px; align-items: center; font-weight: 600; margin-bottom: 10px; }
  .badge { padding: 2px 10px; border-radius: 4px; font-size: 14px; }
  .badge.ok { background: var(--correct-bg); color: var(--correct); }
  .badge.no { background: var(--wrong-bg); color: var(--wrong); }
  .option.is-correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.is-correct .letter { border-color: var(--correct); background: var(--correct); color: #fff; }
  .option.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.is-wrong .letter { border-color: var(--wrong); background: var(--wrong); color: #fff; }
  .option[disabled] { cursor: default; }
  .explain { margin: 14px 0 0 38px; padding: 14px 16px; background: var(--field); border-radius: 6px; font-size: 16px; }
  .explain p { margin: 0 0 8px; }
  .explain p:last-child { margin: 0; }
  .explain .why-not { color: var(--ink-soft); }

  .section-score { font-size: 18px; margin: 0 0 24px; }
  .section-score b { font-size: 26px; }

  /* final */
  .final-score { text-align: center; padding: 20px 0 10px; }
  .final-score .big { font-size: 64px; font-weight: 700; line-height: 1; }
  .final-score .of { color: var(--ink-soft); font-size: 20px; }
  .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 26px 0 30px; }
  .breakdown div { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .breakdown strong { display: block; font-size: 24px; }
  .breakdown span { color: var(--ink-soft); font-size: 15px; }
  .verdict { margin: 0 0 24px; }
  .center { text-align: center; }

  @media (max-width: 760px) {
    .two-col { grid-template-columns: 1fr; }
    .passage { position: static; }
    .plan, .breakdown { grid-template-columns: 1fr; }
    .sheet { padding: 22px; }
    .options, .explain { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .option { transition: background .12s, border-color .12s; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title">Practice Test 36</span>
    <span class="section-name" id="hdr-section"></span>
    <span class="spacer"></span>
    <span class="admin-badge">Admin · not recorded</span>
    <a class="home" id="home-link" href="../../index.html">All tests</a>
  </div>
</header>
<main id="app"></main>

<script>
/* ---------------------------------------------------------------
   TEST CONTENT — Practice Test 36
   --------------------------------------------------------------- */

let passMode = "answer";
const INK = "#1b2a41";

/* ---- Reading: four extracts on one theme ---- */
const EXTRACTS = [
  `Long before mechanical clocks were invented, people used the sun to tell the time. A sundial is simply a pointer that casts a shadow. As the sun moves across the sky, the shadow creeps around marks on a dial. Sundials were used in ancient Egypt thousands of years ago. They had one obvious weakness, however: at night, or whenever clouds covered the sun, they were useless. For those times, people used water clocks, which measured time by how much water had dripped out of a container.`,
  `Your body has a clock of its own. Even without a watch, it tells you when to feel sleepy and when to feel wide awake, following a cycle that lasts roughly twenty-four hours. Daylight helps to keep this clock set correctly. When people fly halfway around the world, their body clock can be left many hours behind or ahead of the clock on the wall. This is called jet lag, and it can take several days for the body to catch up.`,
  `Mum said she would be back in ten minutes. Ivy sat on the bench outside the shop and watched the long hand on the big clock above the door. It crawled. She counted the cars going past. She counted the cracks in the footpath. She retied both of her shoelaces, slowly, twice. When she was certain that at least half an hour had gone by, she looked up at the clock again. Mum had been gone for six minutes.`,
  `Not every calendar is divided into twelve months. In Kakadu, in northern Australia, the Aboriginal traditional owners recognise six seasons rather than four, and none of them begins on a fixed date. Instead, each season arrives when its signs appear: a change in the wind, the first storms, certain plants flowering or animals behaving in particular ways. In some years a season comes early; in others it comes late. This knowledge has been passed down for many generations.`
];
const PASSAGE = {
  title: "Keeping Time",
  note: "Read the four extracts below about time.",
  html: EXTRACTS.map((t, i) => `<div class="extract"><h4>Extract ${"ABCD"[i]}</h4><p>${t}</p></div>`).join("")
};

/* ---- Thinking Skills Q2: sprinkler timeline ---- */
const SPRINKLERS = [["front lawn", 0, 60], ["vegie patch", 30, 90], ["back lawn", 60, 120], ["flower bed", 105, 150]];
const SPRINKLER_SVG = (() => {
  const lx = 104, px = 2.0, top = 10, rowH = 34, W = lx + 180 * px + 20;
  let g = "";
  for (let m = 0; m <= 180; m += 15) {
    const x = lx + m * px, major = m % 60 === 0;
    g += `<line x1="${x}" y1="${top}" x2="${x}" y2="${top + 4 * rowH}" stroke="${major ? "#9aa6bb" : "#dde2ea"}" stroke-width="1"/>`;
    if (m % 30 === 0) g += `<text x="${x}" y="${top + 4 * rowH + 18}" font-size="12" text-anchor="middle" fill="${INK}">${6 + Math.floor(m / 60)}:${m % 60 === 0 ? "00" : "30"}</text>`;
  }
  SPRINKLERS.forEach(([name, a, b], i) => {
    const y = top + i * rowH;
    g += `<text x="${lx - 8}" y="${y + rowH / 2 + 5}" font-size="13" text-anchor="end" fill="${INK}">${name}</text>
          <rect x="${lx + a * px}" y="${y + 8}" width="${(b - a) * px}" height="${rowH - 16}" rx="3" fill="#4a8fd1" stroke="${INK}" stroke-width="1.2"/>`;
  });
  g += `<text x="${lx + 90 * px}" y="${top + 4 * rowH + 36}" font-size="12" text-anchor="middle" fill="#55607a">time (am) — each small gap is 15 minutes</text>`;
  return `<svg viewBox="0 0 ${W} ${top + 4 * rowH + 44}" width="${W}" height="${top + 4 * rowH + 44}" style="max-width:100%;height:auto" role="img" aria-label="A timeline from 6:00 to 9:00 am with grid lines every 15 minutes. Front lawn sprinkler on from 6:00 to 7:00. Vegie patch from 6:30 to 7:30. Back lawn from 7:00 to 8:00. Flower bed from 7:45 to 8:30.">${g}</svg>`;
})();

/* ---- Thinking Skills Q3: table seen from above ---- */
const TABLE_SVG = (() => {
  const ox = 70, oy = 50, s = 180, c = s / 3;
  const cell = (r, k) => [ox + k * c + c / 2, oy + r * c + c / 2];
  let g = `<rect x="${ox}" y="${oy}" width="${s}" height="${s}" rx="6" fill="#f3e3c7" stroke="${INK}" stroke-width="2"/>`;
  const [bx, by] = cell(0, 0); // book: north-west
  g += `<rect x="${bx - 20}" y="${by - 14}" width="40" height="28" rx="2" fill="#5b7db1" stroke="${INK}" stroke-width="1.5"/><line x1="${bx}" y1="${by - 14}" x2="${bx}" y2="${by + 14}" stroke="#fff" stroke-width="1.5"/>
        <text x="${bx}" y="${by + 30}" font-size="12" text-anchor="middle" fill="${INK}">book</text>`;
  const [cx, cy] = cell(1, 1); // cup: centre
  g += `<circle cx="${cx}" cy="${cy}" r="13" fill="#fff" stroke="${INK}" stroke-width="2"/><path d="M${cx + 13} ${cy - 5} q10 5 0 10" fill="none" stroke="${INK}" stroke-width="2"/>
        <text x="${cx}" y="${cy + 30}" font-size="12" text-anchor="middle" fill="${INK}">cup</text>`;
  const [qx, qy] = cell(2, 1); // ball: south-middle
  g += `<circle cx="${qx}" cy="${qy}" r="14" fill="#e0a43a" stroke="${INK}" stroke-width="2"/><path d="M${qx - 14} ${qy} q14 -8 28 0" fill="none" stroke="${INK}" stroke-width="1.2"/>
        <text x="${qx + 26}" y="${qy + 5}" font-size="12" fill="${INK}">ball</text>`;
  const seat = (x, y, name) => `<text x="${x}" y="${y}" font-size="14" font-weight="700" text-anchor="middle" fill="${INK}">${name}</text>`;
  g += seat(ox + s / 2, oy - 14, "Anna") + seat(ox + s + 34, oy + s / 2 + 5, "Ben") + seat(ox + s / 2, oy + s + 26, "Cleo") + seat(ox - 34, oy + s / 2 + 5, "Dev");
  g += `<g transform="translate(${ox + s + 30} ${oy - 30})"><line x1="0" y1="18" x2="0" y2="0" stroke="${INK}" stroke-width="2"/><path d="M-5 6 L0 -2 L5 6 Z" fill="${INK}"/><text x="0" y="32" font-size="11" text-anchor="middle" fill="${INK}">N</text></g>`;
  return `<svg viewBox="0 0 ${ox + s + 80} ${oy + s + 40}" width="${ox + s + 80}" height="${oy + s + 40}" role="img" aria-label="A square table seen from above. Anna sits on the north side, Ben on the east side, Cleo on the south side and Dev on the west side, each facing the table. A book is in the north-west corner of the table, a cup is in the centre, and a ball is in the middle of the south edge.">${g}</svg>`;
})();

/* ---- Maths Q1: thermometer ---- */
const THERMO_SVG = (() => {
  const x = 60, top = 14, h = 220, per = h / 40; // 0..40 degrees
  let g = `<rect x="${x - 9}" y="${top - 6}" width="18" height="${h + 12}" rx="9" fill="#fff" stroke="${INK}" stroke-width="2"/>
           <circle cx="${x}" cy="${top + h + 20}" r="16" fill="#d9534f" stroke="${INK}" stroke-width="2"/>
           <rect x="${x - 4}" y="${top + h - 26 * per}" width="8" height="${26 * per + 14}" fill="#d9534f"/>`;
  for (let d = 0; d <= 40; d += 2) {
    const y = top + h - d * per, major = d % 10 === 0;
    g += `<line x1="${x + 10}" y1="${y}" x2="${x + (major ? 26 : 18)}" y2="${y}" stroke="${INK}" stroke-width="${major ? 1.8 : 1}"/>`;
    if (major) g += `<text x="${x + 32}" y="${y + 5}" font-size="13" fill="${INK}">${d}</text>`;
  }
  g += `<text x="${x - 44}" y="${top + 5}" font-size="13" fill="#55607a">°C</text>`;
  return `<svg viewBox="0 0 140 ${top + h + 44}" width="140" height="${top + h + 44}" role="img" aria-label="A thermometer marked 0, 10, 20, 30 and 40 degrees Celsius, with four small marks between each pair of labels. The red liquid reaches the third small mark above 20.">${g}</svg>`;
})();

/* ---- Maths Q3: picture graph ---- */
const BOOKS = [["Monday", 3.5], ["Tuesday", 5], ["Wednesday", 3], ["Thursday", 4], ["Friday", 6]];
const PICTO_SVG = (() => {
  const lx = 96, w = 28, gap = 6, rowH = 36;
  const book = (x, y, half) => half
    ? `<rect x="${x}" y="${y}" width="${w / 2}" height="24" fill="#5b7db1" stroke="${INK}" stroke-width="1.2"/>`
    : `<rect x="${x}" y="${y}" width="${w}" height="24" rx="2" fill="#5b7db1" stroke="${INK}" stroke-width="1.2"/><line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + 24}" stroke="#fff" stroke-width="1.2"/>`;
  let g = "";
  BOOKS.forEach(([day, n], i) => {
    const y = 8 + i * rowH;
    g += `<text x="${lx - 10}" y="${y + 17}" font-size="13" text-anchor="end" fill="${INK}">${day}</text>`;
    for (let k = 0; k < Math.floor(n); k++) g += book(lx + k * (w + gap), y, false);
    if (n % 1) g += book(lx + Math.floor(n) * (w + gap), y, true);
  });
  const ky = 8 + BOOKS.length * rowH + 10;
  g += `<g transform="translate(${lx} ${ky})">${book(0, 0, false)}<text x="${w + 10}" y="17" font-size="13" fill="${INK}">= 4 books</text></g>`;
  const W = lx + 6 * (w + gap) + 10;
  return `<svg viewBox="0 0 ${W} ${ky + 32}" width="${W}" height="${ky + 32}" role="img" aria-label="A picture graph of books read by a class. Monday: three and a half symbols. Tuesday: five. Wednesday: three. Thursday: four. Friday: six. Key: one symbol stands for 4 books.">${g}</svg>`;
})();

const SECTIONS = [
  {
    id: "reading",
    name: "Reading",
    passage: PASSAGE,
    intro: "Read the four extracts about time. For each question, choose the extract (A, B, C or D) which best answers it.",
    questions: [
      {
        stem: "In which extract does someone find that time seemed to pass much more slowly than it really did?",
        letterOptions: true,
        options: ["Extract A", "Extract B", "Extract C", "Extract D"],
        answer: 2,
        skill: "inferring a character’s experience",
        explain: `<p>In Extract C, Ivy fills the time with every small task she can think of and is “certain that at least half an hour had gone by”. The clock shows only six minutes. Waiting made the time feel far longer than it was.</p>
                  <p class="why-not">Extract B is the trap: jet lag leaves your body clock out of step with the real time, but that is about being hours ahead or behind, not time <em>feeling</em> slow. Extracts A and D are about ways of measuring time.</p>`
      },
      {
        stem: "Which extract explains why one way of measuring time was not enough on its own?",
        letterOptions: true,
        options: ["Extract A", "Extract B", "Extract C", "Extract D"],
        answer: 0,
        skill: "inferring the purpose of a detail",
        explain: `<p>Extract A says sundials “had one obvious weakness”: they were useless at night or when clouds covered the sun. That is why people <em>also</em> used water clocks “for those times”. So the sundial was not enough on its own.</p>
                  <p class="why-not">Extract B is the trap: the body clock needs daylight to stay set, and it can be thrown out by jet lag, but the extract never says a second way of measuring time was needed. Extract D describes a different way of dividing the year, not one method failing. Extract C has a clock that works perfectly; it is Ivy’s feeling that is wrong.</p>`
      },
      {
        stem: "In which extract is time divided up by changes in nature rather than by dates?",
        letterOptions: true,
        options: ["Extract A", "Extract B", "Extract C", "Extract D"],
        answer: 3,
        skill: "identifying the main idea of an extract",
        explain: `<p>Extract D explains that in Kakadu, seasons begin “when its signs appear”: changes in the wind, the first storms, plants flowering and animal behaviour. None begins on a fixed date.</p>
                  <p class="why-not">Extract B is the trap: daylight, which is part of nature, helps to set the body clock, but the body clock doesn’t divide time into parts like seasons. Extract A uses the sun to tell the time of day, but a sundial measures hours, not the year, and still uses marks on a dial.</p>`
      }
    ]
  },
  {
    id: "thinking",
    name: "Thinking Skills",
    intro: "Choose the one correct answer (A, B, C or D).",
    questions: [
      {
        stem: `For a food drive, Class 4R collected 120 cans and Class 4M collected 90 cans.
               <p class="quote"><em class="speaker">The principal:</em> “Class 4R collected more cans, so the students in 4R must have tried harder than the students in 4M.”</p>
               <p style="margin:10px 0 0">Which one of the following sentences shows the mistake the principal has made?</p>`,
        options: ["The cans collected by both classes may go to the same charity.",
                  "Class 4M may have collected more cans this year than it did last year.",
                  "Some students in Class 4R may really enjoy helping charities.",
                  "Class 4R may have a lot more students than Class 4M."],
        answer: 3,
        skill: "spotting a mistake: an unfair comparison",
        explain: `<p>The principal compares the two <em>totals</em>, but that is only fair if the classes are the same size. If 4R has 30 students and 4M has 18, then 4R collected 4 cans each and 4M collected 5 cans each, so 4M’s students actually collected more per person. D shows the mistake.</p>
                  <p class="why-not">B is the trap: it is about how hard 4M tried, but it compares 4M with its own past, not with 4R, so it doesn’t show why the comparison between the classes is unfair. C, if anything, supports the principal. A doesn’t affect how hard either class tried.</p>`
      },
      {
        stem: `The chart shows when four garden sprinklers were turned on one morning.
               <div class="figure">${SPRINKLER_SVG}</div>
               <p style="margin:10px 0 0">What was the <b>longest continuous</b> time that more than one sprinkler was on?</p>`,
        options: ["30 minutes", "1 hour", "1 hour 15 minutes", "2 hours"],
        answer: 1,
        skill: "reading a timeline and finding overlaps",
        explain: `<p>Look for times when two or more bars overlap:</p>
                  <p>• 6:30 to 7:00: front lawn and vegie patch.<br>
                     • 7:00 to 7:30: vegie patch and back lawn. This follows straight on, so from <b>6:30 to 7:30</b> there are always at least two sprinklers on. That is <b>1 hour</b>.<br>
                     • 7:30 to 7:45: only the back lawn is on, which breaks the run.<br>
                     • 7:45 to 8:00: back lawn and flower bed, only 15 minutes.</p>
                  <p class="why-not">1 hour 15 minutes (C) is the trap: it adds up <em>all</em> the overlapping times, but 7:30 to 7:45 breaks them into two separate periods. 30 minutes (A) looks at only one pair of sprinklers. 2 hours (D) is the time from 6:00 to 8:00, when at least one sprinkler was on.</p>`
      },
      {
        stem: `Four friends sit around a square table. This is the view from above.
               <div class="figure">${TABLE_SVG}</div>
               <p class="quote" style="margin-top:6px">“The ball is the closest thing to me. The cup is straight behind the ball, and the book is over on my left.”</p>
               <p style="margin:10px 0 0">Which friend said this?</p>`,
        options: ["Anna", "Ben", "Cleo", "Dev"],
        answer: 2,
        skill: "picturing a view from someone else’s position",
        explain: `<p>Imagine sitting in each seat, facing the middle of the table.</p>
                  <p><b>Cleo</b> sits on the south side, facing north. The ball is right in front of her, the cup is straight behind it in the centre, and the book is in the far corner on her <b>left</b> ✓</p>
                  <p class="why-not">Dev is the trap: from Dev’s seat the book <em>is</em> on his left, but the closest thing to him is the cup in the middle, not the ball. Anna sees the ball furthest away and the book on her right. Ben has the ball on his left.</p>`
      }
    ]
  },
  {
    id: "maths",
    name: "Mathematical Reasoning",
    intro: "Choose the one correct answer (A, B, C, D or E). No calculators.",
    questions: [
      {
        stem: `What temperature does this thermometer show?
               <div class="figure">${THERMO_SVG}</div>`,
        options: ["20 °C", "23 °C", "24 °C", "26 °C", "27.5 °C"],
        answer: 3,
        skill: "reading a scale with unlabelled marks",
        explain: `<p>Between 20 and 30 there are 4 small marks, which split the gap into 5 equal steps. 10 ÷ 5 = <b>2 °C</b> per step.</p>
                  <p>The red liquid reaches the 3rd small mark above 20: 20 + 3 × 2 = <b>26 °C</b>.</p>
                  <p class="why-not">23 °C (B) is the trap: it counts each small mark as 1 degree. 27.5 °C (E) splits the 10 degrees into 4 steps instead of 5. 24 °C (C) counts only 2 steps above 20 instead of 3. 20 °C (A) just reads the label below the liquid.</p>`
      },
      {
        stem: `A shop sells muesli bars in three ways:
               <ul class="facts">
                 <li>single bars: $1.10 each</li>
                 <li>packs of 6 bars: $5.40 a pack</li>
                 <li>packs of 10 bars: $8.50 a pack</li>
               </ul>
               <p style="margin:10px 0 0">Zoe needs <b>exactly</b> 12 bars. What is the lowest price she can pay?</p>`,
        options: ["$10.20", "$10.70", "$10.80", "$12.00", "$13.20"],
        answer: 1,
        skill: "finding the cheapest combination",
        explain: `<p>Find all the ways to make exactly 12 bars, and the cost of each:</p>
                  <p>• one 10-pack + 2 singles: $8.50 + $2.20 = <b>$10.70</b><br>
                     • two 6-packs: $5.40 + $5.40 = $10.80<br>
                     • one 6-pack + 6 singles: $5.40 + $6.60 = $12.00<br>
                     • 12 singles: 12 × $1.10 = $13.20</p>
                  <p>The cheapest is <b>$10.70</b>, just 10 cents less than two 6-packs.</p>
                  <p class="why-not">$10.80 (C) is the trap: two 6-packs make 12 exactly with no singles, so it looks cheapest, but it isn't. $10.20 (A) works out 12 bars at the 10-pack price of 85 cents each, but you can't buy 12 bars at that price. $12.00 (D) and $13.20 (E) are the other combinations.</p>`
      },
      {
        stem: `The picture graph shows how many books a class read each day.
               <div class="figure">${PICTO_SVG}</div>
               <ol style="margin:8px 0 0;padding-left:22px">
                 <li>Twice as many books were read on Friday as on Wednesday.</li>
                 <li>The class read 86 books altogether.</li>
                 <li>On Friday the class read 2 more books than on Thursday.</li>
               </ol>
               <p style="margin:8px 0 0">Which of these statements is/are correct?</p>`,
        options: ["statement 1 only", "statement 2 only", "statements 1 and 2 only", "statements 2 and 3 only", "statements 1, 2 and 3"],
        answer: 2,
        skill: "reading a picture graph with a key (including half symbols)",
        explain: `<p>Each whole symbol is 4 books, so a half symbol is 2 books.</p>
                  <p>Monday 14, Tuesday 20, Wednesday 12, Thursday 16, Friday 24.</p>
                  <p><b>1:</b> 24 is twice 12 ✓<br>
                     <b>2:</b> 14 + 20 + 12 + 16 + 24 = 86 ✓<br>
                     <b>3:</b> Friday has 2 more <em>symbols</em> than Thursday, but that is 2 × 4 = 8 more books, not 2 ✗</p>
                  <p class="why-not">E is the trap: statement 3 is true if you count symbols instead of books. A total of 84 or 88 (from ignoring the half symbol or counting it as a whole) would make statement 2 look wrong.</p>`
      }
    ]
  }
];

const TEST_META = {"version": 36, "reading_format": "four extracts", "categories": {"reading": ["Feelings & inference", "Purpose of a detail", "Main idea"], "thinking": ["Spot the mistake", "Tables & timetables", "Spatial"], "maths": ["Measurement & scales", "Money & best value", "Graphs & data"]}};
const LETTERS = ["A", "B", "C", "D", "E"];
const app = document.getElementById("app");
const hdrSection = document.getElementById("hdr-section");
let responses = SECTIONS.map(s => s.questions.map(() => null));
let current = 0;

/* ---- progress tracking (stored in this browser only; skipped in admin mode) ---- */
const STORE_KEY = "prac.v1";
const ADMIN = (() => {
  try { return new URLSearchParams(location.search).has("admin") && sessionStorage.getItem("prac.admin") === "1"; }
  catch (e) { return false; }
})();
if (ADMIN) {
  document.body.classList.add("admin");
  document.getElementById("home-link").href = "../../pracadmin/index.html";
  document.getElementById("home-link").textContent = "Admin";
}
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.attempts)) return Object.assign({ flags: {} }, s); }
  catch (e) {}
  return { attempts: [], flags: {} };
}
function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
let attempt = null, sectionStart = 0, changes = [];
function beginAttempt() {
  changes = SECTIONS.map(s => s.questions.map(() => 0));
  if (ADMIN) { attempt = null; return; }
  attempt = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), v: TEST_META.version,
              started: new Date().toISOString(), finished: null, sections: [] };
}
function persistAttempt() {
  if (!attempt) return;
  const st = loadStore();
  const k = st.attempts.findIndex(a => a.id === attempt.id);
  if (k >= 0) st.attempts[k] = attempt; else st.attempts.push(attempt);
  if (attempt.finished) st.flags[attempt.v] = { completed: true, at: attempt.finished };
  saveStore(st);
}
function recordSection(i) {
  if (!attempt) return;
  const s = SECTIONS[i];
  attempt.sections[i] = { id: s.id, ms: Date.now() - sectionStart,
    answers: s.questions.map((q, qi) => ({ cat: ((TEST_META.categories || {})[s.id] || [])[qi] || null,
      chosen: responses[i][qi], answer: q.answer, correct: responses[i][qi] === q.answer, changes: changes[i][qi] })) };
  persistAttempt();
}
function finishAttempt() {
  if (!attempt) return;
  attempt.finished = new Date().toISOString();
  attempt.total = SECTIONS.reduce((n, _, i) => n + sectionScore(i), 0);
  persistAttempt();
  attempt = null;
}
function completedNote() {
  if (ADMIN) return `<p class="done-note" style="background:#fdf3e1;color:#7a5a00">Admin preview: answers in this test are not recorded.</p>`;
  const f = loadStore().flags[TEST_META.version];
  if (!f || !f.completed) return "";
  const d = new Date(f.at);
  return `<p class="done-note">✓ Completed${isNaN(d) ? "" : ` on ${d.toLocaleDateString("en-AU", { day: "numeric", month: "long" })}`}. You can still do it again or look back through it.</p>`;
}

function showStart() {
  hdrSection.textContent = "";
  app.innerHTML = `
    <div class="sheet instructions">
      <h1>Practice paper 36</h1>
      ${completedNote()}
      <p class="lead">Three short sections: reading, thinking skills and maths.</p>
      <div class="plan">
        ${SECTIONS.map(s => `<div><strong>${s.name}</strong><span>${s.questions.length} questions</span></div>`).join("")}
      </div>
      <ol>
        <li>Take as long as you need — there is no time limit.</li>
        <li>Answer all three questions in a section, then press <strong>Submit answers</strong> to see how you went.</li>
        <li>You don’t lose marks for wrong answers, so attempt every question.</li>
        <li>Your overall mark out of 9 is shown at the end.</li>
      </ol>
      <button class="primary" id="start">Start the reading section</button>
    </div>`;
  document.getElementById("start").onclick = () => { current = 0; responses = SECTIONS.map(s => s.questions.map(() => null)); beginAttempt(); showSection(); };
}

function renderPassage(pass) {
  return `<div class="passage">
    <p class="passage-note">${pass.note}</p>
    <div class="prose"><h3>${pass.title}</h3><div id="passage-body">${typeof pass.html === "function" ? pass.html() : pass.html}</div></div>
  </div>`;
}

function refreshPassage() {
  const pass = SECTIONS[current].passage;
  const el = document.getElementById("passage-body");
  if (el && pass && typeof pass.html === "function") el.innerHTML = pass.html();
}

function renderQuestions(section, mode) {
  return section.questions.map((q, qi) => {
    const chosen = responses[current][qi];
    const opts = q.options.map((o, oi) => {
      let cls = "option";
      if (mode === "answer" && chosen === oi) cls += " selected";
      if (mode === "review") {
        if (oi === q.answer) cls += " is-correct";
        else if (chosen === oi) cls += " is-wrong";
      }
      return `<button type="button" class="${cls}" data-q="${qi}" data-o="${oi}" ${mode === "review" ? "disabled" : ""}>
                <span class="letter">${LETTERS[oi]}</span>${q.letterOptions ? "" : `<span>${o}</span>`}</button>`;
    }).join("");
    const optCls = q.visualOptions ? "options visual" : (q.letterOptions ? "options letters" : "options");
    let result = "";
    if (mode === "review") {
      const right = chosen === q.answer;
      const label = chosen === null ? "Not answered" : (right ? "Correct" : "Incorrect");
      result = `<div class="result-line"><span class="badge ${right ? "ok" : "no"}">${label}</span>
                <span>Correct answer: ${LETTERS[q.answer]}${chosen !== null && !right ? ` · You chose ${LETTERS[chosen]}` : ""}</span></div>`;
    }
    return `<div class="question">
      <div class="qhead"><span class="qnum">${qi + 1}</span><div class="stem">${q.stem}</div></div>
      ${result}
      <div class="${optCls}">${opts}</div>
      ${mode === "review" ? `<div class="explain">${q.skill ? `<p class="skill">Skill tested: ${q.skill}</p>` : ""}${q.explain}</div>` : ""}
    </div>`;
  }).join("");
}

function showSection() {
  passMode = "answer";
  sectionStart = Date.now();
  const s = SECTIONS[current];
  hdrSection.textContent = `${s.name} · Section ${current + 1} of ${SECTIONS.length}`;
  const qs = `<div>
      <h2>${s.name}</h2>
      <p class="lead">${s.intro}</p>
      ${s.preamble || ""}
      ${renderQuestions(s, "answer")}
      <div class="submit-row">
        <button class="primary" id="submit">Submit answers</button>
        <span class="status" id="status"></span>
      </div>
    </div>`;
  app.innerHTML = `<div class="sheet">${s.passage ? `<div class="two-col">${renderPassage(s.passage)}${qs}</div>` : qs}</div>`;

  app.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => {
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if (responses[current][qi] !== null && responses[current][qi] !== oi && changes[current]) changes[current][qi]++;
      responses[current][qi] = oi;
      app.querySelectorAll(`.option[data-q="${qi}"]`).forEach(b => b.classList.toggle("selected", +b.dataset.o === oi));
      refreshPassage();
      updateStatus();
    };
  });
  document.getElementById("submit").onclick = () => {
    const unanswered = responses[current].filter(r => r === null).length;
    if (unanswered && !confirm(`You have ${unanswered} unanswered question${unanswered > 1 ? "s" : ""}. Submit anyway?`)) return;
    recordSection(current);
    showReview();
  };
  updateStatus();
  window.scrollTo(0, 0);
}

function updateStatus() {
  const done = responses[current].filter(r => r !== null).length;
  const el = document.getElementById("status");
  if (el) el.textContent = `${done} of ${SECTIONS[current].questions.length} answered`;
}

function sectionScore(i) {
  return SECTIONS[i].questions.reduce((n, q, qi) => n + (responses[i][qi] === q.answer ? 1 : 0), 0);
}

function showReview() {
  passMode = "review";
  const s = SECTIONS[current];
  const score = sectionScore(current);
  const last = current === SECTIONS.length - 1;
  hdrSection.textContent = `${s.name} · Review`;
  const body = `<div>
      <h2>${s.name} — review</h2>
      <p class="section-score">You scored <b>${score}</b> out of ${s.questions.length}</p>
      ${s.preamble || ""}
      ${renderQuestions(s, "review")}
      <div class="submit-row">
        <button class="primary" id="next">${last ? "See your overall mark" : `Start the ${SECTIONS[current + 1].name.split(" — ")[0].toLowerCase()} section`}</button>
      </div>
    </div>`;
  app.innerHTML = `<div class="sheet">${s.passage ? `<div class="two-col">${renderPassage(s.passage)}${body}</div>` : body}</div>`;
  document.getElementById("next").onclick = () => { if (last) showFinal(); else { current++; showSection(); } };
  window.scrollTo(0, 0);
}

function showFinal() {
  hdrSection.textContent = "Results";
  finishAttempt();
  const total = SECTIONS.reduce((n, _, i) => n + sectionScore(i), 0);
  const max = SECTIONS.reduce((n, s) => n + s.questions.length, 0);
  let verdict;
  if (total === max) verdict = "Full marks. Every question right, across all three sections.";
  else if (total >= 7) verdict = "A strong result. Look back at the questions you missed — the explanations show exactly where the trap was.";
  else if (total >= 5) verdict = "A solid attempt. The sections where you dropped marks are the ones to practise next.";
  else verdict = "A good start. Re-read the explanations for each section, then try the paper again.";
  app.innerHTML = `
    <div class="sheet">
      <div class="final-score"><div class="big">${total}</div><div class="of">out of ${max}</div></div>
      <div class="breakdown">
        ${SECTIONS.map((s, i) => `<div><strong>${sectionScore(i)} / ${s.questions.length}</strong><span>${s.name}</span></div>`).join("")}
      </div>
      <p class="verdict center">${verdict}</p>
      <div class="center"><button class="primary" id="again">Try the paper again</button></div>
    </div>`;
  document.getElementById("again").onclick = showStart;
  window.scrollTo(0, 0);
}


showStart();
</script>
</body>
</html>
